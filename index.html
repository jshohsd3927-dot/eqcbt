[G,"04 유도기","3상 유도 전동기의 1차 입력 60[kW], 1차 손실 1[kW], 슬립 3[%]일 때 기계적 출력[kW]은?",["57","75","95","100"],1,"2차 입력 P₂=60−1=59[kW], 출력 P₀=(1−s)P₂=(1−0.03)×59=57.23[kW]"],
[T,"08 3상 교류회로","평형 3상 성형 결선에 있어서 선간전압(Vₗ)과 상전압(Vₚ)의 관계는?",["Vₗ=Vₚ","Vₗ=Vₚ/√3","Vₗ=√2Vₚ","Vₗ=√3Vₚ"],4,"Y(성형) 결선에서 Vₗ=√3Vₚ"],
[G,"02 동기기","동기 발전기의 돌발 단락 전류를 주로 제한하는 것은?",["누설 리액턴스","동기 임피던스","권선 저항","동기 리액턴스"],1,"동기 발전기를 갑자기 단락시켰을 때 흐르는 큰 전류를 돌발 단락 전류라 한다. 이를 주로 제한하는 것은 누설 리액턴스이다."],
[G,"04 유도기","유도 전동기의 슬립을 측정하는 방법으로 옳은 것은?",["전압계법","전류계법","평형 브리지법","스트로보 스코프법"],4,"회전계법: 직접 회전수를 측정하여 슬립 s를 산출하고 스트로보 스코프법으로 회전수를 측정하는 방법"],
[G,"03 변압기","출력에 대한 전부하 동손이 2[%], 철손이 1[%]인 변압기의 전부하 효율[%]은?",["95","96","97","98"],3,"η=P₀/(P₀+Pᵢ+P꜀)×100=1/(1+0.01+0.02)×100=97[%]"],
[S,"05 전선 및 기계기구의 보안공사","접지저항 저감 대책이 아닌 것은?",["접지봉의 연결 개수를 증가시킨다.","접지판의 면적을 감소시킨다.","접지극을 깊게 매설한다.","토양의 고유저항을 화학적으로 저감시킨다."],2,"접지판의 면적이 클수록 접지저항이 감소한다. 따라서 면적을 감소시키는 것은 저감 대책이 아니다."],
[G,"05 정류기 및 제어기기","그림은 유도 전동기 속도제어 회로 및 트랜지스터의 컬렉터 전류 그래프이다. ⓐ와 ⓑ에 해당하는 트랜지스터는?",["ⓐ TR1, TR2 ⓑ TR3, TR4","ⓐ TR1, TR3 ⓑ TR2, TR4","ⓐ TR2, TR4 ⓑ TR1, TR3","ⓐ TR1, TR4 ⓑ TR2, TR3"],4,"단상 인버터 회로. 네 개의 트랜지스터가 1조(TR1, TR4)와 2조(TR2, TR3)로 짝지어 동작하여 직류 입력을 교류 전류로 변환한다. 출력 ⓐ: 1조 동작, 순방향 전류 도통, 출력 ⓑ: 2조 동작, 역방향 전류 도통","직류 입력 양단에 TR1·TR3(위)와 TR2·TR4(아래)가 2열로 있고 가운데 전동기 M이 연결된 단상 인버터. 오른쪽에 ⓐ(양의 구간), ⓑ(음의 구간) 파형 그래프."],
[S,"06 전선로 및 배전선 공사","설계하중 6.8[kN] 이하의 철근 콘크리트 전주의 길이가 12[m]인 지지물을 건주하는 경우 땅에 묻는 깊이로 가장 옳은 것은?",["2.0[m]","1.0[m]","0.8[m]","0.6[m]"],1,"전주의 길이 15[m] 이하: 전주 길이의 1/6 이상. d=12×1/6=2[m]"],
[S,"06 전선로 및 배전선 공사","철근 콘크리트주에 완금을 고정하려면 어떤 밴드를 사용해야 하는가?",["암 밴드","지지선밴드","레크밴드","암타이밴드"],1,"암 밴드: 철근 콘크리트주에 완철(완금)을 고정하는 데 사용하는 가장 일반적인 밴드"],
[S,"03 전선의 접속","전선을 기구 단자에 접속할 때 진동 등의 영향으로 헐거워질 우려가 있는 경우에 사용하는 것은?",["압착단자","코드 페스너","십자머리 볼트","스프링 와셔"],4,"헐거워질 우려가 있는 경우에는 스프링 와셔 또는 이중너트로 결속한다."],
[T,"01 직류회로","기전력 50[V], 내부 저항 r=5[Ω]인 전원이 있다. 이 전원에 부하를 연결하여 얻을 수 있는 최대 전력은 몇 [W]인가?",["50","75","100","125"],4,"내부 저항과 부하 저항이 같을 때 최대. R=5[Ω]일 때 I=50/(5+5)=5[A], Pmax=I²R=5²×5=125[W]"],
[T,"01 직류회로","길이 10[m]인 도선의 저항값이 100[Ω]이었다. 이 도선을 고르게 20[m]로 늘렸을 때 저항값은?(단, 체적은 동일한 경우이다.)",["50[Ω]","100[Ω]","200[Ω]","400[Ω]"],4,"체적이 같을 때 길이가 2배면 단면적은 1/2. R'=ρ·2l/(S/2)=4ρl/S=4R=400[Ω]"],
[G,"02 동기기","동기 발전기의 전기자 반작용 중에서 전기자 전류에 의한 자기장의 축이 항상 주자속의 축과 수직이 되면서 자극편 왼쪽에 있는 주자속은 증가시키고, 오른쪽에 있는 주자속은 감소시켜 편자 작용을 하는 전기자 반작용은?",["증자 작용","감자 작용","교차 자화 작용","직축 반작용"],3,"R 부하(동위상): 교차 자화 작용(횡축 반작용). L 부하(뒤진 전류): 감자 작용(직축 반작용). C 부하(앞선 전류): 증자 작용(자화 작용)"],
[S,"06 전선로 및 배전선 공사","저압구내 가공인입선을 DV전선으로 시설할 때 경간이 20[m]인 경우에 지름 몇 [mm] 이상의 DV전선을 사용하여야 하는가?",["2.0","2.6","3.2","5.0"],2,"가공 인입선으로 DV 전선을 사용하여 인입하는 경우 그 최소 굵기는 지름 2.6[mm] 이상이어야 한다. 다만, 지지물 간 거리(경간)가 15[m] 이하인 경우에는 2.0[mm] 이상도 가능하다."],
[T,"07 교류회로","RL 직렬회로에서 교류전압 v=Vm sin(ωt+θ)[V]를 가했을 때 회로의 위상각 θ를 나타낸 것은?",["θ=tan⁻¹(R/ωL)","θ=tan⁻¹(ωL/R)","θ=tan⁻¹(R/RωL)","θ=tan⁻¹(R/√(R²+(ωL)²))"],2,"R-L 직렬회로 임피던스에서 tanθ=ωL/R ∴ θ=tan⁻¹(ωL/R)[rad]","직각삼각형 임피던스도: 빗변 Z=√(R²+(ωL)²), 밑변 R, 높이 ωL, 밑각 θ."],
[S,"09 전기응용 시설 공사","조명기구의 배광에 의한 분류 중 40~60[%] 정도의 빛이 위쪽과 아래쪽으로 고루 향하고 가장 일반적인 용도를 가지고 있으며 상·하 좌우로 빛이 모두 나오므로 부드러운 조명이 되는 조명 방식은?",["직접조명방식","반 직접 조명방식","전반 확산 조명방식","반 간접 조명방식"],3,"전반 확산 조명: 빛이 공간 전체에 고르게 퍼지도록 설계된 조명 방식. 빛의 40~60[%]가 상하로, 나머지가 좌우로 확산하므로 눈부심이 적고 조도가 균일하다. 주로 사무실, 학교, 식당 등 넓은 공간에 사용한다."],
[G,"02 동기기","단락비가 큰 동기기에 대한 설명으로 옳은 것은?",["기계가 소형이다.","안정도가 높다.","전압변동률이 크다.","전기자 반작용이 크다."],2,"동기발전기에서 단락비가 큰 경우: 전기자 반작용이 작고, 동일 정격에 대하여 동기 임피던스가 작고, 전압변동률이 양호(작다)하며, 기계가 크고 고중량이며 고가이다. 안정도가 높다."],
[T,"07 교류회로","어느 회로에 200[V]의 교류 전압을 가할 때 π/6[rad] 위상이 높은 10[A]의 전류가 흐른다. 이 회로의 전력[W]은?",["3,452","2,361","1,732","1,215"],3,"P=VI cosθ=200×10×cos30°=2,000×√3/2=1,732[W]"],
[S,"08 특수 장소 공사","화약고 등의 위험장소에서 전기설비 시설에 관한 내용으로 옳은 것은?",["전로의 대지전압은 400[V] 이하일 것","전기 기계 기구는 전폐형을 사용할 것","화약고 내의 전기설비는 화약고 장소에 전용개폐기 및 과전류차단기를 시설할 것","개폐기 및 과전류차단기에서 화약고 인입구까지의 배선은 케이블 배선으로 노출하여 시설할 것"],2,"화약류 저장소 등의 위험장소: 전로의 대지전압은 300[V] 이하, 전기기계기구는 전폐형, 화약류 저장소 이외의 곳에 전용 개폐기 및 과전류 차단기를 시설할 것, 케이블을 인입할 때는 케이블이 손상될 우려가 없도록 시설할 것"],
[T,"06 전자유도 법칙과 인덕턴스","자속밀도가 B인 평등한 자기장에 길이가 l인 도선이 있다. 도선이 자속과 수직 방향으로 v 속도로 이동했다면 이때 유도되는 기전력은?",["Blv","Bl/v","Bv/l","lv/B"],1,"유기기전력 e=Blv sinθ[V]. 도선과 자속이 이루는 각이 직각(θ=90°)이므로 e=Blv[V]"],
[T,"07 교류회로","İ=8+j6[A]로 표시되는 전류의 크기 I[A]는 얼마인가?",["6","8","10","12"],3,"전류의 크기 I=√(8²+6²)=10[A]"],
[T,"07 교류회로","R=6[Ω], XL=8[Ω], Xc=16[Ω]이 직렬로 연결된 회로에 100[V]의 교류를 가했을 때 흐르는 전류와 임피던스는?",["7.14[A], 용량성","7.14[A], 유도성","10[A], 용량성","10[A], 유도성"],3,"임피던스 Z=R+j(XL−Xc)=6−j8[Ω]이므로 회로에는 용량성 전류가 흐른다. I=V/|Z|=100/√(6²+8²)=100/10=10[A]"],
[T,"02 전기회로 해석","3[Ω]의 저항 5개, 4[Ω]의 저항 5개, 5[Ω]의 저항 3개가 있다. 이들을 모두 직렬 접속할 때 합성저항[Ω]은?",["75","50","45","35"],2,"직렬연결된 저항은 각 저항값을 더하여 합성한다. R=3×5+4×5+5×3=50[Ω]"],
[T,"06 전자유도 법칙과 인덕턴스","다음 중 코일이 가지는 특성 및 기능으로 옳지 않은 것은?",["전류의 변화를 안정시키려고 하는 특성","상호유도작용의 특성","직류 전류를 차단하고 교류 전류를 통과시키려는 특징","공진하는 특성"],3,"코일은 직류 전류는 통과시키고 교류 전류는 방해하는 특성이 있다. (콘덴서와 반대)"],
[T,"02 전기회로 해석","기전력 4[V], 내부저항 0.2[Ω]의 전지 10개를 직렬로 접속하고 두 극 사이에 부하저항을 접속하였더니 4[A]의 전류가 흘렀다. 이때 외부저항은 몇 [Ω]이 되겠는가?",["6","7","8","9"],3,"총 기전력 V=4×10=40[V], 합성저항 R=0.2×10+R외부. I=40/(2+R)=4 → 10=2+R ∴ R외부=8[Ω]","직렬 연결 전지(내부저항 합 0.2×10=2[Ω], 기전력 4×10=40[V])와 외부저항 R이 하나의 루프를 이루고 4[A]가 흐르는 회로."],
[T,"01 직류회로","다음 설명 중 잘못된 것은?",["양전하를 많이 가진 물질은 전위가 낮다.","1초 동안에 1[C]의 전기량이 이동하면 전류는 1[A]이다.","전위차가 높으면 높을수록 전류는 잘 흐른다.","전류의 방향은 전자의 이동 방향과는 반대 방향으로 정한다."],1,"전위는 양전하가 많을수록 높다. 전류는 전압(전위차)이 높을수록, 저항이 작을수록 잘 흐르며 방향은 양전하가 이동하는 방향으로 정의한다."],
[S,"03 전선의 접속","단선의 직선접속 방법 중에서 트위스트 직선 접속을 할 수 있는 최대 단면적은 몇 [mm²] 이하인가?",["2.5","4","6","10"],3,"트위스트 접속: 단선의 직선 접속에서 6[mm²] 이하의 가는 전선을 접속하는 방법"],
[T,"09 비정현파","비사인파의 일반적인 구성이 아닌 것은?",["삼각파","고조파","기본파","직류분"],1,"비사인파=직류성분+기본파성분+고조파성분"],
[G,"03 변압기","금속 내부를 지나는 자속의 변화로 금속 내부에 생기는 맴돌이 전류를 작게 하려면 어떻게 하여야 하는가?",["두꺼운 철판을 사용한다.","높은 전류를 가한다.","얇은 철판을 성층하여 사용한다.","철판 양면에 절연지를 부착한다."],3,"맴돌이 전류(와류)를 작게 하기 위해 얇은 철심을 여러 겹 성층한다."],
[G,"01 직류기","직류 전동기의 속도 제어에서 자속을 2배로 하면 회전수는?",["1/2배로 줄어든다.","변함이 없다.","2배로 증가한다.","4배로 증가한다."],1,"직류 전동기의 속도 N=K(V−IaRa)/φ[rpm]. 속도와 자속은 반비례이므로 자속이 2배가 되면 속도는 1/2배가 된다."],
[T,"04 정전기와 콘덴서","전기 분해하여 금속의 표면의 산화피막을 만들어 이것을 유전체로 이용한 것은?",["마일러 콘덴서","마이카 콘덴서","전해 콘덴서","세라믹 콘덴서"],3,"마일러: 폴리에스테르 필름, 마이카: 운모, 전해: 전해 산화한 금속 피막, 세라믹: 티탄산 바륨을 유전체로 사용하는 콘덴서"],
[G,"02 동기기","속도가 일정하고 구조가 간단하며 동기이탈이 없는 전동기로서 전기시계, 오실로그래프 등에 많이 사용되는 전동기는?",["유도동기 전동기","초동기 전동기","단상동기 전동기","반동 전동기"],4,"반동 전동기: 직류 여자 코일이 없는 소형의 돌극형 동기 전동기로 반작용 토크에 의해 회전한다. 구조가 간단하고 유지보수가 용이하며 출력이 작고 역률이 낮다. 정밀한 동기속도가 필요한 전기시계, 오실로그래프 등에 사용한다."],
[S,"07 고압 및 저압 배전반 공사","점유 면적이 좁고 운전, 보수 시에 안전하므로 공장, 빌딩 등의 전기실에 많이 사용되는 배전반은 어떤 것인가?",["데드 프런트형","수직형","큐비클형","라이브 프런트형"],3,"폐쇄형 배전반을 일반적으로 큐비클형이라고 한다. 점유 면적이 좁고 운전 보수 시에 안전하므로 공장 빌딩 등의 전기실에 많이 사용된다."],
[T,"01 직류회로","Ȧ₁=A₁∠θ₁, Ȧ₂=A₂∠θ₂일 때 두 벡터의 곱 Ȧ를 구하는 식은?",["A₁A₂∠(θ₁θ₂)","A₁A₂∠(θ₁+θ₂)","(A₁+A₂)∠(θ₁θ₂)","(A₁+A₂)∠(θ₁+θ₂)"],2,"Ȧ=Ȧ₁Ȧ₂=A₁A₂∠(θ₁+θ₂)"],
[G,"05 정류기 및 제어기기","입력으로 펄스 신호를 가해주고 속도를 입력 펄스의 주파수에 의해 조절하는 전동기는?",["전기 동력계","서보 전동기","스테핑 전동기","권선형 유도 전동기"],3,"직류 스테핑 전동기: 회전속도는 입력 펄스 주파수에 비례하여 증감한다. 입력되는 펄스 신호에 따라 미리 설정된 각도만큼 회전한다. 응답 특성이 좋고 정밀 제어에 용이하다."],
[S,"09 전기응용 시설 공사","공장, 사무실, 학교, 상점 등 옥내에 시설하는 전등은 부분조명이 가능하도록 시설하여야 하는데 이때 전등군은 몇 등 이내로 하는 것이 바람직한가?",["6","8","10","12"],1,"사무실, 공장, 상점, 병원 기타 이와 유사한 장소에서 점멸기 1개에 속하는 등기구는 6개 이내로 설치하여야 한다."],
[S,"05 전선 및 기계기구의 보안공사","과전류 차단기로서 저압전로에 사용되는 산업용 배선차단기에 있어서 정격전류가 32[A]인 회로에 50[A]의 전류가 흘렀을 때 몇 분 이내에 자동적으로 동작하여야 하는가?",["20분","30분","60분","120분"],3,"산업용 배선차단기: 정격전류 63[A] 이하의 규정시간은 60분(부동작전류 1.05배, 동작전류 1.3배), 63[A] 초과는 120분. 50/32=1.56배(1.3배 초과)이므로 60분 이내에 동작해야 한다."],
[S,"06 전선로 및 배전선 공사","다단의 크로스 암이 설치되고 또한 장력이 클 때와 H주일 때 보통 지지선을 2단으로 부설하는 지선은?",["보통 지지선","공동 지선","궁 지지선","Y 지지선"],4,"Y 지지선: 장력이 큰 곳에 사용하는 지지선. H주일 때 전주별로 지지선 설치가 곤란하거나 1개의 지지선용 버팀대로 저항력을 확보할 수 있는 경우 2단으로 설치한다."],
[S,"04 옥내 배선 공사","합성수지관의 장점이 아닌 것은?",["절연이 우수하다.","기계적 강도가 높다.","내부식성이 우수하다.","시공하기 쉽다."],2,"합성수지관은 PVC로 제작되어 절연 및 내부식성이 우수하고 저렴하나 기계적 강도가 약하다."],
[G,"02 동기기","동기 발전기의 무부하 포화 곡선에 대한 설명으로 옳은 것은?",["정격전류와 단자전압의 관계이다.","정격전류와 정격전압의 관계이다.","계자전류와 정격전압의 관계이다.","계자전류와 단자전압의 관계이다."],4,"무부하 포화 곡선: 동기 발전기에서 계자전류와 무부하 유기 기전력(단자전압)의 관계 곡선","가로축 계자전류 If, 세로축 기전력 E. 원점 O에서 직선(공극선)과 곡선(무부하 포화 곡선 M)이 그려지고 b에서 수평선이 곡선(c)과 직선(a)에 만남."],
[G,"05 정류기 및 제어기기","게이트(gate)에 신호를 가해야만 동작하는 소자는?",["SCR","MPS","UJT","DIAC"],1,"SCR은 PNPN의 4층 구조로 된 대표적인 3단자 사이리스터 소자이다. 양극(Anode), 음극(Cathode), 게이트(Gate) 3개의 단자 중 게이트에 흐르는 작은 전류로 큰 전력을 제어할 수 있다."],
[S,"04 옥내 배선 공사","금속관 공사에서 금속관을 콘크리트에 매입할 경우 관의 두께는 몇 [mm] 이상의 것이어야 하는가?",["0.8[mm]","1.0[mm]","1.2[mm]","1.5[mm]"],3,"금속관의 두께: 콘크리트에 매입하는 경우 1.2[mm] 이상, 기타의 경우 1.0[mm] 이상"],
[G,"03 변압기","1차 전압이 13,200[V], 2차 전압이 220[V]인 단상 변압기의 1차에 6,000[V]의 전압을 가하면 2차 전압은 몇 [V]인가?",["100","200","1,000","2,000"],1,"권수비 a=V₁/V₂=13,200/220=60. V₁=6,000[V]일 때 V₂=V₁/a=6,000/60=100[V]"],
[T,"04 정전기와 콘덴서","0.2[μF] 콘덴서와 0.1[μF] 콘덴서를 병렬연결하여 40[V]의 전압을 가할 때 0.2[μF]에 축적되는 전하[μC]의 값은?",["2","4","8","12"],3,"병렬연결된 두 콘덴서에 걸리는 전압은 같고, 전하량은 정전 용량 C에 비례하여 배분된다. Q₁=CV=0.2×40=8[μC]"],
[S,"04 옥내 배선 공사","금속전선관 공사에서 금속관과 접속함을 접속하는 경우 녹아웃 구멍이 금속관보다 클 때 사용하는 부품은?",["록 너트(로크 너트)","부싱","새들","링 리듀서"],4,"금속전선관 공사에서 접속함과 파이프 고정 시 구멍이 클 때 링 리듀서를 사용하여 고정한다."],
[T,"03 전류의 열작용과 화학작용","200[V], 60[W] 전등 10개를 20시간 사용하였다면 사용 전력량은 몇 [kWh]인가?",["10","12","24","11"],2,"전등 1개 사용 시 전력량 P=60×20=1,200[Wh]=1.2[kWh]. 전체 전력량=1.2×10=12[kWh]"],
[S,"02 배선재료와 공구","다음 중 인류 또는 내장주 선로에서 활선 공법을 할 때 작업자가 현수애자 등에 접촉되어 생기는 안전사고를 예방하기 위해 사용하는 것은?",["활선커버","가스개폐기","데드엔드커버","프로텍터차단기"],3,"데드엔드커버: 가공전선로에서 활선 작업 시 작업자가 현수 애자 등에 접촉하여 발생하는 안전사고를 예방하기 위해 전선 작업 개소에서 애자 등의 충전부를 방호하는 절연 커버"],
[S,"04 옥내 배선 공사","애자사용공사에 사용하는 애자가 갖추어야 할 성질과 가장 거리가 먼 것은?",["절연성","난연성","내수성","유연성"],4,"애자사용공사에 사용하는 애자는 절연성·난연성 및 내수성의 것이어야 한다."],
[G,"01 직류기","다음 중 전기 용접기용 발전기로 가장 적당한 것은?",["직류분권형 발전기","차동복권형 발전기","가동복권형 발전기","직류타여자식 발전기"],2,"차동 복권 발전기의 특징: 직권과 분권 계자 권선의 기자력이 서로 상쇄된다. 부하 증가에 따라 전압이 현저하게 감소하고 정전류 특성인 수하 특성을 가진다. 수하 특성은 누설 변압기로, 용접기용으로 적합하다."],
[S,"05 전선 및 기계기구의 보안공사","다음의 심벌 명칭은 무엇인가?(3상 세로 사각형 3개, 화살표와 접지 표시)",["파워퓨즈","단로기","피뢰기","고압 컷아웃 스위치"],3,"문제에 나온 심벌은 피뢰기의 복선도이다.","세로로 긴 직사각형 3개가 나란히 있고 각각 위에서 아래로 향하는 화살표(↓)와 아래에서 위로 향하는 화살표(↑)가 있으며, 아래쪽을 가로선으로 묶어 하나의 접지 기호에 연결한 피뢰기 복선도 기호."],
[G,"01 직류기","직류 복권 전동기를 분권 전동기로 사용하려면 어떻게 하여야 하는가?",["분권계자를 단락한다.","부하단자를 단락한다.","직권계자를 단락한다.","전기자를 단락한다."],3,"계자와 전기자가 직렬로 연결되어 있으면 직권, 병렬이면 분권, 직·병렬이면 복권 전동기이다. 복권 전동기의 직권계자를 단락하면 분권 전동기로 사용할 수 있다."],
[G,"05 정류기 및 제어기기","다음 회로도에 대한 설명으로 옳지 않은 것은?",["다이오드 양극의 전압이 음극에 비하여 높을 때를 순방향 도통 상태라고 한다.","다이오드 양극의 전압이 음극에 비하여 낮을 때를 역방향 저지 상태라고 한다.","실제의 다이오드는 순방향 도통 시 양 단자 간의 전압강하가 발생하지 않는다.","역방향 저지 상태에서는 역방향(음극에서 양극)으로 약간의 전류가 흐르는데 이를 누설 전류라고 한다."],3,"순방향 바이어스: V>0, 전류 도통(Si: 0.7[V], Ge: 0.3[V] 내외의 전압 강하 발생). 따라서 순방향 도통 시에도 전압강하가 발생한다.","가변 전원 V에 저항 R, 전류계 A가 직렬이고 전압계 V가 다이오드와 병렬로 연결된 회로. 다이오드에는 전류 iᵈ, 전압 vᵈ 표시."],
[T,"05 자기 성질과 자기장","ⓐ, ⓑ에 들어갈 내용으로 알맞은 것은? '자기저항은 자기 회로의 길이에 (ⓐ)하고 자로의 단면적과 투자율의 곱에 (ⓑ)한다.'",["ⓐ 비례 ⓑ 반비례","ⓐ 반비례 ⓑ 비례","ⓐ 비례 ⓑ 비례","ⓐ 반비례 ⓑ 반비례"],1,"자기저항 Rm=l/(μS)[1/H] (l: 길이, μ: 투자율, S: 단면적)"],
[G,"01 직류기","직류 분권 발전기가 있다. 전기자 총 도체 수 220, 매 극의 자속 수 0.01[Wb], 극수 6, 회전수 1,500[rpm]일 때 유기 기전력은 몇 [V]인가?(단, 전기자 권선은 파권이다.)",["60","120","165","240"],3,"E=(p/a)Zφ(N/60)=(6/2)×220×0.01×(1,500/60)=165[V] (파권 병렬 회로수 a=2)"],
[G,"01 직류기","발전기의 전압 변동률을 표시하는 식은?(단, V₀: 무부하 전압, Vₙ: 정격전압)",["ε=(V₀/Vₙ−1)×100[%]","ε=(1−V₀/Vₙ)×100[%]","ε=(Vₙ/V₀−1)×100[%]","ε=(1−Vₙ/V₀)×100[%]"],1,"전압 변동률 ε=(V₀−Vₙ)/Vₙ×100=(V₀/Vₙ−1)×100[%]"],
[T,"03 전류의 열작용과 화학작용","㉠, ㉡에 들어갈 내용으로 알맞은 것은? '2차 전지의 대표적인 것으로 납축전지가 있다. 전해액으로 비중 약 (㉠) 정도의 (㉡)을 사용한다.'",["㉠ 1.15~1.21 ㉡ 묽은 황산","㉠ 1.25~1.36 ㉡ 질산","㉠ 1.01~1.15 ㉡ 질산","㉠ 1.23~1.36 ㉡ 묽은 황산"],4,"납축전지의 전해액으로는 묽은 황산을 사용하며 그 비중은 약 1.23~1.36이다."],
[S,"03 전선의 접속","아래 그림 기호가 나타내는 것은?(수동 조작 자동 복귀 a접점 기호 2개)",["한시 계전기 접점","전자 접촉기 접점","수동 조작 접점","조작 개폐기 잔류 접점"],3,"수동 조작(수동 조작 자동 복귀) 접점: a 접점, b 접점 기호","세로 선에 위아래 속이 빈 동그라미 2개와 사이의 짧은 가로 막대 기호 한 쌍(왼쪽은 a접점, 오른쪽은 b접점 형태)."],
[T,"02 전기회로 해석","전위차계로 전위를 측정하였다. B점의 전위가 100[V]이고 D점의 전위가 60[V]일 때 4[Ω]에 흐르는 전류는?",["5[A]","15/7[A]","20/7[A]","20[A]"],2,"B−D 사이 전류 I=(100−60)/8=5[A]. 병렬 회로에서 전류는 저항에 반비례. 4[Ω]에 흐르는 전류 I=3/(4+3)×5=15/7[A]","A점–B점 사이에 3[Ω]과 4[Ω]이 병렬, B–C 사이 5[Ω], C–D 사이 3[Ω] 직렬 연결."]
];

EX[16]=[
[T,"04 정전기와 콘덴서","어떤 콘덴서에 전압 20[V]를 가할 때 전하 800[μC]이 축적되었다면 이때 축적되는 에너지는?",["0.008[J]","0.16[J]","0.8[J]","160[J]"],1,"W=(1/2)CV²=(1/2)QV=(1/2)×(800×10⁻⁶)×20=0.008[J]"],
[S,"05 전선 및 기계기구의 보안공사","지중에 매설되어 있는 금속제 수도관로는 접지공사의 접지극으로 사용할 수 있다. 이때 수도관로는 대지와의 전기저항치가 얼마 이하여야 하는가?",["1[Ω]","2[Ω]","3[Ω]","4[Ω]"],3,"금속제 수도관을 접지극으로 사용할 경우 3[Ω] 이하의 접지저항을 가지고 있을 것. 건물의 철골 등 금속체를 접지극으로 사용할 경우 2[Ω] 이하의 접지저항을 가지고 있을 것"],
[G,"03 변압기","변압기의 권선 배치에서 저압 권선을 철심에 가까운 쪽에 배치하는 이유는?",["전류 용량","절연 문제","냉각 문제","구조상 편의"],2,"저압 측 권선을 철심 가까이 배치하는 이유: 권선의 절연량 감소, 누설 리액턴스 감소, 변압기 크기 감소 및 비용 절감, 고압 측 권선에 탭 절환기 배치 용이"],
[T,"07 교류회로","R과 C가 병렬로 연결된 회로(전원 E)에서 R-C 임피던스는?",["1/√(1/R²+(1/ωC)²)","1/√((1/R)²+(ωC)²)","√((1/R)²+(ωC)²)","√(R²+(1/ωC)²)"],2,"어드미턴스 Y=1/R+jωC에서 |Y|=√((1/R)²+(ωC)²)[℧]. 임피던스 |Z|=1/|Y|=1/√((1/R)²+(ωC)²)[Ω]","저항 R(전류 I_R)과 콘덴서 C(전류 I_C)가 병렬로 연결되고 교류 전원 E와 전체 전류 I가 흐르는 회로."],
[G,"03 변압기","변압기의 철심에서 실제 철의 단면적과 철심의 유효 면적과의 비를 무엇이라고 하는가?",["권수비","변류비","변동률","점적률"],4,"변압기의 철심에서 정해진 공간 면적 중 유효 면적이 차지하는 비율을 점적률이라고 한다."],
[S,"04 옥내 배선 공사","가요 전선관의 상호 접속은 무엇을 사용하는가?",["컴비네이션 커플링","스필릿 커플링","더블 커넥터","앵글 커넥터"],2,"가요 전선관과 금속관 접속: 컴비네이션 커플링, 가요 전선관 상호 접속: 스필릿 커플링, 가요 전선관과 박스 접속: 스트레이트박스 커넥터, 앵글박스 커넥터"],
[G,"01 직류기","3상 66,000[kVA], 22,900[V] 터빈 발전기의 정격전류는 약 몇 [A]인가?",["8,764","3,367","2,882","1,664"],4,"정격전류 I=Pn/(√3×Vl)=66,000×10³/(√3×22,900)=1,663.9[A]"],
[G,"04 유도기","3상 유도 전동기의 공급 전압이 일정하고 주파수가 정격값보다 수 [%] 감소할 때 다음 현상 중 옳지 않은 것은?",["동기 속도가 감소한다.","철손이 증가한다.","누설 리액턴스가 증가한다.","효율이 나빠진다."],3,"동기속도 Ns=120f/p이므로 f가 감소하면 감소. 전압이 일정하면 f∝1/B이므로 주파수가 감소할 때 히스테리시스손이 증가하여 철손이 증가하고 효율이 감소한다. 누설 리액턴스 XL=2πfL은 f에 비례하므로 감소한다."],
[G,"05 정류기 및 제어기기","그림은 전력제어 소자를 이용한 위상제어 회로이다. 전동기의 속도를 제어하기 위해서 '가' 부분에 사용되는 소자는?",["전력용 트랜지스터","제너 다이오드","트라이액","레귤레이터 78XX 시리즈"],3,"TRIAC(트라이액): 사이리스터 2개를 역병렬로 접속한 것으로, 양방향으로 전류가 흐르므로 교류 및 전력 제어용으로 사용한다. 제너 다이오드는 정전압 회로용이다.","사인파 교류 전원에 전동기, 가변저항 E₁, 콘덴서 C₁이 연결되고 DIAC를 거쳐 점선 사각형 '가' 소자가 전동기 쪽에 연결된 위상제어 회로."],
[S,"05 전선 및 기계기구의 보안공사","반송보호 계전방식의 이점을 설명한 것으로 틀린 것은?",["다른 방식에 비해 장치가 간단하다.","고장 구간의 고속도 동시 차단이 가능하다.","고장 구간의 선택이 확실하다.","동작을 예민하게 할 수 있다."],1,"반송보호 계전방식은 초고압 송전선의 보호계전방식으로, 표시선 계전방식에 비해 다소 복잡하나 경제적이다."],
[G,"05 정류기 및 제어기기","다음 중 반도체 정류 소자로 사용할 수 없는 것은?",["게르마늄","비스무트","실리콘","산화구리"],2,"다이오드는 대부분 실리콘으로 이루어져 있으나 셀레늄, 게르마늄을 사용하기도 한다. 구리판에 산화구리(Ⅱ) 피막을 입히면 정류 소자로 활용할 수 있다."],
[G,"01 직류기","측정이나 계산으로 구할 수 없는 손실로 부하 전류가 흐를 때 도체 또는 철심 내부에서 생기는 손실을 무엇이라 하는가?",["구리손","히스테리시스손","맴돌이 전류손","표유 부하손"],4,"구리손: 코일 저항에 의한 열손실, 히스테리시스손: 자기력 방향이 주기적으로 변하며 발생하는 열, 맴돌이 전류손(와류손): 와류에 의한 손실, 표유 부하손: 부하 전류가 흐르는 상태에서 도체나 철심 안에 생기는 손실"],
[S,"04 옥내 배선 공사","라이팅 덕트 공사에 의한 저압 옥내배선 시 덕트의 지지점 간 거리는 몇 [m] 이하로 해야 하는가?",["1.0","1.2","2.0","3.0"],3,"건축 구조물에 부착할 경우 지지점은 매 덕트마다 2개소 이상, 그리고 거리는 2[m] 이하로 한다."],
[G,"02 동기기","동기 전동기를 자체 기동법으로 기동할 때 계자 회로는 어떻게 하여야 하는가?",["단락시킨다.","개방시킨다.","직류를 공급한다.","단상교류를 공급한다."],1,"자기(자체) 기동법: 회전 자극 표면에 기동 권선을 설치하여 기동 시에는 농형 유도 전동기로 동작시켜 기동시킨다. 계자 회로에 높은 전압이 유기되면 소손될 염려가 있으므로 반드시 단락 후 기동한다."],
[T,"06 전자유도 법칙과 인덕턴스","감은 횟수 200회의 코일 P와 300회의 코일 S를 가까이 놓고 P에 1[A]의 전류를 흐를 때 S와 쇄교하는 자속이 4×10⁻⁴[Wb]이었다면 이들 코일 사이의 상호 인덕턴스는?",["0.12[H]","0.12[mH]","1.2×10⁻⁴[H]","1.2×10⁻⁴[mH]"],1,"상호 인덕턴스 M=Nsφ/Ip=300×4×10⁻⁴/1=0.12[H]"],
[T,"06 전자유도 법칙과 인덕턴스","다음 중 전자력 작용을 응용한 대표적인 것은?",["전동기","전열기","축전기","전등"],1,"전동기는 전자력 F=I(l×B)를 응용한 대표적인 기기이다."],
[G,"03 변압기","3상 전원에서 2상 전원을 얻기 위한 변압기 결선 방법은?",["스코트 결선","대각 결선","포크 결선","2차 2중 Y 결선"],1,"스코트 결선(T 결선): 단상 변압기 두 대를 이용하여 3상에서 2상으로 변환하는 방법으로, 이용률은 √3/2(86.6[%])이다."],
[G,"05 정류기 및 제어기기","다음 중 유도 전동기의 속도 제어에 사용되는 인버터 장치의 약호는?",["CVCF","VVVF","CVVF","VVCF"],2,"VVVF(Variable Voltage Variable Frequency): 가변전압 가변 주파수 제어(유도 전동기의 속도 제어). CVCF: 정전압 정주파수, CVVF: 정전압 가변 주파수, VVCF: 가변전압 정주파수"],
[S,"05 전선 및 기계기구의 보안공사","배전용 전기기계기구인 COS(컷아웃스위치)의 용도로 알맞은 것은?",["배전용 변압기의 1차 측에 시설하여 변압기의 단락 보호용으로 쓰인다.","배전용 변압기의 2차 측에 시설하여 변압기의 단락 보호용으로 쓰인다.","배전용 변압기의 1차 측에 시설하여 배전 구역 전환용으로 쓰인다.","배전용 변압기의 2차 측에 시설하여 배전 구역 전환용으로 쓰인다."],1,"컷아웃스위치는 고압 퓨즈라고도 하며, 배전용 변압기의 1차 측에 설치하여 변압기의 단락 등으로부터 변압기를 보호하는 기구이다."],
[T,"08 3상 교류회로","성형 결선에서 상전압이 115[V]인 대칭 3상 교류의 선간전압은?",["약 100[V]","약 150[V]","약 200[V]","약 250[V]"],3,"Y 결선에서 상전압 Vp일 때 선간 전압 Vl=√3Vp=√3×115=199.2[V]"],
[G,"04 유도기","전부하 슬립 5[%], 2차 저항손 5.26[kW]인 3상 유도 전동기의 2차 입력은 몇 [kW]인가?",["2.63","5.26","105.2","22.65"],3,"2차 입력 P₂=P₂ᵣ/s=5.26/0.05=105.2[kW]"],
[S,"04 옥내 배선 공사","다음 중 애자사용공사에 사용되는 애자의 구비조건과 거리가 먼 것은?",["광택성","절연성","난연성","내수성"],1,"애자사용공사에 사용하는 애자는 절연성·난연성 및 내수성의 것이어야 한다."],
[G,"01 직류기","분권 발전기는 잔류 자속에 의해서 잔류 전압을 만들고 이때 여자 전류가 잔류 자속을 증가시키는 방향으로 흐르면 여자 전류가 점차 증가하면서 단자 전압이 상승하게 된다. 이 현상을 무엇이라 하는가?",["자기포화","여자 조절","보상 전압","전압 확립"],4,"자여자 발전기의 전압 확립: 잔류 자속에 의해 잔류 전압이 유도되어 여자 전류가 증가함에 따라 단자 전압이 자기 포화점까지 상승하는 과정"],
[T,"03 전류의 열작용과 화학작용","전기 분해에 의해서 구리를 정제하는 경우, 음극선에서 구리 1[kg]을 석출하기 위해서는 200[A]의 전류를 약 몇 시간[h] 흘려야 하는가?(단, 전기 화학당량은 0.3293×10⁻³[g/C]이다.)",["2.11[h]","4.22[h]","8.44[h]","12.65[h]"],2,"석출량 W=kIt[g]. t=W/(kI)=1,000/(0.3293×10⁻³×200)×1/3,600=4.22[h]"],
[G,"02 배선재료와 공구","전동기 과부하 보호장치에 해당되지 않는 것은?",["전동기용 퓨즈","열동계전기","전동기 보호용 배선용 차단기","전동기 기동장치"],4,"전동기 기동장치는 기동 시 기동전류가 낮게 흐르도록 하기 위해 사용한다."],
[T,"07 교류회로","교류 회로에서 전압과 전류의 위상차를 θ[rad]라 할 때 cosθ는?",["전압 변동률","왜곡률","효율","역률"],4,"전압과 전류의 위상차가 θ일 때 cosθ를 역률이라 한다."],
[S,"03 전선의 접속","구리전선과 전기기계 기구단자를 접속하는 경우에 진동 등으로 인하여 헐거워질 염려가 있는 곳에는 어떤 것을 사용하여 접속하여야 하는가?",["평와셔 2개를 끼운다.","스프링 와셔를 끼운다.","코드 패스너를 끼운다.","정슬리브를 끼운다."],2,"진동이 있는 기계기구에 접속할 때에는 이중너트 또는 스프링 와셔를 사용한다."],
[S,"07 고압 및 저압 배전반 공사","수·변전 설비에서 전력퓨즈의 용단 시 결상을 방지하는 목적으로 사용하는 것은?",["자동 고장 구분 개폐기","선로 개폐기","부하 개폐기","기중 부하 개폐기"],3,"부하 개폐기(LBS)는 부하 전류를 차단하거나 회로를 분리하는 장치이다. 고압 배전선로에서 주로 사용하며, 고장 시 모든 상을 차단하여 결상을 방지한다."],
[S,"06 전선로 및 배전선 공사","가공전선로의 지지물에 승탑 또는 승강용으로 사용하는 발판 볼트 등은 지표상 몇 [m] 미만에 시설하여서는 안 되는가?",["1.2[m]","1.5[m]","1.6[m]","1.8[m]"],4,"가공전선로의 지지물에 취급자가 오르고 내리는 데 사용하는 발판 볼트는 지표상 1.8[m] 미만에 시설하여서는 안 된다."],
[G,"02 동기기","병렬운전 중인 동기 발전기의 난조를 방지하기 위하여 자극면에 유도 전동기의 농형 권선과 같은 권선을 설치하는데 이 권선의 명칭은?",["계자 권선","제동 권선","전기자 권선","보상 권선"],2,"제동 권선: 자극면에 슬롯을 설치하여 단락 권선(도체)을 삽입한 것이다. 동기기에서 난조 발생을 억제한다. 모터 기동 시 기동 토크를 생성하며 자력 기동할 수 있게 한다."],
[G,"04 유도기","슬립 4[%]인 유도 전동기의 등가 부하저항은 2차 저항의 몇 배인가?",["5","19","20","24"],4,"등가 저항 R=r₂(1−s)/s=r₂×(1−0.04)/0.04=24r₂[Ω]. 즉 등가 저항은 2차 저항의 24배이다."],
[T,"02 전기회로 해석","4[Ω], 6[Ω], 8[Ω]의 3개 저항을 병렬 접속할 때 합성저항은 약 몇 [Ω]인가?",["1.8[Ω]","2.5[Ω]","3.6[Ω]","4.5[Ω]"],1,"저항 병렬연결 시 합성저항 R=1/(1/4+1/6+1/8)=1.84[Ω]"],
[S,"07 고압 및 저압 배전반 공사","전력용 콘덴서를 회로로부터 개방하였을 때 전하가 잔류함으로써 일어나는 위험의 방지와 재투입할 때 콘덴서에 걸리는 과전압 방지를 위하여 무엇을 설치하는가?",["직렬 리액터","전력용 콘덴서","방전 코일","피뢰기"],3,"잔류 전하를 방전시키기 위해 방전 코일을 사용한다."],
[G,"01 직류기","직류 전동기를 기동할 때 전기자 전류를 제한하는 가감저항기를 무엇이라 하는가?",["단속기","제어기","가속기","기동기"],4,"직류 전동기의 기동전류를 제한하기 위해 전기자에 직렬로 기동저항기를 접속한다."],
[G,"01 직류기","다음 그림에서 직류 분권 전동기의 속도 특성 곡선은?",["A","B","C","D"],2,"분권 전동기의 전기자와 계자권선은 병렬로 접속되어 전원에 연결된다. 단자전압이 일정하면 계자전류 If는 전기자 전류 Ia와 관계없이 If=V/Rf로 일정하다. 그림에서 정속도 특성을 나타내는 곡선은 B이다.","가로축 부하전류[A], 세로축 속도 N[rpm]. A는 오른쪽 위로 상승하는 직선, B는 완만하게 약간 내려가는 곡선, C는 B보다 더 내려가는 곡선, D는 가파르게 떨어지다 완만해지는 곡선."],
[G,"05 정류기 및 제어기기","교류 동기 서보 모터에 비하여 효율이 훨씬 좋고 큰 토크를 발생하여 입력되는 각 전기 신호에 따라 규정된 각도만큼씩 회전하며 회전자는 축 방향으로 자화된 영구 자석으로서 보통 50개 정도의 톱니로 만들어져 있는 것은?",["전기 동력계","유도 전동기","직류 스테핑 모터","동기 전동기"],3,"직류 스테핑 모터: 디지털 신호로 제어하는 전동기로, 입력 신호에 따라 정해진 각도(스텝각)만큼 회전한다. 디지털 기기와 접속이 용이하고 기동·정지 특성이 좋다. 회전각과 속도는 펄스에 의해 비례동작한다."],
[G,"05 정류기 및 제어기기","상전압 300[V]의 3상 반파 정류회로의 직류전압은 약 몇 [V]인가?",["520[V]","350[V]","260[V]","50[V]"],2,"3상 반파 정류에서 Ed=1.17E=1.17×300=351[V]"],
[S,"07 고압 및 저압 배전반 공사","한 분전반에 사용전압이 각각 다른 분기회로가 있을 때 분기회로를 쉽게 식별하기 위한 방법으로 가장 적합한 것은?",["차단기별로 분리해 놓는다.","차단기 가까운 곳에 각각 전압을 표시하는 명판을 붙여 놓는다.","왼쪽은 고압측 오른쪽은 저압측으로 분류해 놓고 전압 표시는 하지 않는다.","분전반을 철거하고 다른 분전반을 새로 설치한다."],2,"분전반의 회로구분은 각각의 회로에 귀로를 표시하여 식별이 가능하도록 하는 것이 좋다. 또한 회로에 명판을 표시하고 도면과 함께 놓아두어야 한다."],
[T,"06 전자유도 법칙과 인덕턴스","자속밀도 0.8[Wb/m²]인 자계에서 길이 50[cm]인 도체가 30[m/s]로 회전할 때 유기되는 기전력[V]은?",["8","12","15","24"],2,"유기 기전력 e=Blv=0.8×0.5×30=12[V]"],
[T,"06 전자유도 법칙과 인덕턴스","자기 인덕턴스 10[mH]의 코일에 50[Hz], 314[V]의 교류 전압을 가했을 때 몇 [A]의 전류가 흐르는가?(단, 코일의 저항은 없는 것으로 하며, π=3.14로 계산한다.)",["10[A]","31.4[A]","62.8[A]","100[A]"],4,"유도성 리액턴스 XL=2πfL=2×3.14×50×10×10⁻³=3.14[Ω]. 전류 I=V/XL=314/3.14=100[A]"],
[T,"04 정전기와 콘덴서","30[μF]과 40[μF]의 콘덴서를 병렬로 접속한 다음 100[V] 전압을 가했을 때 전 전하량은 몇 [C]인가?",["17×10⁻⁴[C]","34×10⁻⁴[C]","56×10⁻⁴[C]","70×10⁻⁴[C]"],4,"콘덴서 병렬 연결 시 합성 정전용량 C=30+40=70[μF]. 전체 전하량 Q=CV=70×10⁻⁶×100=70×10⁻⁴[C]"],
[S,"05 전선 및 기계기구의 보안공사","돌침부에서 이온 또는 펄스를 발생시켜 뇌운의 전하와 작용토록 하여 멀리 있는 뇌운의 방전을 유도하여 보호 범위를 넓게 하는 방식은?",["돌침 방식","용마루 위 도체 방식","이온 방사형 피뢰방식","케이지 방식"],3,"이온 방사형 피뢰 방식: 뇌운 접근 시 이온 또는 펄스를 방사하여 뇌운의 방전을 유도 흡입하는 방식. 돌침 방식은 건축물 상부에 돌침을 설치, 용마루 위 도체는 수평도체, 케이지는 그물망으로 보호하는 방식이다."],
[T,"02 전기회로 해석","다음 회로에서 전류 I의 값[A]은?(15[V], 5[V] 전원 반대방향, 저항 2·3·4·1[Ω] 직렬)",["0.5","1","1.5","2"],2,"전류 I=V/R=(15−5)/(2+4+3+1)=10/10=1[A]","직사각형 폐회로. 위쪽에 15[V] 전지와 2[Ω], 오른쪽에 3[Ω](전류 I 아래로), 아래쪽에 1[Ω]과 5[V] 전지, 왼쪽에 4[Ω]. 두 전지는 서로 반대 방향."],
[T,"03 전류의 열작용과 화학작용","다음은 연축전지에 대한 설명이다. 옳지 않은 것은?",["전해액은 황산을 물에 섞어서 비중을 1.2~1.3 정도로 하여 사용한다.","충전 시 양극은 PbO로 되고 음극은 PbSO₄로 된다.","방전전압의 한계는 1.8[V]로 하고 있다.","용량은 (방전전류×방전시간)으로 표시하고 있다."],2,"연축전지: 전해액은 황산을 물에 섞어 비중을 1.2~1.3 정도로 한다. 양극판은 PbO₂, 음극판은 Pb이다. 방전종지전압은 1.8[V], 공칭전압은 2[V/cell]이다. 축전지 용량 Q=I×t[Ah]"],
[T,"03 전류의 열작용과 화학작용","220[V]용 24[W] 전구 두 개를 직렬과 병렬로 전원 220[V]에 각각 연결하면?",["직렬로 연결한 전등이 더 밝다.","병렬로 연결한 전등이 더 밝다.","직렬로 연결한 경우와 병렬로 연결한 경우의 밝기가 같다.","전구가 모두 안 켜진다."],2,"직렬연결 시 각 전구에 걸리는 전압은 0.5V이므로 소비 전력 P=(0.5V)²/R=0.25P. 병렬연결 시 각 전구에 V가 걸려 소비 전력 P. 병렬연결일 때 소비 전력이 더 크므로 더 밝다."],
[G,"04 유도기","인견 공업에 쓰이는 포트 전동기의 속도 제어는?",["극수 변환에 의한 제어","1차 회전에 의한 제어","주파수 변환에 의한 제어","저항에 의한 제어"],3,"인견 공업용 전동기의 요구 특성: 부드러운 시동과 제동, 부하 변화에도 일정한 회전 속도 유지, 동작의 유연성을 위해 인버터를 이용한 주파수 변환 제어 채택"],
[S,"03 전선의 접속","다음 중 단선의 브리타니아 직선 접속에 사용되는 것은?",["조인트선","파라핀선","바인드선","에나멜선"],1,"브리타니아 직선 접속에서 조인트선을 사용하며, 조인트선에는 1.0~1.2[mm] 연동 나선을 사용한다.","(a)~(d) 단계 그림: 첨선, 펜치 위치, 5회·15D 이상·5회 감기, 조인트선 등 브리타니아 직선 접속 과정."],
[T,"05 자기 성질과 자기장","자속밀도 B=0.2[Wb/m²]의 자장 내에 길이 2[m], 폭 1[m], 권수 5회의 구형 코일이 자장과 30°의 각도로 놓여 있을 때 코일이 받는 회전력은?(단, 코일에 흐르는 전류는 2[A]이다.)",["√(3/2)[N·m]","√3/2[N·m]","2√3[N·m]","√3[N·m]"],3,"회전력 τ=BNIS cosθ=0.2×5×2×(2×1)×(√3/2)=2√3[N·m]"],
[S,"03 전선의 접속","동전선의 종단접속 방법이 아닌 것은?",["동선 압착단자에 의한 접속","종단겹침용 슬리브에 의한 접속","C형 전선접속기 등에 의한 접속","비틀어 꽂는 형의 전선접속기에 의한 접속"],3,"구리(동)선의 종단 접속: 압착단자, 종단겹침용 슬리브(E형), 비틀어 꽂는 형의 전선접속기에 의한 접속. 직선 맞대기용 슬리브(B형)와 C형 접속기는 직선접속에 쓰인다."],
[T,"04 정전기와 콘덴서","\"물질 중의 자유전자가 과잉된 상태\"란?",["(−) 대전상태","(+) 대전상태","발열상태","중성상태"],1,"서로 다른 물체를 마찰하면 중성이던 물체가 전자를 잃거나 얻어 전하를 띠는데, 이를 대전이라 한다. 이때 전자를 얻은 물체는 (−) 전하를, 전자를 잃은 물체는 (+) 전하를 띤다."],
[T,"03 전류의 열작용과 화학작용","200[V], 60[W] 전등 10개를 20시간 사용하였다면 사용 전력량은 몇 [kWh]인가?",["10","12","24","11"],2,"전등 1개 사용 시 전력량 P=60×20=1,200[Wh]=1.2[kWh]. 전체 전력량=1.2×10=12[kWh]"],
[T,"09 비정현파","i=3 sin ωt+4 sin(3ωt−θ)[A]로 표시되는 전류의 등가 사인파 최댓값은?",["2[A]","3[A]","4[A]","5[A]"],4,"전류의 최댓값 Im=√(3²+4²)=5[A]"],
[T,"07 교류회로","교류회로에서 유효전력의 단위는?",["[W]","[VA]","[Var]","[Wh]"],1,"유효전력 단위: [W], 무효전력 단위: [Var], 피상전력 단위: [VA], 전력량 단위: [Wh]"],
[S,"03 전선의 접속","나전선 상호 또는 나전선과 절연전선, 캡타이어 케이블 또는 케이블과 접속하는 경우 바르지 못한 방법은?",["전선의 세기를 20[%] 이상 감소시키지 않을 것","알루미늄 전선과 구리전선을 접속하는 경우에는 접속 부분에 전기적 부식이 생기지 않도록 할 것","코드 상호, 캡타이어 케이블 상호, 케이블 상호 또는 이들 상호를 접속하는 경우에는 코드 접속기·접속함 기타의 기구를 사용할 것","알루미늄 전선을 옥외에 사용하는 경우에는 반드시 트위스트 접속을 할 것"],4,"트위스트 접속은 일반적으로 단선(동) 전선의 직선 접속 시 사용하며, 알루미늄 전선에는 적합하지 않다. 알루미늄 전선은 쉽게 부식되고 전기적 접촉이 불안정할 수 있으므로 접속 시 구조, 절연저항 및 내전압, 기계적 강도, 온도 상승, 내열성이 적합한 기구를 사용한다."],
[S,"02 배선재료와 공구","OW 전선의 규격이 아닌 것은?",["14[mm²]","22[mm²]","36[mm²]","60[mm²]"],3,"옥외용 비닐 절연전선(OW 전선)의 규격: 단선 2.0[mm]-14[mm²], 2.6[mm]-22[mm²], 3.2[mm]-38[mm²], 4.0[mm]-60[mm²], 5.0[mm]-100[mm²]"],
[T,"09 비정현파","그림과 같은 비사인파의 제3고조파 주파수는?(단, V=20[V], T=10[ms]이다.)",["100[Hz]","200[Hz]","300[Hz]","400[Hz]"],3,"기본 주파수 f=1/T=1/(10×10⁻³)=100[Hz]. ∴ 제3고조파의 주파수 f₃=3×f=3×100=300[Hz]","주기 T의 직사각형 파형(위쪽 +V/2, 아래쪽 −V/2 정도로 교대하는 구형 비사인파)이 시간축 t를 따라 반복되는 그림."],
[S,"04 옥내 배선 공사","케이블 공사에 의한 저압 옥내배선에서 케이블을 조영재의 아랫면 또는 옆면에 따라 붙이는 경우에는 전선의 지지점 간 거리는 몇 [m] 이하이어야 하는가?",["0.5","1","1.5","2"],4,"케이블 지지점 간의 거리: 조영재의 아랫면 또는 옆면에 따라 시설할 경우 2[m] 이하(단, 캡타이어 케이블은 1[m]), 조영재의 수직 방향으로 시설할 경우 6[m] 이하"],
[S,"09 전기응용 시설 공사","작업면에서 천장까지의 높이가 3[m]일 때 조명인 경우의 광원 높이는 몇 [m]인가?",["1","2","3","4"],2,"직접 조명인 경우, 광원의 높이 h=(2/3)×H₀=(2/3)×3=2[m] (H₀: 작업면에서 천장까지의 높이)"],
[S,"06 전선로 및 배전선 공사","전선로의 종류가 아닌 것은?",["옥측 전선로","지중 전선로","가공 전선로","산간 전선로"],4,"전선로의 종류: 가공 전선로, 지중 전선로, 옥측 전선로, 옥상 전선로, 수상전선로, 수저전선로, 터널내전선로. 산간 전선로는 공식 명칭이 아니다."],
[G,"05 정류기 및 제어기기","브리지 정류회로로 알맞은 것은?",["①번 회로","②번 회로","③번 회로","④번 회로"],1,"브리지 정류의 입력 전압의 (+) 반주기 동안에는 D₂, 부하(+, −), D₄로 통전하고, (−) 반주기 동안에는 D₃, 부하(+, −), D₁을 통전하여 전파 정류 전압이 출력된다. 출력 전압은 사인파 교류 평균값이다.","전원과 부하 사이에 다이오드 4개로 구성된 4가지 회로 그림(①~④). 정답 ①은 다이오드 4개가 올바른 브리지 방향(두 개는 위로 향하고 두 개는 아래로 향하는 정상 브리지)으로 연결됨."]
];

[S,"09 전기응용 시설 공사","광도가 I[cd]일 때 구광원의 광속은?",["F=4πI[lm]","F=2πI[lm]","F=πI[lm]","F=π²I[lm]"],1,"구광원 F=4πI[lm], 평판광원 F=πI[lm]. 광도는 한 방향으로 나오는 빛의 세기, 광속은 광원에서 나오는 빛의 양이다."],
[S,"02 배선재료와 공구","전선의 굵기를 측정하는 공구는?",["권척","메거","와이어 게이지","와이어 스트리퍼"],3,"와이어 게이지: 전선의 굵기(직경) 측정. 권척(줄자)은 길이 측정, 메거는 절연저항 측정, 와이어 스트리퍼는 피복을 벗기는 공구."],

[S,"05 전선 및 기계기구의 보안공사","전선과 대지 사이의 절연저항은 사용전압에 대한 누설전류가 최대공급전류의 얼마를 초과하지 않도록 해야 하는가?",["1/1,000","1/2,000","1/2,500","1/1,500"],2,"저압 전선로의 절연저항은 누설전류가 최대공급전류의 1/2,000을 넘지 않도록 유지한다. 절연저항 측정이 곤란한 저압 전로는 누설전류 1[mA] 이하."],
[T,"02 전기회로 해석","다음 회로에서 10[Ω]에 걸리는 전압은 몇 [V]인가?",["2","10","20","30"],4,"전류 I=105/(5+10+20)=3[A], 10[Ω]의 전압 V=IR=3×10=30[V]","5[Ω], 10[Ω], 20[Ω] 저항 3개가 직렬로 연결되고 105[V] 전원이 접속된 회로"],
[T,"06 전자유도 법칙과 인덕턴스","도체가 운동하여 자속을 끊었을 때 기전력의 방향을 알아내는 데 편리한 법칙은?",["렌츠의 법칙","패러데이의 법칙","플레밍의 왼손 법칙","플레밍의 오른손 법칙"],4,"플레밍의 오른손 법칙: 도체가 자속을 끊을 때 유기기전력의 방향(발전기). 엄지=운동 방향, 검지=자속 밀도, 중지=기전력."],
[T,"03 전류의 열작용과 화학작용","전압 220[V], 전력 60[W]인 전구 10개를 20시간 동안 사용하였을 때의 사용 전력량[kWh]은 얼마인가?",["12","15","120","150"],1,"60[W]×10개×20[h]=12,000[Wh]=12[kWh]"],
[T,"04 정전기와 콘덴서","전기력선의 성질에 대한 설명 중 옳지 않은 것은?",["전기력선의 방향은 그 점의 전계의 방향과 일치하며, 밀도는 그 점에서의 전계의 크기와 같다.","전기력선은 부전하에서 시작하여 정전하에서 그친다.","단위전하에서는 1/ε₀개의 전기력선이 출입한다.","전기력선은 전위가 높은 점에서 낮은 점으로 향한다."],2,"전기력선은 정전하(+)에서 시작해 부전하(−)에서 끝난다. 전위가 높은 곳에서 낮은 곳으로 향하고, 도체 표면에 수직으로 출입하며 등전위면과 직교한다. 전기력선 수 N=Q/ε₀."],
[S,"02 배선재료와 공구","전등 1개를 2개소에서 점멸하고자 할 때 필요한 3로 스위치는 최소 몇 개인가?",["1개","2개","3개","4개"],2,"2개소 점멸에는 3로 스위치 2개가 필요하다. (3개소 이상이면 3로 2개 + 4로 스위치 추가)"],
[T,"07 교류회로","저항 8[Ω]과 리액턴스 6[Ω]이 직렬 연결된 회로에 전압 100√2 sin ωt[V]를 인가하였을 경우, 전류의 실효값은 얼마인가?",["10√2","10","100√2","100"],2,"전압 실효값 V=100√2/√2=100[V], |Z|=√(8²+6²)=10[Ω], I=100/10=10[A]"],
[T,"05 자기 성질과 자기장","다음 중 [Wb] 단위를 사용하는 것은?",["자하","전하","전속","투자율"],1,"자하 m[Wb], 전하 Q[C], 전속 ψ[C], 투자율 μ[H/m]"],
[S,"06 전선로 및 배전선 공사","고압 가공전선이 도로를 횡단하는 경우 전선의 지표상 최소 높이는 몇 [m]인가?",["3","4","5","6"],4,"저압·고압 가공전선의 높이: 도로 횡단 지표상 6[m] 이상, 철도 횡단 레일면상 6.5[m] 이상"],
[S,"07 고압 및 저압 배전반 공사","가스 차단기에 들어가는 가스인 SF₆가스의 특징으로 틀린 것은?",["무색, 무취, 무독성 가스이다.","난연성, 불활성 가스이다.","소호능력은 공기의 약 1/3배이다.","절연내력은 공기의 약 2~3배이다."],3,"SF₆의 소호능력은 공기의 100~200배이다. 절연내력은 공기의 2~3배, 무색·무취·무독·불연성 가스."],
[S,"07 고압 및 저압 배전반 공사","보호 계전기의 종류가 아닌 것은?",["비율차동 계전기","과저항 계전기","과전류 계전기","과전압 계전기"],2,"비율차동·과전류·과전압 계전기는 보호 계전기이다. 과저항 계전기라는 것은 없다."],
[T,"05 자기 성질과 자기장","반지름 r[m], 권수 N회의 환상 솔레노이드에 I[A]의 전류가 흐를 때, 그 내부의 자장의 세기 H[AT/m]는 얼마인가?",["NI/r²","NI/2π","NI/4πr²","NI/2πr"],4,"환상 솔레노이드 내부 자계 H=NI/2πr[AT/m]"],
[G,"01 직류기","전압변동률이 작고 자여자이므로 다른 전원이 필요 없으며, 계자 저항기를 사용한 전압조정이 가능하여 전기 화학용, 전지의 충전용 발전기로 가장 적합한 것은?",["타여자 발전기","직류 복권 발전기","직류 분권 발전기","직류 직권 발전기"],3,"분권 발전기: 잔류자기로 자여자하며 계자 저항 조정으로 전압조정이 가능하다. 전압변동이 작아 전기화학용·축전지 충전용에 쓰인다."],
[T,"05 자기 성질과 자기장","반지름 5[cm], 권수 10회인 원형 코일에 15[A]의 전류가 흐르면 코일 중심의 자장의 세기는 몇 [AT/m]인가?",["500","1,500","2,500","3,000"],2,"원형 코일 중심 H=NI/2r=(10×15)/(2×5×10⁻²)=1,500[AT/m]"],
[G,"02 동기기","동기 발전기의 병렬운전 중 기전력의 위상차가 생기면 어떤 현상이 나타나는가?",["전기자 반작용이 발생한다.","동기화 전류가 흐른다.","단락 사고가 발생한다.","무효 순환전류가 흐른다."],2,"병렬운전 조건이 다를 때: 크기가 다르면 무효 순환전류, 위상이 다르면 동기화 전류(유효 횡류), 주파수가 다르면 단자전압의 진동, 파형이 다르면 고조파 순환전류가 생긴다."],
[T,"03 전류의 열작용과 화학작용","그림의 휘스톤 브리지의 평형 조건은?",["X=(Q/P)R","X=(P/Q)R","X=(Q/R)P","X=(P²/R)Q"],2,"마주 보는 변의 곱이 같으면 평형이다. Q×X=P×R이므로 X=(P/Q)R","a−c 사이에 P, c−b 사이에 X, a−d 사이에 Q, d−b 사이에 R이 접속되고, c−d 사이에 검류계 G와 스위치 SW₂, a−b 사이에 전원과 스위치 SW₁이 연결된 브리지 회로"],
[S,"02 배선재료와 공구","사람이 쉽게 접촉하는 장소에 설치하는 누전차단기의 사용전압 기준은 몇 [V] 초과인가?",["50","110","150","220"],1,"사람이 접촉하기 쉬운 장소에서 50[V]를 초과하는 저압의 금속제 외함을 가지는 전기기계기구에 전기를 공급하는 전로에는 지락 시 자동으로 차단하는 장치를 시설한다."],
[S,"07 고압 및 저압 배전반 공사","다음은 변압기의 고압 및 특고압 측 전로가 저압 측 전로와 혼촉하고 저압 전로의 대지전압이 150[V]를 초과하는 경우, 1초 초과 2초 이내에 고압 및 특고압 전로를 자동으로 차단하는 장치를 설치할 때의 저항값에 관한 내용이다. k값은 얼마인가?\n\n저항값 = k / 1선 지락전류 [Ω] 이하",["150","300","600","100"],2,"1초 초과 2초 이내에 자동 차단하는 장치가 있으면 300, 1초 이내에 차단하는 장치가 있으면 600을 1선 지락전류로 나눈 값 이하. (차단 장치가 없으면 150)"],
[S,"05 전선 및 기계기구의 보안공사","고압 및 특고압의 전로에 시설하는 피뢰기 접지저항 값은 몇 [Ω] 이하로 하여야 하는가?",["10","30","100","75"],1,"피뢰기의 접지저항값은 10[Ω] 이하"],

[G,"03 변압기","1차 전압 6,300[V], 2차 전압 210[V], 주파수 60[Hz]의 변압기가 있다. 이 변압기의 권수비는?",["30","40","50","60"],1,"a=V₁/V₂=6,300/210=30. 권수비는 주파수와 관계없다."],
[G,"03 변압기","변류기 개방 시 2차 측을 단락하는 이유는?",["2차 측 절연 보호","2차 측 과전류 보호","측정 오차 방지","1차 측 과전류 방지"],1,"변류기 2차 측을 개방하면 2차 측에 매우 높은 기전력이 유기되어 절연이 파괴될 위험이 있다."],
[S,"02 배선재료와 공구","펜치로 절단하기 힘든 굵은 전선의 절단에 사용되는 공구는?",["파이프 렌치","파이프 커터","클리퍼","와이어 게이지"],3,"클리퍼: 굵은 전선을 절단하는 공구"],

[S,"08 특수 장소 공사","소맥분, 전분 기타 가연성의 분진이 존재하는 곳의 저압 옥내 배선 공사방법 중 적당하지 않은 것은?",["애자 사용 공사","합성수지관 공사","케이블 공사","금속관 공사"],1,"가연성 분진이 있는 곳의 저압 옥내 배선은 합성수지관 공사, 금속관 공사, 케이블 공사로 한다."],
[G,"02 동기기","동기 전동기의 특징으로 잘못된 것은?",["일정한 속도로 운전이 가능하다.","난조가 발생하기 쉽다.","역률을 조정하기 힘들다.","공극이 넓어 기계적으로 견고하다."],3,"동기 전동기는 계자의 직류 여자 전류를 조정해 역률을 조정할 수 있다. 장점: 속도 일정, 공극이 넓어 견고, 효율 양호. 단점: 직류 여자 필요, 속도 제어 어려움, 난조 발생."],
[G,"03 변압기","부흐홀츠 계전기의 설치 위치로 가장 적당한 곳은?",["콘서베이터 내부","변압기 고압 측 부싱","변압기 주 탱크 내","변압기 주 탱크와 콘서베이터 사이"],4,"부흐홀츠 계전기는 변압기 내부 고장 보호용으로, 주 탱크와 콘서베이터를 잇는 관 중간에 설치한다. 고장 시 생기는 가스·유증기·유류를 검출한다."],
[G,"02 동기기","동기기의 전기자 권선법이 아닌 것은?",["전절권","분포권","2층권","중권"],1,"동기기 전기자 권선법은 2층권, 중권, 분포권, 단절권이다."],
[S,"04 옥내 배선 공사","경질 비닐관의 호칭으로 맞는 것은?",["홀수에 관 바깥지름으로 표기한다.","짝수에 관 바깥지름으로 표기한다.","홀수에 관 안지름으로 표기한다.","짝수에 관 안지름으로 표기한다."],4,"경질 비닐관(합성수지관)은 안지름에 가까운 짝수로 호칭한다. 규격: 14, 16, 22, 28, 36, 42, 54, 70, 82, 100[mm]"],
[T,"07 교류회로","주파수 10[Hz]일 때 주기는?",["0.1[sec]","0.6[sec]","1[sec]","6[sec]"],1,"T=1/f=1/10=0.1[sec]"],
[G,"05 정류기 및 제어기기","그림과 같은 전동기 제어 회로에서 전동기 M의 전류 방향으로 올바른 것은? (단, 전동기의 역률은 100[%]이고, 사이리스터의 점호각은 0°라고 본다.)",["입력 반주기마다 A에서 B의 방향, B에서 A의 방향","S₁과 S₄, S₂와 S₃의 동작 상태에 따라 A에서 B의 방향, B에서 A의 방향","항상 A에서 B의 방향","항상 B에서 A의 방향"],3,"사이리스터 브리지로 전파 정류하는 회로이므로 전동기에는 입력의 반주기와 관계없이 항상 A에서 B 방향으로 전류가 흐른다.","교류 입력에 사이리스터 S₁~S₄를 브리지로 접속한 회로. S₁·S₂ 사이의 점(A)과 S₃·S₄ 사이의 점(B) 사이에 전동기 M이 연결되어 있다."],
[S,"07 고압 및 저압 배전반 공사","수변전 설비의 고압회로에 걸리는 전압을 표시하기 위해 전압계를 시설할 때 고압회로와 전압계 사이에 시설하는 것은?",["수전용 변압기","계기용 변류기","계기용 변압기","권선형 변류기"],3,"계기용 변압기(PT): 고압을 저압으로 변성하여 전압계, 전력계, 표시등 등의 전원으로 쓴다."],
[G,"02 동기기","주파수가 60[Hz]인 동기 전동기의 극수가 2극일 때, 동기속도는 몇 [rpm]인가?",["2,400","3,600","4,800","7,200"],2,"Ns=120f/p=(120×60)/2=3,600[rpm]"],
[G,"05 정류기 및 제어기기","입력으로 펄스신호를 가해주고 속도를 입력펄스의 주파수에 의해 조절하는 전동기는?",["전기 동력계","서보 전동기","스테핑 전동기","권선형 유도 전동기"],3,"스테핑 전동기: 회전속도가 입력 펄스 주파수에 비례하고, 펄스 수만큼 정해진 각도로 회전한다. 정밀한 위치·속도 제어에 쓴다."],
[G,"03 변압기","단상 변압기 2대로 V−V 결선하여 3상에서 사용하는 경우, V−V 결선의 특징으로 옳지 않은 것은?",["변압기의 이용률이 86.6[%]로 저하된다.","부하 측에 대칭 3상 전압을 공급할 수 있다.","설치방법이 비교적 간단하다.","출력은 Δ−Δ 결선일 때와 동일하다."],4,"V 결선의 출력은 Δ 결선의 1/√3≒57.7[%]로 줄어든다. 이용률은 √3/2≒86.6[%]."],
[T,"04 정전기와 콘덴서","패러데이관 한 개의 단위 전위차당 보유에너지의 값으로 알맞은 것은?",["ED","0","½ED","½"],4,"패러데이관 1개(단위 전하)의 단위 전위차당 에너지 W=½QV=½×1×1=½[J]"],
[T,"04 정전기와 콘덴서","어떤 한 점에 전하량 Q가 72πε₀×10¹²[C]만큼 있다. 여기서 1[m] 떨어진 곳에서의 전속밀도를 D_A, 2[m] 떨어진 곳에서의 전속밀도를 D_B라고 할 때 D_A, D_B값으로 알맞은 것은?",["D_A=40[C/m²], D_B=80[C/m²]","D_A=159[C/m²], D_B=40[C/m²]","D_A=80[C/m²], D_B=40[C/m²]","D_A=40[C/m²], D_B=159[C/m²]"],2,"D=Q/4πr². D_A=(72π×8.855×10⁻¹²×10¹²)/(4π×1²)≒159[C/m²], D_B는 거리가 2배이므로 1/4인 약 40[C/m²]"],
[G,"01 직류기","다극 중권 직류발전기의 전기자 권선에 균압고리를 설치하는 이유는?",["브러시에서 불꽃을 방지하기 위하여","전기자 반작용을 방지하기 위하여","정류 기전력을 높이기 위하여","전압 강하를 방지하기 위하여"],1,"중권은 병렬회로 사이에 기전력 차이가 생기면 브러시를 통해 순환전류가 흘러 불꽃이 난다. 이를 막기 위해 균압 접속(균압고리)을 한다."],
[G,"03 변압기","변압기의 자속에 관한 설명으로 옳은 것은?",["전압과 주파수에 반비례한다.","전압과 주파수에 비례한다.","전압에 반비례하고 주파수에 비례한다.","전압에 비례하고 주파수에 반비례한다."],4,"E=4.44fnφm에서 φm=E/(4.44fn). 자속은 전압에 비례하고 주파수에 반비례한다."],
[G,"03 변압기","낮은 전압을 높은 전압으로 승압할 때 일반적으로 사용되는 변압기의 3상 결선 방식은?",["Δ−Δ 결선","Δ−Y 결선","Y−Y 결선","Y−Δ 결선"],2,"Δ−Y 결선: 발전소용 승압 변압기. Y−Δ 결선: 수전단 변전소용 강압 변압기."],
[G,"05 정류기 및 제어기기","다음 중 전력제어용 반도체 소자가 아닌 것은?",["LED","TRIAC","GTO","IGBT"],1,"LED는 발광 다이오드로 빛을 내는 소자이다. TRIAC(쌍방향 3단자 사이리스터), GTO(게이트 턴 오프 사이리스터), IGBT는 전력 제어용 소자."],
[G,"04 유도기","단상 유도 전동기의 기동 방법 중 기동 토크가 가장 큰 것은?",["분상 기동형","반발 유도형","콘덴서 기동형","반발 기동형"],4,"기동 토크 크기: 반발 기동형 > 반발 유도형 > 콘덴서 기동형 > 영구 콘덴서형 > 분상 기동형 > 셰이딩 코일형"],
[S,"02 배선재료와 공구","원 안에 EQ가 적힌 심벌은 무엇을 의미하는가?",["지진 감지기","과전류 차단기","변압기","누전 경보기"],1,"EQ는 지진 감지기(Earthquake detector)의 심벌이다."],
[T,"03 전류의 열작용과 화학작용","전류에 의한 자기장과 직접적으로 관련이 없는 것은?",["줄의 법칙","플레밍의 왼손 법칙","비오−사바르의 법칙","앙페르의 오른나사 법칙"],1,"줄의 법칙은 전류가 저항에서 소비하는 열량에 관한 법칙이다. H=0.24I²Rt[cal]"],
[G,"01 직류기","전기기기의 철심 재료로 규소강판을 많이 사용하는 이유로 가장 적당한 것은?",["와류손을 줄이기 위해","맴돌이 전류를 없애기 위해","히스테리시스손을 줄이기 위해","구리손을 줄이기 위해"],3,"규소강판 사용 → 히스테리시스손 감소, 성층 철심 → 와류손(맴돌이 전류손) 감소. 그래서 0.35~0.5[mm]의 얇은 규소강판을 성층한다."],
[S,"06 전선로 및 배전선 공사","일반적으로 가공 전선로의 지지물에 취급자가 오르고 내리는 데 사용하는 발판 볼트 등은 지표상 몇 [m] 미만에 시설하여서는 아니 되는가?",["0.75[m]","1.2[m]","1.8[m]","2.0[m]"],3,"발판 볼트는 지표상 1.8[m] 미만에 시설해서는 안 된다."],
[S,"04 옥내 배선 공사","금속관 공사에서 금속관을 콘크리트에 매입할 경우 관의 두께는 몇 [mm] 이상의 것이어야 하는가?",["0.8[mm]","1.0[mm]","1.2[mm]","1.5[mm]"],3,"금속관 두께: 콘크리트에 매입하는 경우 1.2[mm] 이상, 그 외 1.0[mm] 이상"],
[S,"02 배선재료와 공구","한국전기설비규정에 의하면 옥외 백열전등의 인하선으로서 지표상의 높이 2.5[m] 미만인 부분은 공칭 단면적 몇 [mm²] 이상의 연동선과 동등 이상의 세기 및 굵기의 절연전선(옥외용 비닐 절연 전선을 제외)을 사용하는가?",["0.75","1.5","2.0","2.5"],4,"옥외 백열전등 인하선의 지표상 2.5[m] 미만 부분은 2.5[mm²] 이상의 연동선과 동등 이상의 절연전선(OW 제외)을 쓴다."],
[S,"06 전선로 및 배전선 공사","다음 중 고압 지중 케이블이 아닌 것은?",["알루미늄피 케이블","비닐 절연 비닐 외장 케이블","미네랄 인슈레이션 케이블","클로로프렌 외장 케이블"],3,"미네랄 인슈레이션(MI) 케이블은 저압용이다. 고압에는 알루미늄피, 클로로프렌 외장, 비닐 외장, 폴리에틸렌 외장, 콤바인덕트(CD) 케이블을 쓴다."],
[S,"05 전선 및 기계기구의 보안공사","한국전기설비규정에 의하여 분기회로의 과부하 보호장치 설치점과 분기점 사이에 다른 분기회로 또는 콘센트의 접속이 없고, 단락의 위험과 화재 및 인체에 대한 위험성이 최소화되도록 시설된 경우 과부하 보호장치는 분기점으로부터 몇 [m]까지 이동하여 설치할 수 있는가?",["2","3","4","5"],2,"분기회로의 과부하 보호장치는 문제의 조건을 만족하면 분기점(O)으로부터 3[m]까지 이동하여 설치할 수 있다.","전원 측 보호장치 P₁에서 나온 간선 S₁의 분기점 O에서 분기회로 S₂가 갈라지고, 분기회로의 보호장치 P₂가 분기점 O에서 ?[m] 떨어진 곳에 설치되어 있다."],
[G,"03 변압기","변압기의 1차 측 저항이 360[Ω], 2차 측 저항이 0.1[Ω]일 때, 권수비는 얼마인가?",["60","360","3,600","6"],1,"a=N₁/N₂=√(R₁/R₂)=√(360/0.1)=√3,600=60"],
[S,"08 특수 장소 공사","교통신호등의 제어 장치로부터 신호등의 전구까지의 전로에 사용하는 전압은 몇 [V] 이하인가?",["60","100","300","440"],3,"교통신호등 회로의 사용전압은 300[V] 이하"],
[S,"08 특수 장소 공사","무대, 무대마루 밑, 오케스트라 박스, 영사실, 기타 사람이나 무대 도구가 접촉할 우려가 있는 장소에 시설하는 저압 옥내배선, 전구선 또는 이동전선은 사용전압이 몇 [V] 이하이어야 하는가?",["100","200","400","700"],3,"흥행장의 저압 옥내배선, 전구선, 이동전선은 사용전압 400[V] 이하"],
[S,"02 배선재료와 공구","실링·직접부착등을 시설하고자 한다. 배선도에 표기할 그림기호로 옳은 것은?",["① 가로선 끝의 원 안에 N","② 원에 사선 두 개가 걸친 기호","③ 원 안에 CL","④ 원 안에 R"],3,"CL(Ceiling Light): 천장에 직접 붙이는 등(실링·직접부착등)의 심벌","①~④ 네 가지 그림기호"],
[S,"03 전선의 접속","전선을 접속할 경우의 설명으로 틀린 것은?",["접속 부분의 전기 저항이 증가되지 않아야 한다.","전선의 세기를 80[%] 이상 감소시키지 않아야 한다.","접속 부분은 접속기구를 사용하거나 납땜을 하여야 한다.","알루미늄 전선과 동선을 접속하는 경우, 전기적 부식이 생기지 않도록 해야 한다."],2,"전선의 세기(인장 하중)는 20[%] 이상 감소시키지 않아야 한다(80[%] 이상 유지)."],
[S,"02 배선재료와 공구","한국전기설비규정에서 정하는 옥내배선의 보호도체의 색상 표시는?",["갈색","흑색","회색","녹색 − 노란색"],4,"전선 색상: L1 갈색, L2 흑색, L3 회색, N 청색, 보호도체 녹색−노란색"]

[G,"04 유도기","유도 전동기의 회전속도를 N[rpm], 동기속도를 Ns[rpm]이라 할 때, 순방향 회전 자계의 슬립을 s라 하면, 역방향 회전 자계에 대한 회전자 슬립은 어떻게 되는가?",["1−s","2−s","s−1","s−2"],2,"s=(Ns−N)/Ns에서 N/Ns=1−s. 역방향 슬립 s′=(Ns+N)/Ns=1+(1−s)=2−s"],

[S,"06 전선로 및 배전선 공사","고압 가공전선이 도로를 횡단하는 경우 전선의 지표상 최소 높이는 몇 [m]인가?",["3","4","5","6"],4,"도로 횡단: 지표상 6[m] 이상, 철도 횡단: 레일면상 6.5[m] 이상"],

[G,"02 동기기","동기 전동기의 자기 기동에서 계자 권선을 단락하는 이유는?",["기동이 쉽다.","기동 권선으로 이용한다.","고전압 유도에 의한 절연파괴 위험을 방지한다.","전기자 반작용을 방지한다."],3,"기동 시 계자 권선이 회전 자계를 끊어 고전압이 유기되어 계자회로가 소손될 수 있으므로 저항을 통해 단락시켜 놓고 기동한다."],

[G,"02 동기기","동기 발전기의 돌발 단락 전류를 주로 제한하는 것은?",["누설 리액턴스","동기 임피던스","권선 저항","동기 리액턴스"],1,"돌발 단락 전류는 누설 리액턴스가 제한한다. (지속 단락 전류는 동기 리액턴스)"],
[S,"08 특수 장소 공사","폭연성 분진 또는 화약류의 분말이 전기설비가 발화원이 되어 폭발할 우려가 있는 곳에 시설하는 저압 옥내 전기 설비의 저압 옥내배선 공사는?",["금속관 공사","합성수지관 공사","가요전선관 공사","애자 공사"],1,"폭연성 분진·화약류 분말이 있는 곳은 금속관 공사 또는 케이블 공사(캡타이어케이블 제외)로 한다."],
[S,"07 고압 및 저압 배전반 공사","선택지락 계전기(Selective Ground Relay)의 용도는?",["단일 회선에서 지락 전류의 방향의 선택","단일 회선에서 지락 사고 지속 시간 선택","단일 회선에서 지락 전류의 대소의 선택","다회선에서 지락 고장 회선의 선택"],4,"선택지락 계전기(SGR): 다회선 선로에서 지락이 발생한 회선만 선택하여 차단한다."],
[G,"01 직류기","직류 전동기의 전기자에 가해지는 단자전압을 변화하여 속도를 조정하는 제어법이 아닌 것은?",["워드 레오나드 방식","일그너 방식","직·병렬 제어","계자 제어"],4,"전압 제어 방식: 워드 레오나드 방식, 일그너 방식, 직·병렬 제어. 계자 제어는 자속을 바꾸는 방식이다."],
[T,"03 전류의 열작용과 화학작용","두 종류의 금속 접합부에 전류를 흘리면 전류의 방향에 따라 줄열 이외의 열의 흡수 또는 발생 현상이 생긴다. 이러한 현상을 무엇이라 하는가?",["제벡 효과","페란티 효과","펠티에 효과","초전도 효과"],3,"펠티에 효과: 다른 금속의 접합부에 전류를 흘리면 열의 발생·흡수. 제벡 효과: 두 접합점의 온도차로 열기전력 발생. 톰슨 효과: 같은 금속에서 온도차+전류로 열의 발생·흡수."],
[G,"04 유도기","3상 유도 전동기의 원선도를 그리는 데 필요하지 않은 것은?",["저항 측정","무부하 시험","구속 시험","슬립 측정"],4,"원선도 작성에 필요한 시험: 저항 측정 시험, 무부하 시험, 구속 시험"],
[S,"06 전선로 및 배전선 공사","저압 연접 인입선의 시설과 관련된 설명으로 잘못된 것은?",["옥내를 통과하지 아니할 것","전선의 굵기는 1.5[mm²] 이하일 것","폭 5[m]를 넘는 도로를 횡단하지 아니할 것","인입선에서 분기하는 점으로부터 100[m]를 넘는 지역에 미치지 아니할 것"],2,"연접 인입선 조건: 분기점에서 100[m] 이내, 폭 5[m] 초과 도로 횡단 금지, 옥내 통과 금지. 전선 굵기를 1.5[mm²] 이하로 한다는 규정은 없다."],
[S,"02 배선재료와 공구","절연 전선으로 가선된 배전 선로에서 활선 상태인 경우 전선의 피복을 벗기는 것은 매우 곤란한 작업이다. 이런 경우 활선 상태에서 전선의 피복을 벗기는 공구는?",["데드 엔드 커버","애자 커버","와이어 통","전선 피박기"],4,"전선 피박기(활선 피박기): 활선 상태에서 피복을 벗기는 공구. 와이어 통은 활선을 옮기는 절연봉, 데드 엔드 커버는 현수 애자 등의 충전부를 덮는 절연 커버."],
[S,"03 전선의 접속","전선과 기구 단자 접속 시 나사를 덜 죄었을 경우 발생할 수 있는 위험과 거리가 먼 것은?",["누전","화재 위험","과열 발생","저항 감소"],4,"나사를 덜 죄면 접촉 저항이 증가하여 과열, 누전, 화재로 이어진다."],
[G,"03 변압기","1대의 출력이 20[kVA]인 단상 변압기 2대로 V 결선하여 3상 전력을 공급할 수 있는 최대전력은 약 몇 [kVA]인가?",["20","28.3","34.6","40"],3,"Pv=√3P₁=√3×20≒34.6[kVA]"],
[G,"02 동기기","3상 동기전동기 자기동법에 관한 사항 중 틀린 것은?",["기동토크를 적당한 값으로 유지하기 위하여 변압기 탭에 의해 정격전압의 80[%] 정도로 전압을 가해 기동을 한다.","기동토크는 일반적으로 적고 전부하 토크의 40~60[%] 정도이다.","제동권선에 의한 기동토크를 이용하는 것으로 제동권선은 2차 권선으로서 기동토크를 발생한다.","기동할 때에는 회전자속에 의하여 계자권선 안에는 고전압이 유도되어 절연을 파괴할 우려가 있다."],1,"기동 보상기(3상 단권 변압기)로 전전압의 1/3~1/2 정도로 전압을 낮추어 기동한다. 80[%]가 아니다."],
[S,"07 고압 및 저압 배전반 공사","분전반 및 배전반은 어떤 장소에 설치하는 것이 바람직한가?",["전기회로를 쉽게 조작할 수 있는 장소","개폐기를 쉽게 개폐할 수 없는 장소","은폐된 장소","이동이 심한 장소"],1,"분전반·배전반은 전기회로를 쉽게 조작할 수 있고, 은폐되지 않았으며, 움직임이 적은 고정된 곳에 설치한다."],
[T,"03 전류의 열작용과 화학작용","220[V]용 100[W] 전구와 200[W] 전구를 직렬로 연결하여 220[V]의 전원에 연결하면?",["두 전구의 밝기가 같다.","100[W]의 전구가 더 밝다.","200[W]의 전구가 더 밝다.","두 전구 모두 안 켜진다."],2,"R=V²/P이므로 100[W] 전구 484[Ω], 200[W] 전구 242[Ω]. 직렬은 전류가 같아 P=I²R에서 저항이 큰 100[W] 전구가 더 밝다."],
[S,"04 옥내 배선 공사","플로어 덕트 공사의 설명 중 틀린 것은?",["덕트의 끝 부분은 막는다.","플로어 덕트는 접지공사를 생략하여도 된다.","덕트 상호 간 접속은 견고하고 전기적으로 완전하게 접속하여야 한다.","덕트 및 박스 기타 부속품은 물이 고이는 부분이 없도록 시설하여야 한다."],2,"플로어 덕트는 접지공사를 하여야 한다."],
[T,"06 전자유도 법칙과 인덕턴스","자체 인덕턴스가 각각 L₁, L₂[H]인 두 원통 코일이 서로 직교하고 있다. 두 코일 사이의 상호 인덕턴스[H]는?",["L₁+L₂","L₁L₂","0","√(L₁L₂)"],3,"M=k√(L₁L₂)에서 직교하면 결합계수 k=0이므로 M=0"],
[S,"03 전선의 접속","전선의 굵기가 6[mm²] 이하의 가는 단선의 전선 접속은 어떤 접속을 하여야 하는가?",["브리타니아 접속","쥐꼬리 접속","트위스트 접속","슬리브 접속"],3,"단선의 직선 접속: 6[mm²] 이하는 트위스트 접속, 10[mm²] 이상은 브리타니아 접속"],
[G,"03 변압기","변압기 절연내력 시험 중 권선의 층간 절연시험은?",["충격전압 시험","무부하 시험","가압 시험","유도 시험"],4,"유도 시험: 권선 단자 사이에 상호유도전압의 2배 전압을 유도시켜 층간 절연을 시험한다."],

[S,"03 전선의 접속","연선 분기 접속은 접속선을 브리타니아 접속과 소선 자체를 이용하여 접속하는 방법이 있는데 다음 중 소선자체를 이용하는 방법이 아닌 것은?",["단권분기 접속","복권분기 접속","직권분기 접속","분할분기 접속"],3,"연선 분기 접속에는 단권분기, 복권분기, 분할분기 접속 등이 있다. 직권분기 접속이라는 것은 없다."],
[G,"02 동기기","동기 임피던스 5[Ω]인 2대의 3상 동기 발전기의 유도 기전력에 100[V]의 전압 차이가 있다면 무효 순환전류[A]는?",["10","15","20","25"],1,"I=E/(Z₁+Z₂)=100/(5+5)=10[A]"],
[S,"08 특수 장소 공사","흥행장의 저압 공사에서 잘못된 것은?",["무대용의 콘센트 박스, 플라이덕트 및 보더라이트의 금속제 외함에는 접지를 하여야 한다.","무대 마루 밑, 오케스트라 박스 및 영사실의 전로에는 전용 개폐기 및 과전류 차단기를 시설할 필요가 없다.","플라이 덕트는 조영재 등에 견고하게 시설하여야 한다.","플라이 덕트 내의 전선을 외부로 인출할 경우는 제1종 캡타이어 케이블을 사용한다."],2,"무대 마루 밑, 오케스트라 박스, 영사실의 전로에는 전용 개폐기와 과전류 차단기를 반드시 시설한다."],
[G,"05 정류기 및 제어기기","다음 기호 중 DIAC의 기호는?",["①번 기호","②번 기호","③번 기호","④번 기호"],1,"① DIAC ② TRIAC ③ SCR ④ UJT. DIAC는 게이트 없이 다이오드 2개를 역병렬로 접속한 형태의 2단자 소자이다.","①~④ 네 가지 반도체 소자 기호"],
[S,"07 고압 및 저압 배전반 공사","자연 공기 내에서 개방할 때 접촉자가 떨어지면서 자연 소호되는 방식을 가진 차단기로 저압의 교류 또는 직류차단기로 많이 사용되는 것은?",["유입차단기","자기차단기","가스차단기","기중차단기"],4,"기중차단기(ACB): 공기 중 자연 소호 방식의 저압용 차단기. VCB는 진공, GCB는 SF₆ 가스, OCB는 절연유로 소호한다."],
[T,"05 자기 성질과 자기장","다음 보기 중 자기저항에 영향을 미치는 성질이 아닌 것은?",["길이","면적","투자율","전류"],4,"자기저항 Rm=l/μS. 길이, 투자율, 단면적으로 정해진다."],
[S,"07 고압 및 저압 배전반 공사","설치 면적과 설치 비용이 많이 들지만 가장 이상적이고 효과적인 진상용 콘덴서를 설치하는 방법은 무엇인가?",["수전단 모선에 설치","수전단 모선과 부하 측에 분산하여 설치","부하 측에 분산하여 설치","가장 큰 부하 측에만 설치"],3,"진상용 콘덴서는 부하 측에 분산 설치하는 것이 역률 개선에 가장 이상적이지만 설치 비용이 많이 든다."],
[T,"02 전기회로 해석","R₁과 R₂가 병렬연결이고 전체전류 I가 흐르고 있을 때, R₂에 흐르는 전류 I₂는 얼마인가?",["R₂/(R₁+R₂) × I","R₁/(R₁+R₂) × I","(R₁+R₂)/R₂ × I","(R₁+R₂)/R₁ × I"],2,"전류 분배 법칙: I₂=R₁/(R₁+R₂)×I. 병렬에서는 반대쪽 저항이 분자에 온다."],
[T,"04 정전기와 콘덴서","대전에 의해 물체가 띠고 있는 전기를 무엇이라고 하는가?",["원자","전하","정전유도","대전체"],2,"전하: 대전된 물체가 가지고 있는 전기"],
[S,"03 전선의 접속","전선 접속 시 사용되는 슬리브(Sleeve)의 종류가 아닌 것은?",["D형","S형","E형","P형"],1,"슬리브 종류: 직선맞대기용(B형), 종단겹침용(E형), 직선겹침용(P형), S형, 매킹타이어 슬리브"],
[S,"03 전선의 접속","네온 방전등의 관등회로 배선을 애자 공사로 하는 경우 전선 상호 간의 이격거리는?",["3[cm]","6[cm]","9[cm]","12[cm]"],2,"네온 관등회로의 애자 공사에서 전선 상호 간 간격은 6[cm] 이상"],
[S,"02 배선재료와 공구","굵은 전선이나 케이블을 절단할 때 사용되는 공구는?",["클리퍼","펜치","나이프","플라이어"],1,"클리퍼: 굵은 전선 절단용. 펜치는 전선 절단·접속·바인드, 나이프는 피복 제거, 플라이어는 로크너트 조임 등에 쓴다."],
[G,"02 동기기","4극 36슬롯 3상 동기 발전기의 매극 매상당 슬롯 수는?",["2","3","4","5"],2,"매극 매상당 슬롯 수=전체 슬롯 수/(극수×상수)=36/(4×3)=3"],
[S,"04 옥내 배선 공사","박스나 캐비닛의 노크아웃의 지름이 금속관의 지름보다 클 때 사용되는 접속기구는 무엇인가?",["링 리듀서","부싱","커넥터","로크 너트"],1,"링 리듀서: 박스의 구멍(노크아웃)이 금속관보다 클 때 사용해 고정한다."],

[S,"07 고압 및 저압 배전반 공사","고압 이상에서 기기의 점검, 수리 시 무전압, 무전류 상태로 전로에서 단독으로 전로의 접속 또는 분리하는 것을 주목적으로 사용되는 수·변전기기는?",["기중부하 개폐기","단로기","전력퓨즈","컷아웃 스위치"],2,"단로기(DS): 무부하 상태에서 회로의 접속 변경, 점검·수리 시 사용. 부하 개폐기(LBS)는 부하전류 개폐, 전력퓨즈(PF)는 단락 보호, 컷아웃 스위치(COS)는 변압기 과전류 보호."],

[T,"03 전류의 열작용과 화학작용","두 종류의 금속을 접속하여 두 접합 부분을 다른 온도로 유지하면 열기전력을 일으켜 열전류가 흐른다. 이 현상을 지칭하는 것은?",["제벡 효과","제3금속의 법칙","펠티에 효과","패러데이의 법칙"],1,"제벡 효과: 다른 금속의 두 접합점 온도차로 열기전력이 발생해 열전류가 흐르는 현상. 제3금속의 법칙: 열전쌍 사이에 다른 금속을 넣어도 그 양 끝 온도가 같으면 열기전력은 변하지 않는다."],

[G,"05 정류기 및 제어기기","실리콘 제어 정류기(SCR)의 게이트(G)는?",["P형 반도체","N형 반도체","PN형 반도체","NP형 반도체"],1,"SCR은 PNPN 4층 구조의 사이리스터이며, 게이트는 P형 반도체에 연결된다."],
[T,"05 자기 성질과 자기장","다음 중 자기장 내에서 같은 크기 m[Wb]의 자극이 존재할 때 자계의 세기가 가장 큰 물질은?",["텅스텐","알루미늄","철","구리"],4,"H=B/(μ₀μs)이므로 비투자율이 작을수록 자계의 세기가 크다. 구리는 μs<1인 역자성체라서 가장 크다."],
[S,"07 고압 및 저압 배전반 공사","보호를 요하는 회로의 전류가 어떤 일정한 값(정정값) 이상으로 흘렀을 때 동작하는 계전기는?",["과전류 계전기","과전압 계전기","차동 계전기","비율 차동 계전기"],1,"과전류 계전기(OCR): 전류가 설정값 이상으로 흐르면 동작한다."],
[S,"07 고압 및 저압 배전반 공사","점유 면적이 좁고 운전, 보수 시에 안전하며 공장, 빌딩 등의 전기실에 많이 사용되는 배전반은 어떤 것인가?",["데드 프런트형","수직형","큐비클형","라이브 프런트형"],3,"큐비클형(폐쇄식) 배전반: 점유 면적이 좁고 운전·보수가 안전하여 공장, 빌딩 전기실에 널리 쓰인다."],
[T,"03 전류의 열작용과 화학작용","황산구리(CuSO₄)의 전해액에 2개의 동일한 구리판을 넣고 전원을 연결하였을 때 양극에서 나타나는 변화를 옳게 설명한 것은?",["변화가 없다.","구리판이 두꺼워진다.","구리판이 얇아진다.","수소 가스가 발생한다."],3,"양극은 산화반응으로 구리판이 얇아지고, 음극은 환원반응으로 구리가 석출되어 두꺼워진다."],
[G,"05 정류기 및 제어기기","다음 중 트라이액(TRIAC)의 기호는?",["①번 기호","②번 기호","③번 기호","④번 기호"],3,"① DIAC ② SCR ③ TRIAC ④ UJT","①~④ 네 가지 반도체 소자 기호"],
[G,"03 변압기","수전단 발전소용 변압기 결선에 주로 사용하고 있으며 한쪽은 중성점을 접지할 수 있고 다른 한쪽은 제3고조파에 의한 영향을 없애주는 장점을 가지고 있는 3상 결선방식은?",["Y−Y","Δ−Δ","Y−Δ","V−V"],3,"Y−Δ 결선: Y 측 중성점을 접지할 수 있고 Δ 측에서 제3고조파 장해를 줄인다. 수전단 변전소의 강압용으로 쓰며 1·2차 선간전압 사이에 π/6의 위상차가 생긴다."],
[T,"04 정전기와 콘덴서","정전기 발생 방지책으로 틀린 것은?",["대전 방지제의 사용","접지 및 보호구의 착용","배관 내 액체의 흐름 속도 제한","대기의 습도를 30[%] 이하로 하여 건조함을 유지"],4,"정전기를 막으려면 대기의 습도를 높여야 한다."],
[T,"02 전기회로 해석","저항 10개를 접속하여 가장 작은 합성저항값을 얻으려면 어떻게 접속하여야 하는가?",["직렬","병렬","직렬−병렬","병렬−직렬"],2,"저항 r을 n개 병렬 연결하면 합성저항은 r/n으로 가장 작아진다."],
[T,"02 전기회로 해석","전위차계로 전위를 측정하였다. B점의 전위가 100[V]이고 D점의 전위가 60[V]일 때 4[Ω]에 흐르는 전류는?",["5[A]","15/7[A]","20/7[A]","20[A]"],2,"B−D 사이 전류 I=(100−60)/(5+3)=5[A]. 이 전류가 3[Ω]과 4[Ω] 병렬에 나뉘어 흐르므로 4[Ω]의 전류=3/(4+3)×5=15/7[A]","A점과 B점 사이에 3[Ω]과 4[Ω]이 병렬, B점−C점 사이에 5[Ω], C점−D점 사이에 3[Ω]이 직렬로 연결된 회로"],
[S,"04 옥내 배선 공사","애자 사용 공사에 의한 저압 옥내 배선에서 잘못된 것은?",["600[V] 비닐 절연전선을 사용한다.","전선 상호 간의 거리가 6[cm]이다.","전선과 조영재 사이의 이격거리는 사용 전압이 400[V] 이하인 경우에는 5.5[cm] 이상일 것","절연성, 내열성 및 내구성이 있어야 한다."],3,"애자 공사 이격거리: 전선 상호 간 6[cm] 이상, 전선과 조영재 사이는 400[V] 이하 2.5[cm] 이상, 400[V] 초과 4.5[cm] 이상(건조한 곳은 2.5[cm] 이상)"],
[G,"01 직류기","타여자 발전기와 같이 전압변동률이 적고 자여자이므로 다른 여자 전원이 필요 없으며, 계자 저항기를 사용하여 전압 조정이 가능하므로 전기화학용 전원, 전지의 충전용, 동기기의 여자용으로 쓰이는 발전기는?",["분권 발전기","직권 발전기","과복권 발전기","차동복권 발전기"],1,"분권 발전기: 전압 변화가 작은 정전압 발전기로, 계자 저항기로 전압 조정이 가능하다."],
[G,"03 변압기","부흐홀츠 계전기의 설치 위치로 가장 적당한 것은?",["변압기 주 탱크 내부","콘서베이터 내부","변압기 고압 측 부싱","변압기 주 탱크와 콘서베이터 사이"],4,"부흐홀츠 계전기는 변압기 주 탱크와 콘서베이터 사이에 설치하여 내부 고장 시 생기는 유증기를 검출한다."],
[S,"07 고압 및 저압 배전반 공사","3상 4선식 380/220[V] 전로에서 전원의 중성극에 접속된 전선을 무엇이라 하는가?",["접지도체","중성선","전원선","접지측선"],2,"중성선: 다중접지식 전로에서 전원의 중성극에 접속된 전선"],
[S,"04 옥내 배선 공사","플로어 덕트 배선의 사용전압은 몇 [V] 이하로 제한되는가?",["220","400","600","700"],2,"플로어 덕트 배선의 사용전압은 400[V] 이하"],
[T,"07 교류회로","임피던스 Z=6+j8[Ω]에서 서셉턴스의 크기는?",["0.06","0.08","0.6","0.8"],2,"Y=1/Z=(6−j8)/(6²+8²)=0.06−j0.08[℧]. 서셉턴스의 크기는 0.08[℧]"],
[G,"03 변압기","전기기기의 철심 재료로 규소강판을 많이 사용하는 이유로 가장 적당한 것은?",["와류손을 줄이기 위해","구리손을 줄이기 위해","맴돌이 전류를 없애기 위해","히스테리시스 손을 줄이기 위해"],4,"규소강판 사용 → 히스테리시스손 감소, 성층 철심 → 와류손 감소"],
[T,"01 직류회로","정상 상태에서의 원자를 설명한 것으로 틀린 것은?",["양성자와 전자의 극성은 같다.","원자는 전체적으로 보면 전기적으로 중성이다.","원자를 이루고 있는 양성자의 수는 전자의 수와 같다.","양성자 1개가 지니는 전기량은 전자 1개가 지니는 전기량과 크기가 같다."],1,"양성자는 (+), 전자는 (−)로 극성이 반대이다."],

[G,"01 직류기","전압변동률 ε의 식은? (단, 정격전압 Vn[V], 무부하 전압 V₀[V]이다.)",["ε=(V₀−Vn)/Vn × 100[%]","ε=(Vn−V₀)/Vn × 100[%]","ε=(Vn−V₀)/V₀ × 100[%]","ε=(V₀−Vn)/V₀ × 100[%]"],1,"전압변동률 ε=(V₀−Vn)/Vn×100[%]. 무부하 전압과 정격전압의 차를 정격전압에 대한 백분율로 나타낸다."],
[T,"09 비정현파","비사인파의 일반적인 구성이 아닌 것은?",["삼각파","고조파","기본파","직류분"],1,"비사인파 = 직류분 + 기본파 + 고조파"],
[S,"02 배선재료와 공구","실링·직접부착등을 시설하고자 한다. 배선도에 표기할 그림기호로 옳은 것은?",["① 가로선 끝의 원 안에 N","② 원에 사선 두 개가 걸친 기호","③ 원 안에 CL","④ 원 안에 R"],3,"CL(Ceiling Light): 천장에 직접 붙이는 등의 심벌","①~④ 네 가지 그림기호"],
[T,"05 자기 성질과 자기장","전류에 의해 발생되는 자기장에서 자력선의 방향을 간단하게 알아내는 법칙은?",["앙페르의 오른나사의 법칙","플레밍의 왼손 법칙","앙페르의 주회적분 법칙","줄의 법칙"],1,"앙페르의 오른나사 법칙: 전류에 의한 자기장의 방향. 플레밍의 왼손 법칙: 전자력의 방향. 주회적분 법칙: 자기장의 세기. 줄의 법칙: 발생 열량."],
[G,"05 정류기 및 제어기기","애벌런치 항복 전압은 온도 증가에 따라 어떻게 변화하는가?",["감소한다.","증가한다.","증가했다가 감소한다.","무관하다."],2,"애벌런치 항복 전압은 온도에 비례하여 증가한다."],
[T,"07 교류회로","İ=8+j6[A]로 표시되는 전류의 크기 I[A]는 얼마인가?",["6","8","10","12"],3,"I=√(8²+6²)=10[A]"],
[G,"05 정류기 및 제어기기","입력으로 펄스신호를 가해주고 속도를 입력펄스의 주파수에 의해 조절하는 전동기는?",["전기 동력계","서보 전동기","스테핑 전동기","권선형 유도 전동기"],3,"스테핑 전동기: 회전속도가 입력 펄스 주파수에 비례하고, 펄스 수만큼 정해진 각도로 회전한다."],
[S,"02 배선재료와 공구","하나의 콘센트에 둘 또는 세 가지의 기계기구를 끼워서 사용할 때 사용되는 것은?",["노출형 콘센트","키리스 소켓","멀티 탭","아이언 플러그"],3,"멀티 탭: 하나의 콘센트에 둘 또는 세 가지 기구를 끼워 쓸 때 사용한다."],
[T,"01 직류회로","전기 전도도가 좋은 순서대로 도체를 나열한 것은?",["은 → 구리 → 금 → 알루미늄","구리 → 금 → 은 → 알루미늄","금 → 구리 → 알루미늄 → 은","알루미늄 → 금 → 은 → 구리"],1,"전기 전도도: 은 > 구리 > 금 > 알루미늄"]

[G,"02 동기기","동기 전동기의 전기자 반작용은 리액터 부하에 의한 (㉠)과 콘덴서 부하에 의한 (㉡)이 있다. ㉠, ㉡에 알맞은 말은?",["㉠: 증자작용, ㉡: 감자작용","㉠: 감자작용, ㉡: 증자작용","㉠: 교차자화작용, ㉡: 감자작용","㉠: 증자작용, ㉡: 교차자화작용"],1,"동기 전동기의 전기자 반작용은 리액터 부하에 의한 증자작용과 콘덴서 부하에 의한 감자작용이 있다."],

[S,"02 배선재료와 공구","한국전기설비규정에 의하여 비상 조명을 제외한 조명용 분기회로 및 정격 32[A] 이하의 콘센트용 분기회로에 시설하는 누전차단기는 정격감도전류가 몇 [mA] 이하이어야 하는가?",["15","20","30","50"],3,"비상 조명을 제외한 조명용 분기회로 및 정격 32[A] 이하 콘센트용 분기회로의 누전차단기는 정격감도전류 30[mA] 이하이다."],
[T,"03 전류의 열작용과 화학작용","그림과 같은 회로에서 CD에서 본 합성 저항은 몇 [Ω]인가?",["r/2","r","(3/2)r","2r"],1,"CD 회로는 2r, r, 2r이 병렬이므로 1/R=1/2r+1/r+1/2r=2/r → R=r/2[Ω]","브리지형으로 저항 r 5개가 연결된 회로. C는 윗꼭짓점, D는 아랫꼭짓점에 연결되고, 위·아래 꼭짓점 사이에 r(가운데), 왼쪽 경로 r+r, 오른쪽 경로 r+r이 병렬로 있다."],
[G,"05 정류기 및 제어기기","SCR 2개를 역병렬로 접속한 그림과 같은 기호의 명칭은?",["SCR","TRIAC","GTO","UJT"],2,"사이리스터 2개를 역병렬로 접속한 것과 등가인 것은 트라이액(TRIAC)이다.","두 삼각형이 서로 반대 방향으로 겹쳐 있고 게이트(G) 단자가 하나 달린 기호"],
[G,"03 변압기","변압기의 여자 전류가 일그러지는 이유는 무엇 때문인가?",["와류(맴돌이 전류) 때문에","자기포화와 히스테리시스 현상 때문에","누설 리액턴스 때문에","선간 정전용량 때문에"],2,"변압기 철심에는 자기포화 현상과 히스테리시스 현상이 있어 여자 전류 I₀는 일그러진 파형(정현파형이 되지 않음)이 된다."],
[G,"03 변압기","변압기에서 전압변동률이 최대가 되는 부하의 역률은? (단, p: 퍼센트 저항 강하, q: 퍼센트 리액턴스 강하, cos θm: 역률)",["cos θm=p/√(p+q)","cos θm=p/√(p²+q²)","cos θm=p/(p²+q²)","cos θm=p/(p+q)"],2,"전압변동률이 최대일 때 역률 cos θm=p/√(p²+q²)"],
[T,"03 전류의 열작용과 화학작용","기전력 50[V], 내부저항 5[Ω]인 전원이 있다. 이 전원에 부하를 연결하여 얻을 수 있는 최대전력은?",["125[W]","250[W]","500[W]","1,000[W]"],1,"최대전력은 내부저항과 부하저항이 같을 때이다. I=50/(5+5)=5[A], P=I²R=5²×5=125[W]"],
[S,"04 옥내 배선 공사","한국전기설비규정에 의하여 애자 공사를 할 경우, 사용전압이 400[V] 이하일 때 전선과 조영재의 이격거리는 몇 [cm] 이상이어야 하는가?",["1","2.5","4","6"],2,"애자 공사 시 사용전압이 400[V] 이하인 경우 전선과 조영재의 간격(이격거리)은 2.5[cm] 이상으로 한다."],
[S,"08 특수 장소 공사","사람이 상시 통행하는 터널 안 배선의 사용전압이 저압일 때 배선 방법으로 틀린 것은?",["금속관 배선","금속덕트 배선","합성수지관 배선","금속제 가요전선관 배선"],2,"사람이 상시 통행하는 터널 안의 배선은 애자사용, 금속관, 합성수지관, 금속제 가요전선관, 케이블 배선으로 한다. 금속덕트 배선은 해당되지 않는다."],
[S,"05 전선 및 기계기구의 보안공사","전압계, 전류계 등의 소손방지용으로 계기 내에서 장치하고 봉입하는 퓨즈는 어느 것인가?",["통형 퓨즈","판형 퓨즈","온도 퓨즈","텅스텐 퓨즈"],4,"텅스텐 퓨즈: 전압계, 전류계 등의 소손방지용으로 계기 내에서 장치하고 봉입하는 퓨즈"],
[G,"03 변압기","50[Hz]의 변압기에 60[Hz]의 같은 전압을 가했을 때 자속밀도는 50[Hz]일 때의 몇 배인가?",["6/5","5/6","(6/5)²","(6/5)^1.2"],2,"E=4.44fNφm에서 동일 전압이면 자속밀도는 주파수 f에 반비례하므로 주파수가 6/5배가 되면 자속밀도는 5/6배가 된다."],
[T,"06 전자유도 법칙과 인덕턴스","그림과 같이 자극 사이에 있는 도체에 전류(I)가 흐를 때 힘은 어느 방향으로 작용하는가?",["가","나","다","라"],1,"플레밍의 왼손 법칙을 적용하면 힘은 가 방향(위쪽)으로 향한다.","왼쪽 N극, 오른쪽 S극 사이에 도체가 있고 전류 I가 흐른다. 힘의 방향 후보: 가(위), 나(오른쪽), 다(아래), 라(왼쪽)"],
[T,"06 전자유도 법칙과 인덕턴스","상호 유도 회로에서 결합계수 k는? (단, M은 상호 인덕턴스, L₁, L₂는 자기 인덕턴스이다.)",["k=M√(L₁L₂)","k=√(ML₁L₂)","k=M/√(L₁L₂)","k=√(L₁L₂/M)"],3,"상호 인덕턴스 M=k√(L₁L₂) → k=M/√(L₁L₂)"],
[S,"02 배선재료와 공구","금속관을 절단할 때 사용되는 공구는?",["오스터","녹아웃 펀치","파이프 커터","파이프 렌치"],3,"오스터: 금속관 끝에 나사를 내는 공구 / 녹아웃 펀치: 배전반, 분전반 등의 캐비닛에 구멍을 뚫을 때 필요한 공구 / 파이프 커터: 금속관을 절단 / 파이프 렌치: 금속관과 커플링을 물고 조이는 공구"],
[G,"05 정류기 및 제어기기","다이오드를 사용한 정류회로에서 다이오드를 여러 개 직렬로 연결하여 사용하는 경우의 설명으로 가장 옳은 것은?",["다이오드를 과전류로부터 보호할 수 있다.","다이오드를 과전압으로부터 보호할 수 있다.","부하 출력의 맥동률을 감소시킬 수 있다.","낮은 전압 전류에 적합하다."],2,"다이오드를 직렬로 접속하면 다이오드에 걸리는 전압이 분배되어 전체 입력을 증가시킬 수 있다. 따라서 과전압으로부터 보호할 수 있다."],
[G,"01 직류기","직류 직권 전동기를 사용하려고 할 때 벨트를 걸고 운전하면 안 되는 가장 타당한 이유는?",["벨트가 기동할 때 또는 갑자기 중부하를 걸 때 미끄러지기 때문에","벨트가 벗겨지면 전동기가 갑자기 고속으로 회전하기 때문에","벨트가 끊어졌을 때 전동기의 급정지 때문에","부하에 대한 손실을 최대로 줄이기 위해서"],2,"직류 직권 전동기는 무부하가 되면 회전속도가 급격히 상승(무구속 속도)하여 위험하므로 무부하 운전이나 벨트 운전을 하지 않도록 해야 한다."],
[T,"03 전류의 열작용과 화학작용","서로 다른 종류의 안티모니와 비스무트의 두 금속을 접속하여 여기에 전류를 통하면, 그 접점에서 열의 발생 또는 흡수가 일어난다. 줄열과 달리 전류의 방향에 따라 열의 흡수와 발생이 다르게 나타나는 이 현상은?",["펠티에 효과","제벡 효과","제3금속의 법칙","열전 효과"],1,"펠티에 효과: 서로 다른 금속을 접속시켜 폐회로를 만들고 전류를 흘리면 접합부에서 열을 발생 또는 흡수하는 현상"],
[T,"09 비정현파","정현파에서 파고율이란?",["최대값/실효값","평균값/실효값","실효값/평균값","최대값/평균값"],1,"파고율=최대값/실효값, 파형률=실효값/평균값"],
[G,"02 동기기","단락비가 큰 동기기에 대한 설명으로 옳은 것은?",["기계가 소형이다.","안정도가 높다.","전압변동률이 크다.","전기자 반작용이 크다."],2,"단락비가 큰 동기발전기: 전기자 반작용이 작고, 동기 임피던스가 작으며, 전압변동률이 양호(작다). 기계가 크고 고중량이며 고가이다. 안정도가 높다."],
[S,"06 전선로 및 배전선 공사","한국전기설비규정에 의하여 가공전선에 케이블을 사용하여 조가용선에 조가하는 경우 조가용선의 단면적은 몇 [mm²] 이상이어야 하는가?",["20","22","36","50"],2,"가공전선에 케이블을 사용하여 조가선(조가용선)에 조가하는 경우 조가선의 단면적은 22[mm²] 이상이어야 한다."],
[S,"03 전선의 접속","다음 그림과 같은 전선의 접속 방법은?",["쥐꼬리 접속","브리타니아 접속","트위스트 접속","슬리브 접속"],3,"그림의 전선 접속 방법은 트위스트 접속으로 6[mm²] 이하의 가는 전선의 직선 접속이다.","두 심선을 약 120°로 교차시킨 뒤 서로 비틀어 감는 접속 그림"],
[G,"04 유도기","유도 전동기에 기계적 부하를 걸었을 때 출력에 따라 속도, 토크, 효율, 슬립 등의 변화를 나타낸 출력 특성 곡선에 슬립을 나타내는 곡선은?",["1","2","3","4"],4,"유도 전동기의 출력 특성 곡선에서 슬립을 나타내는 곡선은 4이다.","출력 특성 곡선 그래프. 가로축은 출력, 곡선 1~4번이 표시되고 속도·토크·효율·슬립 곡선 중 하나씩에 해당함"],
[T,"06 전자유도 법칙과 인덕턴스","히스테리시스 곡선에서 가로축과 만나는 점과 관계 있는 것은?",["보자력","잔류자기","자속밀도","기자력"],1,"가로축(H축)과 만나는 점은 보자력(c), 세로축(B축)과 만나는 점은 잔류자기(b)이다.","B-H 히스테리시스 곡선. 점 a(포화점), b(세로축 교점), c(가로축 교점), d, e, f가 표시됨"],
[T,"07 교류회로","10[Ω]의 저항회로에 e(t)=100 sin(377t+π/3)[V]의 전압을 가했을 때 t=0에서의 순시전류는 몇 [A]인가?",["5√3","10","5","5√2"],1,"i(t)=e(t)/R=10 sin(377t+π/3), i(0)=10 sin(π/3)=10×√3/2=5√3[A]"],
[T,"02 전기회로 해석","그림을 테브난 등가회로로 고칠 때 개방전압 V와 등가저항 R은?",["20[V], 5[Ω]","30[V], 8[Ω]","15[V], 12[Ω]","10[V], 1.2[Ω]"],1,"6[Ω]에 걸리는 테브난 전압 V=6/(3+6)×30=20[V], 개방 측에서 본 합성저항 R=3×6/(3+6)+3=5[Ω]","30[V] 전원에 3[Ω]이 직렬, 이어서 6[Ω]이 병렬(세로), 그 뒤에 3[Ω]이 직렬로 연결되고 맨 오른쪽 두 단자가 개방된 회로"],
[G,"03 변압기","부흐홀츠 계전기로 보호되는 기기는?",["발전기","변압기","전동기","회전 변류기"],2,"부흐홀츠 계전기는 변압기의 내부고장으로 발생하는 절연유의 분해 가스 증기 또는 유류를 이용하여 계전기의 접점을 닫는다. 변압기 주 탱크와 콘서베이터 연결관 도중에 설치한다."],
[G,"01 직류기","전압변동률 ε의 식은? (단, 정격전압 Vn[V], 무부하 전압 V₀[V]이다.)",["ε=(V₀−Vn)/Vn×100[%]","ε=(Vn−V₀)/Vn×100[%]","ε=(Vn−V₀)/V₀×100[%]","ε=(V₀−Vn)/V₀×100[%]"],1,"전압변동률 ε=(V₀−Vn)/Vn×100[%]"],
[S,"02 배선재료와 공구","케이블의 고장점을 찾는 데 사용되는 방법이 아닌 것은?",["수색코일에 의한 방법","펄스 측정법","머레이 루프법","콜라우시 브리지법"],4,"케이블의 고장점을 찾는 방법: 수색코일에 의한 방법, 펄스 측정법, 머레이 루프법, 정전용량법"],
[S,"04 옥내 배선 공사","한국전기설비규정에 의하여 절연전선을 동일 금속덕트 내에 넣을 경우 금속덕트의 크기는 전선의 피복절연물을 포함한 단면적의 총합계가 금속덕트 내 단면적의 몇 [%] 이하가 되도록 선정하여야 하는가?",["20","32","48","50"],1,"금속덕트의 크기는 전선의 피복절연물을 포함한 단면적의 총합계가 금속덕트 내 단면적의 20[%] 이하가 되도록 선정한다."],
[S,"02 배선재료와 공구","피시 테이프(Fish Tape)의 용도는?",["전선을 테이핑하기 위해서 사용","전선관의 끝마무리를 위해서 사용","배관에 전선을 넣을 때 사용","합성수지관을 구부릴 때 사용"],3,"피시 테이프(Fish Tape): 전선관에 전선을 넣거나 매달고 당길 때 사용되는 도구이다."],
[T,"05 자기 성질과 자기장","다음 물질 중 강자성체로만 짝지어진 것은?",["철, 니켈, 아연, 망간","구리, 비스무트, 코발트, 망간","철, 구리, 니켈, 아연","철, 니켈, 코발트"],4,"강자성체: 철, 니켈, 코발트 등(암기 팁: 니 코 강철 같다). 반자성체: 구리, 아연 등"],
[T,"08 3상 교류회로","출력 P[kVA]의 단상 변압기 전원 2대를 V 결선할 때의 3상 출력[kVA]은?",["P","√3P","2P","3P"],2,"단상 변압기 2대를 V 결선한 3상 출력 P_V=√3P[kVA] (P: 1상의 출력)"],
[T,"05 자기 성질과 자기장","자기저항의 단위는?",["[AT/m]","[Wb/AT]","[AT/Wb]","[Ω/AT]"],3,"자기저항 Rm=NI/φ[AT/Wb]"],
[G,"01 직류기","직류 발전기에서 급전선의 전압강하 보상용으로 사용되는 것은?",["분권 발전기","직권 발전기","과복권 발전기","차동 복권 발전기"],3,"과복권 발전기는 직류 복권 발전기의 부류로서 부하와 발전기 사이가 먼 배전선로 저항에 의한 급전선의 전압강하 보상용으로 사용된다."],
[G,"03 변압기","3상 4극, 60[MVA], 역률 0.8, 60[Hz], 22.9[kV] 수차 발전기의 전부하 손실이 1,600[kW]이면 전 부하 효율[%]은?",["90","95","97","99"],3,"η=출력/(출력+손실)×100=60×0.8/((60×0.8)+1.6)×100≒97[%]"],
[G,"05 정류기 및 제어기기","인버터의 스위칭 주기가 1[ms]일 때 주파수는 몇 [Hz]인가?",["20","60","100","1,000"],4,"f=1/T=1/(1×10⁻³)=1,000[Hz]"],
[S,"04 옥내 배선 공사","합성수지관을 새들 등으로 지지하는 경우 지지점 간의 거리는 몇 [m] 이하인가?",["1.5","2.0","2.5","3.0"],1,"배관의 지지점 사이의 거리는 1.5[m] 이하로 하고, 관과 관, 관과 박스의 접속점 및 관 끝은 가까운 곳에 지지점을 시설해야 한다."],
[S,"03 전선의 접속","접착력은 떨어지나 절연성, 내온성, 내유성이 좋아 연피 케이블의 접속에 사용되는 테이프는?",["고무 테이프","리노 테이프","비닐 테이프","자기 융착 테이프"],2,"리노 테이프: 접착성은 떨어지나 절연성, 내온성, 내유성이 좋아 연피 케이블의 접속에 사용한다."],
[T,"06 전자유도 법칙과 인덕턴스","자속 밀도 0.5[Wb/m²]의 자장 안에 자장과 직각으로 20[cm]의 도체를 놓고 이것에 10[A]의 전류를 흘릴 때 도체가 50[cm] 운동한 경우의 한 일은 몇 [J]인가?",["0.5","1","1.5","5"],1,"전자력 F=IBl sinθ=10×0.5×20×10⁻²×sin90°=1[N], 한 일 W=F×r=1×50×10⁻²=0.5[J]"],
[T,"05 자기 성질과 자기장","환상 솔레노이드에 감겨진 코일의 감는 횟수를 2배로 늘리면 자체 인덕턴스는 몇 배로 되는가?",["2","4","8","0.5"],2,"환상 솔레노이드의 인덕턴스 L=μSN²/l이므로 코일의 횟수를 2배로 늘리면 인덕턴스는 4배가 된다."],
[G,"04 유도기","유도전동기의 동기속도 Ns, 회전속도 n일 때 슬립 s의 표현식은?",["s=(Ns−n)/n","s=(n−Ns)/n","s=(Ns−n)/Ns","s=(Ns+n)/Ns"],3,"슬립: 회전자계 속도인 동기속도와 회전자 속도의 관계 s=(Ns−n)/Ns"],
[G,"05 정류기 및 제어기기","PN 접합 다이오드의 대표적인 작용으로 옳은 것은?",["정류작용","변조작용","증폭작용","발진작용"],1,"PN 접합 다이오드의 대표적인 작용은 정류작용으로, 전압의 방향에 따라 전류를 흐르게 하거나 흐르지 못하게 하는 정류특성을 가진다."],
[S,"08 특수 장소 공사","소맥분, 전분 기타 가연성의 분진이 존재하는 곳의 저압 옥내 배선 공사방법 중 적당하지 않은 것은?",["애자 공사","합성수지관 공사","케이블 공사","금속관 공사"],1,"가연성의 먼지로서 공중에 떠다니는 상태에서 착화하였을 때 폭발의 우려가 있는 곳의 저압 옥내 배선은 합성수지관 공사, 금속관 공사, 케이블 공사에 의하여 시설한다."],
[S,"04 옥내 배선 공사","금속관 공사에서 녹아웃의 지름이 금속관의 지름보다 큰 경우에 사용하는 재료는?",["링 리듀서","부싱","커넥터","로크너트"],1,"링 리듀서: 금속관을 아웃렛 박스에 접속할 때 박스 지름이 관보다 클 경우 사용하는 보조 접속 기구"],
[S,"06 전선로 및 배전선 공사","한국전기설비규정에 의하여 고압 가공인입선이 횡단보도교 위에 시설되는 경우 노면상 몇 [m] 이상의 높이에 설치되어야 하는가?",["3","3.5","5","6.5"],2,"고압 가공인입선이 횡단보도교 위에 시설되는 경우는 노면상 3.5[m] 이상으로 설치해야 한다."],
[T,"06 전자유도 법칙과 인덕턴스","공기 중에서 5[cm] 간격을 유지하고 있는 2개의 평행 도선에 각각 10[A]의 전류가 동일한 방향으로 흐를 때 도선 1[m]당 발생하는 힘의 크기[N]는?",["4×10⁻⁴","2×10⁻⁵","4×10⁻⁵","2×10⁻⁴"],1,"흡인력 F=μI₁I₂/(2πd)=4×3.14×10⁻⁷×10×10/(2×3.14×5×10⁻²)=4×10⁻⁴[N]"],
[G,"02 동기기","60[Hz], 20,000[kVA]의 발전기의 회전수가 1,200[rpm]이라면 이 발전기의 극수는 얼마인가?",["6극","8극","12극","14극"],1,"동기속도 Ns=120f/p → p=120f/Ns=120×60/1,200=6극"],
[G,"02 동기기","3상 동기 전동기의 토크에 대한 설명으로 옳은 것은?",["공급전압 크기에 비례한다.","공급전압 크기의 제곱에 비례한다.","부하각 크기에 반비례한다.","부하각 크기의 제곱에 비례한다."],1,"동기 전동기에서 토크는 공급전압에 비례한다. 동기 전동기는 동기속도 Ns의 일정 속도로 운전한다."],
[S,"02 배선재료와 공구","옥외용 비닐 절연전선의 약호는?",["OW","DV","NR","FTC"],1,"OW: 옥외용 비닐 절연전선, DV: 인입용 비닐 절연전선"],
[S,"04 옥내 배선 공사","합성수지관 상호 간 및 관과 박스는 접속 시에 삽입하는 깊이를 관 바깥지름의 몇 배 이상으로 하여야 하는가? (단, 접착제를 사용하지 않는 경우이다.)",["0.2","0.5","1.0","1.2"],4,"관 상호 간 및 박스와는 관을 삽입하는 깊이를 관의 바깥지름의 1.2배(접착제를 사용하는 경우에는 0.8배) 이상으로 하고 또한 꽂음 접속에 의하여 견고하게 접속할 것"],
[S,"02 배선재료와 공구","조명용 전등을 호텔 또는 여관 객실 입구에 설치할 경우 최대 몇 분 이내에 소등되는 타임스위치를 시설하여야 하는가?",["1","2","3","4"],1,"타임스위치 소등 시간: 일반 주택 및 아파트 3분 이내, 숙박 업소 입구 1분 이내"],
[T,"05 자기 성질과 자기장","전류에 의해 발생되는 자기장에서 자력선의 방향을 간단하게 알아내는 법칙은?",["앙페르의 오른나사의 법칙","플레밍의 왼손 법칙","앙페르의 주회적분 법칙","줄의 법칙"],1,"앙페르의 오른나사 법칙: 전류에 의하여 발생하는 자기장의 방향을 결정"],
[T,"02 전기회로 해석","어떤 저항(R)에 전압(V)을 가하니 전류(I)가 흘렀다. 이 회로의 저항(R)을 20[%] 줄이면 전류(I)는 처음의 몇 배가 되는가?",["0.8","0.88","1.25","2.04"],3,"I'=V/((1−0.2)R)=V/(0.8R)=1/0.8×V/R=1.25×V/R=1.25I[A]"],
[T,"07 교류회로","R−L 병렬 회로에서 합성 임피던스의 크기는 어떻게 표현되는가?",["R/(R²+XL²)","X/√(R²+XL²)","(R+XL)/(R²+XL²)","R·XL/√(R²+XL²)"],4,"어드미턴스의 크기 |Y|=√((1/R)²+(1/XL)²)=√(R²+XL²)/(R·XL) → 임피던스의 크기 |Z|=1/|Y|=R·XL/√(R²+XL²)"],
[G,"05 정류기 및 제어기기","3상 반파 정류회로 입력 전압을 E[V]라고 할 때의 직류 출력 전압 값은?",["0.45E","0.9E","1.17E","1.35E"],3,"3상 반파 정류 직류출력 Ed=1.17E (단상 반파 0.45E, 단상 전파 0.9E, 3상 전파 1.35E)"],
[S,"03 전선의 접속","동전선의 종단 접속 방법이 아닌 것은?",["동선 압착 단자에 의한 접속","종단 겹침용 슬리브에 의한 접속","C형 전선 접속기에 의한 접속","비틀어 꽂는 형의 전선 접속기에 의한 접속"],3,"C형 전선 접속기(슬리브)는 직선으로 T형 분기 접속에 사용한다. 동전선의 종단 접속 방법에는 해당하지 않는다."],
[S,"07 고압 및 저압 배전반 공사","수변전 설비의 고압 회로에 걸리는 전압을 표시하기 위해 전압계를 시설할 때 고압회로와 전압계 사이에 시설하는 것은?",["관통형 변압기","계기용 변류기","계기용 변압기","권선형 변류기"],3,"고전압을 저전압으로 변성하여 측정계기나 보호 계전기에 전압을 공급하기 위한 계기를 계기용 변압기(PT)라 한다."]
];

[S,"05 전선 및 기계기구의 보안공사","한국전기설비규정에 의하여 저압전로에 사용하는 산업용 배선차단기의 정격전류가 30[A]이고 전로에 39[A]가 흐를 때 과전류트립 동작시간은?",["30분","60분","90분","120분"],2,"정격전류 63[A] 이하의 과전류트립 동작시간은 60분이다. (39[A]는 정격의 1.3배)"],
[G,"02 동기기","동기 발전기의 병렬운전 조건이 아닌 것은?",["기전력의 주파수가 같을 것","기전력의 크기가 같을 것","기전력의 위상이 같을 것","발전기의 회전수가 같을 것"],4,"병렬운전 조건: 기전력의 크기, 위상, 주파수, 파형이 같을 것"],
[G,"01 직류기","직류 분권 전동기의 계자전류를 약하게 하면 회전수는?",["감소한다.","정지한다.","증가한다.","변화 없다."],3,"N=K(V−IaRa)/φ 이므로 계자전류를 약하게 하면 자속이 감소하여 회전수는 증가한다."],
[S,"07 고압 및 저압 배전반 공사","일정값 이상의 전류가 흘렀을 때 동작하는 계전기는?",["OCR","OVR","UVR","GR"],1,"OCR은 과전류 계전기, OVR은 과전압 계전기, UVR은 부족전압 계전기, GR은 지락 계전기이다."],
[T,"04 정전기와 콘덴서","쿨롱의 법칙에서 2개의 점전하 사이에 작용하는 정전력의 크기는?",["두 전하의 곱에 비례하고 거리에 반비례한다.","두 전하의 곱에 반비례하고 거리에 비례한다.","두 전하의 곱에 비례하고 거리의 제곱에 비례한다.","두 전하의 곱에 비례하고 거리의 제곱에 반비례한다."],4,"F=(1/4πε₀)×Q₁Q₂/r²[N]"],
[S,"03 전선의 접속","진동이 심한 전기 기계기구의 단자에 전선을 접속할 때 사용되는 것은?",["커플링","압착단자","링 슬리브","스프링 와셔"],4,"진동이 있는 단자에 전선을 접속할 때는 스프링 와셔 또는 이중너트를 사용한다."],
[T,"02 전기회로 해석","4[Ω], 6[Ω], 8[Ω]의 3개 저항을 병렬 접속할 때 합성저항은 약 몇 [Ω]인가?",["1.8[Ω]","2.5[Ω]","3.6[Ω]","4.5[Ω]"],1,"R=1/(1/4+1/6+1/8)=1/(13/24)≒1.8[Ω]"],
[S,"02 배선재료와 공구","한국전기설비규정에 의하여 조명용 전등을 아파트 현관에 설치할 경우 최대 몇 분 이내 소등되는 타임스위치를 시설하여야 하는가?",["1분","3분","0.5분","5분"],2,"일반 주택 및 아파트는 3분 이내, 숙박 업소 입구는 1분 이내 소등"],
[T,"03 전류의 열작용과 화학작용","어떤 전압계의 측정 범위를 10배로 하려면 배율기의 저항을 전압계 내부저항의 몇 배로 하여야 하는가?",["10","1/10","9","1/9"],3,"E/V=1+Rm/R=10 이므로 Rm/R=9"],
[G,"03 변압기","다음 중 변압기의 온도 상승 시험법으로 가장 널리 사용되는 것은?",["무부하 시험법","절연내력 시험법","단락 시험","실부하법"],3,"단락 시험법: 변압기의 권선을 단락하고 전 손실에 해당하는 부하 손실을 공급해서 온도 상승을 측정한다. 가장 널리 사용된다."],
[T,"05 자기 성질과 자기장","영구자석의 재료로서 적당한 것은?",["잔류자기가 작고 보자력이 큰 것","잔류자기와 보자력이 모두 큰 것","잔류자기와 보자력이 모두 작은 것","잔류자기가 크고 보자력이 작은 것"],2,"영구자석은 잔류자기와 보자력 모두 큰 것을, 전자석은 잔류자기는 크고 보자력은 작은 것을 사용한다."],
[S,"04 옥내 배선 공사","한국전기설비규정에 의하여 저압 옥내용 배선공사 방법 중 점검 가능한 은폐 장소이며 건조한 장소인 곳에 시설할 수 없는 방법은?",["금속관 공사","플로어덕트 공사","금속몰드 공사","합성수지관 공사"],2,"플로어덕트 공사는 점검이 불가능한 은폐 장소이며 건조한 장소에 한하여 시설할 수 있다."],
[T,"01 직류회로","2분 동안에 전류를 흘려 72,000[C]의 전하가 이동했을 때 이 도선의 전류는?",["10[A]","20[A]","600[A]","1,200[A]"],3,"I=Q/t=72,000/(2×60)=600[A]"],
[S,"09 전기응용 시설 공사","전동기의 정·역 운전을 제어하는 회로에서 2개의 전자 개폐기의 작동이 동시에 일어나지 않도록 하는 회로는?",["Y−Δ 회로","자기유지 회로","촌동 회로","인터록 회로"],4,"인터록 회로: 주회로의 단락 방지 등을 위한 회로로, 동시동작을 방지한다."],
[S,"02 배선재료와 공구","전선의 굵기를 측정하는 공구는?",["권척","메거","와이어 게이지","와이어 스트리퍼"],3,"와이어 게이지: 전선의 굵기(직경) 측정. 권척: 길이 측정, 메거: 절연 저항 측정, 와이어 스트리퍼: 피복을 벗기는 공구"],
[G,"01 직류기","전기 기계의 철심을 성층하는 가장 적절한 이유는?",["기계손을 적게 하기 위해서","표유부하손을 적게 하기 위하여","히스테리시스손을 적게 하기 위하여","와류손을 적게 하기 위하여"],4,"철심을 얇은 강판으로 성층하면 와류손(맴돌이 전류손)이 감소하고, 규소강판 사용으로 히스테리시스손이 감소한다. 성층의 직접적 목적은 와류손 감소이다."],
[S,"05 전선 및 기계기구의 보안공사","한국전기설비규정에 의하여 분기회로의 과부하보호장치 설치점과 분기점 사이에 다른 분기회로 또는 콘센트의 접속이 없고, 단락의 위험과 화재 및 인체에 대한 위험성이 최소화되도록 시설된 경우 과부하보호장치는 분기점으로부터 몇 [m]까지 이동하여 설치할 수 있는가?",["2","3","4","5"],2,"이 경우 분기회로의 과부하보호장치는 분기점으로부터 3[m]까지 이동하여 설치할 수 있다.","주 전로에서 분기점 O를 거쳐 분기되는 회로. 보호장치 P₁은 A점에 있고, 분기회로 보호장치 P₂는 분기점 B에서 ?[m] 떨어진 위치에 설치됨."],
[G,"05 정류기 및 제어기기","ON, OFF를 고속도로 변환할 수 있는 스위치이고 직류 변압기 등에 사용되는 회로는 무엇인가?",["초퍼 회로","인버터 회로","컨버터 회로","정류기 회로"],1,"초퍼: 고정 직류를 가변 직류로 변환(DC→Variable DC), 직류 변압기에 사용. 인버터: DC→AC, 컨버터: AC→DC"],
[S,"07 고압 및 저압 배전반 공사","전력용 콘덴서를 회로로부터 개방하였을 때 전하가 잔류함으로써 일어나는 위험의 방지와 재투입할 때 콘덴서에 걸리는 과전압의 방지를 위하여 무엇을 설치하는가?",["직렬 리액터","전력용 콘덴서","방전 코일","피뢰기"],3,"방전 코일(DC): 콘덴서를 회로에서 개방하였을 때 잔류 전하에 의한 위험 방지와 재투입 시 과전압 방지를 위해 사용한다."],
[S,"08 특수 장소 공사","한국전기설비규정에 의하여 교통신호등 회로의 사용전압이 몇 [V]를 초과하는 경우에 지락 발생 시 자동적으로 전로를 차단하는 누전차단기를 반드시 설치해야 하는가?",["50","120","150","300"],3,"교통신호등 회로의 사용전압이 150[V]를 초과하는 경우 지락 발생 시 자동적으로 전로를 차단하는 누전차단기를 설치해야 한다."],
[T,"03 전류의 열작용과 화학작용","전류의 열작용과 관계가 있는 법칙은 어느 것인가?",["옴의 법칙","키르히호프의 법칙","줄의 법칙","플레밍의 오른손 법칙"],3,"줄의 법칙: 전류가 흐를 때 발생하는 열량 H=0.24I²Rt[cal]"],
[G,"03 변압기","3상 전원에서 2상 전원을 얻기 위한 변압기 결선 방법은?",["스코트 결선","대각 결선","포크 결선","2차 2중 Y 결선"],1,"3상에서 2상으로 변환하는 방법은 스코트(T) 결선이다. 이 외에 메이어 결선, 우드브리지 결선이 있다."],
[S,"04 옥내 배선 공사","금속관 배관 공사에서 절연 부싱을 사용하는 이유는?",["박스 내에서 전선의 접속을 방지","관이 손상되는 것을 방지","관 끝단에서 전선의 인입 및 교체 시 발생하는 전선의 손상 방지","관의 입구에서 조영재의 접속을 방지"],3,"부싱은 관 끝에 설치하여 전선의 피복 손상을 방지하기 위한 것이다."],
[T,"06 전자유도 법칙과 인덕턴스","자기 인덕턴스 L₁, L₂와 상호 인덕턴스 M일 때, 일반적인 자기 결합 상태에서 결합계수 k는?",["k<0","0<k<1","k>1","k=1"],2,"결합계수 k=M/√(L₁L₂). 일반적인 결합 시 0<k<1, 미결합 시 k=0, 완전 결합 시 k=1"],
[T,"09 비정현파","비사인파 교류회로의 전력 성분과 거리가 먼 것은?",["맥류 성분과 사인파의 곱","직류 성분과 사인파의 곱","직류 성분","주파수가 같은 두 사인파의 곱"],1,"맥류 성분과 사인파의 곱은 교류회로의 전력 성분과 관계가 없다."],
[S,"08 특수 장소 공사","한국전기설비규정에 의하여 가연성 분진에 전기설비가 발화원이 되어 폭발할 우려가 있는 곳에 합성수지관 공사로 저압 옥내배선을 하는 경우 전동기에 접속하는 부분에서 가요성을 필요로 할 때 사용되는 방폭형 부속품은?",["유연성 부속","분진 방폭형 유연성 부속","분진 유연성 부속","안전 증가 유연성 부속"],2,"분진 방폭형 유연성 부속: 가연성 분진에 전기설비가 발화원이 되어 폭발할 우려가 있는 곳에서 전동기에 접속하는 부분에 가요성이 필요할 때 사용하는 방폭형 부속품"],

[T,"04 정전기와 콘덴서","전하의 성질을 잘못 설명한 것은?",["같은 종류의 전하는 흡인하고 다른 종류의 전하끼리는 반발한다.","대전체에 들어있는 전하를 없애려면 접지시킨다.","대전체의 영향으로 비대전체에 전기가 유도된다.","전하는 가장 안정한 상태를 유지하려는 성질이 있다."],1,"같은 종류의 전하는 반발하고 다른 종류의 전하끼리는 흡인한다."],
[S,"08 특수 장소 공사","한국전기설비규정에 의하여 사람이 상시 통행하는 터널 안 배선의 사용전압이 저압일 때 시설할 수 없는 공사 방법은?",["금속관 공사","금속몰드 공사","케이블 공사","합성수지관 공사"],2,"사용전압이 저압인 터널 안 배선은 합성수지관 공사, 금속관 공사 및 케이블 공사에 의해 시설해야 한다."],

[T,"06 전자유도 법칙과 인덕턴스","누설자속이 발생되기 쉬운 경우는 어느 것인가?",["자로에 공극이 없는 경우","자로의 자속 밀도가 낮은 경우","철심이 자기 포화되어 있는 경우","자기회로의 자기저항이 작은 경우"],3,"누설자속은 자기저항이 큰 경우 많아진다. 자로가 포화되면 자기저항은 커지므로 철심이 자기 포화되어 있는 경우 누설자속이 발생되기 쉽다."],
[S,"07 고압 및 저압 배전반 공사","수·변전 설비의 고압회로에 걸리는 전압을 표시하기 위해 전압계를 시설할 때 고압회로와 전압계 사이에 시설하는 것은?",["수전용 변압기","계기용 변류기","계기용 변압기","권선형 변류기"],3,"계기용 변압기(PT)는 교류 전압 측정을 목적으로 하며 정격 2차 표준전압은 110[V]이다."],

[T,"02 전기회로 해석","R₁=3[Ω], R₂=5[Ω], R₃=6[Ω]의 저항 3개를 그림과 같이 병렬로 접속한 회로에 30[V]의 전압을 가하였다면 이때 R₁ 저항에 흐르는 전류[A]는 얼마인가?",["6","10","15","20"],2,"병렬 연결된 저항에는 각각 30[V]가 인가되므로 I₁=V/R₁=30/3=10[A]","30[V] 전원에 R₁, R₂, R₃가 병렬로 연결된 회로. 각 저항에 전류 I₁, I₂, I₃가 흐르고 전체 전류는 I."],
[S,"05 전선 및 기계기구의 보안공사","한국전기설비규정에 의하여 저압 전로의 중성점에 시설하는 접지도체의 연동선 단면적은 몇 [mm²] 이상이어야 하는가?",["1.5","2.5","6","16"],3,"저압 전로의 중성점에 시설하는 접지도체는 공칭단면적 6[mm²] 이상의 연동선 또는 이와 동등 이상의 세기 및 굵기의 쉽게 부식하지 않는 금속선이어야 한다."],

[T,"01 직류회로","반지름이 5[mm]인 구리선에 10[A]의 전류가 흐르고 있을 때 단위시간당 구리선의 단면을 통과하는 전자의 개수는? (단, 전자의 전하량 e=1.602×10⁻¹⁹[C]이다.)",["6.24×10¹⁷","6.24×10¹⁹","1.28×10²¹","1.28×10²³"],2,"전하 Q=It=ne 이므로 n=(t/e)×I=(1/1.602×10⁻¹⁹)×10=6.24×10¹⁹[개]"],

[S,"05 전선 및 기계기구의 보안공사","한국전기설비규정에 의하여 전로에 시설하는 기계기구의 철대 및 외함에 반드시 접지공사를 해야 하는 경우는?",["사용전압이 교류 대지전압 220[V]인 기계기구를 건조한 곳에 시설하는 경우","사용전압이 직류 300[V]인 기계기구를 건조한 곳에 시설하는 경우","외함을 충전하여 사용하는 기계기구에 사람이 접촉할 우려가 없도록 시설한 경우","철대 또는 외함의 주위에 적당한 절연대를 설치하는 경우"],1,"사용전압이 직류 300[V] 또는 교류 대지전압이 150[V] 이하인 기계기구를 건조한 곳에 시설하는 경우 등은 접지하지 않아도 된다. 대지전압 220[V]는 150[V]를 초과하므로 접지해야 한다."],

[T,"03 전류의 열작용과 화학작용","전류계의 측정 범위를 확대시키기 위하여 전류계와 병렬로 접속하는 것은?",["분류기","검류계","배율기","전위차계"],1,"분류기: 전류계의 측정범위를 확대하기 위해 전류계와 병렬로 접속하는 저항. 배율기는 전압계와 직렬로 접속한다.","전원 V, 전류 I가 흐르는 회로에 전류계(내부저항 r)와 병렬로 분류기 저항 RA가 연결된 그림"],

[G,"04 유도기","다음은 3상 유도 전동기 고정자 권선의 결선도를 나타낸 것이다. 맞는 사항을 고르면?",["3상 2극, Y 결선","3상 4극, Y 결선","3상 2극, Δ 결선","3상 4극, Δ 결선"],2,"전원이 A, B, C상으로 3상이다. C₁과 A₂가 마주 보고, C₂와 A₃가 등지고, C₃와 A₄가 마주 보고, C₄와 A₁이 등지는 상황으로 4극이 형성된다. A₄, B₄, C₄가 모두 연결되어 Y 결선이다.","코일 A₁B₁C₁A₂B₂C₂A₃B₃C₃A₄B₄C₄가 일렬로 놓여 있고 A, B, C 3상 전원에 연결되며 끝 단자 A₄, B₄, C₄가 하나로 묶인 결선도"],
[G,"04 유도기","권선형에서 비례 추이를 이용한 기동법은?",["리액터 기동법","기동 보상기법","2차 저항기동법","Y−Δ 기동법"],3,"권선형 유도 전동기와 같이 2차 회로의 저항을 가감시켜서 슬립을 조정하는 것을 비례 추이라 한다. 기동회전력을 크게 하거나 속도를 제어하는 데 용이하다."],
[S,"06 전선로 및 배전선 공사","사용전압이 35[kV] 이하인 특고압 가공전선과 220[V] 가공전선을 병행설치할 때, 가공선로 간의 이격거리는 몇 [m] 이상이어야 하는가?",["0.5","0.75","1.2","1.5"],3,"35[kV] 이하 특고압 가공전선과 저압 가공전선의 병행설치 간격은 1.2[m] 이상(케이블 사용 시 0.5[m]), 35[kV] 초과 60[kV] 이하는 2[m] 이상(케이블 사용 시 1[m])"],

[S,"03 전선의 접속","박스 내에서 가는 전선을 접속할 때에는 어떤 방법으로 접속하는가?",["트위스트 접속","쥐꼬리 접속","브리타니아 접속","슬리브 접속"],2,"쥐꼬리 접속: 박스나 접속함 내에서 가는 전선을 접속할 때 사용하는 방법"],
[T,"02 전기회로 해석","그림과 같이 R₁, R₂, R₃의 저항 3개가 직·병렬 접속되었을 때 합성저항은?",["R=(R₁+R₂)R₃/(R₁+R₂+R₃)","R=(R₂+R₃)R₁/(R₁+R₂+R₃)","R=(R₁+R₃)R₂/(R₁+R₂+R₃)","R=R₁R₂R₃/(R₁+R₂+R₃)"],1,"R₁과 R₂는 직렬이므로 R₁₂=R₁+R₂, R₁₂와 R₃는 병렬이므로 R=R₁₂R₃/(R₁₂+R₃)=(R₁+R₂)R₃/(R₁+R₂+R₃)","a점과 b점 사이에 R₁, R₂가 직렬로 연결된 위쪽 경로와 R₃가 있는 아래쪽 경로가 병렬로 연결된 회로"],
[S,"02 배선재료와 공구","한국전기설비규정에 의하여 조명용 전등을 아파트 현관에 설치할 경우 최대 몇 분 이내 소등되는 타임스위치를 시설하여야 하는가?",["1분","3분","0.5분","5분"],2,"일반 주택 및 아파트는 3분 이내, 숙박 업소 입구는 1분 이내 소등"],
[S,"06 전선로 및 배전선 공사","연피케이블을 직접 매설식에 의하여 차량 기타 중량물의 압력을 받을 우려가 있는 장소에 시설하는 경우 매설 깊이는 몇 [m] 이상이어야 하는가?",["0.6","0.8","1.0","1.6"],3,"직접 매설식으로 시공할 경우 매설 깊이는 중량물의 압력이 있는 곳은 1.0[m] 이상, 없는 곳은 0.6[m] 이상으로 한다."],
[T,"08 3상 교류회로","평형 3상 회로에서 1상의 소비전력이 P[W]라면, 3상 회로 전체 소비전력[W]은?",["2P","√2P","3P","√3P"],3,"1상의 소비전력이 P이면 3상의 소비전력 P₃상=3×P[W]"],
[T,"06 전자유도 법칙과 인덕턴스","L₁, L₂ 두 코일이 접속되어 있을 때 누설자속이 없는 이상적인 코일 간의 상호 인덕턴스는?",["M=√(L₁+L₂)","M=√(L₁−L₂)","M=√(L₁L₂)","M=√(L₁/L₂)"],3,"누설자속이 없이 두 코일이 상호 영향을 줄 때 상호 인덕턴스는 M=√(L₁L₂)이다. (결합계수 k=1)"],
[T,"04 정전기와 콘덴서","두 콘덴서 C₁, C₂를 직렬연결하고 그 양 끝에 전압을 가한 경우 C₁에 걸리는 전압[V]은?",["C₁/(C₁+C₂)×V","C₂/(C₁+C₂)×V","(C₁+C₂)/C₁×V","(C₁+C₂)/C₂×V"],2,"합성 정전용량 C=C₁C₂/(C₁+C₂), Q=CV, V_C₁=Q/C₁=C₂/(C₁+C₂)×V"],
[S,"09 전기응용 시설 공사","배전선로 공사에서 충전되어 있는 활선을 움직이거나 작업권 밖으로 밀어낼 때, 또는 활선을 다른 장소로 옮길 때 사용하는 활선공구는?",["피박기","활선 커버","데드 엔드 커버","와이어 통"],4,"와이어 통: 충전되어 있는 활선을 움직이거나 작업권 밖으로 밀어낼 때, 또는 활선을 다른 장소로 옮길 때 사용하는 활선공구(절연봉)"],
[S,"05 전선 및 기계기구의 보안공사","간선에서 분기하여 분기 과전류 차단기를 거쳐서 부하에 이르는 사이의 배선을 무엇이라 하는가?",["간선","인입선","중성선","분기회로"],4,"분기회로: 간선에서 분기하여 과전류 차단기를 거치는 구간"],
[S,"02 배선재료와 공구","피시 테이프(Fish Tape)의 용도는?",["전선을 테이핑하기 위해서 사용","전선관의 끝마무리를 위해서 사용","배관에 전선을 넣을 때 사용","합성수지관을 구부릴 때 사용"],3,"피시 테이프(Fish Tape): 전선관에 전선을 넣거나 매달고 당길 때 사용되는 도구이다."],

[G,"02 동기기","동기 전동기의 자기 기동에서 계자 권선을 단락하는 이유는?",["기동이 쉽다.","기동 권선으로 이용하기 용이하다.","고전압 유도에 의한 절연파괴 위험을 방지한다.","전기자 반작용을 방지한다."],3,"기동 시 계자 권선을 열어 두면 권선 수가 많은 계자 회로가 전기자 회전 자계를 끊고 높은 전압을 유기하여 소손될 염려가 있으므로, 계자 회로는 저항을 통해 단락시켜 놓고 기동시켜야 한다."],

[S,"03 전선의 접속","진동이 심한 전기 기계기구의 단자에 전선을 접속할 때 사용되는 것은?",["커플링","압착단자","링 슬리브","스프링 와셔"],4,"진동이 있는 단자에 전선을 접속할 때는 스프링 와셔 또는 이중너트를 사용한다."],
[T,"04 정전기와 콘덴서","쿨롱의 법칙에서 2개의 점전하 사이에 작용하는 정전력의 크기는?",["두 전하의 곱에 비례하고 거리에 반비례한다.","두 전하의 곱에 반비례하고 거리에 비례한다.","두 전하의 곱에 비례하고 거리의 제곱에 비례한다.","두 전하의 곱에 비례하고 거리의 제곱에 반비례한다."],4,"F=(1/4πε₀)×Q₁Q₂/r²[N]"],

[S,"04 옥내 배선 공사","금속관 공사에서 절연 부싱을 사용하는 이유는?",["박스 내에서 전선의 접속을 방지","관이 손상되는 것을 방지","관 끝단에서 전선의 인입 및 교체 시 발생하는 전선의 손상 방지","관의 입구에서 조영재의 접속을 방지"],3,"모든 관 공사 시 부싱은 관 끝단에 설치하여 전선의 피복 훼손 방지를 하기 위한 것이다."],
[S,"05 전선 및 기계기구의 보안공사","피뢰기가 구비해야 할 조건 중 잘못 설명된 것은?",["충격방전 개시전압이 낮을 것","방전내량이 작으면서 제한전압이 높을 것","상용주파 방전개시전압이 높을 것","속류의 차단능력이 충분할 것"],2,"피뢰기의 구비 조건: 상용주파 방전개시전압이 높을 것, 충격방전 개시전압이 낮을 것, 제한전압이 낮을 것, 속류 차단능력이 우수할 것, 내구성이 있을 것, 경제적일 것"],
[T,"06 전자유도 법칙과 인덕턴스","도체가 운동하여 자속을 끊었을 때 기전력의 방향을 알아내는 데 편리한 법칙은?",["렌츠의 법칙","패러데이의 법칙","플레밍의 왼손 법칙","플레밍의 오른손 법칙"],4,"도체가 운동하여 자속을 끊어 유기기전력이 발생할 때 기전력의 방향을 결정하는 법칙은 플레밍의 오른손 법칙이다."],

[T,"06 전자유도 법칙과 인덕턴스","유도기전력은 자신의 발생 원인이 되는 자속의 변화를 방해하려는 방향으로 발생한다. 이것을 유도기전력에 관한 무슨 법칙이라 하는가?",["옴(Ohm)의 법칙","렌츠(Lenz)의 법칙","쿨롱(Coulomb)의 법칙","앙페르(Ampere)의 법칙"],2,"e=−N dφ/dt 에서 (−)는 렌츠의 법칙으로 유기기전력의 방향을 결정한다. 자속 φ의 변화를 반대하는 방향으로 유기기전력이 발생한다."],

[S,"07 고압 및 저압 배전반 공사","22.9[kV−Y] 이하의 배전선로에서 수전하는 설비의 피뢰기 정격전압은 몇 [kV]를 적용하는가?",["288[kV]","144[kV]","24[kV]","18[kV]"],4,"공칭전압 22.9[kV]의 선로용 피뢰기 정격전압은 18[kV]이다. (변전소는 21[kV])"],

[S,"04 옥내 배선 공사","교류 전등 공사에서 금속관 내에 전선을 넣어 연결한 방법 중 옳은 것은? (그림 ①~④ 중 선택)",["그림 ①","그림 ②","그림 ③","그림 ④"],3,"교류 전등 공사에서 금속관 내에 전선을 넣어 연결할 경우 전자적 불평형이 생기지 않도록 하나의 배관에 하나의 부하(왕복 전선 두 가닥 모두)를 연결하여야 한다. 정답은 ③번이다.","네 가지 배선 그림. ①은 왕복 전선을 각각 다른 금속관에 넣음, ②도 마찬가지로 분리됨, ③은 하나의 금속관에 왕복 전선(전원선과 스위치 쪽 선)이 함께 들어감, ④는 부하가 2개 나뉘어 연결됨."],
[T,"02 전기회로 해석","저항 10개를 접속하여 가장 작은 합성저항값을 얻으려면 어떻게 접속하여야 하는가?",["직렬","병렬","직렬−병렬","병렬−직렬"],2,"저항 r[Ω]을 병렬로 n개 연결하면 합성저항은 R=r/n[Ω]로 작아진다."],
[T,"02 전기회로 해석","두 개의 저항 R₁, R₂를 병렬 접속하면 합성저항은?",["1/(R₁+R₂)","R₁/(R₁+R₂)","R₁R₂/(R₁+R₂)","R₂/(R₁+R₂)"],3,"1/R=1/R₁+1/R₂ → R=R₁R₂/(R₁+R₂)"],
[T,"04 정전기와 콘덴서","그림의 브리지 회로에서 평형이 되었을 때의 Cx는? (R₁=200[Ω], R₂=50[Ω], Cs=0.1[μF])",["0.1[μF]","0.2[μF]","0.3[μF]","0.4[μF]"],4,"휘트스톤 브리지 평형: R₁/(jωCx)=R₂/(jωCs) → R₁/Cx=R₂/Cs → 200/Cx=50/0.1 → Cx=20/50=0.4[μF]","마름모형 브리지. 위쪽 변은 R₂=50[Ω]과 Cx, 아래쪽 변은 R₁=200[Ω]과 Cs=0.1[μF], 가운데 검류계 D, 아래에 전원."],
[S,"02 배선재료와 공구","조명용 전등을 호텔 또는 여관 객실의 입구나 일반 주택 및 아파트 각 실의 현관에 설치할 때 사용되는 스위치는 무엇인가?",["로터리 스위치","누름버튼 스위치","타임 스위치","토글 스위치"],3,"타임 스위치: 정해진 시간에 자동으로 흐르거나 끊어지게 하는 스위치로 현관 등 전기 장치에 많이 사용"],
[G,"03 변압기","용량이 200[kVA]인 단상 변압기 3대를 Δ 결선으로 운전 중 1대가 고장이 나서 V 결선으로 운전하는 경우의 출력은 약 몇 [kVA]인가?",["346[kVA]","200[kVA]","600[kVA]","400[kVA]"],1,"V 결선 출력 PV=√3P=√3×200≒346[kVA]"],
[S,"06 전선로 및 배전선 공사","전주의 길이가 16[m]이고, 설계하중이 6.8[kN] 이하의 철근 콘크리트주를 시설할 때 땅에 묻히는 깊이는 몇 [m] 이상이어야 하는가?",["1.2","1.4","2.0","2.5"],4,"전주의 길이가 16[m] 이하이고 설계하중이 6.8[kN] 이하인 경우, 땅에 묻히는 깊이는 2.5[m] 이상이어야 한다."],
[G,"03 변압기","3상 변압기의 병렬운전 시 병렬운전이 불가능한 결선 조합은?",["Δ−Δ와 Y−Y","Δ−Δ와 Δ−Y","Δ−Y와 Δ−Y","Δ−Δ와 Δ−Δ"],2,"병렬운전 불가능 조합: Δ−Δ와 Δ−Y, Y−Y와 Δ−Y (Δ나 Y의 개수가 각각 짝수를 이루어야 한다.)"],
[T,"05 자기 성질과 자기장","평균 반지름이 10[cm]이고 감은 횟수 10회의 원형 코일에 5[A]의 전류를 흐르게 하면 코일 중심의 자장의 세기[AT/m]는?",["250","500","750","1,000"],1,"H=NI/2r=10×5/(2×10×10⁻²)=250[AT/m]"],
[S,"09 전기응용 시설 공사","천장에 작은 구멍을 뚫어 그 속에 등기구를 매입시키는 방식으로 건축의 공간을 유효하게 하는 조명방식은?",["코브 방식","코퍼 방식","밸런스 방식","다운라이트 방식"],4,"다운라이트 방식: 천장에 작은 구멍을 뚫고 그 속에 광원을 넣고 매입하는 방식으로, 용도에 따라 다운라이트, 다운스포트로 구분한다."],
[T,"01 직류회로","고유저항 ρ의 단위로 맞는 것은?",["[Ω]","[Ω·m]","[AT/Wb]","[Ω⁻¹]"],2,"R=ρl/A 에서 ρ=RA/l[Ω·m²]/[m]=[Ω·m]"],
[G,"01 직류기","직류 직권발전기가 정격전압 V=400[V], 출력 P=10[kW]로 운전되고 전기자 저항 Ra와 직권 계자저항 Rs가 모두 0.1[Ω]일 경우, 유도 기전력[V]은? (단, 정류자의 접촉저항은 무시한다.)",["393","405","415","423"],2,"Ia=P/V=10×10³/400=25[A], E=V+Ia(Ra+Rs)=400+25×(0.1+0.1)=405[V]"],
[T,"04 정전기와 콘덴서","Q₁[C]으로 대전된 용량 C₁[F]의 콘덴서에 용량 C₂[F]를 병렬연결할 경우 C₂가 분배받는 전기량 Q₂[C]는? (단, V₁[V]은 콘덴서 C₁이 Q₁으로 충전되었을 때 C₁의 양단 전압이다.)",["Q₂=(C₁+C₂)/C₂×V₁","Q₂=C₂/(C₁+C₂)×V₁","Q₂=(C₁+C₂)/C₁×V₁","Q₂=C₁C₂/(C₁+C₂)×V₁"],4,"전체 전하량 Q=Q₁=C₁V₁, 병렬 합성용량 C=C₁+C₂, V=Q/(C₁+C₂), Q₂=C₂V=C₁C₂/(C₁+C₂)×V₁[C]"],
[S,"06 전선로 및 배전선 공사","지중 전선로를 직접 매설식에 의하여 시설하는 경우 차량, 기타 중량물의 압력을 받을 우려가 있는 장소의 매설 깊이[m]는?",["0.6[m] 이상","1.0[m] 이상","1.5[m] 이상","2.0[m] 이상"],2,"지중 전선로를 직접 매설식으로 시설할 때 매설 깊이는 차량 기타 중량물의 압력을 받을 우려가 있는 장소에는 1.0[m] 이상, 기타 장소에는 60[cm] 이상으로 한다."],
[T,"04 정전기와 콘덴서","다음 회로의 합성 정전용량[μF]은?",["5","4","3","2"],4,"병렬 부분 C=2+4=6[μF], 3[μF]과 6[μF]은 직렬이므로 C=3×6/(3+6)=2[μF]","a단자 쪽에 3[μF]이 직렬로 연결되고, 그 뒤에 2[μF]과 4[μF]이 병렬로 연결되어 b단자로 이어지는 회로"],
[T,"04 정전기와 콘덴서","쿨롱의 법칙에서 2개의 점전하 사이에 작용하는 정전력의 크기는?",["두 전하의 곱에 비례하고 거리에 반비례한다.","두 전하의 곱에 반비례하고 거리에 비례한다.","두 전하의 곱에 비례하고 거리의 제곱에 비례한다.","두 전하의 곱에 비례하고 거리의 제곱에 반비례한다."],4,"F=(1/4πε₀)×Q₁Q₂/r²[N]"],
[G,"05 정류기 및 제어기기","VVVF(Variable Voltage Variable Frequency)는 어떤 전동기의 속도 제어에 사용되는가?",["직류 타여자 전동기","동기 전동기","유도 전동기","직류 분권 전동기"],3,"VVVF(가변전압 가변 주파수)는 유도형 모터에 대하여 속도 제어를 하는 장치이다. Ns=120f/p 에서 주파수를 가변하여 속도를 제어한다."],
[S,"02 배선재료와 공구","금속관 절단구에 대한 다듬기에 쓰이는 공구는?",["리머","홀소우","프레셔 툴","파이프 렌치"],1,"리머: 금속관을 쇠톱이나 커터로 자른 다음, 관 안에 날카로운 것을 다듬는 것"],
[T,"03 전류의 열작용과 화학작용","저항이 10[Ω]인 도체에 1[A]의 전류를 10분간 흘렸다면 발생하는 열량은 몇 [kcal]인가?",["0.62","1.44","4.46","6.24"],2,"H=0.24I²Rt=0.24×1²×10×10×60=1,440[cal]=1.44[kcal]"],
[G,"03 변압기","부흐홀츠 계전기의 설치 위치는?",["콘서베이터 내부","변압기의 고압 측 부싱","변압기 주탱크 내부","변압기 본체와 콘서베이터 사이"],4,"부흐홀츠 계전기는 변압기의 주 탱크와 콘서베이터 사이에 설치된다. 절연유의 온도 상승 시 발생하는 유증기를 검출하여 권선 단락, 철심 고정 볼트의 절연 열화, 탭 전환기의 고장 등을 경보 및 차단하기 위한 용도로 사용된다."],
[G,"02 동기기","동기속도 30[rps]인 교류발전기 기전력의 주파수가 60[Hz]가 되려면 극수는 얼마인가?",["2","4","6","8"],2,"Ns=2f/p[rps] → p=2f/Ns=2×60/30=4극"],
[S,"04 옥내 배선 공사","제1종 가요전선관을 구부릴 경우 곡률 반지름은 관 안지름의 몇 배 이상으로 하여야 하는가?",["3배","4배","6배","8배"],3,"제1종 가요전선관을 구부릴 경우 곡선(곡률) 반지름은 관 안지름의 6배 이상으로 하여야 한다."],
[S,"08 특수 장소 공사","전기울타리용 전원장치에 전원을 공급하는 전로의 사용전압은 몇 [V] 이하이어야 하는가?",["400","250","200","150"],2,"전기울타리용 전원 장치에 전기를 공급하는 전로의 사용전압은 250[V] 이하이어야 한다."],
[T,"06 전자유도 법칙과 인덕턴스","자기 인덕턴스가 L₁, L₂이고 상호 인덕턴스가 M일 때, 일반적인 자기 결합 상태에서 결합계수 k는?",["k<0","0<k<1","k>1","k=1"],2,"결합계수 k=M/√(L₁L₂). 일반적인 결합 시 0<k<1, 미결합 시 k=0, 완전 결합 시 k=1"],
[G,"01 직류기","직류 전동기의 출력이 50[kW], 회전수가 1,800[rpm]일 때 토크는 약 몇 [kg·m]인가?",["12","23","27","31"],3,"τ=(1/9.8)×60/(2π)×Po/N=(1/9.8)×60×50×10³/(2π×1,800)≒27[kg·m]"],
[G,"05 정류기 및 제어기기","다음 중 정류 소자가 아닌 것은?",["GTO","SCR","LED","IGBT"],3,"GTO, SCR, IGBT는 정류·제어 소자이다. LED(발광 다이오드)는 일정 전류를 흐르게 하면 빛을 내는 소자로 정류 소자가 아니다."],
[G,"02 동기기","동기기의 전기자 권선법이 아닌 것은?",["전절권","분포권","2층권","중권"],1,"동기기의 전기자 권선법은 2층권, 중권, 분포권, 단절권이다."],
[S,"07 고압 및 저압 배전반 공사","수전 설비의 저압 배전반은 배전반 앞에서 계측기를 판독하기 위하여 앞면과 최소 몇 [m] 이상 유지하는 것을 원칙으로 하고 있는가?",["2.5[m]","1.8[m]","1.5[m]","1.7[m]"],3,"기기별 최소 유지 거리: 저압 배전반 앞면 또는 조작 계측면 1.5[m], 고압 배전반 1.5[m], 특고압반 1.7[m], 변압기 등 0.6[m]"],
];

[T,"03 전류의 열작용과 화학작용","줄의 법칙에서 발열량 계산식을 옳게 나타낸 것은?",["H=0.24I²R²[cal]","H=0.24I²Rt[cal]","H=0.24I²R[cal]","H=0.24I²R²t[cal]"],2,"줄의 법칙은 전류가 저항체에 흐를 때 저항체에서 발생하는 발열량과의 관계를 나타내는 법칙으로 열량 H=0.24I²Rt[cal]이다."],
[S,"05 전선 및 기계기구의 보안공사","접지저항 저감 대책이 아닌 것은?",["접지봉의 연결 개수를 증가시킨다.","접지판의 면적을 감소시킨다.","접지극을 깊게 매설한다.","토양의 고유저항을 화학적으로 저감시킨다."],2,"접지판의 면적이 클수록 접지저항이 저감된다."],
[G,"05 정류기 및 제어기기","다음 중 트라이액(TRIAC)의 기호는?",["DIAC","SCR","TRIAC","UJT"],3,"TRIAC은 쌍방향성 3단자 사이리스터로 게이트 단자가 있는 양방향 기호이다.","①DIAC ②SCR ③TRIAC ④UJT 기호 4개를 보기로 제시."],
[G,"05 정류기 및 제어기기","스위칭 주기 10[μs], 온(ON)시간 5[μs]일 때 강압형 초퍼의 출력 전압 E₂와 입력 전압 E₁의 관계는?",["E₂=3E₁","E₂=2E₁","E₂=E₁","E₂=0.5E₁"],4,"출력 전압 E₂=DE₁에서 듀티비 D=Ton/Ts=5/10=0.5 ∴ E₂=0.5×E₁"],

[T,"07 교류회로","v=5+j2[V], i=4−j2[A]일 때 무효전력[Var]은?",["12","16","18","24"],3,"피상전력 Pa=v·i=(5+j2)×(4+j2)=16+j18[VA]. 무효전력은 18[Var]이다."],
[G,"03 변압기","동기기에서 사용되는 절연재료로 B종 절연물의 온도 상승 한도는 약 몇 [℃]인가?(단, 기준온도는 공기 중에서 40[℃]이다.)",["65","75","90","120"],3,"B종 절연물의 최고허용온도는 130[℃]이므로 기준온도 40[℃]를 빼면 온도 상승 한도는 90[℃]가 된다. (Y종 90, A종 105, E종 120, B종 130, F종 155, H종 180, C종 180 초과)"],
[G,"01 직류기","워드 레오나드 방식의 목적은?",["계자 자속 조정","토크 조정","속도 제어","병렬 운전"],3,"워드 레오나드 방식은 타여자 전동기의 전압 제어에 주로 이용되는 속도 제어 방식이다. 광범위한 속도 조정을 원활하고 효율적으로 할 수 있다. 다만, 속도 변동률이 적고 가격적으로 가장 우수한 속도 제어법이나 설비비가 많이 드는 단점이 있다."],
[S,"04 옥내 배선 공사","버스덕트 공사에서 도중에 부하를 접속할 수 있도록 제작한 덕트는?",["피더 버스덕트","플러그인 버스덕트","트롤리 버스덕트","이동 부하 버스덕트"],2,"플러그인 버스덕트: 도중에 부하를 접속할 수 있도록 부하 접속용 꽂음 플러그를 만든 버스덕트"],
[S,"07 고압 및 저압 배전반 공사","수변전설비에 사용하는 차단기 중 가스차단기에 들어가는 가스는?",["CO₂","LPG","SF₆","LNG"],3,"가스차단기에 사용되는 가스는 SF₆(육불화황)를 사용하고 있다."],
[T,"07 교류회로","전압의 순시값이 v=100√2 sin(ωt+π/4)[V]인 경우 복소수로 알맞게 표현한 것은?",["100+j100","50√2+j50√2","100−j100","50√2−j50√2"],2,"극좌표 형식 V=100∠π/4[V]. 삼각함수 형식으로 V=100(cos π/4+j sin π/4)=100(1/√2+j1/√2)=50√2+j50√2[V]"],

[G,"05 정류기 및 제어기기","반도체 내에서 정공은 어떻게 생성되는가?",["결합전자의 이탈","자유전자의 이동","접합 불량","확산 용량"],1,"진성반도체(4가 원자)에 불순물(3가 원자)을 첨가하면 공유 결합을 해서 전자 1개의 정공이 생성된다. 즉, 결합 자유전자의 이탈에 의하여 생성된다."],
[S,"04 옥내 배선 공사","합성수지관을 새들 등으로 지지하는 경우 지지점 간의 거리는 몇 [m] 이하인가?",["1.5","2.0","2.5","3.0"],1,"배관의 지지점 사이의 거리는 1.5[m] 이하로 하고, 관과 관, 관과 박스의 접속점 및 관 끝은 각각 가까운 거리(300[mm]) 이내에 지지한다.","합성수지관 배관 그림: 지지점 간 거리 1.5[m] 이하, 접속점 30[cm] 이하 등 치수 표시."],

[T,"06 전자유도 법칙과 인덕턴스","자기 인덕턴스가 각각 L₁과 L₂인 2개의 코일이 직렬로 가동접속되었을 때, 합성 인덕턴스를 나타낸 식은?(단, 자기력선에 의한 영향을 서로 받는 경우이다.)",["L=L₁+L₂−M","L=L₁+L₂−2M","L=L₁+L₂+M","L=L₁+L₂+2M"],4,"자기력선에 의한 영향을 서로 받는 경우 상호 인덕턴스 M. 두 코일을 직렬 가동접속 시 전체 인덕턴스 L=L₁+L₂+2M"],
[G,"02 동기기","동기 발전기의 무부하 포화 곡선에 대한 설명으로 옳은 것은?",["정격전류와 단자전압의 관계이다.","정격전류와 정격전압의 관계이다.","계자전류와 정격전압의 관계이다.","계자전류와 단자전압의 관계이다."],4,"무부하에서 자속은 계자전류에 의해서만 정해지는데 무부하 유기 기전력(단자전압)과 계자전류의 관계 곡선이 동기 발전기의 무부하 포화 곡선이다.","가로축 계자전류 If, 세로축 E. 원점 O에서 직선(공극선 P)과 곡선(포화곡선 M)이 그려지고 b에서 수평선이 곡선(c)과 직선(a)과 만남."],
[S,"08 특수 장소 공사","옥내에 시설하는 저압의 이동전선에서 사용하는 캡타이어 케이블의 최소 단면적은?",["0.75[mm²]","1[mm²]","1.5[mm²]","2.5[mm²]"],1,"조명용 전원코드 또는 이동전선은 단면적 0.75[mm²] 이상의 코드 또는 캡타이어케이블을 사용해야 한다."],
[S,"07 고압 및 저압 배전반 공사","다음 ( ) 안에 들어갈 알맞은 말은? '뱅크(Bank)란 전로에 접속된 변압기 또는 ( )의 결선상 단위를 말한다.'",["콘덴서","조상기","피뢰기","차단기"],1,"뱅크(Bank)란 전로에 접속된 변압기 또는 콘덴서의 결선상 단위이다."],
[G,"04 유도기","유도 전동기의 동기속도 Ns, 회전속도 N일 때 슬립은?",["s=(Ns−N)/N","s=(N−Ns)/N","s=(Ns−N)/Ns","s=(Ns+N)/Ns"],3,"유도 전동기에서 슬립이란 회전자계 속도인 동기속도와 회전자 속도의 관계이다. 슬립 s=(Ns−N)/Ns"],
[T,"05 자기 성질과 자기장","비오-사바르(Biot-Savart)의 법칙과 가장 관계가 깊은 것은?",["전류가 만드는 자장의 세기","전류와 전압의 관계","기전력과 자계의 세기","기전력과 자속의 변화"],1,"비오-사바르 법칙은 유한한 전선에 전류가 흐를 때 주변 자계(자기장)의 세기를 구하는 법칙이다."],

[S,"06 전선로 및 배전선 공사","고압 가공전선이 도로를 횡단하는 경우 전선의 지표상 최소 높이는 몇 [m]인가?",["3","4","5","6"],4,"저압 및 고압 가공 전선의 높이: 도로 횡단의 경우 지표상 6[m] 이상, 철도 횡단의 경우 레일면상 6.5[m] 이상"],
[G,"04 유도기","유도 전동기에서 원선도 작성 시 필요하지 않은 시험은?",["무부하 시험","구속 시험","저항 측정 시험","슬립 측정 시험"],4,"원선도 작성에 필요한 시험으로는 저항 측정 시험, 무부하 시험, 구속 시험 등이 있다."],
[S,"03 전선의 접속","알루미늄전선의 접속 방법으로 적합하지 않은 것은?",["직선 접속","분기 접속","종단 접속","트위스트 접속"],4,"트위스트 접속: 구리(동)전선의 접속 방법으로 단면적 6[mm²] 이하의 가는 단선을 접속할 때 사용한다."],

[G,"04 유도기","슬립 4[%]인 유도전동기의 등가 부하저항은 2차 저항의 몇 배인가?",["5","19","20","24"],4,"등가 저항 R=r₂(1−s)/s=r₂×(1−0.04)/0.04=24r₂"],

[S,"04 옥내 배선 공사","노출장소 또는 점검 가능한 은폐장소에서 제2종 가요전선관을 시설하고 제거하는 것이 부자유하거나 점검 불가능한 경우의 곡률 반지름은 안지름의 몇 배 이상으로 하여야 하는가?",["2","3","5","6"],4,"2종 가요전선관: 노출장소 또는 점검 가능한 장소에서 시설 제거가 자유로운 경우 관 안지름의 3배 이상, 노출장소 또는 점검이 가능한 은폐장소에서 시설하고 제거하는 것이 부자유하거나 점검이 불가능할 경우 관 안지름의 6배 이상으로 한다."],
[G,"03 변압기","일정 전압 및 일정 파형에서 주파수가 상승하면 변압기 철손은 어떻게 변하는가?",["증가한다.","감소한다.","불변이다.","증가하다 감소한다."],2,"Bm=E/(4.44fNS)이므로 전압이 일정한 경우 B∝1/f. 주파수가 상승하면 와류손은 불변이고 히스테리시스손이 감소하므로 철손이 감소한다."],
[G,"02 동기기","전기자 반작용에 의한 중성점의 이동각 θ의 2θ 범위 내의 반작용은?",["증자작용","감자작용","편자작용","교차자화작용"],2,"기하학적 중성축을 중심으로 2θ의 범위에 있는 전기자 권선의 기자력은 계자 기자력의 방향과 반대 방향의 기자력으로 감자작용이다. 180−2θ=β라 할 때 β의 범위에 있는 권선의 기자력은 교차 자화작용이다."],
[T,"04 정전기와 콘덴서","정전용량 C₁, C₂를 병렬로 접속하였을 때의 합성 정전용량은?",["C₁+C₂","1/(C₁+C₂)","1/C₁+1/C₂","C₁C₂/(C₁+C₂)"],1,"콘덴서를 병렬로 접속하였을 때의 합성 정전용량은 각 정전용량을 합한 값이다. 즉 C₁+C₂이다."],
[T,"07 교류회로","각주파수 ω=100π[rad/s]일 때 주파수 f[Hz]는?",["20","30","40","50"],4,"ω=2πf이므로 f=ω/2π=100π/2π=50[Hz]"],
[G,"03 변압기","낮은 전압을 높은 전압으로 승압할 때 일반적으로 사용되는 변압기의 3상 결선 방식은?",["Δ-Δ 결선","Δ-Y 결선","Y-Y 결선","Y-Δ 결선"],2,"Δ-Y 결선은 발전소용 변압기와 같이 낮은 전압을 높은 전압으로 올리는 승압용 변압기에 사용. Y-Δ 결선은 수전단 변전소용 변압기와 같이 높은 전압을 낮은 전압으로 강압하는 경우에 사용"],

[S,"04 옥내 배선 공사","애자 공사에서 전선 상호 간의 간격은 몇 [cm] 이상이어야 하는가?",["4","5","6","8"],3,"전선 상호 간의 간격은 6[cm] 이상일 것. 전선과 조영재 사이의 간격은 사용 전압이 400[V] 이하인 경우 2.5[cm] 이상, 400[V] 초과인 경우 4.5[cm](건조한 장소 2.5[cm]) 이상일 것","애자 공사 그림: 전선 상호 간격 6[cm] 이상, 조영재와 2.5[cm] 이상, 지지점 간격 2[m] 이하."],
[S,"03 전선의 접속","접착력은 떨어지나 절연성, 내온성, 내유성이 좋아 연피케이블 접속에 사용되는 테이프는?",["고무 테이프","리노 테이프","비닐 테이프","자기 융착 테이프"],2,"리노 테이프: 접착성은 없으나 절연성, 내온성, 내유성이 있어서 연피케이블 접속 시 사용한다."],
[G,"05 정류기 및 제어기기","다음 사이리스터 중 3단자 형식이 아닌 것은?",["SCR","GTO","DIAC","TRIAC"],3,"SCR은 PNPN 4층 구조의 대표적인 3단자 소자이다. GTO는 게이트에 역방향으로 전류를 흘리면 자기 소호하는 3단자 사이리스터이다. DIAC는 다이오드 2개를 역병렬로 접속한 것과 등가인 2단자 트리거 소자이다. TRIAC은 쌍방향성 3단자 사이리스터이다."],

[T,"06 전자유도 법칙과 인덕턴스","자체 인덕턴스 40[mH]의 코일에서 0.2초 동안에 10[A]의 전류가 변화하였다. 코일에 유도되는 기전력[V]은?",["1","2","3","4"],2,"V=L·di/dt=40×10⁻³×10/0.2=2[V]"],
[G,"04 유도기","유도 전동기에서 슬립이 1이면 전동기의 속도 N은?",["동기속도보다 빠르다.","정지한다.","불변이다.","동기속도와 같다."],2,"슬립 s=1이면 N=0으로 전동기는 정지 상태이다. s=0이면 N=Ns가 되어 동기속도로 회전하는 이상적인 무부하 상태가 된다."],
[T,"05 자기 성질과 자기장","전류에 의해 만들어지는 자기장의 자기력선 방향을 간단하게 알아내는 방법은?",["플레밍의 왼손 법칙","렌츠의 자기유도 법칙","앙페르의 오른나사 법칙","패러데이의 전자유도 법칙"],3,"앙페르의 오른나사 법칙: 전류에 의해 만들어지는 자기장의 방향을 결정하는 법칙. 플레밍의 오른손 법칙은 유도기전력 방향, 왼손 법칙은 힘의 방향, 렌츠의 법칙은 유기기전력의 방향 결정, 패러데이는 유기기전력의 크기 법칙이다."],
