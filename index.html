[G,"02 동기기","동기 발전기의 병렬운전 조건이 아닌 것은?",["유도기전력의 크기가 같을 것","동기 발전기의 용량이 같을 것","유도기전력의 위상이 같을 것","유도기전력의 주파수가 같을 것"],2,"동기 발전기의 병렬운전 조건: 기전력의 크기, 위상, 주파수, 파형이 같을 것"],
[G,"02 동기기","2대의 동기 발전기 A, B가 병렬 운전하고 있을 때 A기의 여자전류를 증가시키면 어떻게 되는가?",["A기의 역률은 낮아지고 B기의 역률은 높아진다.","A기의 역률은 높아지고 B기의 역률은 낮아진다.","A, B 양 발전기의 역률이 높아진다.","A, B 양 발전기의 역률이 낮아진다."],1,"여자전류가 증가된 발전기는 기전력이 커지므로 무효 순환전류가 발생하여 무효분의 값이 증가된다. 따라서 A기의 역률은 낮아지고 B기의 역률은 높아진다."],
[S,"02 배선재료와 공구","전선의 슬리브 접속에 있어서 펜치와 같이 사용되고 금속관 공사에서 로크 너트를 죌 때 사용하는 공구의 이름은?",["펌프 플라이어(Pump plier)","히키(Hickey)","비트 익스텐션(Bit extension)","클리퍼(Clipper)"],1,"펌프 플라이어: 로크 너트, 너트 등을 죌 때 사용하는 기구로 쉘라라고도 한다."],
[T,"07 교류회로","RL 직렬회로에 교류전압 v=Vm sin(ωt+θ)[V]를 가했을 때 회로의 위상각 θ를 나타낸 것은?",["θ=tan⁻¹(R/ωL)","θ=tan⁻¹(ωL/R)","θ=tan⁻¹(1/RωL)","θ=tan⁻¹(R/√(R²+(ωL)²))"],2,"RL 직렬회로 임피던스 Z=√(R²+XL²), 위상각 θ=tan⁻¹(ωL/R)이다.","직각삼각형 임피던스도: 빗변 Z=√(R²+XL²), 밑변 R, 높이 XL=ωL, 밑각 θ."],
[T,"02 전기회로 해석","6[Ω], 8[Ω], 9[Ω]의 저항 3개를 직렬로 접속한 회로에 5[A]의 전류를 흘릴 때 회로에 공급한 전압[V]은?",["125","115","100","85"],2,"합성저항 R=6+8+9=23[Ω]. V=23×5=115[V]"],
[S,"04 옥내 배선 공사","단상 3선식의 불평형률은 몇 [%]를 넘지 않아야 하는가?",["20","30","40","50"],3,"단상 3선식의 불평형률은 40[%]를 넘지 않아야 한다. 3상 3선식 또는 3상 4선식의 불평형률은 30[%]를 넘지 않아야 한다."],
[G,"04 유도기","동기 와트 P₂, 출력 Po, 슬립 s, 동기속도 Ns, 회전속도 N, 2차 동손 Pc2일 때 2차 효율 표기로 틀린 것은?",["1−s","Pc2/P2","Po/P2","N/Ns"],2,"2차 효율 η₂=Po/P₂=1−s=N/Ns. Pc2/P₂는 슬립 s이다."],
[T,"02 전기회로 해석","R₁=3[Ω], R₂=5[Ω], R₃=6[Ω]의 저항 3개를 그림과 같이 병렬로 접속한 회로에 30[V]의 전압을 가하였다면 이때 R₁ 저항에 흐르는 전류[A]는 얼마인가?",["6","10","15","20"],2,"전압은 병렬 연결된 각 저항에 30[V]가 인가되므로 R₁에 흐르는 전류 I₁=V/R₁=30/3=10[A]","R₁, R₂, R₃가 위아래로 나란히 병렬 연결되고 아래쪽에 전원 V가 연결됨. 각 저항 전류 I₁, I₂, I₃, 전체 전류 I."],
[T,"04 정전기와 콘덴서","유전율 ε의 유전체 내에 있는 전하 Q[C]에서 나오는 전기력선 수는?",["Q","Q/ε₀","Q/ε","Q/εs"],3,"전하 Q[C]에서 나오는 전기력선 수 N=Q/ε[개]"],
[S,"06 전선로 및 배전선 공사","지선의 중간에 넣는 애자의 명칭은?",["구형 애자","곡핀 애자","인류 애자","핀애자"],1,"지선의 중간에 사용하는 애자를 구형 애자, 지선 애자, 옥애자, 구슬 애자라고 한다."],
[G,"03 변압기","부흐홀츠 계전기의 설치 위치로 가장 적당한 곳은?",["콘서베이터 내부","변압기 고압 측 부싱","변압기 주 탱크 내","변압기 주 탱크와 콘서베이터 사이"],4,"부흐홀츠 계전기는 변압기 내부 고장 보호용으로 사용되며 변압기의 주 탱크와 콘서베이터 사이에 설치한다. 절연유의 온도 상승 시 발생하는 유증기를 검출하여 권선 단락, 철심 고정 볼트의 절연 열화, 탭 전환기의 고장 등을 경보 및 차단하기 위한 용도로 사용된다."],
[S,"02 배선재료와 공구","피시 테이프(Fish Tape)의 용도는?",["전선을 테이핑하기 위해서 사용","전선관의 끝마무리를 위해서 사용","배관에 전선을 넣을 때 사용","합성수지관을 구부릴 때 사용"],3,"피시 테이프: 전선관에 전선을 넣거나 매달고 당길 때 사용되는 도구이다."],
[T,"07 교류회로","임피던스 Z=r+jx이고 Y=g+jb로 표현할 경우 서셉턴스를 표현한 것은?",["r","g","x","b"],4,"임피던스 Z=r+jx(r: 저항, x: 리액턴스), 어드미턴스 Y=g+jb(g: 컨덕턴스, b: 서셉턴스)"],
[S,"03 전선의 접속","일반적으로 정크션 박스 내에서 사용되는 전선 접속 방식은?",["슬리브","코드노트","코드파스너","와이어 커넥터"],4,"정크션 박스 내에서 전선을 접속할 경우 와이어 접속기(커넥터)를 사용하여 접속하여야 한다."]
];

EX[18]=[
[T,"02 전기회로 해석","저항 10[Ω]과 15[Ω]의 병렬 회로에서 30[V]의 전압을 가할 때 15[Ω]에 흐르는 전류[A]는?",["1","2","3","4"],2,"저항이 병렬로 연결되면 각각의 저항에 걸리는 전압은 30[V]이므로 15[Ω]에 흐르는 전류 I=30/15=2[A]","10[Ω]과 15[Ω] 저항이 병렬로 연결되고 30[V] 전원이 가해진 회로"],
[G,"01 직류기","직류 발전기의 무부하 포화 곡선과 관계되는 것은 어느 것인가?",["단자전압과 여자전류","단자전압과 부하전류","유도기전력과 계자전류","부하전류와 회전속도"],3,"무부하 포화 곡선은 정격속도 n이 일정하고 무부하 상태 즉, 전류 I=0인 경우 계자전류 If와 유기기전력 E의 관계를 나타낸 것으로 모든 특성 곡선의 기초가 되는 특성 곡선이다."],
[G,"03 변압기","1대의 출력이 100[kVA]인 단상 변압기 2대로 V결선하여 3상 전력을 공급할 수 있는 최대전력은 몇 [kVA]인가?",["100","100√2","100√3","200"],3,"단상 변압기 2대 V결선 출력 Pv=√3P[kVA](실제 출력) ∴ √3×100=100√3[kVA]"],
[S,"09 전기응용 시설 공사","천장에 작은 구멍을 뚫어 그 속에 등기구를 매입시키는 방식으로 건축의 공간을 유효하게 하는 조명방식은?",["코브 방식","코퍼 방식","밸런스 방식","다운라이트 방식"],4,"다운라이트 방식: 천장에 작은 구멍을 뚫고 그 속에 광원을 넣고 매입하는 방식으로 용도에 따라 다운라이트, 다운스포트로 구분하며 광원으로는 백열등, 할로겐램프 등을 사용한다."],
[T,"07 교류회로","R-L-C 직렬 공진 시의 주파수 f[Hz]는?",["1/(2πLC)","1/(2π√(LC))","3πfLC","2π√(LC)"],2,"공진조건 ωL=1/(ωC)이므로 2πfL=1/(2πfC) ∴ 공진주파수 f=1/(2π√(LC))[Hz]"],
[T,"02 전기회로 해석","\"임의의 폐회로에서의 기전력 총합은 회로소자에서 발생하는 전압강하의 총합과 같다.\"라고 정의되는 법칙은?",["키르히호프의 제1법칙","키르히호프의 제2법칙","플레밍의 오른손 법칙","앙페르의 오른나사 법칙"],2,"키르히호프 제2(전압)법칙: 폐회로의 모든 기전력의 총합과 회로소자의 전압강하의 총합은 같다. 제1(전류)법칙은 접합점으로 들어온 전류와 나가는 전류의 합이 같다는 법칙이다."],
[S,"06 전선로 및 배전선 공사","저압 인입선의 접속점 선정으로 잘못된 것은?",["인입선이 옥상을 가급적 통과하지 않도록 시설할 것","인입선은 약전류 전선로와 가까이 시설할 것","인입선은 장력에 충분히 견딜 것","가공배전선로에서 최단거리로 인입선이 시설될 수 있을 것"],2,"저압 인입선은 전자파 장해를 방지하기 위해 약전류 전선로와 간격(이격거리)을 두어야 한다."],
[S,"08 특수 장소 공사","가연성 분진이 존재하는 곳에 저압 옥내 배선을 할 때 다음 중 배선의 방법이 옳지 않은 것은?",["합성수지관 공사","금속관 공사","3종 캡타이어 케이블 공사","CD 케이블 공사"],3,"3종 캡타이어 케이블은 화재의 위험이 있어 가연성 먼지(분진)가 있는 곳에는 사용할 수 없다."],
[G,"02 동기기","다음 그림은 동기 발전기의 무부하 포화 곡선을 나타낸 것이다. 포화계수에 해당하는 것은?",["ob/oc","bc'/bc","cc'/bc'","cc'/bc"],3,"동기 발전기의 무부하 포화 곡선은 무부하 유기기전력과 계자전류의 관계 곡선으로 정격전압에 상응하는 bc의 연장선과 만나는 공극선과 무부하 포화 곡선이 만나는 점에서 포화계수(포화율) σ=cc'/bc'가 된다.","가로축 계자전류 If, 세로축 단자전압 V[V]. 원점 O에서 직선(공극선)과 곡선(무부하 포화 곡선 M)이 그려지고, 정격전압 Vn 높이의 점 b에서 수평선이 곡선과 c, 공극선과 c'에서 만남."],
[G,"05 정류기 및 제어기기","반도체 사이리스터에 의한 전동기의 속도 제어 중 주파수 제어는?",["초퍼 제어","인버터 제어","컨버터 제어","브리지 정류 제어"],2,"인버터(역변환 장치): 직류를 교류로 변환시켜 주파수를 변환시켜 전동기 속도제어와 형광등의 고주파 점등 등이 가능하다. 초퍼는 DC→가변 DC, 컨버터는 AC→DC 변환 장치이다."],
[T,"03 전류의 열작용과 화학작용","전력량 1[Wh]와 그 의미가 같은 것은?",["1[C]","1[J]","3,600[C]","3,600[J]"],4,"[W·sec]=[J] ∴ 1[Wh]=3,600[W·sec]=3,600[J]"],
[S,"04 옥내 배선 공사","금속관 공사에서 노크아웃의 지름이 금속관의 지름보다 큰 경우에 사용하는 재료는?",["로크 너트","부싱","커넥터","링 리듀서"],4,"링 리듀서: 녹아웃(노크아웃)의 지름이 관의 지름보다 큰 관계로 로크 너트만으로는 고정할 수 없을 때 보조적으로 사용한다."],
[S,"06 전선로 및 배전선 공사","저압 구내 가공인입선을 DV 전선으로 시설할 때 경간이 20[m]인 경우에 지름 몇 [mm] 이상의 DV 전선을 사용하여야 하는가?",["2.0","2.6","3.2","5.0"],2,"가공 인입선으로 DV 전선을 사용하여 인입하는 경우 그 굵기는 지름 2.6[mm] 이상이어야 한다. 다만, 지지물 간 거리(경간)가 15[m] 이하인 경우에는 2.0[mm] 이상도 가능하다."],
[G,"02 동기기","동기 발전기의 전기자 반작용의 원인은 무엇인가?",["전기자 전류","동기리액턴스","여자전류","히스테리시스손"],1,"동기 발전기에서 전기자 전류에 의한 자속 중에서 공극을 지나 자극에 들어가 계자 자속에 영향을 미치는 것을 전기자 반작용이라 하며, 이 반작용은 전류의 크기가 같아도 역률에 따라서 그 작용이 다르게 된다."],
[T,"03 전류의 열작용과 화학작용","표준전지에서 사용하는 양극 재료는?",["백금","은","Cd","수은"],4,"표준전지는 전위차를 측정할 때 사용하는 전지로 전류를 흐르게 하는 목적으로 사용하지 않는다. 양극에는 수은을 사용하고 음극에는 카드뮴을 사용한다."],
[T,"04 정전기와 콘덴서","다음과 같이 공기 중에 놓인 2×10⁻⁸[C]의 전하에서 2[m] 떨어진 점 P와 1[m] 떨어진 점 Q와의 전위차는 몇 [V]인가?",["80","90","100","110"],2,"공기 중 전위 V=Q/(4πε₀r)=9×10⁹×Q/r. Q점 VQ=9×10⁹×2×10⁻⁸/1=180[V], P점 VP=9×10⁹×2×10⁻⁸/2=90[V]. 전위차 VQ−VP=90[V]","2×10⁻⁸[C] 전하에서 점 Q까지 1[m], 점 P까지 2[m] 떨어져 있고 전하·Q·P가 한 직선 위에 있음."],
[G,"05 정류기 및 제어기기","SCR을 역병렬로 접속한 것과 같은 특성의 소자는?",["다이오드","사이리스터","GTO","TRIAC"],4,"TRIAC(쌍방향성 3단자 사이리스터)은 사이리스터 2개를 역병렬로 접속한 것과 등가인 것으로 양방향 전류가 흘러 교류 제어용으로 사용되는 소자이다. 전력 제어용, 조광 다이얼(AC) 등 교류 제어용으로만 사용된다."],
[G,"02 동기기","동기 발전기의 단락비가 크다는 것은?",["기계가 작아진다.","효율이 좋아진다.","전압 변동률이 나빠진다.","전기자 반작용이 작아진다."],4,"동기 발전기에서 단락비가 큰 경우: 전기자 반작용이 작고, 동일 정격에 대하여 동기 임피던스가 작고, 전압 변동률이 양호(작다)하며, 기계가 크고 고중량이며 고가이다."],
[S,"02 배선재료와 공구","옥내 배선 공사에서 절연 전선의 피복을 벗길 때 사용하면 편리한 공구는?",["드라이버","플라이어","압착펜치","와이어 스트리퍼"],4,"와이어 스트리퍼: 절연 전선의 피복 절연물을 벗기는 수동 공구"],
[G,"03 변압기","변압기의 효율이 최대가 되기 위한 조건은?",["철손=1/2 동손","1/2 철손=동손","철손=동손","(철손)²=동손"],3,"변압기의 최대효율은 Pi=(1/m)²Pc일 때(부하율=1/m) 철손과 동손이 같으면 최대효율이다. 변압기의 종류마다 최대효율이 되는 부하율은 전력용 변압기 전 부하의 75[%] 정도, 배전용 변압기 전 부하의 60[%] 정도이다."],
[S,"02 배선재료와 공구","저압 옥내 배선에 사용할 수 없는 케이블은?",["OF","VV","CV","MI"],1,"OF(Oil Filled) 케이블은 초고압용 케이블로서 저압 옥내 배선에 사용할 수 없다."],
[T,"02 전기회로 해석","기전력 E[V], 내부저항 r[Ω]의 전지 N개를 병렬로 접속할 경우 부하 저항 R에 흐르는 전류 I[A]는?",["I=E/(N/r+R)","I=E/(r/R+N)","I=E/(R/N+r)","I=E/(r/N+R)"],4,"내부저항 r이 N개 병렬로 연결된 합성저항 rN=r/N[Ω]. rN과 R은 직렬연결이므로 회로의 합성저항 RT=r/N+R ∴ 전류 I=E/(r/N+R)[A]"],
[S,"02 배선재료와 공구","배전반을 나타내는 그림 기호는?",["기호 ①","기호 ②","기호 ③","기호 ④"],2,"① 분전반(정사각형의 대각선 아래 절반을 칠한 기호) ② 배전반(정사각형에 X자) ③ 제어반(X자에서 좌우 삼각형을 칠한 기호) ④ 계폐기(S가 든 사각형)","네모 안에: ① 대각선 아래 절반 검게 칠함, ② X자 모양, ③ X자에서 좌우 삼각형을 검게 칠함, ④ 알파벳 S."],
[S,"02 배선재료와 공구","손작업 쇠톱날의 크기(치수: [mm])가 아닌 것은?",["200","250","300","550"],4,"절단용 쇠톱날의 크기: 200[mm], 250[mm], 300[mm]"],
[T,"03 전류의 열작용과 화학작용","두 종류의 금속 접합부에 전류를 흘리면 전류의 방향에 따라 줄열 이외의 열의 흡수 또는 발생 현상이 생긴다. 이러한 현상을 무엇이라 하는가?",["제벡 효과","페란티 효과","펠티에 효과","초전도 효과"],3,"펠티에 효과(Peltier Effect): 서로 다른 금속을 접속시켜 폐회로를 만들고 전류를 흘리면 접합부에서 열이 발생하거나 흡수되는 현상. 제벡 효과는 두 접합점의 온도를 다르게 했을 때 열기전력이 발생하는 현상이다. 톰슨 효과는 같은 종류의 금속에 온도 차를 주고 전류를 흘릴 때 열이 발생하거나 흡수되는 현상이다."],
[G,"02 동기기","동기 발전기의 병렬운전 조건이 아닌 것은?",["기전력의 크기가 같을 것","기전력의 주파수가 같을 것","기전력의 파형이 같을 것","기전력의 위상 차가 최대일 것"],4,"동기 발전기의 병렬운전 조건: 기전력의 크기가 같을 것, 위상이 같을 것, 주파수가 같을 것, 파형이 같을 것"],
[G,"03 변압기","변류기 개방 시 2차 측을 단락하는 이유는?",["2차 측 절연 보호","2차 측 과전류 보호","측정 오차 방지","1차 측 과전류 방지"],1,"변류기는 2차 전류를 낮게 하기 위한 목적으로 사용하며, 권수비가 작아 2차 측을 개방하게 되면 2차 측에 높은 기전력이 유기되어 절연파괴의 위험이 있다. 즉, 변류기 개방 시 2차 측을 단락하여 2차 측 절연을 보호한다."],
[S,"08 특수 장소 공사","소맥분, 전분 기타 가연성의 분진이 존재하는 곳의 저압 옥내 배선공사 방법에 해당되지 않는 것은?",["케이블 공사","금속관 공사","애자 공사","합성수지관 공사"],3,"소맥분, 전분 기타 가연성의 먼지(분진)가 존재하는 곳의 저압 옥내 배선공사 방법은 금속관 공사, 합성수지관 공사, 케이블 공사에 의하여야 한다."],
[S,"06 전선로 및 배전선 공사","지중전선을 직접 매설식에 의하여 시설하는 경우 차량, 기타 중량물의 압력을 받을 우려가 있는 장소의 매설 깊이는 몇 [m] 이상이어야 하는가?",["0.6[m]","1.0[m]","1.2[m]","1.5[m]"],2,"지중전선을 직접 매설식에 의하여 시설하는 경우 차량, 기타 중량물의 압력을 받을 우려가 있는 장소의 매설 깊이는 1.0[m] 이상이어야 한다."],
[T,"08 3상 교류회로","대칭 3상 교류에서 기전력 및 주파수가 같을 경우 각 상 간의 위상차는 얼마인가?",["π","π/2","2π/3","2π"],3,"대칭 3상 교류에서 기전력과 주파수가 같을 경우 각 상 간의 위상차는 2π/3이다."],
[T,"04 정전기와 콘덴서","극성이 없으며 비유전율이 큰 산화티탄 등을 유전체로 사용한 것으로 가격에 비해 성능이 우수하여 널리 사용되고 있는 콘덴서의 종류는?",["전해 콘덴서","세라믹 콘덴서","마일러 콘덴서","마이카 콘덴서"],2,"세라믹 콘덴서: 유전체로 티탄산바륨을 사용하고 크기도 작고 가격이 저렴하다. 또한 극성이 없으며 가격에 비해 성능이 우수하여 널리 사용되고 있는 콘덴서이다. 전해 콘덴서는 극성이 있고 내압이 작으며, 마일러는 얇은 폴리에스테르 필름, 마이카는 운모박판을 유전체로 사용한다."],
[G,"01 직류기","직류 직권 전동기의 회전수 N과 토크 τ의 관계는?",["τ∝1/N","τ∝1/N²","τ∝N","τ∝N²"],2,"직류 직권 전동기는 계자권선과 전기자 권선이 직렬로 연결되어 If=Ia=I가 된다. 이때 회전수와 토크의 관계는 N∝1/Ia, τ∝φIa이므로 τ∝1/N²"],
[G,"04 유도기","세이딩코일형 유도전동기의 특징을 나타낸 것으로 틀린 것은?",["역률과 효율이 좋고 구조가 간단하여 세탁기 등 가정용 기기에 많이 쓰인다.","회전자는 농형이고 고정자의 성층철심은 몇 개의 돌극으로 되어 있다.","기동토크가 작고 출력이 수십[W] 이하의 소형 전동기에 주로 사용한다.","운전 중에도 세이딩코일에 전류가 흐르고 속도 변동률이 크다."],1,"세이딩코일형 유도전동기의 회전자는 농형이고 고정자의 성층 철심은 몇 개의 돌극으로 되어 있다. 구조가 간단하나 기동토크가 작고 운전 중에 세이딩코일에 전류가 흘러 효율과 역률이 떨어지며 회전 방향을 변경할 수 없는 결점이 있다. 출력이 수십[W] 이하의 소형 전동기에 주로 사용한다."],
[S,"04 옥내 배선 공사","합성수지몰드 공사에서 틀린 것은?",["전선은 절연전선일 것","합성수지몰드 안에는 접속점이 없도록 할 것","합성수지몰드는 홈의 폭 및 깊이가 6.5[cm] 이하일 것","합성수지몰드와 박스 기타의 부속품과는 전선이 노출되지 않도록 할 것"],3,"합성수지몰드 공사: 전선은 절연전선을 사용하고, 몰드 내에서는 접속점을 만들지 말 것. 사용전압은 400[V] 이하. 두께는 2[mm] 이상으로 하며, 홈의 폭과 깊이는 3.5[cm] 이하가 되게 한다.(단, 사람의 접촉이 쉽지 않은 경우 폭 5[cm] 이하, 두께 1[mm] 이상의 것을 사용)"],
[S,"07 고압 및 저압 배전반 공사","배전반 및 분전반을 넣은 강판제로 만든 함의 두께는 몇 [mm] 이상인가?",["1.2","1.5","2.0","2.5"],1,"강판제로 만든 함의 두께는 1.2[mm] 이상이어야 한다. 다만, 가로 또는 세로의 길이가 30[cm] 이하인 것은 두께 1.0[mm] 이상으로 할 수 있다."],
[G,"01 직류기","직류 분권발전기가 있다. 전기자 총도체수 220, 매극의 자속수 0.01[Wb], 극수 6, 회전수 1,500[rpm]일 때 유기기전력은 몇 [V]인가?(단, 전기자 권선은 파권이다.)",["60","120","165","240"],3,"유기기전력 E=(P/a)Zφ(N/60)에서 파권의 경우 병렬 회로수는 2이다. ∴ E=(6/2)×220×0.01×(1,500/60)=165[V]"],
[G,"04 유도기","동기 와트로 표시되는 것은?",["1차 입력","2차 출력","동기속도","2차 입력"],4,"슬립이 s인 유도 전동기가 같은 토크 τ를 발생하며 동기 속도로 회전할 때의 입력(2차 입력)을 말한다."],
[T,"09 비정현파","다음 중 구형파의 파고율로 알맞은 것은?",["1","1.414","1.732","2.449"],1,"파고율=최대값/실효값. 구형파는 실효값=최대값=Vm이므로 파형률 1, 파고율 1이다. (정현파 1.414, 삼각파 1.73, 구형반파 1.41, 정현반파 2)"],
[G,"02 동기기","동기기의 전기자 권선법이 아닌 것은?",["전절권","분포권","2층권","중권"],1,"동기기의 전기자 권선법은 2층권, 중권, 분포권, 단절권을 사용한다."],
[S,"09 전기응용 시설 공사","조명설계 시 고려해야 할 사항 중 틀린 것은?",["적당한 조도일 것","휘도 대비가 높을 것","균등한 광속 발산도 분포일 것","적당한 그림자가 있을 것"],2,"휘도는 눈부심 정도를 나타내며, 휘도 대비가 높으면 불쾌감을 느낄 수 있으므로 작게 설계하여야 한다."],
[G,"04 유도기","회전자 입력을 P2, 슬립을 s라고 할 때 3상 유도 전동기의 기계적 출력의 관계식은?",["sP2","(1−s)P2","s²P2","P2/s"],2,"슬립 s=(Ns−N)/Ns 또는 N=(1−s)Ns로서 N/Ns=(1−s)=P/P2(=2차 출력/2차 입력) ∴ P=(1−s)P2"],
[T,"07 교류회로","다음 전압과 전류는 어느 편이 얼마나 위상이 앞서고 있는가? v=2V cos(ωt+30°)[V], i=√2 sin(ωt+60°)[A]",["i가 30° 앞선다.","i가 60° 앞선다.","v가 30° 앞선다.","v가 60° 앞선다."],4,"v=2V cos(ωt+30°)=2V sin(ωt+30°+90°)=2V sin(ωt+120°)[V]. 따라서 전압 v가 전류 i보다 60° 앞선다."],
[T,"03 전류의 열작용과 화학작용","니켈의 원자가는 2.0이고 원자량은 58.7이다. 이때 화학당량의 값은?",["117.4","60.7","56.7","29.35"],4,"화학당량=원자량/원자가=58.7/2.0=29.35"],
[S,"06 전선로 및 배전선 공사","지지물에 전선, 그 밖의 기구를 고정시키기 위해 완목, 완금, 애자 등을 장치하는 것을 무엇이라 하는가?",["장주","건주","터파기","가선 공사"],1,"장주: 지지물에 전선 및 개폐기 등을 고정시키기 위한 완목, 완금, 애자 등을 시설하는 것"],
[G,"04 유도기","단상 유도 전동기의 정회전 슬립이 s이면 역회전 슬립은 무엇인가?",["1−s","2−s","1+s","2+s"],2,"역회전일 경우 슬립 s=(Ns−(−N))/Ns=1+N/Ns=1+(1−s)=2−s (∵ N=(1−s)Ns)"],
[T,"06 전자유도 법칙과 인덕턴스","두 코일이 있다. 한 코일에 매초 전류가 150[A/s]의 비율로 변할 때 다른 코일에 60[V]의 기전력이 발생하였다면, 두 코일의 상호 인덕턴스는 몇 [H]인가?",["0.4[H]","2.5[H]","4.0[H]","25[H]"],1,"다른 코일에 발생하는 기전력 e=M·di/dt이므로 60=M×150, M=60/150=0.4[H]"],
[T,"01 직류회로","도체의 전기저항에 대한 설명으로 옳은 것은?",["길이와 단면적에 비례한다.","길이와 단면적에 반비례한다.","길이에 비례하고 단면적에 반비례한다.","길이에 반비례하고 단면적에 비례한다."],3,"전기저항 R=ρ·l/S[Ω]. 따라서 전기저항은 도선 단면적에 반비례하고 도선의 길이에 비례하며, 도선의 고유저항률에 비례한다."],
[G,"03 변압기","무부하 시 변압기에 흐르는 전류는?",["자화 전류와 철손 전류","자화 전류와 동기화 전류","여자 전류와 손실 전류","계자 전류와 철손 전류"],1,"변압기의 1차 측 전류는 여자 전류와 1차 측 부하 전류로 나뉘며 무부하 시 여자 전류만 있다. 이때, 여자 전류는 철손 전류와 자화 전류의 합으로 표현된다."],
[S,"02 배선재료와 공구","다음의 보기 중 명칭과 약칭이 맞게 짝지어지지 않은 것은?",["600[V] 고무 절연전선: RN","인입용 비닐 절연전선: DV","옥외용 비닐 절연전선: OW","비닐절연 비닐시스 케이블: VV"],1,"OW: 옥외용 비닐 절연전선, DV: 인입용 비닐 절연전선, VV: 비닐절연 비닐시스 케이블, RN: 고무절연 클로로프렌 시스 케이블. 600[V] 고무 절연전선의 약칭은 RB이다."],
[T,"06 전자유도 법칙과 인덕턴스","다음 중 와전류손의 특성으로 알맞은 것은?",["주파수에 비례한다.","최대자속밀도에 비례한다.","주파수의 제곱에 비례한다.","최대자속밀도의 3승에 비례한다."],3,"와전류손 Pe=ηe(tfBm)²[W/m³] (f: 주파수, Bm: 최대자속밀도, t: 철심두께). 따라서 와전류손은 주파수의 제곱에 비례하고 최대자속밀도의 제곱에 비례한다."],
[T,"02 전기회로 해석","기전력이 100[V], 내부저항 r=10[Ω]인 전원이 있다. 이 전원에 부하를 연결하여 얻을 수 있는 최대전력은 몇 [W]인가?",["125","150","225","250"],4,"최대전력 조건은 내부저항=부하저항이다. 부하저항 R=10[Ω]이므로 회로의 전체저항 Rt=20[Ω], 전류 I=100/20=5[A]. Pmax=I²R=5²×10=250[W]"],
[T,"05 자기 성질과 자기장","환상 솔레노이드 내부의 자기장의 세기에 관한 설명으로 옳은 것은?",["자장의 세기는 권수에 반비례한다.","자장의 세기는 권수, 전류, 평균 반지름과는 관계가 없다.","자장의 세기는 평균 반지름에 비례한다.","자장의 세기는 전류에 비례한다."],4,"환상 솔레노이드 내부의 자기장 세기 H=NI/(2πr)[AT/m]이므로 자기장의 세기는 권수에 비례, 전류에 비례하고 반지름에 반비례한다."],
[G,"05 정류기 및 제어기기","그림은 전력 제어 소자를 이용한 위상제어 회로이다. 전동기의 속도를 제어하기 위해서 '가' 부분에 사용되는 소자는?",["전력용 트랜지스터","제너 다이오드","트라이액","레귤레이터 78XX 시리즈"],3,"TRIAC(쌍방향성 3단자 사이리스터)은 사이리스터 2개를 역병렬로 접속한 것과 등가인 것으로 양방향 전류가 흘러 교류 제어용으로 사용되는 소자이다. 전력 제어용, 조광 다이얼(AC) 등 교류 제어용으로만 사용된다.","사인파 교류 전원에 전동기, 가변저항, 콘덴서 C1, DIAC가 연결되고 DIAC 오른쪽에 점선 상자 '가'(TRIAC 위치)가 전동기와 직렬로 연결된 위상제어 회로."],

[S,"06 전선로 및 배전선 공사","저압 연접인입선은 인입선에서 분기하는 점으로부터 몇 [m]를 넘지 않는 지역에 시설하는가?",["50","75","100","150"],3,"저압 이웃연결(연접)인입선은 인입선에서 분기하는 점으로부터 100[m]를 넘지 않는 지역에 시설하여야 한다."],

[G,"03 변압기","전기기기에 있어 와전류손(Eddy Current Loss)을 감소시키기 위한 적합한 방법은?",["규소강판에 성층철심을 사용한다.","보상권선을 설치한다.","교류전원을 사용한다.","냉각 압연한다."],1,"철심은 자기회로를 만드는 부분으로 회전에 따른 자속 방향이 수시로 변화하면서 와전류손과 히스테리시스손에 의한 철손이 생기게 된다. 따라서 계자(전기자)철심은 이 철손을 줄이기 위해서 두께 0.35[mm] 또는 0.5[mm] 정도의 얇은 규소강판을 성층해서 만든다."],
[S,"03 전선의 접속","동전선의 직선접속에서 단선 및 연선에 적용되는 접속 방법은?",["직선맞대기용 슬리브에 의한 압착 접속","가는 단선(2.6[mm] 이상)의 분기 접속","S형 슬리브에 의한 분기 접속","터미널 러그에 의한 접속"],1,"직선맞대기용 슬리브에 의한 압착 접속: 구리(동)전선의 직선접속으로 단선 및 연선에 적용한다. 가는 단선의 분기 접속과 S형 슬리브 분기 접속은 분기 접속, 터미널 러그는 알루미늄전선의 종단 접속이다."],
[S,"07 고압 및 저압 배전반 공사","교류 차단기에 포함되지 않는 것은?",["GCB","HSCB","VCB","ABB"],2,"HSCB는 직류 고속도 차단기로 사고전류 검출 기능과 차단 기능을 동시에 갖는다."],

[T,"06 전자유도 법칙과 인덕턴스","브리지 회로에서 전류계 D에서 측정된 전류가 0일 때 인덕턴스 Lx[H]를 구하면?",["Lx=(R2/R1)Ls","Lx=(R1/R2)Ls","Lx=(Rs/R1)Ls","Lx=(R1/Rs)Ls"],2,"그림은 맥스웰브리지 회로이며 회로가 평형이 되기 위한 조건은 Lx/Ls=R1/R2이다. 따라서 보기와 같은 조건으로 변형하면 Lx=(R1/R2)Ls","브리지 회로: 윗변에 Lx와 Ls, 좌우 변에 Rx와 Rs가 있고, 아래쪽에 R1(왼쪽), R2(오른쪽), 가운데 검류계 D, 아래에 교류전원."],
[T,"06 전자유도 법칙과 인덕턴스","자기장 내에 있는 도선에 전류가 흐를 때 자기장과 도선이 이루는 각도가 몇 도일 때 도선에 작용하는 힘이 최대가 되는가?",["30°","45°","60°","90°"],4,"자계 내의 전류도체가 받는 힘 F=BIl sinθ[N] ∴ sin90°=1이므로 θ가 90°일 때 도선에 작용하는 힘은 최대가 된다."],
[G,"02 동기기","단락비가 큰 동기 발전기에 대한 설명으로 틀린 것은?",["단락 전류가 크다.","동기 임피던스가 작다.","전기자 반작용이 크다.","공극이 크고 전압 변동률이 작다."],3,"동기 발전기에서 단락비가 큰 경우: 전기자 반작용이 작고, 동일 정격에 대하여 동기 임피던스가 작고, 전압변동률이 양호(작다)하며, 기계가 크고 중량이 무거우며 가격이 고가이다."],
[G,"03 변압기","변압기 V 결선의 특징으로 틀린 것은?",["고장 시 응급처치 방법으로도 쓰인다.","단상변압기 2대로 3상 전력을 공급한다.","부하증가가 예상되는 지역에 시설한다.","V 결선 시 출력은 Δ 결선 시 출력과 크기가 같다."],4,"V 결선의 특징: 이용률=√3/2=0.866, 출력비=√3/3=0.577. V 결선 시 출력은 Δ 결선 시 출력과 크기가 같지 않다."],
[G,"01 직류기","다음 그림의 전동기는 어떤 전동기인가?",["직권 전동기","타여자 전동기","분권 전동기","복권 전동기"],3,"계자와 전기자가 직렬로 연결되어 있으면 직권 전동기, 계자와 전기자가 병렬로 접속되어 있으면 분권 전동기이다. 즉, 그림의 전동기는 분권 전동기이다.","전원 V에 전기자(M, 전류 Ia)와 계자 저항 R·계자권선(전류 Ish)이 서로 병렬로 연결된 회로."],
[S,"08 특수 장소 공사","폭연성 분진이 존재하는 곳의 금속관 공사에 있어서 관 상호 및 관과 박스의 접속은 몇 턱 이상의 조임 나사로 시공하여야 하는가?",["6턱","5턱","4턱","3턱"],2,"폭연성 먼지(분진), 화약류 가루(분말)가 존재하는 곳 등의 금속관 공사에 있어서 관 상호 및 관과 박스 등은 5턱 이상의 나사 조임으로 접속하여야 한다."],

[S,"07 고압 및 저압 배전반 공사","열동계전기는 무엇이 동작하여 회로를 차단하는가?",["퓨즈","다이오드","철심","바이메탈"],4,"열동계전기는 바이메탈이 동작하여 회로를 차단한다."],
[T,"02 전기회로 해석","다음 그림에서 저항 R2[Ω]은?",["5","3","2","1"],3,"10[Ω]에 걸리는 전압이 20[V]이므로 회로에 흐르는 전류 I=20/10=2[A]. 회로의 합성 저항 R=V/I=30/2=15[Ω]=10+3+R2 ∴ R2=15−10−3=2[Ω]","30[V] 전원에 3[Ω], R2가 직렬로 연결되고 10[Ω] 저항이 R2 뒤에 직렬로 연결된 회로. 10[Ω] 양단 전압이 20[V]."],

[G,"04 유도기","농형 유도 전동기의 기동법이 아닌 것은?",["전전압 기동법","Y-Δ 기동법","기동 보상기에 의한 기동법","2차 저항기법"],4,"전전압 기동법: 소용량 5[kW] 이하, Y-Δ 기동법: 기동 시 전압의 60[%] 정도로 5~15[kW] 정도까지 적용, 기동 보상기법: 단권 변압기를 이용해 공급 전압을 낮추어 기동. 2차 저항기법은 권선형 유도 전동기의 기동 및 운전에 적용하는 방법이다."],
[G,"03 변압기","변압기의 온도 상승 시험법으로 가장 널리 사용되는 것은?",["단락 시험법","절연내력 시험법","무부하 시험법","실 부하법"],1,"변압기의 온도 시험법은 반환 부하법, 단락 시험법, 실 부하법 등이 있는데 가장 널리 사용하는 방법은 단락 시험법, 반환 부하법이다."],
[S,"04 옥내 배선 공사","다음 중 금속덕트 공사의 시설 방법 중 틀린 것은?",["덕트 상호 간은 견고하고 또한 전기적으로 완전하게 접속할 것","덕트 지지점 간의 거리는 3[m] 이하로 할 것","덕트의 끝부분은 열어 둘 것","덕트에는 접지공사를 할 것"],3,"금속덕트 공사에서 덕트의 끝부분은 막아야 한다."],
[S,"03 전선의 접속","다음 중 전선의 접속방법에 해당되지 않는 것은?",["트위스트 접속","슬리브 접속","쥐꼬리 접속","직접 접속"],4,"전선의 접속 종류: 트위스트 접속, 브리타니아 접속, 슬리브 접속, 쥐꼬리 접속"],

[G,"02 동기기","동기발전기의 전기자 반작용에서 역률이 1인 경우 나타나는 현상은?",["교차 자화 작용","감자 작용","직축 자화 작용","증자 작용"],1,"교차 자화 작용(횡축 반작용): 계자에 의한 기전력과 전기자 부하전류가 동상(역률 1). 감자 작용(직축 반작용): 전기자 전류가 계자기전력보다 90도 뒤진 경우(지상). 증자 작용(자화 작용): 전기자 전류가 계자기전력보다 90도 앞선 경우(진상)."],
[G,"01 직류기","다음 중 특수 직류기가 아닌 것은?",["고주파 발전기","단극 발전기","승압기","전기 동력계"],1,"단극 발전기, 승압기, 전기 동력계는 특수 직류기이다. 고주파 발전기는 유도자형 발전기가 주로 채용되어 고주파 전기로 등의 전원으로 사용되는 교류기로 특수 직류기가 아니다."],

[S,"02 배선재료와 공구","콘크리트에 매입하는 금속관 공사에서 직각으로 배관할 때 사용하는 것은?",["노멀 밴드","뚜껑이 있는 엘보","서비스 엘보","유니버셜 엘보"],1,"노멀 밴드: 콘크리트에 매입하는 금속관 공사에서 직각으로 배관할 때 사용"],
[T,"03 전류의 열작용과 화학작용","어떤 저항에서 1[kWh]의 전력량을 소비시켰을 때 발생하는 열량은 약 몇 [kcal]인가?",["860","746","780","825"],1,"1[kWh]=3.6×10⁶[J], 1[J]=0.24[cal] ∴ 1[kWh]=3.6×10⁶×0.24=860[kcal]"],
[S,"06 전선로 및 배전선 공사","저압 전로의 접지 측 전선을 식별하는 데 애자의 빛깔에 의하여 표시하는 경우 어떤 빛깔의 애자를 접지 측으로 하여야 하는가?",["백색","청색","갈색","황갈색"],2,"저압 전로의 접지 측 전선을 식별하는 데 애자의 빛깔에 의하여 표시하는 경우 파란색(청색)을 사용해야 한다."],
[S,"04 옥내 배선 공사","합성수지몰드 공사에서 틀린 것은?",["전선은 절연전선일 것","합성수지몰드 안에는 접속점이 없도록 할 것","합성수지몰드는 홈의 폭 및 깊이가 6.5[cm] 이하일 것","합성수지몰드와 박스 기타의 부속품과는 전선이 노출되지 않도록 할 것"],3,"합성수지몰드 공사: 전선은 절연전선을 사용하고, 몰드 내에서는 접속점을 만들지 말 것. 사용전압은 400[V] 이하. 두께는 2[mm] 이상, 홈의 폭과 깊이는 3.5[cm] 이하가 되게 한다.(단, 사람의 접촉이 쉽지 않은 경우 폭 5[cm] 이하, 두께 1[mm] 이상)"],
[T,"07 교류회로","R-L 직렬회로에서 임피던스 Z=3+j4[Ω]이다. 이 회로에 교류 100[V]를 가할 때 유효전력[W]은?",["1,200","1,600","1,800","2,400"],1,"임피던스의 크기 |Z|=√(3²+4²)=5[Ω], 역률 cosθ=3/5=0.6. P=Pa·cosθ=(V²/Z)cosθ=(100²/5)×0.6=1,200[W]"],
[G,"04 유도기","3상 유도 전동기의 회전 방향을 바꾸려면?",["전원의 극수를 바꾼다.","전원의 주파수를 바꾼다.","3상 전원 3선 중 두 선의 접속을 바꾼다.","기동 보상기를 이용한다."],3,"3상 유도 전동기의 3선 중 두 선의 접속(상 회전 순서)을 바꾸어 주면 회전 자계가 반대로 형성되어 회전 방향이 반대로 된다."],
[G,"01 직류기","다음 그림은 여러 직류 전동기의 속도 특성 곡선을 나타낸 것이다. A-D까지 차례로 맞는 것은?",["차동복권, 분권, 가동복권, 직권","가동복권, 차동복권, 직권, 분권","분권, 직권, 가동복권, 차동복권","직권, 가동복권, 분권, 차동복권"],4,"속도 특성 곡선(부하전류 I에 대한 회전수 n): 가장 급하게 떨어지는 A는 직권, 그다음 B는 가동복권, C는 분권, 오른쪽 위로 올라가는 D는 차동복권이다.","가로축 부하전류[A], 세로축 회전수 N[rpm]. 전부하 부근에서 만나는 네 곡선: A는 가장 급하게 감소, B는 그다음으로 감소, C는 완만하게 감소, D는 오른쪽 위로 증가."],
[S,"08 특수 장소 공사","무대, 무대마루 밑, 오케스트라 박스 및 영사실, 기타 사람이나 무대 도구가 접촉될 우려가 있는 장소에 시설하는 저압 옥내배선, 전구선 또는 이동전선은 사용전압이 몇 [V] 이하이어야 하는가?",["400","500","600","700"],1,"무대, 무대마루 밑, 오케스트라 박스, 영사실, 기타 사람이나 무대 도구가 접촉할 우려가 있는 곳에 시설하는 저압 옥내배선, 전구선 또는 이동전선은 사용전압이 400[V] 이하일 것"],
[T,"07 교류회로","RL 직렬회로에서 임피던스(Z)의 크기를 나타내는 식은?",["R²+XL²","R²−XL²","√(R²+XL²)","√(R²−XL²)"],3,"RL 직렬회로 임피던스의 크기 |Z|=√(R²+XL²)[Ω]"],
[T,"04 정전기와 콘덴서","전기력선의 성질 중 맞지 않는 것은?",["전기력선은 양(+)전하에서 나와 음(−)전하에서 끝난다.","전기력선의 접선 방향이 전장의 방향이다.","전기력선은 도중에 만나거나 끊어지지 않는다.","전기력선은 등전위면과 교차하지 않는다."],4,"전기력선은 양전하에서 나와 음전하로 들어간다. 전기력선의 접선 방향이 그 점의 전계 방향이다. 전기력선은 등전위면과 수직이다(교차한다). 전기력선의 밀도로 전계를 정의하기도 한다."],
[G,"01 직류기","직류기의 전기자 철심을 규소강판으로 성층하여 만드는 이유는?",["가공하기 쉽다.","가격이 염가이다.","철손을 줄일 수 있다.","기계손을 줄일 수 있다."],3,"철심은 자기회로를 만드는 부분으로 회전에 따른 자속 방향이 수시로 변화하면서 와전류(성층 철심으로 감소) 손실이나 히스테리시스(규소강판 사용으로 감소) 현상에 의한 철손이 생기게 된다. 따라서 계자(전기자) 철심은 이 철손을 줄이기 위해서 두께 0.35~0.5[mm] 정도의 얇은 규소강판을 성층하여 만든다."],

[T,"03 전류의 열작용과 화학작용","저항 R 양단에 기전력 E를 가하고, 이때 R에 흐르는 전류를 I라 하고, R에서 소비되는 전력을 P라 할 때 옳지 않은 것은?",["I가 일정하면 P는 E에 비례한다.","I가 일정하면 P는 R에 비례한다.","R이 일정하면 P는 E에 비례한다.","R이 일정하면 P는 I²에 비례한다."],3,"전류 I=E/R, 전력 P=EI=I²R=E²/R이므로 I가 일정하면 전력 P는 E와 R에 비례하고 R이 일정하면 E²과 I²에 비례한다."],
[T,"01 직류회로","절연재료의 저항 특성 중 옳지 않은 것은?",["저항률이 클 것","저항 온도 계수가 작을 것","저항 온도 계수가 클 것","저항 온도 계수가 (+)일 것"],3,"절연재료의 저항 특성: 저항률이 클 것, 저항 온도 계수가 작을 것, 저항 온도 계수가 (+)일 것"],
[T,"03 전류의 열작용과 화학작용","1.5[A]의 전류를 1분 동안 질산은 용액에 흘리면 몇 [g]의 은을 석출하겠는가?(단, 은의 전기화학당량은 0.001118[g/C]이다.)",["0.10062","0.16002","0.00168","0.0172"],1,"석출되는 양 W=kQ=kIt=0.001118×1.5×60=0.10062[g]"],
[G,"04 유도기","4극 7.6[kW], 220[V]의 3상 유도전동기가 있다. 이 전동기의 전부하 시 2차 입력이 7.8[kW]라면 이때의 2차 동손[W]은?(단, 전동기 기계손은 무시한다.)",["200","300","360","400"],1,"2차 동손 Pc2=P2−P0−Pm=7,800−7,600−0=200[W]"],
[G,"03 변압기","변압기의 무부하 시험, 단락시험에서 구할 수 없는 것은?",["동손","철손","절연내력","전압 변동률"],3,"단락시험으로 권선의 저항, 누설 리액턴스 2차를 단락하고 1차 측 정격 주파수 전압을 서서히 상승하면서 1차 전류와 입력을 측정한다. 1차 전류가 정격전류와 같을 때의 입력이 부하손(동손)이며 전압계로 임피던스 전압이 측정된다. 권선의 저항, 누설 리액턴스와 전압 변동률을 측정할 수 있다. 절연내력은 무부하 시험, 단락시험으로 구할 수 없다."],
[G,"05 정류기 및 제어기기","다음 정류 방식 중에서 맥동 주파수가 가장 많고 맥동률이 가장 작은 정류 방식은 어느 것인가?",["단상 반파식","단상 전파식","3상 반파식","3상 전파식"],4,"맥동 주파수/맥동률: 단상 반파 f/121[%], 단상 전파 2f/48[%], 3상 반파 3f/18[%], 3상 전파 6f/4[%]. 따라서 3상 전파식이 맥동 주파수가 가장 많고 맥동률이 가장 작다."],
[S,"08 특수 장소 공사","셀룰로이드, 성냥, 석유류 등 기타 가연성 위험물질을 제조 또는 저장하는 장소의 공사로 틀린 것은?",["금속관 공사","케이블 공사","플로어 덕트 공사","합성수지관(CD관 제외) 공사"],3,"성냥, 석유류, 셀룰로이드 등의 위험 물질을 제조하거나 저장하는 곳의 전기 인공구조물(공작물)은 금속관 공사, 합성수지관(CD관 제외) 공사, 케이블 공사에 의하여야 한다."],
[S,"02 배선재료와 공구","금속관에 여러 가닥의 전선을 넣을 때 매우 편리하게 넣을 수 있는 방법으로 쓰이는 것은?",["비닐전선","철망그리프","전지선","호밍사"],2,"철망그리프: 전선관 또는 덕트, 트레이 등에 전선을 여러 가닥으로 배선 시 사용하는 것으로 편리하게 배선할 수 있다."],
[S,"04 옥내 배선 공사","가정용 집을 건축할 때 콘크리트벽 내 금속관 공사에 대해서 스위치 배선을 하려고 할 때 관 두께는 최소 몇 [mm]인가?",["1.3","1.2","1.1","1.0"],2,"콘크리트 벽 내에 매설하는 전선관의 두께는 1.2[mm] 이상으로 해야 한다."],
[S,"02 배선재료와 공구","연선 결정에 있어서 중심소선을 뺀 층수가 3층이다. 전체 소선수는 얼마인가?",["37","61","19","7"],1,"소선수 N=3n(n+1)+1=3×3×(3+1)+1=(9×4)+1=37"],
[S,"04 옥내 배선 공사","교류 전등 공사에서 금속관 내에 전선을 넣어 연결한 방법 중 옳은 것은?",["그림 ①","그림 ②","그림 ③","그림 ④"],3,"교류 전등 공사에서 금속관 내에 전선을 넣어 연결할 경우 전자적 불평형이 생기지 않도록 하나의 배관에 하나의 부하를 연결하여야 한다. (왕복 두 전선을 하나의 관에 함께 넣어야 한다.)","① 전원 두 선이 각각 다른 금속관에 따로 들어감 ② 두 선이 각각 별도의 관에 들어가 부하에 연결 ③ 전원 두 선이 하나의 금속관에 함께 들어가 부하·스위치에 연결 ④ 짧은 관과 두 갈래 관을 섞어 연결."],
[T,"04 정전기와 콘덴서","면적이 S[m²], 극판간격이 d[m], 유전율이 ε인 평행판 콘덴서에 V[V]전압을 가할 때 축적되는 전하량 Q[C]의 값은?",["SV/(εd)","(εS/d)V","(d/ε)SV","εdSV"],2,"C=εS/d, Q=CV=(εS/d)V[C]"],
[T,"04 정전기와 콘덴서","그림에서 A-B 간의 합성 정전용량[μF]은?",["1","2","3","4"],1,"병렬 회로의 합성 정전용량 2[μF] (1+1). 즉, 2[μF]와 2[μF]의 직렬 회로로 볼 수 있다. ∴ A-B 간 합성 정전용량 C=(2×2)/(2+2)=1[μF]","A와 B 사이에 2[μF] 콘덴서가 직렬로 있고, 그 뒤에 1[μF] 콘덴서 2개가 병렬로(위·아래 가지) B에 연결됨."],
[T,"06 전자유도 법칙과 인덕턴스","전동기의 회전 방향을 알기 위한 법칙은?",["플레밍의 오른손 법칙","플레밍의 왼손 법칙","렌츠의 법칙","앙페르의 오른나사 법칙"],2,"플레밍의 왼손 법칙: 전동기의 회전 방향을 알려주는 법칙. 플레밍의 오른손 법칙: 발전기에서 유기되는 전압의 방향. 렌츠의 법칙: 자속의 변화로 유기되는 기전력의 방향. 앙페르의 오른나사 법칙: 도선에 전류가 흐르면 주위에 발생하는 자계의 방향"],
[S,"03 전선의 접속","다음 중 전선 및 케이블 접속 방법이 잘못된 것은?",["전선의 세기를 30[%] 이상 감소시키지 않을 것","접속 부분은 접속관 기타의 기구를 사용하거나 납땜을 할 것","코드 상호, 캡타이어 케이블 상호, 케이블 상호 등을 접속하는 경우에는 코드 접속기, 접속함 기타의 기구를 사용할 것","도체에 알루미늄을 사용하는 전선과 동을 사용하는 전선을 접속하는 경우에는 접속 부분에 전기적 부식이 생기지 않도록 할 것"],1,"전선 및 케이블을 접속할 경우 전선의 세기는 20[%] 이상 감소시키지 않아야 한다."],
[S,"03 전선의 접속","옥내배선의 박스(접속함) 내에서 가는 전선을 접속할 때 주로 어떤 방법을 사용하는가?",["쥐꼬리 접속","슬리브 접속","트위스트 접속","브리타니아 접속"],1,"옥내배선의 박스 내에서 가는 전선을 접속할 때 쥐꼬리 접속을 사용한다."],
[G,"02 동기기","동기 발전기 2대를 병렬운전하고자 할 때 필요로 하는 조건이 아닌 것은?",["발생 전압의 주파수가 서로 같아야 한다.","각 발전기에서 유도되는 기전력의 크기가 같아야 한다.","발전기에서 유도된 기전력의 위상이 일치해야 한다.","발전기의 용량이 같아야 한다."],4,"동기 발전기의 병렬운전 조건: 기전력의 크기가 같을 것, 기전력의 위상이 같을 것, 기전력의 주파수가 같을 것, 기전력의 파형이 같을 것"],
[T,"07 교류회로","회전자가 1초에 30회전을 하면 각속도는?",["30π[rad/s]","60π[rad/s]","90π[rad/s]","120π[rad/s]"],2,"각속도 ω=2πf에서 주파수 f=30[Hz]이므로 ω=2π×30=60π[rad/s]"],
[S,"02 배선재료와 공구","그림과 같은 심벌의 명칭은?(\"MD\"가 적힌 직사각형)",["금속덕트","버스덕트","플로어덕트","셀룰러덕트"],1,"MD 심벌은 금속덕트를 나타낸다.","직사각형 안에 영문 'MD'가 적힌 심벌."],
[S,"02 배선재료와 공구","유니온 커플링의 사용 목적은?",["내경이 다른 금속관 상호의 접속","금속관 상호 접속용으로 관이 고정되어 있을 때 또는 관 자체를 돌릴 수 없을 때에 사용","금속관의 박스와의 접속","배관의 직각 굴곡 부분에 사용"],2,"유니온 커플링: 금속관 상호 접속용으로 관 자체를 돌리기 힘들거나 고정되어 있을 경우 사용한다."],
[G,"01 직류기","타여자식 발전기에 전기자 저항 0.05[Ω]으로 부하전류 100[A]를 공급하였더니 단자전압이 210[V]였다. 발전기의 유도 기전력은?",["195[V]","215[V]","225[V]","235[V]"],2,"유도 기전력 E=V+IaRa=210+(100×0.05)=215[V]"],
[G,"04 유도기","유도 전동기의 공급 전압이 1/2배로 감소하면 토크는 처음의 몇 배가 되는가?",["1/2","1/4","1/6","1/8"],2,"슬립 s가 일정하면 유도 전동기의 토크는 공급 전압의 제곱에 비례한다. 공급 전압이 1/2배로 감소하면 토크는 1/4배로 감소한다."],
[T,"02 전기회로 해석","키르히호프의 제1법칙은?",["전압에 관한 법칙이다.","정전기에 관한 법칙이다.","전류에 관한 법칙이다.","자기에 관한 법칙이다."],3,"키르히호프 제1법칙은 전류에 관한 법칙이고, 제2법칙은 전압에 관한 법칙이다."],
[G,"03 변압기","변압기 여자 회로에서 서셉턴스 b0에 흐르는 전류는 무슨 전류인가?",["철손 전류","자화 전류","부하 전류","여자 전류"],2,"여자 전류 I0는 주자속과 동상인 무효분의 자화 전류 Iφ와 직각인 유효분의 철손 전류 Ii로 나눌 수 있고, 여자 전류의 벡터 합은 I0=Ii+jIφ이다. 이때, 등가회로의 여자어드미턴스 Y0=g0+jb0에서 서셉턴스 b0에 흐르는 전류는 자화 전류이다."],
[S,"04 옥내 배선 공사","옥내의 건조하고 전개된 장소에서 사용전압이 400[V] 이상인 경우에 시설할 수 없는 배선 공사는?",["애자 공사","금속덕트 공사","버스덕트 공사","금속몰드 공사"],4,"옥내의 건조하고 전개된 장소에서 사용전압이 400[V] 이상인 경우에는 애자 공사, 금속덕트 공사 또는 버스덕트 공사로 시설하여야 한다."],
[S,"05 전선 및 기계기구의 보안공사","최대 사용 전압이 220[V]인 3상 유도 전동기가 있다. 이때 절연내력 시험 전압은 몇 [V]로 하여야 하는가?",["330","500","750","1,050"],2,"회전기(7[kV] 이하)의 시험 전압은 1.5배(최저 500[V]). ∴ 시험 전압=220×1.5=330[V] 시험 전압이 500[V] 미만이므로 최저 시험 전압의 기준인 500[V]로 한다."],
[T,"05 자기 성질과 자기장","반지름 5[cm], 권수 10회인 원형 코일에 15[A]의 전류가 흐르면 코일 중심의 자장의 세기는 몇 [AT/m]인가?",["500","1,500","2,500","3,000"],2,"원형 코일의 중심 자계 H=NI/(2r)=(10×15)/(2×5×10⁻²)=1,500[AT/m]"],
[T,"03 전류의 열작용과 화학작용","전해액에 전류가 흘러 화학변화를 일으키는 현상을 무엇이라 하는가?",["전리","전기분해","화학분해","전기변화"],2,"전해액에 전류를 흐르게 하여 화학반응을 일으키는 현상을 전기분해라 한다."],
[G,"01 직류기","계자 철심에 잔류자기가 없어도 발전되는 직류기는?",["분권기","직권기","복권기","타여자기"],4,"타여자 발전기: 별도의 직류전원을 여자 전류로 사용하므로 계자 철심에 잔류자기가 없어도 발전할 수 있으나 별도 전원을 사용해야 하는 어려움이 있다. 자여자 발전기는 계자 철심에 잔류자기가 존재하고 있어야 발전 가능하다."],
[S,"04 옥내 배선 공사","저압크레인 또는 호이스트 등의 트롤리선을 애자공사에 의하여 옥내의 노출장소에 시설하는 경우 트롤리선의 바닥에서의 높이는 몇 [m] 이상으로 설치하는가?",["2","2.5","3","3.5"],4,"트롤리선의 바닥에서의 높이는 3.5[m] 이상으로 하고, 또한 사람이 접촉할 우려가 없도록 시설할 것"],
[T,"07 교류회로","v=Vm sin(ωt−20°)[V], i=Im cos(ωt−20°)[A]의 위상차를 구하면?",["π/2[rad]","π/3[rad]","π/4[rad]","π/6[rad]"],1,"i=Im cos(ωt−20°)=Im sin(ωt−20°+90°)=Im sin(ωt+70°)[A]. 전류 i와 전압 v를 비교하면 π/2만큼 위상차가 발생한다."],
[S,"09 전기응용 시설 공사","60[cd]의 점광원으로부터 2[m]의 거리에서 그 방향과 직각인 면과 30° 기울어진 평면 위의 조도[lx]는?",["11","13","15","19"],2,"수평면 조도 E=(I/r²)cosθ=(60/2²)×cos30°=13[lx]","점광원(I=60[cd])에서 수직 아래 방향과 30° 기울어진 방향으로 r=2[m] 떨어진 지점의 수평면."],
[S,"02 배선재료와 공구","다음의 그림 기호가 나타내는 것은?",["비상 콘센트","형광등","점멸기","접지저항 측정용 단자"],1,"사각형 안에 점 두 개씩 든 원 두 개: 비상 콘센트","직사각형 안에 원 2개가 나란히 있고, 왼쪽 원에는 점 2개, 오른쪽 원에는 점 3개."],

[S,"02 배선재료와 공구","변압기 2차 저압 과전류 보호용으로 사용되는 배선용 차단기의 약호는?",["ELB","PF","OCB","MCCB"],4,"배선용 차단기(MCCB)는 정격 전류에서는 동작하지 않고 과부하나 단락 사고 시 과전류가 흘렀을 때 동작하는 차단기이다."],

[T,"01 직류회로","다음 설명 중 옳지 않은 것은?",["전류가 흐르고 있는 금속선에 있어서 임의의 두 점 간의 전위차는 전류에 비례한다.","저항의 단위는 옴[Ω]을 사용한다.","금속선의 저항 R은 길이 l에 반비례한다.","저항률 ρ의 역수를 도전율이라고 한다."],3,"저항 R=ρ·l/S[Ω]이므로 저항은 도체 길이에 비례하고 단면적에 반비례한다."],
[T,"03 전류의 열작용과 화학작용","200[V], 30[W]인 백열전구와 200[V], 60[W]인 백열전구를 직렬로 접속하고 200[V]의 전압을 인가하였을 때 어느 전구가 더 어두운가?(단, 전구의 밝기는 소비전력에 비례한다.)",["둘 다 같다.","30[W]전구가 60[W]전구보다 더 어둡다.","60[W]전구가 30[W]전구보다 더 어둡다.","비교할 수 없다."],3,"R30=V²/P=200²/30≒1,333[Ω], R60=200²/60≒667[Ω]. 직렬연결 합성저항 R=2,000[Ω], 전류 I=200/2,000=0.1[A](직렬 접속에서는 전류가 일정). P30=I²R30=0.1²×1,333≒13.33[W], P60=I²R60=0.1²×667≒6.67[W] ∴ 60[W] 전구가 더 어둡다."],

[G,"05 정류기 및 제어기기","반도체 내에서 정공은 어떻게 생성되는가?",["결합전자의 이탈","자유전자의 이동","접합 불량","확산 용량"],1,"진성반도체(4가 원자)에 불순물(3가 원자)을 첨가하면 공유 결합을 해서 전자 1개의 정공이 생성된다. 즉, 결합 자유전자의 이탈에 의하여 생성된다."],

[S,"02 배선재료와 공구","코드 상호, 캡타이어 케이블 상호 접속 시 사용해야 하는 것은?",["와이어 커넥터","케이블 타이","코드 접속기","테이블 탭"],3,"코드 및 캡타이어 케이블 상호 접속 시에는 직접 접속이 불가능하고 전용의 접속 기구인 코드 접속기를 사용해야 한다."],
[G,"01 직류기","직류 발전기에서 브러시와 접촉하여 전기자 권선에 유도되는 교류 기전력을 정류해서 직류로 만드는 부분은?",["계자","정류자","슬립링","전기자"],2,"계자: 주자속을 만드는 부분, 정류자: 발전된 교류를 직류로 바꾸어 주는 부분(AC→DC), 슬립링: 교류 전압을 외부로 흐르게 하는 부분, 전기자: 계자에서 발생한 주자속을 회전하며 끊어 기전력을 유기하는 부분"],

[T,"07 교류회로","전기회로에 100[V]라는 표시가 있다. 여기서 100[V]는 무엇을 나타내는가?",["최대값","실효값","평균값","파고율"],2,"정현파의 교류 실효값을 의미한다."],
[T,"02 전기회로 해석","그림에서 절점 B의 전위[V]는?",["130","110","100","90"],2,"회로에 흐르는 전류 I=110/(20+25+10)=2[A]. 절점 B의 전위는 110[V], 절점 C의 전위는 110−2×20=70[V]","110[V] 전원의 양(+)극에 연결된 절점 B에서 20[Ω]을 거쳐 C, 25[Ω]을 거쳐 D, 10[Ω]을 거쳐 A(전원 음극)로 돌아오는 직렬 회로."],
[S,"04 옥내 배선 공사","한국전기설비규정에 의하여 애자 공사를 건조한 장소에 시설하고자 한다. 사용 전압이 400[V] 초과인 경우 전선과 조영재 사이의 이격 거리는 최소 몇 [cm] 이상이어야 하는가?",["2.5","4.5","6.0","8.0"],1,"애자 공사 시 전선과 조영재 간의 간격(이격 거리): 400[V] 이하는 2.5[cm] 이상, 400[V] 초과는 4.5[cm] 이상(단, 건조한 장소는 2.5[cm] 이상)"],
[S,"02 배선재료와 공구","조명용 전등을 호텔 또는 여관 객실 입구에 설치할 경우 최대 몇 분 이내에 소등되는 타임 스위치를 시설하여야 하는가?",["1","2","3","4"],1,"타임 스위치 소등 시간: 일반 주택 및 아파트는 3분 이내 소등, 숙박 업소 입구는 1분 이내 소등"],
[G,"01 직류기","직류 발전기의 병렬운전 조건이 아닌 것은?",["전압이 같을 것","극성이 같을 것","수하 특성을 가질 것","용량이 같을 것"],4,"직류 발전기의 병렬운전 조건: 극성이 같을 것, 단자전압이 같을 것, 외부특성이 수하 특성일 것, 용량은 임의의 값이고 %부하 전류가 일치할 것. 특성이 일치할 경우 용량은 같지 않아도 된다."],
[T,"04 정전기와 콘덴서","비유전율이 9인 유전체 중에 1[cm]의 거리를 두고 1[μC]과 2[μC]의 두 점전하가 있을 때 서로 작용하는 힘[N]은?",["18[N]","20[N]","180[N]","200[N]"],2,"F=Q1Q2/(4πε0εs r²)=9×10⁹×Q1Q2/(εs r²)=9×10⁹×(1×10⁻⁶×2×10⁻⁶)/(9×(1×10⁻²)²)=20[N]"],
[G,"03 변압기","20[kVA]의 단상 변압기 2대를 사용하여 V-V 결선으로 하고 3상 전원을 얻고자 한다. 이때 여기에 접속시킬 수 있는 3상 부하의 용량은 약 몇 [kVA]인가?",["34.6","44.6","54.6","66.6"],1,"V 결선 3상 용량 PV=√3P=√3×20=34.6[kVA]"],
[T,"01 직류회로","원자핵의 구속력을 벗어나서 물질 내에서 자유로이 이동할 수 있는 것은?",["중성자","양자","분자","자유전자"],4,"원자핵의 구속력을 벗어나 자유롭게 이동하는 전자를 자유전자라 한다."],
[S,"03 전선의 접속","쥐꼬리 접속 시 접속하려는 두 전선의 피복을 벗긴 후 심선을 교차시킬 때 펜치로 비트는 교차각은 몇 도가 되도록 해야 하는가?",["30°","90°","120°","180°"],2,"펜치로 교차시킨 심선을 잡아당기면서 90°가 되도록 비틀어 2~3회 정도 꼰 후 끝을 잘라낸다."],
[S,"02 배선재료와 공구","450/750[V] 일반용 단심 비닐 절연전선의 약호는?",["NRI","NF","NFI","NR"],4,"NRI: 300/500[V] 기기 배선용 단심 비닐 절연전선, NF: 450/750[V] 일반용 유연성 단심 비닐 절연전선, NFI: 300/500[V] 기기 배선용 유연성 단심 비닐 절연전선, NR: 450/750[V] 일반용 단심 비닐 절연전선"],
[T,"06 전자유도 법칙과 인덕턴스","인덕턴스 L=20[mH]인 코일에 실효값 V=50[V], 주파수 f=60[Hz]인 정현파 전압을 인가했을 때 코일에 축적되는 평균 자기에너지 WL[J]은 약 얼마인가?",["6.3","4.4","0.63","0.44"],4,"코일에 축적되는 에너지 WL=½LI². 전류 I=V/XL=V/(2πfL)=50/(2×3.14×60×20×10⁻³)=6.63[A] ∴ WL=½×20×10⁻³×6.63²=0.44[J]"],
[T,"05 자기 성질과 자기장","전류에 의해 만들어지는 자기장의 자기력선 방향을 간단하게 알아내는 방법은?",["플레밍의 왼손 법칙","렌츠의 자기유도 법칙","앙페르의 오른나사 법칙","패러데이의 전자유도 법칙"],3,"앙페르의 오른나사 법칙: 전류에 의해 만들어지는 자기장의 방향을 결정하는 법칙. 플레밍의 오른손 법칙: 유도 기전력 방향, 플레밍의 왼손 법칙: 힘의 방향, 렌츠의 법칙: 유기되는 기전력의 방향, 패러데이의 전자유도 법칙: 도체가 시간당 자속의 변화를 가지면 도체에 기전력이 유기되는 법칙"],
[T,"08 3상 교류회로","전원과 부하가 다같이 Δ 결선된 3상 평형회로가 있다. 상전압이 200[V], 부하 임피던스가 Z=6+j8[Ω]인 경우 선전류는 몇 [A]인가?",["20","20/√3","20√3","10√3"],3,"상전류 IP=200/√(6²+8²)=200/10=20[A]. Δ 전선 연결(결선)에서 선전류와 상전류 관계 Il=√3IP ∴ Il=√3IP=√3×20=20√3[A]","Δ 결선된 3상 전원(Va, Vb, Vc)과 Δ 결선된 부하(Za, Zb, Zc)가 연결된 3상 평형회로."],
[T,"02 전기회로 해석","회로에서 단자 AB 간의 합성저항은 몇 [Ω]인가?",["10","12","15","30"],2,"병렬연결된 20[Ω]과 60[Ω] 합성저항 R'=(20×60)/(20+60)=15[Ω]. 전체 합성저항 R=((R'+15)×20)/((R'+15)+20)=((15+15)×20)/((15+15)+20)=12[Ω]","A에서 B로 15[Ω]을 지나 분기점에서 20[Ω]과 60[Ω]이 병렬로 연결, 그 뒤에 20[Ω] 저항이 A-B 사이에 추가로 병렬 연결된 회로."],
[G,"02 동기기","전기자를 고정시키고 자극 N, S를 회전시키는 동기 발전기는?",["회전 계자형","직렬 저항형","회전 전기자형","회전 정류자형"],1,"회전 계자형: 전기자를 고정시키고 계자를 회전시키는 방식이다. 동기 발전기에서는 주로 회전 계자형을 사용한다. 전기자 권선은 전압이 높고 전선 연결(결선)이 복잡하며 인출선도 많고, 계자회로는 직류 저전압 회로이므로 소요 전력도 적으며 인출선은 2개만 있으면 되고, 전기자보다 계자를 회전자로 하는 것이 기계적으로 튼튼하다."],
[S,"04 옥내 배선 공사","금속관 공사에서 사용되는 후강 전선관의 규격이 아닌 것은?",["22","28","36","48"],4,"후강 전선관의 호칭: 안지름(내경)의 크기에 가까운 짝수. 관의 종류(10종류): 16, 22, 28, 36, 42, 54, 70, 82, 92, 104[mm]"],
[S,"02 배선재료와 공구","배전반 및 분전반과 연결된 배관을 변경하거나 이미 설치되어 있는 캐비닛에 구멍을 뚫을 때 필요한 공구는?",["오스터","녹아웃 펀치","토치 램프","클리퍼"],2,"오스터: 금속관에 나사를 낼 때 사용. 녹아웃 펀치: 배전반이나 분전반 등의 금속제 캐비닛의 구멍을 확대하거나 철판의 구멍 뚫기에 사용하는 공구. 토치 램프: 합성 수지관 공사 시 가열용 램프. 클리퍼: 단면적 16[mm²] 이상인 굵은 전선의 절단용 공구"],
[G,"03 변압기","부흐홀츠 계전기의 설치 위치로 가장 적당한 것은?",["변압기 주 탱크 내부","콘서베이터 내부","변압기 고압 측 부싱","변압기 주 탱크와 콘서베이터 사이"],4,"부흐홀츠 계전기는 변압기 내부 고장으로 인한 보호용으로 사용되며 변압기의 주 탱크와 콘서베이터 사이에 설치한다. 절연유의 온도 상승 시 발생하는 유증기를 검출하여 권선 단락, 철심 고정 볼트의 절연 열화, 탭 전환기의 고장 등을 경보 및 차단하기 위한 용도로 사용된다."],
[G,"01 직류기","전기자 저항 0.1[Ω], 전기자 전류 104[A], 유도 기전력 110.4[V]인 직류 분권 발전기의 단자 전압[V]은?",["110","106","102","100"],4,"분권 발전기는 잔류 자기로 인한 낮은 전압이 전기자에 유기되어 이것이 전기자 저항과 계자 저항을 통해서 계자에 전류를 흘린다. 유도 기전력 E=V+IaRa, V=E−IaRa=110.4−(0.1×104)=100[V]"],
[S,"02 배선재료와 공구","가정용 전기 세탁기를 욕실에 설치하는 경우 콘센트의 규격은?",["접지극부 3극 15[A]","3극 15[A]","접지극부 2극 15[A]","2극 15[A]"],3,"욕실 또는 화장실 등 인체가 물에 젖어 있는 상태에서 전기를 사용하는 장소에 콘센트를 시설하는 경우에는 인체 감전 보호용 누전 차단기(정격 감도 전류 15[mA] 이하, 동작시간 0.03초 이하)를 전로에 접속하거나, 그것이 부착된 콘센트를 시설하여야 한다. 콘센트는 접지극이 있는 2극 15[A] 방수형 콘센트를 사용하여 접지하여야 한다."],
[G,"05 정류기 및 제어기기","다음 중 전력제어용 반도체 소자가 아닌 것은?",["LED","TRIAC","GTO","IGBT"],1,"LED(발광 다이오드)는 일정 전류를 흘리면 빛을 발하는 발광 소자이다. TRIAC은 양방향 3단자 사이리스터, GTO는 게이트에 역방향으로 전류를 흘려 자기 소호하는 사이리스터, IGBT는 대전류 고전압의 전기량을 제어할 수 있는 자기 소호형 소자로 모두 전력 제어용 소자이다."],
[S,"02 배선재료와 공구","한국전기설비규정에 의하면 옥외 백열전등의 인하선으로서 지표상의 높이 2.5[m] 미만인 부분은 공칭 단면적 몇 [mm²] 이상의 연동선과 동등 이상의 세기 및 굵기의 절연전선(옥외용 비닐 절연 전선을 제외)을 사용하는가?",["0.75","1.5","2.5","2.0"],3,"옥외 백열전등의 인하선으로서 지표상의 높이 2.5[m] 미만의 부분은 공칭 단면적 2.5[mm²] 이상의 연동선과 동등 이상의 세기 및 굵기의 절연전선을 사용한다.(단, OW 제외)"],
[T,"04 정전기와 콘덴서","등전위면을 따라 전하 Q[C]을 운반하는 데 필요한 일은?",["전하의 크기에 따라 변한다.","전위의 크기에 따라 변한다.","등전위면과 전기력선에 의하여 결정된다.","항상 0이다."],4,"등전위면에 있는 모든 점들은 전위차가 없기 때문에 등전위면을 따라 전하를 이동시켰을 때의 한 일은 0이 된다. ∴ W=0"],
[S,"06 전선로 및 배전선 공사","지선의 안전율은 2.5 이상으로 하여야 한다. 이 경우 허용 최저 인장 하중[kN]은 얼마 이상으로 하여야 하는가?",["4.31","6.8","9.8","0.68"],1,"지지선(지선)의 시설 규정: 안전율은 2.5 이상일 것, 지지선(지선)의 허용 인장 하중은 4.31[kN] 이상일 것, 소선 3가닥 이상의 아연 도금 연선일 것"],
[G,"04 유도기","단상 유도 전동기의 기동 방법 중 기동 토크가 가장 큰 것은?",["분상 기동형","반발 유도형","콘덴서 기동형","반발 기동형"],4,"단상 유도 전동기의 기동 토크가 큰 순서: 반발 기동형>반발 유도형>콘덴서 기동형>영구 콘덴서형>분상 기동형>셰이딩 코일형"],
[G,"03 변압기","낮은 전압을 높은 전압으로 승압할 때 일반적으로 사용되는 변압기의 3상 결선 방식은?",["Δ-Δ","Δ-Y","Y-Y","Y-Δ"],2,"Δ-Y 전선 연결(결선)은 발전소용 변압기와 같이 낮은 전압을 높은 전압으로 올리는 승압용 변압기에 주로 사용한다. Y-Δ 전선 연결(결선)은 수전단 변전소용 변압기와 같이 높은 전압을 낮은 전압으로 강압하는 경우에 주로 사용한다."],
[T,"04 정전기와 콘덴서","C=5[μF]인 평행판 콘덴서에 5[V]인 전압을 걸어 줄 때, 콘덴서에 축적되는 에너지는 몇 [J]인가?",["6.25×10⁻⁵[J]","6.25×10⁻³[J]","1.25×10⁻⁵[J]","1.25×10⁻³[J]"],1,"콘덴서에 축적되는 에너지 W=½QV=½CV²=½×5×10⁻⁶×5²=6.25×10⁻⁵[J]"],
[S,"07 고압 및 저압 배전반 공사","수·변전 설비의 고압 회로에 걸리는 전압을 표시하기 위해 전압계를 시설할 때 고압 회로와 전압계 사이에 시설하는 것은?",["수전용 변압기","계기용 변류기","계기용 변압기","권선형 변류기"],3,"고전압을 저전압으로 변성하여 측정계기나 보호 계전기에 전압을 공급하기 위한 전압 변성기를 계기용 변압기(PT)라 한다."],
[G,"01 직류기","분권 전동기에 대한 설명으로 옳지 않은 것은?",["토크는 전기자 전류의 자승에 비례한다.","부하전류에 따른 속도 변화가 거의 없다.","계자회로에 퓨즈를 넣어서는 안 된다.","계자권선과 전기자 권선이 전원에 병렬로 접속되어 있다."],1,"분권 전동기는 전기자와 계자권선이 병렬로 접속되어 있어서 단자전압이 일정하면 부하전류에 관계없이 자속은 일정하므로 타여자 전동기와 거의 동일한 특성을 가진다. 토크는 전기자 전류에 비례한다. 또한, 계자전류가 0이 되면 속도가 급격히 상승하여 위험하기 때문에 계자회로에 퓨즈를 넣어서는 안 된다."],
[G,"04 유도기","다음은 3상 유도 전동기 고정자 권선의 결선도를 나타낸 것이다. 맞는 사항을 고르면?",["3상 2극, Y 결선","3상 4극, Y 결선","3상 2극, Δ 결선","3상 4극, Δ 결선"],2,"전원이 A, B, C상으로 3상, C1과 A2가 마주 보고, C2와 A3가 등지고, C3와 A4가 마주 보고, C4와 A1이 등지는 상황으로 4극이 형성된다. A4, B4, C4가 모두 연결되어 Y 전선 연결(결선)이다.","코일 A1 B1 C1 A2 B2 C2 A3 B3 C3 A4 B4 C4가 한 줄로 늘어서 결선되고, 전원 A, B, C가 코일 쪽으로 들어가며 끝부분 A4·B4·C4가 한 점에 모두 연결됨."],
[G,"04 유도기","3상 유도 전동기의 2차 입력에 대한 기계적 출력비는?",["(Ns/N)×100[%]","(N/Ns)×100[%]","((Ns−N)/N)×100[%]","((Ns−N)/Ns)×100[%]"],2,"2차 입력 P2, 2차 동손 Pc2, 2차 출력 Po라 할 때 P2:Pc2:Po=1:s:(1−s). Po/P2=1−s=1−((Ns−N)/Ns)=(N/Ns)×100[%]"],
[T,"03 전류의 열작용과 화학작용","전류의 열작용과 관계가 있는 법칙은 어느 것인가?",["옴의 법칙","키르히호프의 법칙","줄의 법칙","플레밍의 오른손 법칙"],3,"줄의 법칙: 전류가 흐를 때 발생하는 열량 H=0.24I²Rt[cal]"],
[G,"04 유도기","3상 유도 전동기의 원선도를 그리는 데 필요하지 않은 것은?",["저항 측정","무부하 시험","구속 시험","슬립 측정"],4,"원선도는 정격 출력에 대한 전부하 전류, 역률, 효율, 슬립, 최대출력, 정격출력, 부하 회전력 및 최대 회전력을 구한다. 원선도 작성에 필요한 시험으로는 저항 측정 시험, 무부하 시험, 구속 시험 등이 있다."],
[S,"08 특수 장소 공사","사람이 상시 통행하는 터널 안 배선의 사용전압이 저압일 때 공사 방법으로 틀린 것은?",["금속관 공사","애자 공사","금속몰드 공사","합성수지관(두께 2[mm] 미만 및 난연성이 없는 것은 제외) 공사"],3,"금속관, 두께 2[mm] 이상의 합성수지관, 금속제 가요전선관, 케이블, 애자 공사 등에 준하여 시설한다. 금속몰드 공사는 사용 전압 400[V] 이하인 건조하고 전개된 장소에 시설하는 공사이다."],
[S,"09 전기응용 시설 공사","실내 전반 조명을 하고자 한다. 작업대로부터 광원까지의 높이가 2.4[m]인 위치에 조명 기구를 배치할 때 벽에서 한 기구 이상 떨어진 기구에서 기구 간의 거리는 일반적인 경우 최대 몇 [m]로 배치하여 설치하는가?",["1.8","2.4","3.2","3.6"],4,"작업대로부터 광원까지의 높이가 H[m]인 경우 등 간격은 S≤1.5H이므로 S≤1.5×2.4=3.6[m]이다."],
];

EX[22]=[
[S,"07 고압 및 저압 배전반 공사","낙뢰, 수목 접촉, 일시적인 섬락 등 순간적인 사고로 계통에서 분리된 구간을 신속히 계통에 재투입시켜 계통의 안정도를 향상시키고 정전 시간을 단축시키기 위해 사용되는 계전기는?",["과전류 계전기","거리 계전기","재폐로 계전기","차동 계전기"],3,"재연결(재폐로) 계전기: 계통을 안정시키기 위해서 재연결(재폐로)로 차단기와 조합하여 사용한다. 송전 선로에 고장이 발생하면 고장을 일으킨 구간을 신속히 고속 차단하여 제거한 후 재투입시켜서 정전 구간을 단축하는 계전기이다."],
[G,"04 유도기","역률과 효율이 좋아서 가정용 선풍기, 전기세탁기, 냉장고 등에 주로 사용되는 것은?",["분상 기동형 전동기","콘덴서 기동형 전동기","반발 기동형 전동기","셰이딩 코일형 전동기"],2,"단상 유도 전동기는 기동 방법에 따라 분상 기동형, 콘덴서 기동형(2차 콘덴서형, 영구콘덴서형), 반발 기동형, 셰이딩 코일형 등으로 분류한다. 이중 콘덴서 기동형은 원심력 스위치가 없고 가격도 싸며, 보수할 필요가 적고, 큰 기동 토크를 요구하지 않는 선풍기, 냉장고, 세탁기 등에 널리 사용된다."],
[G,"03 변압기","다음 중 변압기의 1차 측이란?",["고압 측","저압 측","전원 측","부하 측"],3,"일반적으로 전력이 들어가는 전원 측을 1차(P: primary), 나오는 부하 측을 2차(S: secondary)라고 한다."],
[S,"05 전선 및 기계기구의 보안공사","과전류 차단기로서 저압전로에 사용되는 산업용 배선차단기에 있어서 정격전류가 32[A]인 회로에 50[A]의 전류가 흘렀을 때 몇 분 이내에 자동적으로 동작하여야 하는가?",["30분","60분","120분","180분"],2,"과전류 차단기로 저압전로에 사용되는 산업용 배선차단기의 동작시간: 정격전류 63[A] 이하는 규정시간 60분(부동작전류 1.05배, 동작전류 1.3배), 63[A] 초과는 120분"],
[G,"04 유도기","50[kW]의 농형 유도 전동기를 기동하려고 할 때 다음 중 가장 적당한 기동방법은?",["분상 기동법","기동 보상기법","권선형 기동법","2차 저항 기동법"],2,"전전압 기동법: 5[kW] 이하, Y-Δ 기동법: 5~15[kW] 정도, 기동 보상기법: 단권 변압기를 써서 공급전압을 낮추어 기동시키는 방법으로 15[kW] 이상에 적용. 권선형 유도 전동기의 기동법은 2차 저항법이 적용된다."],
[T,"04 정전기와 콘덴서","정전계에 주어진 전하분포에 의하여 발생되는 전계의 세기를 구하려고 할 때 적당하지 않은 방법은?",["쿨롱의 법칙을 이용하여 구한다.","전위를 이용하여 구한다.","가우스 법칙을 이용하여 구한다.","비오-사바르의 법칙에 의하여 구한다."],4,"쿨롱의 법칙으로 전계 E=(1/4πε)×(Q/r²)[V/m]를 구한다. 전위를 먼저 구하여 전계 E=−gradV를 이용하여 구한다. 가우스 법칙으로 전속밀도 D를 구한 다음 D=εE의 관계를 이용하여 전계 E를 구한다. 비오-사바르 법칙은 자계를 구하는 법칙이다."],
[G,"03 변압기","34극, 60[MVA], 역률 0.8, 60[Hz], 22.9[kV] 수차 발전기의 전부하 손실이 1,600[kW]이면 전부하 효율[%]은?",["90","95","97","99"],3,"효율 η=출력/(출력+손실)×100=(60×0.8)/((60×0.8)+1.6)×100≒97[%]"],
[G,"04 유도기","다음 설명 중 틀린 것은?",["3상 유도 전압 조정기의 회전자 권선은 분로 권선이고, Y 결선으로 되어 있다.","디프 슬롯형 전동기는 냉각 효과가 좋아 기동 정지가 빈번한 중·대형 저속기에 적당하다.","누설 변압기가 네온사인이나 용접기의 전원으로 알맞은 이유는 수하 특성 때문이다.","계기용 변압기의 2차 표준은 110/220[V]로 되어 있다."],4,"계기용 변압기의 2차 표준은 110[V]로 되어 있다."],
[S,"03 전선의 접속","전선의 접속에 대한 설명으로 틀린 것은?",["접속 부분의 전기 저항을 20[%] 이상 증가되도록 한다.","접속 부분의 인장 강도를 80[%] 이상 유지되도록 한다.","접속 부분에 전선 접속 기구를 사용한다.","알루미늄 전선과 구리선의 접속 시 전기적인 부식이 생기지 않도록 한다."],1,"전선 접속 시 주의 사항: 접속 부분의 전기 저항을 증가시키지 말 것, 접속 부분의 인장 강도는 80[%] 이상 유지할 것, 접속 부분의 인장 하중을 20[%] 이상 감소시키지 말 것, 이종(서로 성질이 다른 전선) 전선의 접속 시는 부식 고려"],
[S,"03 전선의 접속","전선 접속 시 사용되는 슬리브(Sleeve)의 종류가 아닌 것은?",["E형","S형","D형","P형"],3,"전선 접속 시 사용되는 슬리브(Sleeve)의 종류에는 C형, S형, E형, P형 등이 있다."],
[G,"01 직류기","직류기의 전기자 철심을 규소강판으로 성층하여 만드는 이유는?",["가공하기 쉽다.","가격이 염가이다.","철손을 줄일 수 있다.","기계손을 줄일 수 있다."],3,"철심은 자기회로를 만드는 부분으로 회전에 따른 자속 방향이 수시로 변화하면서 와전류(성층 철심으로 감소) 손실이나 히스테리시스(규소강판 사용으로 감소) 현상에 의한 철손이 생기게 된다. 따라서 계자(전기자) 철심은 이 철손을 줄이기 위해서 두께 0.35[mm]~0.5[mm] 정도의 얇은 규소강판을 성층하여 만든다."],
[T,"05 자기 성질과 자기장","다음 중 기자력(Magneto-motive Force)에 대한 설명으로 옳지 않은 것은?",["전기회로의 기전력에 대응한다.","코일에 전류를 흘렸을 때 전류 밀도와 코일의 권수의 곱의 크기와 같다.","자기회로의 자기저항과 자속의 곱과 동일하다.","SI 단위는 암페어[A]이다."],2,"기자력은 전류와 코일 권수의 곱으로 정의한다. F=NI=Rmφ[AT] (전류 밀도가 아니라 전류와 권수의 곱이다.)"],
[G,"01 직류기","직류 전동기의 출력이 50[kW], 회전수가 1,800[rpm]일 때 토크는 약 몇 [kg·m]인가?",["12","23","27","31"],3,"T=(60/2π)×(Po/N)[N·m], T=(1/9.8)×(60/2π)×(Po/N)[kg·m]. T=(1/9.8)×(60/2π)×(50×10³/1,800)=27[kg·m]"],
[T,"04 정전기와 콘덴서","같은 규격의 축전지 2개를 병렬로 연결하면?",["전압과 용량 모두 2배가 된다.","전압과 용량 모두 1/2이 된다.","전압은 그대로, 용량은 2배가 된다.","전압은 2배, 용량은 그대로이다."],3,"축전지 n개를 직렬연결 시: 전압은 n배, 용량은 1/n배. 축전지 n개를 병렬연결 시: 전압은 그대로, 용량은 n배"],
[S,"03 전선의 접속","전선의 접속법에서 두 개 이상의 전선을 병렬로 사용하는 경우의 시설 기준으로 틀린 것은?",["각 전선의 굵기는 동선인 경우 50[mm²] 이상이어야 한다.","각 전선의 굵기는 알루미늄인 경우 70[mm²] 이상이어야 한다.","병렬로 사용하는 전선은 각각에 퓨즈를 설치할 것","동극의 각 전선은 동일한 터미널 러그에 완전히 접속할 것"],3,"병렬로 접속해서 각각 전선에 퓨즈를 설치한 경우 만약 한 선의 퓨즈가 용단될 때 다른 한 선으로 전류가 모두 흘러 위험해지므로 퓨즈를 설치하면 안 된다."],
[G,"03 변압기","변압기, 동기기 등의 층간 단락 등의 내부고장 보호에 사용되는 계전기는?",["차동 계전기","접지 계전기","과전압 계전기","역상 계전기"],1,"차동 계전기: 고장 또는 이상 현상에 의해 생긴 불평형의 전류차가 기준치 이상이 되었을 때 동작하는 계전기이다. 변압기, 동기기 등의 내부고장 검출용으로 사용한다."],
[T,"07 교류회로","다음 중 LC 직렬회로의 공진 조건으로 옳은 것은?",["1/(ωL)=ωC+R","직류 전원을 가할 때","ωL=ωC","ωL=1/(ωC)"],4,"직렬회로 공진 조건: ωL=1/(ωC), 병렬회로 공진 조건: ωC=1/(ωL)"],
[T,"04 정전기와 콘덴서","등전위면(Equipotential Surface)에 대한 설명으로 옳은 것은?",["전기력선은 등전위면을 평행하게 지나간다.","전하를 갖고 등전위면에 따라 이동하면 일이 생긴다.","다른 전위의 등전위면은 서로 교차한다.","점전하가 만드는 전계의 등전위면은 동심구면이다."],4,"전기장 안에서 전위가 같은 점을 연결하여 이루어진 면이다. 등전위면은 동심폐곡면이고 교차하지 않는다. 전하에서 나오는 전기력선은 등전위면과 수직이다. 등전위면에서 전하를 이동하면 일의 양은 0이다."],
[T,"03 전류의 열작용과 화학작용","㉠, ㉡에 들어갈 내용으로 알맞은 것은? \"2차 전지의 대표적인 것으로 납축전지가 있다. 전해액으로 비중 약(㉠) 정도의 (㉡)을 사용한다.\"",["㉠ 1.15~1.21, ㉡ 묽은 황산","㉠ 1.25~1.36, ㉡ 질산","㉠ 1.01~1.15, ㉡ 질산","㉠ 1.23~1.36, ㉡ 묽은 황산"],4,"보통 전해액은 비중 1.23~1.36인 묽은 황산을 사용한다."],
[G,"05 정류기 및 제어기기","다음 중 턴오프(소호)가 가능한 소자는?",["GTO","TRIAC","SCR","LASCR"],1,"GTO(게이트 턴 오프 사이리스터)는 게이트에 역방향으로 전류를 흘리면 자기 소호하는 사이리스터이다. TRIAC, SCR, LASCR은 게이트 신호로 소호할 수 없다."],
[T,"04 정전기와 콘덴서","두 개의 자하 m1, m2 사이에 작용되는 쿨롱의 법칙으로서 자하 간의 자기력에 대한 설명으로 옳지 않은 것은?",["두 자하가 동일 극성이면 반발력이 작용한다.","두 자하가 서로 다른 극성이면 흡인력이 작용한다.","두 자하의 거리에 반비례한다.","두 자하의 곱에 비례한다."],3,"쿨롱의 법칙 F=(m1m2)/(4πμ0μs r²)=6.33×10⁴×(m1m2)/(μs r²)[N]. 두 자하 사이에 작용하는 힘은 두 자하의 곱에 비례, 두 자하의 거리 제곱에 반비례한다."],
[G,"03 변압기","변압기의 정격 출력으로 맞는 것은?",["정격 1차 전압×정격 1차 전류","정격 1차 전압×정격 2차 전류","정격 2차 전압×정격 1차 전류","정격 2차 전압×정격 2차 전류"],4,"변압기의 정격출력이란 정격 2차 전압, 정격 2차 전류, 정격 주파수 및 정격역률로 2차 단자 사이에서 얻을 수 있는 피상전력을 말하고 [VA], [kVA] 또는 [MVA] 등으로 표시한다."],
[G,"04 유도기","회전수 1,728[rpm]인 유도 전동기의 슬립[%]은?(단, 동기속도는 1,800[rpm]이다.)",["2","3","4","5"],3,"s=(Ns−N)/Ns×100=(1,800−1,728)/1,800×100=4[%]"],
[S,"06 전선로 및 배전선 공사","전주 외등 설치 시 백열전등 및 형광등의 조명기구를 전주에 부착하는 경우 부착한 점으로부터 돌출되는 수평거리는 몇 [m] 이내로 하여야 하는가?",["0.5","0.8","1.0","1.2"],3,"백열전등 및 형광등에 있어서는 기구를 전주에 부착한 점으로부터 돌출되는 수평거리는 1[m] 이내로 할 것"],
[G,"02 동기기","동기 발전기에서 비돌극기의 출력이 최대가 되는 부하각(Power Angle)은?",["0°","45°","90°","180°"],3,"비돌극기의 출력은 부하각 δ=90°에서 최대, 철극(돌극)기에서는 δ=60°에서 최대이다."],
[G,"02 동기기","동기기에서 사용되는 절연재료로 B종 절연물의 온도 상승 한도는 약 몇 [℃]인가?(단, 기준온도는 공기 중에서 40[℃]이다.)",["65","75","90","130"],3,"B종 절연물의 최고 허용온도는 130[℃]이고 기준온도는 공기 중에서 40[℃]이므로 90[℃] 상승이 가능하다. (Y종 90, A종 105, E종 120, B종 130, F종 155, H종 180, C종 180 초과)"],
[T,"07 교류회로","저항 50[Ω]인 전구에 e=100√2 sin ωt[V]의 전압을 가할 때 순시전류[A]값은?",["√2 sin ωt","2√2 sin ωt","5√2 sin ωt","10√2 sin ωt"],2,"순시전류 i=e/R=(100√2 sin ωt)/50=2√2 sin ωt[A]"],
[G,"01 직류기","직류 발전기에서 전압정류의 역할을 하는 것은?",["보극","탄소 브러시","전기자","리액턴스 코일"],1,"정류전압은 전기자 코일에서 발생하는 평균 리액턴스 전압과 반대 극성의 전압을 유도시켜 평균 리액턴스 전압을 제거한다. 이것을 위해 주 자극 사이에 보극을 설치한다."],
[G,"02 동기기","6극, 36 슬롯, 3상 동기 발전기의 매극 매상당 슬롯(코일 수) 수는?",["2","3","4","5"],1,"매극 매상당 슬롯 수=전체 슬롯(홈)수/(극수×상수)=36/(6×3)=2"],
[T,"02 전기회로 해석","다음과 같이 변환 시 R1+R2+R3의 값[Ω]은?(단, Rab=2[Ω], Rbc=4[Ω], Rca=6[Ω]이다.)",["1.57[Ω]","2.67[Ω]","3.67[Ω]","4.87[Ω]"],3,"Δ 결선 임피던스를 Y 결선 임피던스로 변환. R1=(Rab×Rca)/(Rab+Rbc+Rca)=12/12=1[Ω], R2=(Rab×Rbc)/12=8/12=0.67[Ω], R3=(Rbc×Rca)/12=24/12=2[Ω]. ∴ R1+R2+R3=1+0.67+2=3.67[Ω]","Rab, Rbc, Rca로 이루어진 Δ 회로를 R1, R2, R3의 Y 회로로 변환하는 그림."],
[S,"04 옥내 배선 공사","금속관 공사에서 녹아웃의 지름이 금속관의 지름보다 큰 경우에 사용하는 재료는?",["링 리듀서","부싱","커넥터","로크너트"],1,"링 리듀서: 금속관을 아웃렛 박스에 접속할 때 박스 지름이 관보다 클 경우 사용하는 보조 접속 기구"],
[T,"06 전자유도 법칙과 인덕턴스","그림과 같은 환상철심에 A, B의 코일이 감겨있다. 전류 I가 120[A/s]로 변화할 때, 코일 A에 90[V], 코일 B에 40[V]의 기전력이 유도된 경우, 코일 A의 자기인덕턴스 L1[H]과 상호인덕턴스 M[H]의 값은 얼마인가?",["L1=0.75, M=0.33","L1=1.25, M=0.7","L1=1.75, M=0.9","L1=1.95, M=1.1"],1,"코일 A에 유도되는 기전력 VA=L1(dI/dt), L1=VA/(dI/dt)=90/120=0.75[H]. 코일 B에 발생하는 전압 EB=M(dI/dt), M=EB/(dI/dt)=40/120=0.33[H]","환상철심에 코일 A(전류 I가 들어감)와 코일 B가 감겨 있고 각각 두 단자가 있는 그림."],
[G,"04 유도기","전동기의 제동에서 전동기가 가지는 운동에너지를 전기에너지로 변화시키고 이것을 전원에 반환하여 전력을 회생시킴과 동시에 제동하는 방법은?",["발전 제동(Dynamic braking)","역전 제동(Plugging braking)","맴돌이 전류 제동(Eddy current braking)","회생 제동(Regenerative braking)"],4,"회생 제동: 유도 전동기를 전원에 연결시킨 상태로 동기속도 이상의 속도에서 운전하여 유도 발전기로 동작시켜(s<0) 제동하며 발생 전력을 전원에 반환하는 방법이다. 발전 제동은 발생 전력을 저항에서 열로 소비하며, 역상 제동은 1차 측 3선 중 두 선을 바꾸어 접속하는 방법이다."],
[G,"01 직류기","복권 발전기의 병렬운전을 안전하게 하기 위해서 두 발전기의 전기자와 직권 권선의 접촉점에 연결해야 하는 것은?",["균압선","집전환","안정저항","브러시"],1,"복권 발전기에는 직권 계자 권선이 있어 균압선이 없이는 안정된 병렬운전을 할 수 없다. 안정 운전을 위해서는 굵은 도선으로 된 균압선을 설치한다."],
[T,"03 전류의 열작용과 화학작용","두 종류의 금속을 접속하여 두 접합 부분을 다른 온도로 유지하면 열기전력을 일으켜 열전류가 흐른다. 이 현상을 지칭하는 것은?",["제벡 효과","제3금속의 법칙","펠티에 효과","패러데이의 법칙"],1,"제벡 효과(Seebeck Effect): 서로 다른 금속을 접합하여 폐회로를 만든 후 두 접합점의 온도를 다르게 했을 때 폐회로에 열기전력이 발생하여 열전류가 흐르는 현상"],
[S,"02 배선재료와 공구","전선의 약호 중 \"H\"가 의미하는 것은?",["전열용 절연 전선","네온 전선","내열용 절연 전선","경동선"],4,"경동선의 약호는 \"H\"이다. 거칠게 뺀 구리(동)선을 황에 담궈 표면의 산화동을 씻어 낸 다음 정상 온도에서 다이스를 통하여 늘린 전선이다."],
[T,"07 교류회로","i=20√2 sin(377t−π/6)[A]인 파형의 주파수는 몇 [Hz]인가?",["50","60","70","80"],2,"ω=377[rad/s]=2πf ∴ f=377/(2×3.14)=60[Hz]"],
[S,"02 배선재료와 공구","다음 그림 기호의 배선 명칭은?(굵은 실선 한 줄)",["노출 배선","천장 은폐 배선","바닥 은폐 배선","바닥면 노출 배선"],2,"천장 은폐 배선은 실선, 노출 배선은 파선(긴 점선), 바닥 은폐 배선은 점선, 지중 매설 배선은 일점쇄선","가로로 그은 굵은 실선 한 줄."],
[S,"02 배선재료와 공구","굵은 전선이나 케이블을 절단할 때 사용되는 공구는?",["플라이어","펜치","나이프","클리퍼"],4,"클리퍼: 굵은 전선이나 볼트 절단 시 사용하는 공구"],
[T,"01 직류회로","2[C]의 전기량이 이동을 하여 10[J]의 일을 하였다면 두 점 사이의 전위차는 몇 [V]인가?",["0.2[V]","0.5[V]","5[V]","20[V]"],3,"V=W/Q=10/2=5[V]"],
[T,"09 비정현파","비정현파의 종류에 속하는 직사각형파의 전개식에 기본파의 진폭[V]은?(단, Vm=20[V], T=10[ms])",["23.46[V]","24.46[V]","25.46[V]","26.46[V]"],3,"직사각형파의 진폭 V=(4/π)Vm ∴ 진폭 V=(4/π)×20=25.46[V]"],
[S,"06 전선로 및 배전선 공사","한국전기설비규정에 의하여 고압 옥측 전선로를 시설할 경우 수관, 가스관 또는 이와 유사한 것과 접근하거나 교차하는 경우에 고압 옥측 전선로의 전선과 이들 사이의 이격 거리는 몇 [cm] 이상이어야 하는가?",["15","30","60","45"],1,"고압 옥측 전선로의 전선이 수관, 가스관 또는 이와 유사한 것과 접근하거나 교차하는 경우에는 고압 옥측 전선로의 전선과 이들 사이의 간격(이격 거리)은 15[cm] 이상이어야 한다."],
[S,"08 특수 장소 공사","가연성 분진에 전기 설비가 발화원이 되어 폭발의 우려가 있는 곳에 시설하는 저압 옥내 배선 공사 방법이 아닌 것은?",["애자 공사","케이블 공사","두께 2[mm] 이상 합성 수지관 공사","금속관 공사"],1,"가연성 먼지(분진)로 인하여 폭발할 우려가 있는 저압 옥내 설비 공사는 금속관 공사, 케이블 공사, 두께 2[mm] 이상의 합성 수지관 공사 등에 의하여 시설한다."],
[S,"06 전선로 및 배전선 공사","고압 및 특고압용 기계기구의 시설에 있어 고압용 변압기는 시가지 외에 시설하는 경우 지표상 ( )[m] 이상 높이에 시설하여야 한다.",["5","4.5","4","3.5"],3,"고압용 기계기구 시설 시 지표상 높이: 시가지 내 4.5[m] 이상, 시가지 외 4[m] 이상"],
[T,"03 전류의 열작용과 화학작용","저항 20[Ω]인 전열기로 21.6[kcal]의 열량을 발생시키려면 5[A]의 전류를 약 몇 분간 흘려주면 되는가?",["3분","5.7분","7.2분","18분"],1,"줄의 법칙에서 H=I²Rt[J]=0.24I²Rt[cal]. t=H/(0.24I²R)=(21.6×10³)/(0.24×5²×20)=180초=3분"],
[S,"02 배선재료와 공구","ACSR 약호의 품명은?",["경동연선","중공연선","알루미늄선","강심 알루미늄 연선"],4,"ACSR은 합성 연선의 대표적인 전선으로 강심 알루미늄 연선을 나타낸다."],
[S,"06 전선로 및 배전선 공사","하나의 수용 장소의 인입선 접속점에서 분기하여 지지물을 거치지 아니하고 다른 수용장소의 인입선 접속점에 이르는 전선은?",["연접 인입선","구내 인입선","가공 인입선","옥측 배선"],1,"이웃 연결(연접) 인입선: 하나의 수용 장소의 인입선 접속점에서 분기하여 지지물을 거치지 아니하고 다른 수용장소의 인입선 접속점에 이르는 전선. 분기점으로부터 100[m]를 초과하지 않을 것, 중도에 접속점을 두지 않도록 할 것, 폭 5[m]를 넘는 도로를 횡단하지 않도록 할 것, 옥내를 통과하지 않도록 할 것"],
[T,"04 정전기와 콘덴서","정전기 발생 방지책으로 틀린 것은?",["대전 방지제의 사용","접지 및 보호구의 착용","배관 내 액체의 흐름 속도 제한","대기의 습도를 30[%] 이하로 하여 건조함을 유지"],4,"습도를 높게 해야 정전기가 발생하지 않는다."],
[T,"09 비정현파","기본파의 3[%]인 제3고조파와 4[%]인 제5고조파, 1[%]인 제7고조파를 포함하는 전압파의 왜형률은?",["약 2.7[%]","약 5.1[%]","약 7.7[%]","약 14.1[%]"],2,"왜형률=고조파 실효값/기본파 실효값×100[%]=√(V2²+V3²+…)/V1×100. 왜형률=√(3²+4²+1²)/100×100[%]=5.1[%]"],
[S,"02 배선재료와 공구","전기 저항이 작고, 부드러운 성질이 있어 구부리기가 용이하므로 주로 옥내 배선에 사용하는 구리선의 명칭은?",["경동선","연동선","합성 연선","중공 전선"],2,"구리선의 종류: 경동선은 인장 강도가 뛰어나므로 주로 옥외 전선로에서 사용, 연동선은 부드럽고 가요성이 뛰어나므로 주로 옥내 배선에서 사용"],
[S,"05 전선 및 기계기구의 보안공사","최대 사용 전압이 70[kV]인 중성점 직접 접지식 전로의 절연 내력 시험 전압은 몇 [V]인가?",["35,000","50,400","44,800","42,000"],2,"최대 사용 전압이 60[kV] 초과인 중성점 직접 접지식 전로의 절연 내력 시험은 최대 사용 전압의 0.72배의 전압을 연속으로 10분간 가할 때 견디는 것으로 하여야 한다. 시험 전압=70,000×0.72=50,400[V]"],
[S,"06 전선로 및 배전선 공사","전주 외등 설치 시 백열전등 및 형광등의 조명기구를 전주에 부착하는 경우 부착한 점으로부터 돌출되는 수평거리는 몇 [m] 이내로 하여야 하는가?",["0.5","0.8","1.0","1.2"],3,"백열전등 및 형광등에 있어서는 기구를 전주에 부착한 점으로부터 돌출되는 수평거리는 1[m] 이내로 할 것"],
[T,"06 전자유도 법칙과 인덕턴스","패러데이 법칙에서 유도기전력 e[V]를 옳게 표현한 것은?",["e=−(1/N)(dφ/dt)","e=−(1/N²)(dφ/dt)","e=−N(dφ/dt)","e=−N²(dφ/dt)"],3,"패러데이 렌츠 법칙: e=−N(dφ/dt)[V]. 패러데이 법칙은 유도기전력 크기를 결정하고, 렌츠 법칙은 유도기전력 방향(−)을 결정한다."],
[S,"02 배선재료와 공구","금속관 공사를 노출로 시공할 때 직각으로 구부러지는 곳에는 어떤 배선 기구를 사용하는가?",["유니언 커플링","아웃렛 박스","픽스처 히키","유니버설 엘보"],4,"직각 배관 시 사용하는 기구: 유니버설 엘보는 노출 배관 시 직각 배관, 노멀 밴드는 매입 배관 공사 시 직각 배관"],
[G,"03 변압기","3상 변압기의 병렬운전 시 병렬운전이 불가능한 결선 조합은?",["Δ-Δ와 Y-Y","Δ-Δ와 Δ-Y","Δ-Y와 Δ-Y","Δ-Δ와 Δ-Δ"],2,"병렬운전 가능: Δ-Δ와 Δ-Δ, Δ-Y와 Δ-Y, Y-Y와 Y-Y, Y-Δ와 Y-Δ, Δ-Δ와 Y-Y, Δ-Y와 Y-Δ. 병렬운전 불가능: Δ-Δ와 Δ-Y, Y-Y와 Δ-Y. (Δ와 Y의 개수가 각각 짝수 개 여야 한다.)"],
[G,"05 정류기 및 제어기기","다음 중 유도 전동기의 속도 제어에 사용되는 인버터 장치의 약호는?",["CVCF","VVVF","CVVF","VVCF"],2,"VVVF(Variable Voltage Variable Frequency): 가변전압 가변 주파수 제어(유도 전동기의 속도 제어에 사용). CVCF는 정전압 정주파수, CVVF는 정전압 가변 주파수, VVCF는 가변전압 정주파수 제어"],
[S,"07 고압 및 저압 배전반 공사","수변전 설비에서 차단기의 종류 중 가스 차단기에 들어가는 가스의 종류는?",["CO2","LPG","SF6","LNG"],3,"가스 차단기에 들어가는 가스의 종류는 SF6(육불화황) 가스이다. 무색, 무취, 무독성, 불활성이며 비중은 공기의 5배 정도, 소호능력은 공기의 100배, 절연내력은 공기의 2~3배이다."],
[T,"04 정전기와 콘덴서","정전용량 6[μF], 극간거리 2[mm]의 평행 평판 콘덴서에 300[μC]의 전하를 주었을 때 극판 간의 전계는 몇 [V/mm]인가?",["25","50","150","200"],1,"전압 V=Q/C=(300×10⁻⁶)/(6×10⁻⁶)=50[V]. E=V/d=50/(2×10⁻³)=25×10³[V/m]=25[V/mm]"],
[T,"03 전류의 열작용과 화학작용","분류기를 사용하여 전류를 측정하는 경우 전류계의 내부 저항이 0.12[Ω], 분류기 저항이 0.03[Ω]이면 그 배율은?",["4","5","15","36"],2,"분류기 회로에서 IA=(RA/(RA+r))×I → I/IA=(RA+r)/RA=1+r/RA=m (RA: 분류기 저항, r: 내부 저항). m=1+0.12/0.03=5","전류계(내부저항 r)에 분류기 저항 RA가 병렬로 연결되고 전원 V와 전체 전류 I가 흐르는 회로."],
[G,"03 변압기","발전기를 정격전압 220[V]로 전부하 운전하다가 무부하로 운전하였더니 단자전압이 242[V]가 되었다. 이 발전기의 전압변동률[%]은?",["10","14","20","25"],1,"전압변동률 ε=(V20−V2n)/V2n×100[%]=(242−220)/220×100=10[%]"],
];

EX[23]=[
[T,"04 정전기와 콘덴서","동일한 용량의 콘덴서 5개를 병렬로 접속하였을 때의 합성용량을 Cp라고 하고, 5개를 직렬로 접속하였을 때의 합성용량을 Cs라 할 때 Cp와 Cs의 관계는?",["Cp=5Cs","Cp=10Cs","Cp=25Cs","Cp=50Cs"],3,"병렬연결 시 합성 정전용량 Cp=5C, 직렬연결 시 합성 정전용량 Cs=C/5. Cp/Cs=5C/(C/5)=25 ∴ Cp=25Cs"],
[T,"08 3상 교류회로","각 상의 임피던스가 6+j8[Ω]인 평형 Y 부하에 선간전압 220[V]인 대칭 3상 전압을 가하였을 때 선전류는?",["10.7[A]","11.7[A]","12.7[A]","13.7[A]"],3,"Y 결선에서 선전류 Il=Ip(상전류), 선간전압 Vl=√3Vp. Vp=Vl/√3=220/√3[V], |Z|=√(6²+8²)=10이므로 선전류 Il=Ip=Vp/|Z|=(220/√3)/√(6²+8²)=12.7[A]"],
[T,"03 전류의 열작용과 화학작용","제벡 효과에 대한 설명으로 틀린 것은?",["두 종류의 금속을 접속하여 폐회로를 만들고, 두 접속점에 온도의 차이를 주면 기전력이 발생하여 전류가 흐른다.","열기전력의 크기와 방향은 두 금속 점의 온도 차에 따라서 정해진다.","열전쌍(열전대)은 두 종류의 금속을 조합한 장치이다.","전자 냉동기, 전자 온풍기에 응용된다."],4,"제벡 효과: 서로 다른 금속을 결합하여 폐회로를 만든 후 두 접합점의 온도를 다르게 했을 때 폐회로에 열기전력이 발생하여 열전류가 흐르는 현상. 전자 냉동기, 전자 온풍기에는 펠티에 효과가 이용된다."],
[G,"02 동기기","3상 동기 전동기의 출력(P)을 부하각으로 나타낸 것은?(단, V는 1상의 단자 전압, E는 역기전력, xs는 동기 리액턴스, δ는 부하각이다.)",["P=3VE sinδ[W]","P=3VE sinδ/xs[W]","P=3VE cosδ/xs[W]","P=3VE cosδ[W]"],2,"단상 동기 전동기 출력은 P=VE sinδ/xs[W]으로서 3상 동기 전동기 출력은 P3=3P=3VE sinδ/xs[W]이다."],
[S,"05 전선 및 기계기구의 보안공사","일반적으로 학교 건물이나 은행 건물 등의 간선의 수용률은 얼마인가?(단, 부하가 10[kVA] 초과하는 경우이다.)",["50[%]","60[%]","70[%]","80[%]"],3,"부하가 10[kVA] 초과 시 학교 건물이나 은행 건물 등의 간선의 수용률은 70[%]를 적용한다. (주택, 아파트, 기숙사, 여관, 호텔, 병원은 10[kVA] 초과 시 50[%])"],
[T,"05 자기 성질과 자기장","평균 반지름이 10[cm]이고 감은 횟수 10회의 원형 코일에 5[A]의 전류를 흐르게 하면 코일 중심의 자장의 세기 [AT/m]는?",["250","500","750","1,000"],1,"원형 코일의 중심자계 H=NI/(2a) (a: 코일의 반지름, N: 코일 수, I: 전류). H=(10×5)/(2×10×10⁻²)=250[AT/m]"],
[S,"07 고압 및 저압 배전반 공사","수변전 설비의 고압 회로에 걸리는 전압을 표시하기 위해 전압계를 시설할 때 고압회로와 전압계 사이에 시설하는 것은?",["관통형 변압기","계기용 변류기","계기용 변압기","권선형 변류기"],3,"고전압을 저전압으로 변성하여 측정계기나 보호 계전기에 전압을 공급하기 위한 계기를 계기용 변압기(PT)라 한다."],
[S,"08 특수 장소 공사","무대, 오케스트라 박스 등 흥행장의 저압 옥내 배선 공사의 사용 전압은 몇 [V] 이하인가?",["200","300","400","600"],3,"흥행장의 저압 옥내 배선 공사: 금속관, 케이블, 두께 2[mm] 이상 합성 수지관, 캡타이어 케이블. 사용 전압: 400[V] 이하"],
[T,"09 비정현파","입력 전원 전압이 vs=Vm sinθ인 경우, 다음 그림의 전파 다이오드 정류기의 출력전압(v0(t))에 대한 평균치와 실효치를 각각 옳게 나타낸 것은?",["평균치: Vm/π, 실효치: Vm/2","평균치: Vm/2, 실효치: Vm/π","평균치: Vm/(2π), 실효치: Vm/√2","평균치: 2Vm/π, 실효치: Vm/√2"],4,"입력 전압이 Vm sinθ인 전파 정류회로의 평균값은 2Vm/π이고, 실효값은 Vm/√2이다.","교류 전원 vs에 다이오드 D1~D4 브리지가 연결되고 출력 쪽에 부하저항 R, 출력전압 v0(t)와 전류 i0(t)가 표시된 전파 정류 회로."],
[G,"02 동기기","동기 발전기를 회전 계자형으로 하는 이유가 아닌 것은?",["고전압에 견딜 수 있게 전기자 권선을 절연하기가 쉽다.","전기자 단자에 발생한 고전압을 슬립링 없이 간단하게 외부 회로에 인가할 수 있다.","기계적으로 튼튼하게 만드는 데 용이하다.","전기자가 고정되어 있지 않아 제작비용이 저렴하다."],4,"회전 계자형은 전기자를 고정시키고 계자를 회전시키는 방식이다. 동기 발전기에서 주로 회전 계자형을 사용하는 이유: 전기자 권선은 전압이 높고 결선이 복잡하며 인출선도 많다, 계자회로는 직류 저전압 회로이므로 소요 전력도 적으며 인출선은 2개만 있으면 된다, 전기자보다 계자를 회전자로 하는 것이 기계적으로 튼튼하다."],
[G,"02 동기기","동기 전동기의 특징으로 잘못된 것은?",["일정한 속도로 운전이 가능하다.","난조가 발생하기 쉽다.","역률을 조정하기 힘들다.","공극이 넓어 기계적으로 견고하다."],3,"동기 전동기의 장점: 부하의 변화로 속도가 변하지 않는다, 계자 권선의 직류 여자 전류를 조정하여 역률을 조정할 수 있다, 공극이 넓으므로 기계적으로 견고하다. 단점: 직류 전원장치가 필요하다, 동기화 장치가 필요하며 가격이 고가, 속도 제어가 어렵다, 난조가 발생하기 쉽다."],
[T,"06 전자유도 법칙과 인덕턴스","2개의 코일을 서로 근접시켰을 때 한쪽 코일의 전류를 변화하면 다른 쪽 코일에 유도기전력이 발생하는 현상을 무엇이라고 하는가?",["상호결합","자체유도","상호유도","자체결합"],3,"상호유도 작용: 한쪽 코일에서 발생한 자속에 의해 다른 쪽 코일에 기전력이 유기되는 현상"],
[G,"01 직류기","계자 권선이 전기자에 병렬로만 접속된 직류기는?",["타여자기","직권기","분권기","복권기"],3,"분권기는 전기자 권선과 계자권선이 병렬로 연결되어 있는 발전기 또는 전동기이다.","전기자 A와 계자 F(계자 저항 Rf 포함)가 전원에 병렬로 연결된 분권기 결선도."],
[S,"06 전선로 및 배전선 공사","가공 케이블 시설 시 조가용선에 금속 테이프 등을 사용하여 케이블 외장을 견고하게 붙여 조가하는 경우 나선형으로 금속제 테이프를 감는 간격은 몇 [cm] 이하를 확보하여 감아야 하는가?",["50","30","20","10"],3,"조가선(조가용선)에 금속제 테이프를 나선형으로 20[cm] 이하마다 감아야 한다."],
[S,"04 옥내 배선 공사","애자 공사에 의한 저압 옥내 배선에서 일반적으로 전선 상호 간의 간격은 몇 [cm] 이상이어야 하는가?",["2.5","6","25","60"],2,"애자 공사 시 전선 상호 간 간격(이격 거리): 저압 6[cm] 이상, 고압 8[cm] 이상"],
[S,"04 옥내 배선 공사","관을 시설하고 제거하는 것이 자유롭고 점검 가능한 은폐 장소에서 가요전선관을 구부리는 경우 곡률 반경은 2종 가요전선관 내경의 몇 배 이상으로 하여야 하는가?",["10","9","6","3"],4,"관을 시설하고 제거하는 것이 자유롭고 점검 가능한 은폐 장소에서 가요전선관을 구부리는 경우 곡선(곡률) 반지름은 제2종 가요전선관 내경의 3배 이상으로 하여야 한다."],
[S,"03 전선의 접속","접착력은 떨어지나 절연성, 내온성, 내유성이 좋아 연피 케이블의 접속에 사용되는 테이프는?",["고무 테이프","리노 테이프","비닐 테이프","자기 융착 테이프"],2,"리노 테이프는 절연성, 내온성, 내유성이 좋아 연피 케이블 접속에 사용되는 테이프이다."],
[G,"04 유도기","3상 농형 유도 전동기의 Y-Δ 기동 시의 기동 전류를 전전압 기동 시와 비교하면?",["전전압 기동 전류의 1/3배로 된다.","전전압 기동 전류의 √3배로 된다.","전전압 기동 전류의 3배로 된다.","전전압 기동 전류의 9배로 된다."],1,"Y-Δ 기동은 고정자 3상 권선을 운전 시에 Δ 전선 연결(결선)으로 연결하고 기동 시에만 Y 전선 연결(결선)로 연결하는 것을 말한다. 1상 권선에 가해지는 전압은 기동 시 전전압의 1/√3(60[%]) 정도가 되는 기동 방법이다. 기동 토크는 (1/√3)²=1/3배가 되며, 기동 전류는 전전압 기동 전류의 1/3배이다."],
[S,"07 고압 및 저압 배전반 공사","다음 중 단로기(DS)의 사용 목적으로 맞는 것은?",["전압의 개폐","부하 전류의 차단","단일 회선의 개폐","고장 전류의 차단"],1,"단로기는 부하 전류, 고장 전류를 차단할 수 있는 능력이 없고, 설비 계통의 보수, 점검 시 잠시 선로를 분리하는 설비이다. 따라서 전압의 개폐가 가능하다."],
[T,"04 정전기와 콘덴서","비유전율 εs에 대한 설명으로 옳은 것은?",["εs의 단위는 [C/m]이다.","εs는 항상 1보다 작은 값이다.","εs는 유전체의 종류에 따라 다르다.","진공의 비유전율은 0이고, 공기의 비유전율은 1이다."],3,"유전율은 물질마다 다르다. 유전율은 진공 중의 유전율(ε0)과 비유전율(εs)의 곱이다. ε=ε0εs, 진공 중의 유전율 ε0=8.85×10⁻¹²[F/m], 비유전율 εs=ε/ε0 (진공의 유전율에 대한 물체의 유전율에 대한 비이다. 단위는 없고 진공의 비유전율은 1이다.)"],
[S,"02 배선재료와 공구","금속관을 절단할 때 사용되는 공구는?",["오스터","녹아웃 펀치","파이프 커터","파이프 렌치"],3,"금속관 절단 공구: 파이프 커터, 쇠톱"],
[G,"03 변압기","변압기 2대를 V 결선했을 때의 이용률은 몇 [%]인가?",["57.7[%]","70.7[%]","86.6[%]","100[%]"],3,"V 전선 연결(결선)한 변압기 1대당 이용률=√3V2nI2n/(2V2nI2n)=√3/2≒0.866. (출력비 PV/PΔ=1/√3≒0.577)"],
[T,"02 전기회로 해석","그림에서 전류계는 0.4[A], 전압계 V1은 3[V], V2는 4[V]를 지시했다. 저항 R3의 값[Ω]은?(단, 전류계 및 전압계의 내부저항은 무시한다.)",["5","11","12.5","13.7"],3,"저항 R1, R2, R3가 직렬연결이므로 각 저항에 흐르는 전류 I=0.4[A]. 저항 R3 양단에 걸리는 전압 V3=12−3−4=5[V] ∴ R3=V3/I=5/0.4=12.5[Ω]","12[V] 전원에 전류계, R1(양단 전압계 V1=3[V]), R2(양단 전압계 V2=4[V]), R3가 직렬로 연결된 회로."],
[G,"02 동기기","단락비가 큰 동기기에 대한 설명으로 옳은 것은?",["기계가 소형이다.","안정도가 높다.","전압변동률이 크다.","전기자 반작용이 크다."],2,"단락비가 큰 동기기의 특징: 공극이 넓고 동기 임피던스는 작다, 전압변동률이 적다, 전기자 반작용이 적다, 안정도가 좋다, 중량이 무겁고 가격 또한 비싸다, 효율이 나쁘다."],
[S,"07 고압 및 저압 배전반 공사","선택지락 계전기(Selective Ground Relay)의 용도는?",["단일 회선에서 지락 전류의 방향의 선택","단일 회선에서 지락 사고 지속 시간 선택","단일 회선에서 지락 전류의 대소의 선택","다회선에서 지락 고장 회선의 선택"],4,"선택지락 계전기(SGR): 다회선 송전 선로에서 지락이 발생한 회선만을 검출해 선택해 차단할 수 있도록 동작하는 계전기"],
[G,"05 정류기 및 제어기기","반파 정류회로에서 직류전압 100[V]를 얻는 데 필요한 변압기 2차 상전압은?(단, 부하는 순 저항이며, 변압기 내 전압강하는 무시하고 정류기 내 전압강하는 5[V]로 한다.)",["약 100[V]","약 105[V]","약 222[V]","약 233[V]"],4,"단상 반파정류의 정류전압 Ed=0.45E에서 E=Ed/0.45이며 직류전압 100[V]를 얻는 데 필요한 변압기 2차 전압 E=(100+5)/0.45≒233[V]"],
[S,"04 옥내 배선 공사","금속관 공사에 관하여 설명한 것으로 옳은 것은?",["저압 옥내 배선의 사용전압이 400[V] 이하인 경우 관에는 접지공사를 생략해도 된다.","관의 호칭은 후강 전선관은 홀수, 박강 전선관은 짝수로 표시한다.","콘크리트에 매입하는 것은 전선관의 두께를 1.2[mm] 이상으로 한다.","전선은 옥외용 비닐 절연전선을 사용한다."],3,"금속관 공사: 전선은 절연전선(옥외용 비닐절연전선을 제외)일 것. 전선관의 두께는 콘크리트에 매입 시 1.2[mm] 이상, 이외의 경우 1[mm] 이상(다만, 이음매가 없는 길이 4[m] 이하인 것을 건조하고 전개된 곳에 시설하는 경우에는 0.5[mm] 이상). 관에는 접지공사를 할 것. 관의 호칭은 후강 전선관은 짝수, 박강 전선관은 홀수로 표시한다."],
[T,"07 교류회로","다음과 같은 회로에서 입력전압의 실효값이 12[V]인 정현파일 때, 전전류 I[A]는?",["3−j4[A]","3+j4[A]","4−j3[A]","6+j10[A]"],1,"IR=12/4=3[A], IL=12/(j3)=−j4[A]. 합성전류 I=IR+IL=3−j4[A]","12∠0°[V] 전원에 4[Ω] 저항과 3[Ω] 유도성 리액턴스(코일)가 병렬로 연결, 전전류 I, 각 전류 IR, IL 표시."],
[S,"03 전선의 접속","동전선의 종단 접속 방법이 아닌 것은?",["동선 압착 단자에 의한 접속","종단 겹침용 슬리브에 의한 접속","C형 전선 접속기에 의한 접속","비틀어 꽂는 형의 전선 접속기에 의한 접속"],3,"구리선(동선)의 종단 접속: 가는 단선(4[mm²] 이하)의 종단, 구리선(동선) 눌러붙임(압착) 단자에 의한 접속, 비틀어 꽂는 형의 전선 접속기에 의한 접속, 종단 겹침용 슬리브(E형)에 의한 접속, 직선 겹침용 슬리브(P형)에 의한 접속, 꽂음형 커넥터에 의한 접속. C형 전선 접속기(슬리브)는 직선으로 T형 분기 접속에 사용"],
[T,"03 전류의 열작용과 화학작용","전기분해를 통하여 석출된 물질의 양은 통과한 전기 및 화학당량과 어떤 관계인가?",["전기량과 화학당량에 비례한다.","전기량과 화학당량에 반비례한다.","전기량에 비례하고 화학당량에 반비례한다.","전기량에 반비례하고 화학당량에 비례한다."],1,"패러데이 법칙으로 석출된 물질의 양은 전기량과 화학당량에 비례한다. W=kQ=kIt[g] (W: 화학당량, Q: 전하량, I: 전류)"],
[S,"06 전선로 및 배전선 공사","일반적으로 가공 전선로의 지지물에 취급자가 오르고 내리는 데 사용하는 발판 볼트 등은 일반인의 승주를 방지하기 위하여 지표상 몇 [m] 미만에 시설하여서는 아니 되는가?",["0.75","1.2","1.8","2.0"],3,"발판 볼트는 지표상 1.8[m] 미만에 시설하여서는 안 된다."],
[T,"05 자기 성질과 자기장","다음 중 상자성체는 어느 것인가?",["철","코발트","니켈","텅스텐"],4,"강자성체(μs≫1): 철, 코발트, 니켈 등. 상자성체(μs>1): 알루미늄, 산소, 텅스텐, 공기 등. 역자성체(μs<1): 구리, 아연, 납 등. ※ 암기팁: 강자성체 물체 \"니코 강철 같다\""],
[S,"05 전선 및 기계기구의 보안공사","다음 중 과전류 차단기를 설치하는 곳은?",["간선의 전원 측 전선","접지공사의 접지도체","접지공사를 한 저압 가공 전선로의 접지 측 전선","다선식 전로의 중성선"],1,"과전류 차단기의 시설 장소 제외 장소: 접지공사의 접지도체, 접지공사를 한 저압 가공 전선로의 접지 측 전선, 다선식 전로의 중성선"],
[T,"01 직류회로","굵기가 일정한 도체에서 체적은 변하지 않고 지름이 1/n배로 줄었다면 저항은?",["1/n²로 된다.","n배로 된다.","n²배로 된다.","n⁴배로 된다."],4,"전선의 지름을 1/n배로 줄이면 단면적 S는 1/n²배로 줄기 때문에 길이는 n²배 늘어나야 체적이 일정하게 된다. ∴ 저항 R'=ρ l'/S'=ρ(n²l)/((1/n²)S)=n⁴×ρ l/S=n⁴R"],
[G,"05 정류기 및 제어기기","다음 중 유도 전동기의 속도 제어에 사용되는 인버터 장치의 약호는?",["CVCF","VVVF","CVVF","VVCF"],2,"VVVF(Variable Voltage Variable Frequency): 가변전압 가변 주파수 제어(유도 전동기의 속도 제어). CVCF는 정전압 정주파수, CVVF는 정전압 가변 주파수, VVCF는 가변전압 정주파수 제어"],
[S,"09 전기응용 시설 공사","가로 20[m], 세로 18[m], 천장의 높이 3.85[m], 작업면의 높이 0.85[m], 간접조명 방식인 호텔 연회장의 실지수는 약 얼마인가?",["1.16","2.16","3.16","4.16"],3,"실지수 RI=X·Y/(H(X+Y)) (X: 가로, Y: 세로, H: 작업면으로부터 광원까지의 거리). RI=(20×18)/((3.85−0.85)×(20+18))=3.16"],
[T,"09 비정현파","전류 순시값 i=30 sin ωt+40 sin(3ωt+60°)[A]의 실효값은?",["약 35.4[A]","약 42.4[A]","약 56.6[A]","약 70.7[A]"],1,"비정현파 실효값 I=√(I0²+I1²+…+In²)[A]. I=√((30/√2)²+(40/√2)²)=35.4[A]"],
[G,"02 동기기","극수가 8극이고 회전수가 900[rpm]인 동기 발전기와 병렬 운전하는 동기 발전기의 극수가 12극이라면 회전수는?",["400[rpm]","500[rpm]","600[rpm]","700[rpm]"],3,"동기속도 Ns=120f/p. f=(Ns×p)/120=(900×8)/120=60[Hz]. Ns=120f/p=(120×60)/12=600[rpm]이 된다."],
[S,"04 옥내 배선 공사","다음 중 금속관 공사의 설명으로 잘못된 것은?",["교류 회로는 1회로의 전선 전부를 동일관 내에 넣는 것을 원칙으로 한다.","교류 회로에서 전선을 병렬로 사용하는 경우에는 관 내에 전자적 불평형이 생기지 않도록 시설한다.","금속관 내에서는 전선 접속점을 만들지 않아야 한다.","관의 두께는 콘크리트에 매입하는 경우 1[mm] 이상이어야 한다."],4,"콘크리트에 매입 시 금속관의 두께는 1.2[mm] 이상이어야 한다.","단상 2선식, 3상 3선식에서 바른 방법(전선 전부를 한 관에 넣음)과 틀린 방법(전선을 나누어 각각의 관에 넣음)을 비교하는 그림."],
[G,"03 변압기","변압기 철심에 성층철심을 사용하는 이유는 무엇인가?",["기계손을 적게하기 위해서","표유부하손을 적게하기 위하여","히스테리시스손을 적게하기 위하여","와류손을 적게하기 위하여"],4,"철심은 자기회로를 만드는 부분으로 회전에 따른 자속 방향이 수시로 변화하면서 와전류(성층 철심으로 감소) 손실이나 히스테리시스(규소강판 사용으로 감소) 현상에 의한 철손이 생기게 된다. 성층철심은 와류손을 줄이기 위한 것이다."],
[G,"01 직류기","직류 직권 전동기의 회전수(N)와 토크(τ)의 관계는?",["τ∝1/N","τ∝1/N²","τ∝N","τ∝N^(3/2)"],2,"τ∝φIa, φ∝If이므로 τ∝IfIa이다. 이때 직류 직권 전동기는 계자권선과 전기자 권선이 직렬로 연결되어 있어 If=Ia=I가 되므로 τ∝Ia²이 된다. N∝1/Ia이므로 τ∝1/N²이 된다."],
[S,"03 전선의 접속","전선의 접속에 대한 설명으로 틀린 것은?",["접속 부분의 전기 저항을 증가시켜서는 안 된다.","접속 부분의 인장 강도를 20[%] 이상 유지되도록 한다.","접속 부분에 전선 접속 기구를 사용한다.","알루미늄 전선과 구리선의 접속 시 전기적인 부식이 생기지 않도록 한다."],2,"전선 접속 시 주의 사항: 접속 부분의 전기 저항을 증가시키지 말 것, 접속 부분의 인장 강도를 80[%] 이상 유지할 것, 접속 부분의 인장 하중을 20[%] 이상 감소시키지 말 것, 이종 전선의 접속 시는 부식 고려"],
[T,"05 자기 성질과 자기장","반지름이 a[m]이고, N=1회의 원형코일에 I[A]의 전류가 흐를 때 그 코일의 중심점에서의 자계의 세기[AT/m]는?",["I/(2πa)","I/(4πa)","I/(2a)","I/(4a)"],3,"원형 코일의 중심 자계 H=NI/(2a). N=1이므로 H=I/(2a)[AT/m]"],
[G,"02 동기기","동기 전동기의 직류 여자전류가 증가될 때의 현상으로 옳은 것은?",["진상 역률이 된다.","지상 역률이 된다.","변화 없다.","진상, 지상 역률을 반복한다."],1,"동기 전동기에서 공급 전압 V 및 출력 P2를 일정한 상태로 두고 여자만을 변화시켰을 경우 전기자 전류의 크기와 역률이 달라진다. 여자가 약할 때(부족 여자): I가 V보다 지상 역률(뒤짐), 여자가 강할 때(과여자): I가 V 진상 역률(앞섬), 여자가 적합할 때 I가 V와 동위상으로 역률 1"],
[T,"04 정전기와 콘덴서","진공 중에 10⁻⁶[C], 10⁻⁴[C]의 두 점전하가 1[m]의 간격을 두고 놓여 있다. 두 전하 사이에 작용하는 힘은?",["9×10⁻²[N]","18×10⁻²[N]","9×10⁻¹[N]","18×10⁻¹[N]"],3,"F=k·Q1Q2/r²=9×10⁹×(1×10⁻⁶×1×10⁻⁴)/1²=9×10⁻¹[N] (k=9×10⁹)"],
[G,"04 유도기","3상 유도 전동기의 1차 입력 60[kW], 1차 손실 1[kW], 슬립 3[%]일 때 기계적 출력은 약 몇 [kW]인가?",["57","75","95","100"],1,"2차 입력 P2=1차 입력−1차 손실=60−1=59[kW]. 2차 출력 Po=(1−s)P2=(1−0.03)×59=57[kW]"],
[G,"03 변압기","부하 역률이 1일 때의 전압변동률은 3[%]이고, 부하 역률 0일 때의 전압변동률은 4[%]인 변압기가 있다. 부하 역률이 0.8(지상)일 때, 전압변동률[%]은?",["3.0","4.0","4.8","7.0"],3,"p를 %저항 강하, q를 %리액턴스 강하라 하면 전압변동률 ε=p cosθ+q sinθ=3×0.8+4×0.6=4.8[%]"],
[T,"03 전류의 열작용과 화학작용","정격전압에서 소비전력이 600[W]인 저항에 정격전압의 90[%]의 전압을 가할 때 소비되는 전력은?",["480[W]","486[W]","540[W]","545[W]"],2,"소비전력 P=V²/R[W]. 정격전압 90[%] 시 소비전력 P90%=(0.9V)²/R=0.81V²/R=0.81P=0.81×600=486[W]"],
[G,"03 변압기","1차 전압 6,600[V], 2차 전압 220[V], 주파수 60[Hz]의 단상 변압기가 있다. 다음 그림과 같이 결선하고 1차 측에 120[V]의 전압을 인가하였을 때, 전압계의 지시값[V]은?",["100","116","120","124"],2,"권수비 a=V1/V2=6,600/220=30. 1차 측에 120[V]를 인가하면 2차 측 전압 V2=V1/a=120/30=4[V]. 일반적으로 우리나라 변압기는 감극성이므로 V0=V1−V2=120−4=116[V]","단상 변압기의 고압 측 A, B 사이에 전압 V1, 저압 측 a, b 사이에 전압 V2가 걸리고, 고압 측 B와 저압 측 b를 서로 연결하여 A와 a 사이에 전압계 V를 접속한 그림."],
[S,"04 옥내 배선 공사","16[mm] 합성 수지전선관을 직각 구부리기 할 경우 곡률 반지름은 몇 [mm]인가?(단, 16[mm] 합성 수지관의 안지름은 18[mm], 바깥 지름은 22[mm]이다.)",["119","132","187","220"],1,"합성 수지전선관 직각 구부리기: 곡선(곡률) 반지름 r=6d+D/2=6×18+22/2=119[mm] (d: 전선관의 안지름, D: 전선관의 바깥지름)"],
[T,"09 비정현파","비정현파의 성분을 가장 적합하게 나타낸 것은?",["직류분+고조파","교류분+고조파","직류분+기본파+고조파","교류분+기본파+고조파"],3,"비정현파=직류 성분+기본파 성분+고조파 성분으로 구성된다."],
[T,"04 정전기와 콘덴서","전기력선의 성질에 대한 설명 중 옳지 않은 것은?",["전기력선의 방향은 그 점의 전계의 방향과 일치하며, 밀도는 그 점에서의 전계의 크기와 같다.","전기력선은 부전하에서 시작하여 정전하에서 그친다.","단위전하에서는 1/ε0개의 전기력선이 출입한다.","전기력선은 전위가 높은 점에서 낮은 점으로 향한다."],2,"전기력선은 정전하(+)에서 시작하여 부전하(−)에서 그친다. 전위가 높은 점에서 낮은 점으로 향하고, 도체 표면에 수직으로 출입하며 내부에 존재하지 않는다. 등전위면과 항상 직교한다. 전기력선의 수는 N=Q/ε0이다."],
[S,"02 배선재료와 공구","한국전기설비규정에 의하면 옥외 백열전등의 인하선으로서 지표상의 높이 2.5[m] 미만의 부분은 전선에 공칭 단면적 몇 [mm²] 이상의 연동선과 동등 이상의 세기 및 굵기의 절연전선(옥외용 비닐 절연전선을 제외)을 사용하는가?",["0.75","1.5","2.5","2.0"],3,"옥외 백열전등의 인하선으로서 지표상의 높이 2.5[m] 미만의 부분은 전선에 공칭 단면적 2.5[mm²] 이상의 연동선과 동등 이상의 세기 및 굵기의 절연전선을 사용한다."],
[S,"06 전선로 및 배전선 공사","다음 중 고압 지중 케이블이 아닌 것은?",["알루미늄피복 케이블","비닐 절연 비닐 외장 케이블","미네랄 인슈레이션 케이블","클로로프렌 외장 케이블"],3,"전압에 따른 지중 케이블의 종류: 저압은 알루미늄피복, 클로로프렌 외장, 비닐 절연 비닐 외장, 폴리에틸렌 외장, 미네랄 인슈레이션(MI) 케이블. 고압은 알루미늄피복, 클로로프렌 외장, 비닐 절연 비닐 외장, 폴리에틸렌 외장, 콤바인덕트(CD) 케이블"],
[G,"01 직류기","직류 직권발전기가 정격전압 V=400[V], 출력 P=10[kW]로 운전되고 전기자 저항 Ra와 직권 계자저항 Rs가 모두 0.1[Ω]일 경우, 유도 기전력[V]은?(단, 정류자의 접촉저항은 무시한다.)",["393","405","415","423"],2,"직류 직권발전기는 계자 권선과 전기자 권선이 직렬로 연결되어 계자 전류, 전기자 전류는 부하전류와 같다. 전기자 전류 Ia=P/V=(10×10³)/400=25[A]. 유도 기전력 E=V+Ia(Ra+Rs)=400+25×(0.1+0.1)=405[V]"],
[T,"06 전자유도 법칙과 인덕턴스","자체 인덕턴스 20[mH]의 코일에 30[A]의 전류를 흘릴 때 축적되는 에너지는?",["1.5[J]","3[J]","9[J]","18[J]"],3,"W=½LI²=½×20×10⁻³×30²=9[J]"],
[G,"04 유도기","다음 설명 중 틀리게 기술된 것은?",["3상 유도 전압 조정기의 회전자 권선은 분로 권선이고, Y 결선으로 되어 있다.","디프 슬롯형 전동기는 냉각 효과가 좋아 기동 정지가 빈번한 중 대형 저속기에 적당하다.","누설 변압기가 네온사인이나 용접기의 전원으로 알맞은 이유는 수하 특성 때문이다.","계기용 변압기의 2차 표준은 110/220[V]로 되어 있다."],4,"계기용 변압기의 2차 표준은 110[V]로 되어 있다."],
[T,"06 전자유도 법칙과 인덕턴스","자속밀도 0.5[Wb/m²]의 자장 안에 자장과 직각으로 20[cm]의 도체를 놓고 이것에 10[A]의 전류를 흘릴 때 도체가 50[cm] 운동한 경우 한 일은 몇 [J]인가?",["0.5","1","1.5","5"],1,"전자력 F=IBl sinθ=10×0.5×20×10⁻²×sin90°=1[N]. W=F×r=1×50×10⁻²=0.5[J]"],
[G,"01 직류기","정류자와 접촉하여 전기자 권선과 외부 회로를 연결하는 역할을 하는 것은?",["계자","전기자","브러시","계자철심"],3,"계자: 성층 철심의 권선에 전류를 흘려주어 자속을 만드는 부분. 전기자: 계자에서 발생한 주자속을 회전하며 끊어 기전력을 유기하는 부분. 브러시: 정류자에 접촉하여 직류 기전력을 외부로 인출하는 것. 정류자: 발전된 교류를 직류로 변환하는 부분(AC→DC)"],
[G,"04 유도기","15[kW], 60[Hz], 4극의 3상 유도 전동기가 있다. 전부하가 걸렸을 때의 슬립이 4[%]라면 이때의 2차(회전자) 측 동손은 약 몇 [kW]인가?",["1.2","1.0","0.8","0.6"],4,"2차 입력 P2, 2차 동손 Pc2, 2차 출력 Po라 할 때 P2:Pc2:Po=1:s:(1−s). Pc2=s×P2=0.04×15=0.6[kW]"],
];

[G,"04 유도기","3상 유도 전동기의 1차 입력 60[kW], 1차 손실 1[kW], 슬립 3[%]일 때 기계적 출력[kW]은 약 얼마인가?",["62","60","59","57"],4,"2차 입력 P2=1차 입력−1차 손실=60−1=59[kW]. 2차 출력 Po=(1−s)P2=(1−0.03)×59=57[kW]"],
[G,"01 직류기","정격전압 100[V], 전기자 전류 50[A], 전기자 저항이 0.2[Ω]인 직류 발전기의 유기 기전력은 몇 [V]인가?",["100","110","120","125"],2,"직류 발전기의 유기 기전력 E=V+IaRa=100+50×0.2=110[V]"],
[G,"02 동기기","동기속도 30[rps]인 교류발전기 기전력의 주파수가 60[Hz]가 되려면 극수는 얼마인가?",["2","4","6","8"],2,"동기속도 Ns=120f/p[rpm]=2f/p[rps]에서 p=2f/Ns=(2×60)/30=4극 (※ 1[rpm]=1/60[rps])"],
[S,"09 전기응용 시설 공사","천장에 작은 구멍을 뚫어 그 속에 등기구를 매입시키는 방식으로 건축의 공간을 유효하게 하는 조명방식은?",["코브 방식","코퍼 방식","밸런스 방식","다운라이트 방식"],4,"코브 방식: 램프를 감추고 코브의 벽, 천장면을 이용하여 간접조명으로 만들어 그 반사광으로 채광하는 방식. 코퍼(라이트) 방식: 천장면을 여러 형태로 오려내어 건축적인 공간을 형성하고 다양한 매입기구를 부착. 밸런스 방식: 벽면을 밝은 광원으로 조명하는 방식. 다운라이트 방식: 천장에 작은 구멍을 뚫고 그 속에 광원을 넣고 매입하는 방식으로 용도에 따라 다운라이트, 다운스포트로 구분"],
[G,"03 변압기","3상 변압기의 결선 방법 중 수전단 변전소용 변압기와 같이 고전압을 저전압으로 강압할 때, 주로 사용되는 것은?",["Δ-Δ 결선","Y-Y 결선","Y-Δ 결선","Δ-Y 결선"],3,"Δ-Δ 결선: 1상의 권선에 고장이 발생하더라도 출력은 감소하나 V 결선으로 운전 가능. Y-Y 결선: 중성점을 접지시킬 수 있고 상전압이 선간전압의 1/√3이 되어 절연이 용이하나 제3고조파 통신 장해. Y-Δ 결선: 일반적으로 강압변압기의 결선으로 이용. Δ-Y 결선: 주로 발전소의 승압변압기에 이용"],
[S,"03 전선의 접속","구리 전선과 전기 기계기구 단자를 접속하는 경우에 진동 등으로 인하여 헐거워질 염려가 있는 곳에는 어떤 것을 사용하여 접속하여야 하는가?",["평와셔 2개를 끼운다.","스프링 와셔를 끼운다.","코드 패스너를 끼운다.","정 슬리브를 끼운다."],2,"스프링 와셔는 스프링 작용으로 진동에 대해 강하다."],
[T,"06 전자유도 법칙과 인덕턴스","같은 철심 위에 동일한 권수로 자체 인덕턴스 L[H]의 코일 두 개를 접근해서 감고 이것을 같은 방향으로 직렬 연결할 때 합성 인덕턴스[H]는?(단, 두 코일의 결합 계수는 0.5이다.)",["L","2L","3L","4L"],3,"직렬 가동접속 시 합성 인덕턴스 L=L1+L2+2M, M=k√(L1L2). ∴ L합성=L+L+(2×0.5×√(L×L))=2L+L=3L[H]"],
[G,"05 정류기 및 제어기기","ON, OFF를 고속도로 변환할 수 있는 스위치이고 직류 변압기 등에 사용되는 회로는 무엇인가?",["초퍼 회로","인버터 회로","컨버터 회로","정류기 회로"],1,"인버터(역변환 장치): 직류를 교류로 변환(DC→AC). 초퍼(Chopper): 고정 직류를 가변 직류로 변환하는 장치(DC→Variable DC, 직류 변압기에 사용). 컨버터(순변환 장치): 교류를 직류로 변환(AC→DC). 사이클로 컨버터: 교류를 또 다른 교류로 변환하는 주파수 변환 장치(AC↔AC)"],
[T,"04 정전기와 콘덴서","등전위면과 전기력선의 교차 관계는?",["30°로 교차한다.","45°로 교차한다.","직각으로 교차한다.","교차하지 않는다."],3,"전기장 안에서 전위가 같은 점을 연결하여 이루어진 면이다. 등전위면은 동심 폐곡면이고 교차하지 않는다. 전하에서 나오는 전기력선은 등전위면과 수직이다. 등전위면에서 전하를 이동하면 일의 양은 0이다."],
[T,"07 교류회로","R=40[Ω], L=80[mH]의 코일이 있다. 이 코일에 100[V], 60[Hz]의 전압을 가할 때에 소비되는 전력은 몇 [W]인가?",["100","120","160","200"],3,"임피던스 Z=R+jωL=40+j2×3.14×60×80×10⁻³=40+j30[Ω], |Z|=√(40²+30²)=50[Ω]. 전류 I=100/50=2[A]. ∴ P=I²R=2²×40=160[W]"],
[G,"03 변압기","변압기의 백분율 저항강하가 2[%], 백분율 리액턴스 강하가 3[%]일 때 부하 역률이 80[%]인 변압기의 전압 변동률[%]은?",["1.2","2.4","3.4","3.6"],3,"p: % 저항강하, q: % 리액턴스 강하. 전압 변동률 ε=p cosθ+q sinθ=(2×0.8)+(3×0.6)=3.4[%]"],
[S,"05 전선 및 기계기구의 보안공사","고압 이상의 전기설비에서 접지극의 매설 깊이는 지표면으로부터 지하 몇 [m] 이상으로 하는가?(단, 발전소, 변전소, 개폐소 또는 이에 준하는 곳이 아니다.)",["0.6","0.65","0.7","0.75"],4,"고압 이상의 전기설비에서 접지극의 매설 깊이는 지표면으로부터 지하 0.75[m] 이상으로 한다."],
[G,"03 변압기","권수비가 30인 변압기의 1차 측에 3,300[V]의 전압을 인가하고, 2차 측에 33[kW]의 저항 부하를 연결하였다. 이 변압기의 2차 측 전류[A]는?(단, 변압기의 손실은 무시한다.)",["100","200","300","400"],3,"권수비 a=N1/N2=E1/E2=V1/V2=I2/I1=30에서 V2=V1/a=3,300/30=110[V]. P2=V2I2이므로 I2=P2/V2=(33×10³)/110=300[A]"],
[S,"06 전선로 및 배전선 공사","전선로의 지선에 사용되는 애자는?",["현수애자","구형애자","인류애자","핀애자"],2,"가지애자: 전선을 다른 방향으로 돌리는 부분. 곡핀애자: 인입선을 사용하는 애자. 구형애자(지지선(지선)애자, 옥애자): 지지선(지선)의 중간 부분. 현수애자: 특고압 배전선로에서 선로의 종단, 분기, 수평각 30° 이상인 잡아당김(인류)개소, 전선 굵기의 변경 지점, 개폐기 설치 전주 등에 사용"],
[S,"02 배선재료와 공구","다음 중 방수형 콘센트의 심벌은?",["콘센트 기호에 E 표기(접지극 붙이)","검은 원(●)(비상용 조명)","콘센트 기호에 WP 표기","표기 없는 콘센트 기호(벽붙이)"],3,"방수형 콘센트의 기호는 콘센트 반원 기호 옆에 WP를 표기한다. ① 접지극 붙이 콘센트(E), ② 비상용 조명(백열등), ④ 벽붙이 콘센트","콘센트 기호(반원 두 개가 붙은 원 모양) 옆에 ①은 E, ③은 WP가 붙어 있고, ②는 속이 꽉 찬 검은 원, ④는 아무 표기 없는 콘센트."],
[S,"04 옥내 배선 공사","금속몰드의 지지점 간의 거리는 몇 [m] 이하로 하는 것이 가장 바람직한가?",["1","1.5","2","3"],2,"금속몰드 공사: 지지점 간의 거리는 1.5[m] 이하가 되도록 한다. 조영재는 1.5[m] 이하마다 고정하고 금속몰드 및 기타 부속품은 접지공사를 한다. 사용전압은 400[V] 이하, 전선은 절연전선을 사용하고 몰드 내 접속점은 만들 수 없다."],
[S,"06 전선로 및 배전선 공사","논이나 기타 지반이 약한 곳에서 건주 공사 시 전주의 넘어짐을 방지하기 위해 시설하는 것은?",["완금","근가","완목","행거밴드"],2,"완금: 전선을 지지하기 위해 사용되는 자재로 전주의 맨 위쪽 상단에 고정. 전주 버팀대(근가): 전주가 외부 장력에 견디지 못하고 힘이 가해지는 방향으로 기우는 것을 막기 위해서 전주의 밑 부분에 설치하는 콘크리트 자재. 행거밴드: 주상변압기를 전주에 설치하기 위하여 사용하는 금속 부속품(금구류)"],
[T,"05 자기 성질과 자기장","자기회로에 강자성체를 사용하는 이유는?",["자기저항을 감소시키기 위하여","자기저항을 증가시키기 위하여","공극을 크게 하기 위하여","주자속을 감소시키기 위하여"],1,"강자성체는 투자율이 매우 큰 물질로 자기저항을 감소시키기 위해 사용한다. (자기저항 R=l/(μS)[Ω])"],
[S,"04 옥내 배선 공사","합성수지몰드 공사에서 틀린 것은?",["전선은 절연전선일 것","합성수지몰드 안에는 접속점이 없도록 할 것","합성수지몰드는 홈의 폭 및 깊이가 6.5[cm] 이하일 것","합성수지몰드와 박스 기타의 부속품과는 전선이 노출되지 않도록 할 것"],3,"합성수지몰드 공사: 전선은 절연전선, 몰드 내에는 접속점을 만들지 말 것, 사용전압 400[V] 이하, 나사못 지지점 간의 거리는 40~50[cm] 이하, 전선 수는 해당 몰드 내 단면적의 20[%] 이하, 두께는 2[mm] 이상의 것으로 하며 홈의 폭과 깊이는 3.5[cm] 이하가 되게 한다.(단, 사람의 접촉이 쉽지 않은 경우 폭 5[cm] 이하, 두께 1[mm] 이상의 것을 사용)"],
[S,"08 특수 장소 공사","다음 |보기| 중 금속관, 애자, 합성수지관 및 케이블 공사가 모두 가능한 특수 장소를 옳게 나열한 것은?(보기: ㉠ 화약고 등의 위험 장소, ㉡ 부식성 가스가 있는 장소, ㉢ 위험물 등이 존재하는 장소, ㉣ 불연성 먼지가 많은 장소, ㉤ 습기가 많은 장소)",["㉠, ㉡, ㉢","㉡, ㉢, ㉣","㉡, ㉣, ㉤","㉠, ㉣, ㉤"],3,"화약고 등의 위험 장소: 금속관, 케이블 공사 가능. 부식성 가스가 있는 장소: 금속관, 케이블, 합성수지, 애자사용공사 가능. 위험물 등이 존재하는 장소: 금속관, 케이블, 합성수지관공사 가능. 불연성 먼지가 많은 장소: 금속관, 케이블, 합성수지, 애자사용공사 가능. 습기가 많은 장소: 금속관, 케이블, 합성수지관, 애자사용공사(은폐장소 제외) 가능"],
[S,"03 전선의 접속","연피케이블의 접속에 반드시 사용되는 테이프는?",["고무 테이프","비닐 테이프","리노 테이프","자기융착 테이프"],3,"고무 테이프: 절연성 혼합물을 압연하여 표면에 고무풀을 칠한 것. 비닐 테이프: 염화비닐 컴파운드로 만든 것. 리노 테이프: 접착성은 떨어지나 절연성, 내온성, 내유성이 좋아 연피 케이블에 사용. 자기융착 테이프: 비닐외장케이블, 클로로프렌 외장 케이블 접속에 사용"],
[S,"02 배선재료와 공구","사람이 쉽게 접촉하는 장소에 설치하는 누전차단기의 사용전압 기준은 몇 [V] 초과인가?",["50","110","150","220"],1,"50[V]를 초과하는 저압의 금속제 외함을 가지는 전기기계기구가 있다고 할 때, 전기를 공급하는 전로에 지기가 발생하였을 때 전로를 자동으로 차단하는 장치를 시설하여야 한다.(사람이 접촉하기 쉬운 장소)"],
[T,"07 교류회로","R=6[Ω], Xc=8[Ω]일 때 임피던스 Z=6−j8[Ω]으로 표시되는 것은 일반적으로 어떤 회로인가?",["RC 직렬회로","RL 직렬회로","RC 병렬회로","RL 병렬회로"],1,"RC 직렬회로 임피던스 Z=R+1/(jωC)=R−j(1/ωC)=6−j8[Ω]"],
[G,"01 직류기","전기기기의 철심 재료로 규소강판을 많이 사용하는 이유로 가장 적당한 것은?",["와류손을 줄이기 위해","맴돌이 전류를 없애기 위해","히스테리시스손을 줄이기 위해","구리손을 줄이기 위해"],3,"전기기기에서 철심은 자기회로를 만드는 부분으로 회전에 따른 자속 방향이 수시로 변화하면서 와전류(성층 철심으로 감소) 손실이나 히스테리시스(규소강판 사용으로 감소) 현상에 의한 철손이 생기게 된다. 따라서 계자(전기자) 철심은 이 철손을 줄이기 위해서 두께 0.35[mm]~0.5[mm] 정도의 얇은 규소강판을 성층한다."],
[T,"03 전류의 열작용과 화학작용","100[V]용 30[W]의 전구와 60[W]의 전구가 있다. 이것을 직렬로 접속하여 100[V]의 전압을 인가하였을 때 두 전구의 상태는 어떠한가?",["30[W]의 전구가 더 밝다.","60[W]의 전구가 더 밝다.","두 전구의 밝기가 모두 같다.","두 전구 모두 켜지지 않는다."],1,"소비전력이 큰 전구가 더 밝으므로 각 전구의 소비전력을 구한다. R=V²/P이므로 R30=100²/30=333[Ω], R60=100²/60=167[Ω]. 두 전구가 직렬연결이므로 전류 I는 같다. P30=I²×333, P60=I²×167 ∴ 소비전력이 더 큰 30[W] 전구가 더 밝다."],
[S,"06 전선로 및 배전선 공사","저압의 지중전선이 지중약전류전선 등과 접근하거나 교차하는 경우 상호 간의 이격거리가 몇 [cm] 이하인 때에는 하는 경우 상호 간에 견고한 내화성의 격벽을 설치하는가?",["15[cm]","30[cm]","60[cm]","100[cm]"],2,"견고한 내화성의 격벽을 설치하는 경우: 저압 또는 고압의 지중전선은 30[cm] 이하, 특고압 지중전선은 60[cm] 이하"],
[G,"02 동기기","동기 전동기의 용도로 적당하지 않은 것은?",["분쇄기","압축기","송풍기","크레인"],4,"동기 전동기는 동기 발전기와 구조가 같으므로 발전기를 전동기로 운전할 수도 있다. 역률을 조정할 수 있는 특징을 가지고 있고, 동기 무효 전력 보상 장치(조상기)로서 역률을 조정하는 조상설비로 많이 사용된다. 일정한 속도를 내는 곳에 적당하며, 크레인처럼 순간적으로 많은 기동 토크가 필요한 곳에는 적합하지 않다."],
[S,"03 전선의 접속","절연전선을 서로 접속할 때 사용하는 방법이 아닌 것은?",["커플링에 의한 접속","와이어 커넥터에 의한 접속","슬리브에 의한 접속","압축 슬리브에 의한 접속"],1,"커플링: 관의 상호 접속에 사용. 전선의 접속: 직선 접속(트위스트 접속), 분기 접속, 종단 접속(접속기(커넥터) 접속), 슬리브 접속"],
[S,"02 배선재료와 공구","전기공사 시공에 필요한 공구 사용법에 대한 설명 중 잘못된 것은?",["콘크리트의 구멍을 뚫기 위한 공구로 타격용 임팩트 전기드릴을 사용한다.","스위치박스에 전선관용 구멍을 뚫기 위해 녹아웃 펀치를 사용한다.","합성수지 가요전선관의 굽힘 작업을 위해 토치램프를 사용한다.","금속관의 굽힘 작업을 위해 파이프 벤더를 사용한다."],3,"가요전선관공사는 일반적으로 금속제 또는 합성수지제 가요전선관을 사용하며, 관 표면이 주름형식으로 되어 있어 별도의 굽힘 작업을 위한 도구가 필요 없다. 토치램프 또는 열풍기를 사용하여 굽힘 작업을 하는 경우는 HI-PVC관(합성수지관)에 해당한다."],
[T,"03 전류의 열작용과 화학작용","납축전지의 전해액은?",["염화암모늄 용액","묽은 황산","수산화칼륨","염화나트륨"],2,"납축전지의 전해액은 묽은 황산(H2SO4)이다."],
[T,"01 직류회로","도전율이 큰 것부터 작은 것의 순으로 나열된 것은?",["금>은>구리>수은","은>구리>금>수은","금>구리>은>수은","은>구리>수은>금"],2,"도전율[%](은 기준): 은 100[%], 구리 94[%], 금 67[%], 수은 1.69[%]"],
[G,"04 유도기","출력 10[kW], 슬립 4[%]로 운전되고 있는 3상 유도 전동기의 2차 동손은 약 몇 [W]인가?",["250","315","417","620"],3,"2차 입력 P2, 2차 동손 Pc2, 2차 출력 Po라 할 때 P2:Pc2:Po=1:s:(1−s). s×Po=(1−s)×Pc2에서 ∴ Pc2=(s×Po)/(1−s)=(0.04×10×10³)/(1−0.04)=417[W]"],
[G,"01 직류기","부하전류가 40[A]일 때, 1,800[rpm]으로 20[kg·m]의 토크를 발생하는 직권 직류 전동기가 있다. 이 전동기의 부하를 감소시켜 부하전류가 20[A]일 때, 토크[kg·m]는?(단, 자기회로는 불포화 상태이다.)",["5","10","20","40"],1,"직권 전동기의 전류 I=If=Ia. 토크 T=kφIa에서 T∝I²∝1/N². 부하전류가 1/2배로 감소하여 토크는 (1/2)²=1/4배로 감소하였으므로 T=20[kg·m]×1/4=5[kg·m]"],
[T,"04 정전기와 콘덴서","그림과 같이 대전된 에보나이트 막대를 박검전기의 금속판에 닿지 않도록 가깝게 가져갔을 때 금박이 열렸다면 다음 중 옳은 것은?(단, A는 원판, B는 박, C는 에보나이트 막대이다.)",["A: 양전기, B: 양전기, C: 음전기","A: 음전기, B: 음전기, C: 음전기","A: 양전기, B: 음전기, C: 음전기","A: 양전기, B: 양전기, C: 양전기"],3,"정전 유도현상: 대전체와 가까운 쪽에는 대전체와 다른 전하로 대전되고 반대쪽은 같은 전하로 대전되는 현상. 에보나이트가 음전하로 대전 시 C: 음전하, A: 정전기 유도 현상으로 양전하, B: C와 먼 쪽이므로 음전하로 대전","박검전기: 위쪽 금속판 A, 그 밑의 금박 B, 금속판 가까이 가져간 에보나이트 막대 C."],
[T,"06 전자유도 법칙과 인덕턴스","영구자석의 재료로 사용되는 철에 요구되는 사항으로 다음 중 가장 적절한 것은?",["잔류자속밀도는 작고 보자력이 커야 한다.","잔류자속밀도는 크고 보자력이 작아야 한다.","잔류자속밀도와 보자력이 모두 커야 한다.","잔류자속밀도는 커야 하나, 보자력은 0이어야 한다."],3,"영구자석은 잔류자기와 보자력이 큰 물질을 사용한다. 전자석은 잔류자기는 크고 보자력은 작은 것을 사용한다."],
[G,"05 정류기 및 제어기기","다음 중 유도 전동기의 속도 제어에 사용되는 인버터 장치의 약호는?",["CVCF","VVVF","CVVF","VVCF"],2,"VVVF(Variable Voltage Variable Frequency): 가변전압 가변 주파수 제어(유도 전동기의 속도 제어). CVCF는 정전압 정주파수, CVVF는 정전압 가변 주파수, VVCF는 가변전압 정주파수 제어"],
[T,"08 3상 교류회로","평형 3상 회로에 대한 설명으로 옳지 않은 것은?",["전압의 크기와 주파수가 같고 서로 120°씩 위상차가 있는 3상 교류를 말한다.","성형결선에서 선간전압이 상전압보다 √3배 크고, 위상은 30° 앞선다.","부하에 공급되는 유효전력 P=√3×선간전압×선전류×역률이다.","델타결선의 경우 상전류는 선전류보다 √3배 크고, 위상은 30° 앞선다."],4,"성형(Y) 전선 연결(결선): Vl=√3Vp∠30°, Il=Ip. 델타(Δ) 전선 연결(결선): Vl=Vp, Il=√3Ip∠−30° (선전류가 상전류보다 √3배 크고 위상은 30° 뒤진다.)"],
[G,"04 유도기","5[kW] 이하의 3상 농형 유도 전동기에 정격전압을 직접 인가하는 방법으로 가속 토크가 커서 기동시간이 짧은 특성을 갖는 기동 방법은?",["Y-Δ 기동","리액터 기동","전전압 기동","1차 저항기동"],3,"전전압 기동법: 소용량 농형 유도 전동기에 직접 전전압을 가하는 기동방식으로 보통 5[kW] 이하에 적용한다. 리액터 기동법: 전원과 전동기 사이에 직렬리액터를 삽입하여 단자에 가해지는 전압을 떨어뜨리는 방법. Y-Δ 기동법: 1상 권선에 가해지는 전압은 기동 시 전전압의 60[%] 정도로 보통 5~15[kW]까지 적용. 기동 보상기법: 단권 변압기를 써서 공급 전압을 낮추어서 기동시키는 방법"],
[S,"05 전선 및 기계기구의 보안공사","지중에 매설되어 있는 금속제 수도관로는 대지와의 전기저항값이 얼마 이하로 유지되어야 접지극으로 사용할 수 있는가?",["1[Ω]","3[Ω]","4[Ω]","5[Ω]"],2,"금속제 수도관로는 지중에 매설되어 있고 대지와의 전기저항값이 3[Ω] 이하의 값을 유지해야 한다.","금속제 수도관로에서 분기점을 거쳐 75[mm] 미만 굵기의 분기관으로 접지하는 그림."],
[S,"06 전선로 및 배전선 공사","철근 콘크리트주로서 그 전체의 길이가 16[m] 초과 20[m] 이하이고, 설계하중이 6.8[kN] 이하인 것을 지반이 튼튼한 곳에 시설하려고 한다. 지지물의 기초의 안전율을 고려하지 않기 위해서 묻히는 깊이를 몇 [m] 이상으로 하여야 하는가?",["2.5[m] 이상","2.8[m] 이상","3.0[m] 이상","3.2[m] 이상"],2,"전주의 길이 15[m] 이하: 전주 길이의 1/6 이상. 전주의 길이 15[m] 초과 16[m] 이하: 2.5[m] 이상. 철근 콘크리트주로 그 전체의 길이가 16[m] 초과 20[m] 이하이고, 설계하중이 6.8[kN] 이하의 것은 논이나 그 밖의 지반이 연약한 곳 이외에 그 묻히는 깊이를 2.8[m] 이상으로 시설"],
[T,"04 정전기와 콘덴서","공기 중에서 어느 일정한 거리를 두고 있는 두 점전하 사이에 작용하는 힘이 16[N]이었는데, 두 전하 사이에 유리를 채웠더니 작용하는 힘이 4[N]으로 감소하였다. 이 유리의 비유전율은?",["2","4","8","12"],2,"공기 중: F공기=(1/4πε0)×(Q1Q2/r²)[N]. 유리 속: F유리=(1/4πε0εs)×(Q1Q2/r²)[N]. ∴ εs=F공기/F유리=16/4=4"],
[G,"02 동기기","동기 발전기의 병렬운전에 필요한 조건이 아닌 것은?",["기전력의 크기가 같을 것","기전력의 위상차가 최대가 될 것","기전력의 주파수가 같을 것","기전력의 파형이 같을 것"],2,"동기 발전기의 병렬운전 조건: 기전력의 크기가 같을 것, 기전력의 위상이 같을 것, 기전력의 주파수가 같을 것, 기전력의 파형이 같을 것"],
[G,"05 정류기 및 제어기기","다음 중 턴오프(소호)가 가능한 소자는?",["GTO","TRIAC","SCR","LASCR"],1,"GTO(게이트 턴 오프 사이리스터)는 게이트에 역방향으로 전류를 흘리면 자기 소호하는 사이리스터로 직류 및 교류 제어용 소자로 사용한다. TRIAC, SCR, LASCR은 게이트 신호로 소호할 수 없다."],
[T,"04 정전기와 콘덴서","Q1[C]으로 대전된 용량 C1[F]의 콘덴서에 용량 C2[F]를 병렬연결할 경우 C2가 분배받는 전기량 Q2[C]는?(단, V1[V]은 콘덴서 C1이 Q1으로 충전되었을 때 C1의 양단 전압이다.)",["Q2=((C1+C2)/C2)V1","Q2=(C2/(C1+C2))V1","Q2=((C1+C2)/C1)V1","Q2=(C1C2/(C1+C2))V1"],4,"Q1으로 대전된 용량 C1 콘덴서에 C2 콘덴서를 병렬 연결하였으므로 Q1의 전하량이 분배된 것이다. 전체 전하량 Q=Q1=C1V1. 합성 정전용량 C=C1+C2. 전체 전하량 Q=CV=(C1+C2)V, V=Q/(C1+C2). ∴ C2에 저장되는 Q2=C2V=C2×Q/(C1+C2)=(C1C2/(C1+C2))V1[C]"],
[G,"04 유도기","역률이 좋아 가정용 선풍기, 세탁기, 냉장고 등에 주로 사용되는 것은?",["분상 기동형","콘덴서 기동형","반발 기동형","셰이딩 코일형"],2,"단상 유도 전동기는 기동방법에 따라 분상 기동형, 콘덴서 기동형(2차 콘덴서형, 영구 콘덴서형), 반발 기동형, 셰이딩 코일형 등으로 분류한다. 이 중 콘덴서 기동형은 원심력 스위치가 없고 가격도 싸며, 보수할 필요가 적고 큰 기동 토크를 요구하지 않는 선풍기, 냉장고, 세탁기 등에 널리 사용된다."],
[G,"01 직류기","직류 발전기를 구성하는 부분 중 정류자란?",["전기자와 쇄교하는 자속을 만들어 주는 부분","자속을 끊어서 기전력을 유기하는 부분","전기자 권선에서 생긴 교류를 직류로 바꾸어 주는 부분","계자권선과 외부 회로를 연결시켜 주는 부분"],3,"계자: 성층 철심의 권선에 전류를 흘려 주 자속을 만드는 부분. 전기자: 계자에서 발생한 주 자속을 회전하며 끊어 기전력을 유기하는 부분. 정류자: 전기자 권선에서 생긴 교류를 직류로 바꾸어 주는 부분(AC→DC). 슬립링: 교류 전압을 외부로 흐르게 하는 부분"],
[T,"04 정전기와 콘덴서","다음 물질 중에서 비유전율이 가장 큰 것은?",["운모","유리","증류수","고무"],3,"물질에 따른 비유전율: 고무 2.0~3.5, 유리 3.5~10, 운모 4.5~7.5, 물 80, 종이 2.0~2.5. 증류수(물)가 가장 크다."],
[G,"03 변압기","변압기 내부 고장에 대한 보호용으로 가장 많이 사용되는 것은?",["과전류 계전기","차동 임피던스","비율차동 계전기","임피던스 계전기"],3,"비율차동 계전기: 변압기의 내부 고장 발생 시 고저압 측에 설치한 CT 2차 측의 억제 코일에 흐르는 전류차가 일정 비율 이상이 되었을 때 계전기가 동작되는 방식이다. 주로 변압기 및 발전기 내부 고장 보호용으로 적용되는 계전기이다."],
[S,"07 고압 및 저압 배전반 공사","전력용 콘덴서를 회로로부터 개방하였을 때 전하가 잔류하므로써 일어나는 위험의 방지와 재투입할 때 콘덴서에 걸리는 과전압의 방지를 위하여 무엇을 설치하는가?",["직렬 리액터","전력용 콘덴서","방전 코일","피뢰기"],3,"방전 코일(DC): 콘덴서를 회로에서 개방하였을 때 전하가 잔류하여 일어나는 위험의 방지와 재투입할 때 콘덴서에 걸리는 과전압의 방지를 위하여 방전 장치로 사용한다. 직렬 리액터(SR): 제5고조파 제거, 파형 개선, 개폐 시 계통의 과전압 억제, 고조파 전류에 의한 계전기 오작동 방지, 콘덴서 투입 시 돌입전류 방지. 피뢰기(LA): 이상전압 침입 시 전류를 대지로 방전시키고 속류를 차단한다."],
[S,"08 특수 장소 공사","교통신호등의 시설기준으로 틀린 것은?",["교통신호등 회로의 사용전압은 300[V] 이하이어야 한다.","전선을 매다는 금속선에는 지지점 또는 이에 근접하는 곳에 애자를 삽입한다.","교통신호등 제어장치의 전원 측에는 전용 개폐기 및 과전류 차단기를 각 극에 시설한다.","신호등 회로 인하선의 전선은 지표상 3.5[m] 이상이 되도록 한다."],4,"교통신호등의 시설: 전로의 사용전압은 300[V] 이하, 전선의 높이는 2.5[m] 이상, 금속제 외함은 접지공사를 해야 한다."],
[G,"04 유도기","권선형 유도 전동기의 2차 측 단자에 외부저항 R을 삽입하였다. 이 저항 R을 증가시킨 경우의 설명으로 옳지 않은 것은?",["최대 토크 발생 슬립이 증가한다.","최대 토크가 감소한다.","기동 토크가 증가한다.","기동 전류가 감소한다."],2,"3상 권선형 유도 전동기는 2차 회로의 저항을 가감시켜서 슬립을 조정하는 비례추이에 따라 기동 회전력을 크게 하거나 속도를 제어할 수 있다. 저항 R을 증가시키면 최대 토크 T는 변하지 않고 최대 토크 발생 슬립이 증가한다.","권선형 유도 전동기의 슬립에 따른 전류(점선) 및 회전력(실선) 비례추이 곡선. 2차 저항이 r2, 2r2, 3r2로 커질수록 최대 토크 위치가 s=0에서 s=1 쪽으로 이동하고 최대 토크 값은 같음."],
[T,"06 전자유도 법칙과 인덕턴스","자기 인덕턴스 L1, L2와 상호 인덕턴스 M일 때, 일반적인 자기 결합 상태에서 결합계수 k는?",["k<0","0<k<1","k>1","k=1"],2,"결합계수 k=M/√(L1L2) (단, 일반적인 결합 시: 0<k<1, 미결합 시: k=0, 완전 결합 시: k=1)"],
[T,"01 직류회로","어떤 전지에서 5[A]의 전류가 10분간 흘렀다면 이 전지에서 나온 전하량은?",["0.83[C]","50[C]","250[C]","3,000[C]"],4,"Q=I×t=5×10×60=3,000[C]"],
[G,"03 변압기","변압기의 표유부하손을 설명한 것으로 가장 옳은 것은?",["동손, 철손","부하전류 중 누전에 의한 손실","권선 이외 부분의 누설자속에 의한 손실","무부하 시 여자전류에 의한 동손"],3,"변압기에서 부하손은 부하전류로 인하여 기기 내에 생기는 동손, 철손 등을 말한다. 변압기의 부하손에는 동손(저항손)과 누설자속에 의한 표유 부하손이 있다. 표유부하손: 기타 부하전류에 의한 누설자속에 관계되는 권선 외의 손실"],
[T,"02 전기회로 해석","그림과 같은 회로에 입력 전압 200[V]를 가할 때 20[Ω]의 저항에 흐르는 전류는 몇 [A]인가?",["2","3","5","8"],2,"전체 회로 합성저항 R=28+(20×30)/(20+30)=40[Ω]. 회로에 흐르는 전류 I=200/40=5[A]. 20[Ω]에 흐르는 전류 I20=30/(20+30)×5=3[A]","입력 단자에 28[Ω]이 직렬로 연결되고, 그 뒤에 20[Ω]과 30[Ω]이 병렬로 연결된 회로."],
[T,"08 3상 교류회로","평형 3상 회로에서 1상의 소비전력이 P[W]라면, 3상 회로 전체 소비전력[W]은?",["2P","√2P","3P","√3P"],3,"1상의 소비전력이 P이면 3상의 소비전력 P3상=3×P[W]"],
[S,"05 전선 및 기계기구의 보안공사","저압 옥내간선으로부터 분기하는 곳에 설치하여야 하는 것은?",["지락차단기","과전류차단기","누전차단기","과전압차단기"],2,"분기회로의 시설: 저압 옥내간선과 분기점에서 개폐기 및 과전류차단기를 시설할 것"],
[S,"07 고압 및 저압 배전반 공사","수변전 설비 중에서 동력설비 회로의 역률을 개선할 목적으로 사용되는 것은?",["전력 퓨즈","MOF","지락 계전기","진상용 콘덴서"],4,"전력용 콘덴서는 설비의 역률을 개선하기 위하여 설치되며, 전력용 콘덴서를 진상용 콘덴서라고도 한다. 전력 퓨즈(PF): 전원 측에 설치되어 후비 보호. 전력 수급용 계기용 변성기(MOF): 변류기와 계기용 변압기를 한 케이스 속에 종합한 것. 지락 계전기(GR): 지락전류를 검출하여 동작신호를 출력하는 계전기"],
[T,"05 자기 성질과 자기장","전류에 의해 만들어지는 자기장의 자기력선 방향을 간단하게 알아내는 방법은?",["플레밍의 왼손 법칙","렌츠의 자기유도 법칙","앙페르의 오른나사 법칙","패러데이의 전자유도 법칙"],3,"앙페르의 오른나사 법칙: 전류에 의해 만들어지는 자기장의 방향을 결정하는 법칙. 플레밍의 오른손 법칙: 유도기전력 방향을 결정, 플레밍의 왼손 법칙: 힘의 방향을 알 수 있는 법칙, 렌츠의 법칙: 유기되는 기전력의 방향을 결정, 패러데이의 전자유도 법칙: 도체가 시간당 자속의 변화를 가지면 도체에 기전력이 유기되는 법칙"],
[T,"09 비정현파","정현파에서 파고율이란?",["최대값/실효값","평균값/실효값","실효값/평균값","최대값/평균값"],1,"파고율: 파형의 날카로운(뾰족한) 정도를 나타낸다. 파고율=최대값/실효값. 파형률: 파형의 평활정도로 값이 크면 클수록 직류에 가깝다. 파형률=실효값/평균값"],
