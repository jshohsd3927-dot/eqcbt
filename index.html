[G,"02 동기기","동기 전동기를 자체 기동법으로 기동시킬 때 계자 회로는 어떻게 하여야 하는가?",["단락시킨다.","개방시킨다.","직류를 공급한다.","단상 교류를 공급한다."],1,"동기 전동기의 자기(자체) 기동법: 회전 자극 표면에 기동 권선을 설치하여 기동 시에는 농형 유도 전동기로 동작시켜 기동시키는 방법이다. 계자 회로에 높은 전압이 유기되면 계자 회로가 소손될 염려가 있으므로 반드시 단락 후 기동한다."],
[G,"04 유도기","농형 회전자에 비뚤어진 홈을 쓰는 이유는?",["출력을 높인다.","회전수를 증가시킨다.","소음을 줄인다.","미관상 좋다."],3,"농형 회전자에 비뚤어진 홈을 쓰는 이유: 기동특성을 개선한다, 소음을 경감시킨다, 파형을 좋게 한다."],
[S,"07 고압 및 저압 배전반 공사","변류기의 약호는?",["CT","WH","CB","DS"],1,"CT(변류기), WH(전력량계), CB(차단기), DS(단로기)"],
[G,"01 직류기","직류 전동기의 속도 제어법 중 전압 제어법으로서 제철소의 압연기, 고속 엘리베이터의 제어에 사용되는 방법은?",["워드 레오나드 방식","정지 레오나드 방식","일그너 방식","크래머 방식"],3,"직류 전동기의 전압 제어에 의한 속도 제어 방식의 종류는 워드 레오나드 방식, 일그너 방식, 직·병렬 제어방식 등이 있다. 플라이휠과 슬립 조정기를 붙이고 직류 전동기의 부하가 급변할 때에도 거의 일정한 전력을 공급하고 그 전력의 과부족은 플라이휠로 처리할 수 있게 한 방식이 일그너 방식이다. 일그너 방식은 압연기, 고속 엘리베이터의 제어에 사용된다."],
[T,"04 정전기와 콘덴서","전기력선의 성질 중 옳지 않은 것은?",["음전하에서 출발하여 양전하에서 끝나는 선을 전기력선이라 한다.","전기력선의 접선 방향은 그 접점에서의 전기장의 방향이다.","전기력선의 밀도는 전기장의 크기를 나타낸다.","전기력선은 서로 교차하지 않는다."],1,"전기력선은 양전하에서 출발하여 음전하에서 끝나는 선을 말한다."],
[S,"04 옥내 배선 공사","16[mm] 합성수지 전선관을 직각 구부리기를 할 경우 곡률 반지름은 몇 [mm]인가?(단, 16[mm] 합성수지관의 안지름은 18[mm], 바깥지름은 22[mm]이다.)",["119","132","187","220"],1,"합성수지 전선관을 직각 구부릴 경우 곡선(곡률) 반지름 r=6d+D/2=(6×18)+22/2=119[mm] (d: 전선관의 안지름, D: 전선관의 바깥지름)"],
[T,"05 자기 성질과 자기장","자기회로의 길이 l[m], 단면적 A[m²], 투자율 μ[H/m]일 때 자기저항 R[AT/Wb]을 나타낸 것은?",["R=μl/A","R=A/(μl)","R=μA/l","R=l/(μA)"],4,"자기저항은 R=l/(μA)[AT/Wb]로 정의한다."],
[S,"09 전기응용 시설 공사","전주 외등 설치 시 백열전등 및 형광등의 조명 기구를 전주에 부착하는 경우 부착한 점으로부터 돌출되는 수평 거리는 몇 [m] 이내로 하여야 하는가?",["0.5","0.8","1.0","1.2"],3,"전주 외등: 대지 전압 300[V] 이하 백열전등이나 수은등을 배전선로의 지지물에 시설하는 등. 기구 인출선 도체 단면적 0.75[mm²] 이상, 중량 100[kg] 이하, 기구 부착 높이 하단에서 지표상 4.5[m] 이상(단, 교통 지장이 없을 경우 3.0[m] 이상), 돌출 수평 거리 1.0[m] 이내"],
[T,"07 교류회로","RL 직렬회로에서 임피던스(Z)의 크기를 나타내는 식은?",["R²+XL²","R²−XL²","√(R²+XL²)","√(R²−XL²)"],3,"RL 직렬회로 임피던스의 크기 |Z|=√(R²+XL²)[Ω]"],
[S,"07 고압 및 저압 배전반 공사","수전 설비의 저압 배전반은 배전반 앞에서 계측기를 판독하기 위하여 앞면과 최소 몇 [m] 이상 유지하는 것을 원칙으로 하고 있는가?",["2.5[m]","1.8[m]","1.5[m]","1.7[m]"],3,"기기별 최소 유지 거리[m]: 특고압반 앞면 1.7/뒷면 0.8/열상호간 1.4, 고압 배전반 1.5/0.6/1.2, 저압 배전반 1.5/0.6/1.2, 변압기 등 0.6/0.6/1.2/기타 면 0.3"],
[S,"04 옥내 배선 공사","플로어덕트 공사에 의한 저압 옥내 배선에서 절연 전선으로 연선을 사용하지 않아도 되는 것은 전선의 단면적이 몇 [mm²] 이하인 경우인가?",["2.5[mm²]","4[mm²]","6[mm²]","10[mm²]"],4,"저압 옥내 배선에서 플로어덕트 공사 시 전선은 절연 전선으로 연선이 원칙이지만 단선을 사용하는 경우 단면적 10[mm²] 이하까지는 사용할 수 있다."],
[S,"02 배선재료와 공구","저압 구내 가공 인입선으로 DV 전선 사용 시 전선의 길이가 15[m] 이하인 경우 사용할 수 있는 굵기는 지름 몇 [mm] 이상인가?",["1.5","2.0","2.6","4.0"],2,"가공 인입선으로 DV 전선을 사용하여 인입하는 경우 그 굵기는 지름 2.6[mm] 이상이지만, 지지물 간 거리(경간)가 15[m] 이하인 경우는 2.0[mm] 이상도 가능하다."],
[G,"03 변압기","변압기에서 철손은 부하전류와 어떤 관계인가?",["부하전류에 비례한다.","부하전류의 자승에 비례한다.","부하전류에 반비례한다.","부하전류와 관계없다."],4,"히스테리시스손은 고정손인 철손으로서 Ph=ηh·f·Bm^1.6[W/m³] 식과 같이 손실이 발생한다. 즉, 철손은 부하전류와 무관하다."],
[T,"04 정전기와 콘덴서","절연체 중에서 플라스틱, 고무, 종이, 운모 등과 같이 전기적으로 분극 현상이 일어나는 물체를 특히 무엇이라 하는가?",["도체","유전체","도전체","반도체"],2,"콘덴서에서 전기적 분극이 일어나도록 사용하는 부도체를 유전체라 한다."],
[S,"02 배선재료와 공구","배선용 차단기의 심벌은?",["B","E","BE","S"],1,"B: 배선용 차단기, E: 누전 차단기, BE: 과전류 소자붙이 누전 차단기, S: 개폐기","네모 상자 안에 ①은 B, ②는 E, ③은 BE, ④는 S가 적힌 심벌."],
[G,"01 직류기","직류 복권 발전기를 병렬운전할 때 반드시 필요한 것은?",["과부하 계전기","균압선","용량이 같을 것","외부특성 곡선이 일치할 것"],2,"직류 발전기의 병렬운전 조건: 극성이 같을 것, 단자전압이 같을 것. 직류 복권 발전기는 수하 특성을 가지지 않아 한쪽의 부하가 증가할 때 그 발전기의 전압이 상승하여 부하 분담이 적절히 되지 않는다. 따라서 직권 계자에 균압선을 연결하여 전압 상승을 같게 하면 병렬운전을 할 수 있다."],
[T,"06 전자유도 법칙과 인덕턴스","무한히 긴 평행 2직선이 있다. 이들 도선에 같은 방향으로 일정한 전류가 흐를 때 상호 간에 작용하는 힘은?(단, r은 두 도선 간의 거리이다.)",["흡인력이며 r이 클수록 작아진다.","반발력이며 r이 클수록 작아진다.","흡인력이며 r이 클수록 커진다.","반발력이며 r이 클수록 커진다."],1,"흡인력: 평행한 두 도선에 흐르는 전류의 방향이 같을 때. 반발력: 평행한 두 도선에 흐르는 전류의 방향이 다를 때. 힘 F=μI1I2/(2πr)[N/m]이므로 r이 클수록 힘은 작아진다."],
[S,"04 옥내 배선 공사","제1종 가요전선관을 구부릴 경우 곡률 반지름은 관 안지름의 몇 배 이상으로 하여야 하는가?",["3배","4배","6배","8배"],3,"제1종 가요전선관을 구부릴 경우 곡선(곡률) 반지름은 관 안지름의 6배 이상으로 하여야 한다."],
[T,"09 비정현파","최대값이 Vm[V]인 사인파 교류에서 평균값 Va[V]의 값은?",["0.577Vm","0.637Vm","0.707Vm","0.866Vm"],2,"Va=(2/π)Vm=0.637Vm[V]. 정현파: 실효값 Vm/√2, 평균값 (2/π)Vm, 파고율 √2, 파형률 1.11"],
[S,"02 배선재료와 공구","배관 공사 시 금속관이나 합성수지관으로부터 전선을 뽑아 전동기 단자 부근에 접속할 때 관 끝에 설치하는 것은?",["부싱","엔트런스 캡","터미널 캡","로크너트"],3,"터미널 캡은 배관 공사 시 금속관이나 합성수지관으로부터 전선을 뽑아 전동기 단자 부근에 접속할 때 사용한다. 또는 노출 배관에서 금속 배관으로 변경 시 전선 보호를 위해 관 끝에 설치하며 서비스 캡이라고도 한다."],
[T,"05 자기 성질과 자기장","다음 중 자기장 내에서 같은 크기 m[Wb]의 자극이 존재할 때 자계의 세기가 가장 큰 물질은?",["초합금","페라이트","구리","니켈"],3,"H=B/(μ0μs)[AT/m]이므로 μs가 작은 구리가 자계의 세기(H)가 강하다. 강자성체(μs≫1): 철, 코발트, 니켈 등. 상자성체(μs>1): 공기, 산소, 알루미늄 등. 역자성체(μs<1): 구리, 아연, 납 등."],
[G,"05 정류기 및 제어기기","그림의 정류회로에서 다이오드의 전압강하를 무시할 때 콘덴서 양단의 최대전압은 약 몇 [V]까지 충전되는가?",["70","141","280","352"],2,"주어진 그림은 다이오드를 이용한 단상 반파 정류회로이다. 권수비가 2:1로서 2차 측 전압은 100[V]이다. 콘덴서 양단에 걸리는 100[V]는 실효값으로 최대전압은 100√2=141.42[V]가 된다. (∵ 최대값=√2×실효값)","1차 측 AC 200[V], 변압기 권수비 2:1, 2차 측에 다이오드 D가 직렬로 연결되고 그 뒤에 콘덴서 C가 병렬로 연결된 단상 반파 정류회로."],
[S,"02 배선재료와 공구","600[V] 이하의 저압 회로에 사용하는 비닐 절연 비닐 외장 케이블의 약호로 맞는 것은?",["EV","VV","FP","CV"],2,"EV: 폴리에틸렌 절연 비닐 시스 케이블, FP: 내화 케이블, CV: 0.6/1[kV] 가교폴리에틸렌 절연 비닐 시스 케이블, VV: 비닐 절연 비닐 외장 케이블"],
[G,"02 동기기","동기기의 전기자 권선법이 아닌 것은?",["전절권","분포권","2층권","중권"],1,"동기기의 전기자 권선법은 2층권, 중권, 분포권, 단절권이다."],
[G,"01 직류기","직류 분권 전동기에서 운전 중 계자 권선의 저항을 증가하면 회전속도의 값은?",["감소한다.","증가한다.","일정하다.","관계없다."],2,"직류 분권 전동기에서 N=K(V−IaRa)/φ[rpm]. If=V/Rf에서 계자 저항을 증가시키면 계자 전류의 감소로 자속이 감소하여 회전속도는 증가한다."],
[T,"07 교류회로","저항 5[Ω], 유도리액턴스 30[Ω], 용량리액턴스 18[Ω]인 RLC 직렬회로에 130[V]의 교류를 가할 때 흐르는 전류[A]는?",["10[A], 유도성","10[A], 용량성","5.9[A], 유도성","5.9[A], 용량성"],1,"합성 임피던스 Z=5+j(30−18)=5+j12(유도성 성분). 합성 임피던스의 크기 |Z|=√(5²+12²)=13[Ω]. 전류 I=V/|Z|=130/13=10[A]"],
[G,"04 유도기","일반적으로 유도 전동기가 많이 사용되는 이유가 아닌 것은?",["값이 저렴함","취급이 어려움","전원을 쉽게 얻음","구조가 간단하고 튼튼함"],2,"유도 전동기는 전원을 쉽게 얻을 수 있다. 구조가 간단하고 튼튼하며 값이 저렴하다. 취급이 쉬워 쉽게 운전할 수 있다. 정속도 전동기로 부하의 변화에 대하여 속도의 변동이 적은 것 등이 장점이다."],
[T,"07 교류회로","전기저항 25[Ω]에 50[V]의 사인파 전압을 가할 때 전류의 순시값은?(단, 각속도 ω는 377[rad/sec]이다.)",["2 sin 377t[A]","2√2 sin 377t[A]","4 sin 377t[A]","4√2 sin 377t[A]"],2,"전압 V=50[V](V: 실효값), 전압의 최대값 Vm=√2V=√2×50[V]. 전압의 순시값 v(t)=Vm sin ωt. 전류의 순시값 i(t)=v(t)/R=50√2 sin 377t/25=2√2 sin 377t[A]"],
[T,"02 전기회로 해석","다음 회로에서 10[Ω]에 걸리는 전압은 몇 [V]인가?",["2","10","20","30"],4,"회로에 흐르는 전류 I=105/(5+10+20)=3[A]. ∴ 10[Ω]에 걸리는 전압 V10=I×R=3×10=30[V]","5[Ω], 10[Ω], 20[Ω] 저항이 직렬로 연결되고 105[V] 전원이 연결된 단일 루프 회로."],
[G,"04 유도기","3상 유도 전동기의 원선도를 그리려면 등가회로의 정수를 구할 때 몇 가지 시험이 필요하다. 이에 해당되지 않는 것은?",["무부하 시험","고정자 권선의 저항측정","회전수 측정","구속 시험"],3,"원선도는 정격출력에 대한 전부하 전류, 역률, 효율, 슬립, 최대출력, 정격출력, 부하 회전력 및 최대 회전력을 구한다. 원선도 작성에 필요한 시험으로는 저항측정 시험, 무부하 시험, 구속 시험 등이 있다."],
[G,"03 변압기","설비가 간단하고 취급이나 보수가 쉬워 주상용 변압기에서 사용하는 냉각방식은?",["건식 풍냉식","유입 자냉식","유입 풍냉식","유입 송유식"],2,"유입 자냉식: 절연유의 대류작용에 의하여 철심 및 권선에 발생한 열을 외함에 전달하며, 외함의 방산이나 대류에 의하여 열을 대기로 방산시키는 방식이다. 설비가 간단하고 취급이나 보수가 쉬워 주상용 변압기에서 사용한다."],
[S,"02 배선재료와 공구","전등 1개를 2개소에서 점멸하고자 할 때 필요한 3로 스위치는 최소 몇 개인가?",["1개","2개","3개","4개"],2,"전등 1개를 2개소에서 점멸 시 3로 스위치는 2개가 필요하다. (3개소 점멸: 3로 스위치 2개 + 4로 스위치 1개)","3로 스위치 2개로 계단 아래·위에서 전등 하나를 점멸하는 설계 예와 3로·4로 스위치 결선 그림."],
[S,"07 고압 및 저압 배전반 공사","보호 계전기 시험을 하기 위한 유의 사항으로 틀린 것은?",["계전기 위치를 파악한다.","임피던스 계전기는 미리 예열하지 않도록 주의한다.","계전기 시험 회로 결선 시 교류, 직류를 파악한다.","계전기 시험 장비의 허용 오차, 지시 범위를 확인한다."],2,"보호 계전기 시험 시 유의 사항: 보호 계전기의 배치된 상태를 확인, 임피던스 계전기는 미리 예열이 필요한지 확인, 시험 회로 전선 연결 시 교류와 직류를 확인해야 하며 직류인 경우 극성을 확인, 시험용 전원의 용량이 계전기가 요구하는 정격 전압을 유지할 수 있도록 확인, 계전기 시험 장비의 지시 범위의 적합성, 오차, 영점의 정확성 확인"],
[T,"07 교류회로","e=100√2 sin(314πt−π/3)[V]인 정현파 교류전압의 주파수는 얼마인가?",["50[Hz]","60[Hz]","157[Hz]","314[Hz]"],3,"ω=314π=2πf[rad/sec] ∴ f=314π/2π=157[Hz]"],
[T,"06 전자유도 법칙과 인덕턴스","공기 중에서 자속밀도 3[Wb/m²]의 평등 자장 속에 길이 10[cm]의 직선 도선을 자장의 방향과 직각으로 놓고 여기에 4[A]의 전류를 흐르게 하면 이 도선이 받는 힘은 몇 [N]인가?",["0.5","1.2","2.8","4.2"],2,"도선이 받는 힘 F=IBl sinθ=4×3×10×10⁻²×sin 90°=1.2[N] (F: 도선이 받는 힘, B: 자속밀도, I: 전류, l: 코일의 길이)"],
[S,"07 고압 및 저압 배전반 공사","인입 개폐기가 아닌 것은?",["ASS","LBS","LS","UPS"],4,"배전용 인입 개폐기: 자동 고장 구분 개폐기(ASS), 부하 개폐기(LBS), 선로 개폐기(LS), 단로기(DS). UPS(Uninterruptible Power Supply)는 무정전 전원 공급 장치로 인입 개폐기와는 거리가 멀다."],
[S,"06 전선로 및 배전선 공사","사용 전압이 400[V] 이하인 가공 전선로의 시설에서 절연전선의 경우 최소 굵기(지름)는?",["1.6[mm]","2.0[mm]","2.6[mm]","3.2[mm]"],3,"사용 전압이 400[V] 이하인 가공 전선로의 시설에서 절연전선은 지름 2.6[mm] 이상의 경동선을 사용한다."],
[G,"01 직류기","전기철도에 사용하는 직류 전동기로 가장 적합한 전동기는?",["분권 전동기","직권 전동기","가동복권 전동기","차동복권 전동기"],2,"직류 직권 전동기: 토크 특성은 전기자와 계자 권선이 직렬로 접속되어 있으며 자속이 전기자 전류에 비례한다. 부하 변동이 심하고 큰 기동 토크가 요구되는 전동차, 크레인, 전기철도 등에 적용한다. 무부하가 되면 회전속도가 급격히 상승하여 위험하므로 벨트 운전을 하지 않도록 해야 한다."],
[S,"04 옥내 배선 공사","옥내 배선 공사에서 전개된 장소나 점검 가능한 은폐 장소에 시설하는 합성수지관의 최소 두께는 몇 [mm]인가?",["1[mm]","1.2[mm]","2[mm]","2.3[mm]"],3,"합성수지관 공사 규격 및 시설 원칙: 호칭은 안지름(내경)에 짝수(14, 16, 22, 28, 36, 42, 54, 70, 82[mm]), 두께는 2[mm] 이상, 연선 사용(단선일 경우 10[mm²] 이하도 가능), 관 안에 전선의 접속점이 없을 것"],
[T,"06 전자유도 법칙과 인덕턴스","그림과 같은 회로를 고주파 브리지로 인덕턴스를 측정하였더니 그림 (a)는 60[mH], 그림 (b)는 40[mH]이었다. 이 회로의 상호 인덕턴스 M은?",["2[mH]","3[mH]","4[mH]","5[mH]"],4,"가동 접속 시 합성 인덕턴스 L가동=L1+L2+2M, 차동 접속 시 L차동=L1+L2−2M. 60=L1+L2+2M ……㉠, 40=L1+L2−2M ……㉡. ㉠−㉡을 하면 20=4M ∴ M=20/4=5[mH]","두 코일 L1, L2 사이에 상호 인덕턴스 M이 있는 회로. (a)는 두 코일을 직렬 가동(합성) 접속, (b)는 차동 접속한 그림."],
[T,"03 전류의 열작용과 화학작용","200[V], 2[kW]의 전열선 2개를 같은 전압에서 직렬로 접속한 경우의 전력은 병렬로 접속한 경우의 전력보다 어떻게 되는가?",["1/2배로 줄어든다.","1/4배로 줄어든다.","2배로 증가된다.","4배로 증가된다."],2,"전열선의 저항 P=V²/R에서 R=200²/2,000=20[Ω]. 직렬 연결 시 R=40[Ω], P직렬=200²/40=1,000[W]. 병렬 연결 시 R=10[Ω], P병렬=200²/10=4,000[W]. ∴ P직렬=1/4 P병렬"],
[G,"05 정류기 및 제어기기","다음 중 턴오프(소호)가 가능한 소자는?",["GTO","TRIAC","SCR","LASCR"],1,"GTO(게이트 턴 오프 사이리스터)는 게이트에 역방향으로 전류를 흘리면 자기 소호하는 사이리스터로 직류 및 교류 제어용 소자로 사용한다. TRIAC, SCR, LASCR은 게이트 신호로 소호할 수 없다."],
[T,"06 전자유도 법칙과 인덕턴스","환상 솔레노이드의 감겨진 코일에 감는 횟수를 3배로 늘리면 자체 인덕턴스는 몇 배가 되는가?",["3","9","1/3","1/9"],2,"환상 솔레노이드 자체 인덕턴스 L=μSN²/l (S: 단면적, N: 감겨진 코일 수). 자체 인덕턴스는 감겨진 코일 수의 제곱에 비례하므로 감겨진 코일 수를 3배 늘리면 9배로 증가한다."],
[G,"04 유도기","유도 전동기에 기계적 부하를 걸었을 때 출력에 따라 속도, 토크, 효율, 슬립 등의 변화를 나타낸 출력 특성 곡선에서 슬립을 나타내는 곡선은?",["1","2","3","4"],4,"유도 전동기에 기계적 부하를 가하였을 때, 그 출력에 의한 전류, 회전력, 속도, 효율 등의 변화를 나타내는 곡선을 출력 특성 곡선이라 한다. 슬립은 출력이 커질수록 서서히 증가하는 곡선이다.","가로축 출력, 세로축 속도·토크·효율·슬립. 곡선 1은 거의 수평으로 약간 내려가는 속도 곡선, 2는 빠르게 올라가 완만해지는 효율 곡선, 3은 직선으로 올라가는 토크 곡선, 4는 아래에서 완만하게 올라가는 슬립 곡선."],
[T,"06 전자유도 법칙과 인덕턴스","자체 인덕턴스 5[H]의 코일에 40[J]의 에너지가 저장되어 있다. 이때 코일에 흐르는 전류는 몇 [A]인가?",["2","3","4","5"],3,"코일(인덕터)에 저장되는 에너지 W=1/2·LI², 40=1/2×5×I², I²=80/5=16 ∴ I=4[A]"],
[S,"03 전선의 접속","전선 접속 시 S형 슬리브 사용에 대한 설명으로 틀린 것은?",["전선의 끝은 슬리브의 끝에서 조금 나오는 것은 바람직하지 않다.","슬리브는 전선의 굵기에 적합한 것을 선정한다.","직선 접속 또는 분기 접속에서 2회 이상 꼬아 접속한다.","단선과 연선 접속이 모두 가능하다."],1,"S형 슬리브 접속은 2~3회 꼬아서 접속하는 것이 좋으며 전선의 끝은 슬리브의 끝에서 조금 나오는 것이 바람직하다.","S형 슬리브로 본선과 분기선을 2회 이상 꼬아 접속하는 그림. 전선 끝은 슬리브 끝에서 5~8[mm] 나오게 함."],
[G,"02 동기기","동기 발전기의 병렬운전 조건이 아닌 것은?",["기전력의 크기가 같을 것","발전기의 용량이 같을 것","기전력의 위상이 같을 것","기전력의 주파수가 같을 것"],2,"동기 발전기의 병렬운전 조건: 기전력의 크기가 같을 것, 기전력의 위상이 같을 것, 기전력의 주파수가 같을 것, 기전력의 파형이 같을 것"],
[S,"05 전선 및 기계기구의 보안공사","다음 중 과전류 차단기를 설치하는 곳은?",["간선의 전원 측 전선","접지공사의 접지도체","접지공사를 한 저압 가공 전선로의 접지 측 전선","다선식 전로의 중성선"],1,"과전류 차단기 설치 제한 장소: 접지공사의 접지도체, 접지공사를 한 저압 가공 전선로의 접지 측 전선, 다선식 전로의 중성선"],
[S,"05 전선 및 기계기구의 보안공사","학교, 사무실, 은행 등의 간선 굵기 선정 시 수용률은 몇 [%]를 적용하는가?(단, 부하가 10[kVA]를 초과하는 경우이다.)",["50[%]","60[%]","70[%]","80[%]"],3,"건물에 따른 간선의 수용률(부하가 10[kVA]를 초과 시): 주택, 기숙사, 호텔, 병원, 창고 50[%], 학교, 사무실, 은행 70[%]"],
[S,"08 특수 장소 공사","폭연성 분진이 존재하는 곳의 저압 옥내 배선 공사 시 공사 방법으로 짝지어진 것은?",["금속관 공사, MI 케이블 공사, 개장된 케이블 공사","CD 케이블 공사, MI 케이블 공사, 금속관 공사","CD 케이블 공사, MI 케이블 공사, 제1종 캡타이어 케이블 공사","개장된 케이블 공사, CD 케이블 공사, 제1종 캡타이어 케이블 공사"],1,"폭연성 먼지(분진), 화약류 가루(분말)가 있는 장소에서의 공사 시 금속관 공사, 케이블 공사(MI 케이블, 개장 케이블)를 한다."],
[G,"04 유도기","단상 유도 전동기의 기동법 중에서 기동 토크가 가장 작은 것은?",["반발 유도형","반발 기동형","콘덴서 기동형","분상 기동형"],4,"단상 유도 전동기의 기동법 중에서 기동 토크가 큰 순서: 반발 기동형>반발 유도형>콘덴서 기동형>영구 콘덴서형>분상 기동형>셰이딩 코일형. 보기 중에서는 분상 기동형이 가장 작다."],
[T,"02 전기회로 해석","저항의 병렬접속에서 합성저항을 구하는 설명으로 옳은 것은?",["연결된 저항을 모두 합하면 된다.","각 저항값의 역수에 대한 합을 구하면 된다.","저항값의 역수에 대한 합을 구하고 다시 그 역수를 취하면 된다.","각 저항값을 모두 합하고 저항 숫자로 나누면 된다."],3,"저항 병렬연결 시 합성저항 R=1/(1/R1+1/R2+…+1/Rn). 각 저항값의 역수의 합을 구한 다음 다시 역수를 취하여 구한다."],
[G,"05 정류기 및 제어기기","교류회로에서 양방향 점호(ON) 및 소호(OFF)를 이용하며, 위상 제어를 할 수 있는 소자는?",["TRIAC","SCR","GTO","IGBT"],1,"TRIAC(쌍방향성 3단자 사이리스터)는 사이리스터 2개를 역병렬로 접속한 것과 등가인 것으로 양방향 전류가 흘러 교류 제어용으로 사용되는 소자이다. 전력 제어용, 조광 다이얼(AC) 등 교류 제어용으로만 사용된다."],
[G,"02 동기기","동기 발전기를 회전 계자형으로 하는 이유가 아닌 것은?",["고전압에 견딜 수 있게 전기자 권선을 절연하기가 쉽다.","전기자 단자에 발생한 고전압을 슬립링 없이 간단하게 외부 회로에 인가할 수 있다.","기계적으로 튼튼하게 만드는 데 용이하다.","전기자가 고정되어 있지 않아 제작비용이 저렴하다."],4,"회전 계자형으로 하는 이유: 고전압에 견딜 수 있게 전기자 권선을 절연하기가 용이하다. 전기자가 고정되어 있으므로 전기자 단자에 발생한 고전압을 슬립링 없이 간단하게 외부 회로에 인가할 수 있다. 기계적으로 튼튼하게 만드는 데 용이하다. 전기자는 고정되어 있다."],
[G,"01 직류기","직류 전동기에서 전부하 속도가 1,500[rpm], 속도 변동률이 3[%]일 때 무부하 회전속도는 몇 [rpm]인가?",["1,455","1,410","1,545","1,590"],3,"속도 변동률 ε=(N0−Nn)/Nn×100[%] (N0: 무부하 회전속도, Nn: 전부하 속도). ε=(N0−1,500)/1,500×100=3[%]에서 무부하 회전속도 N0=1,545[rpm]"],
[T,"04 정전기와 콘덴서","A-B 사이 콘덴서의 합성 정전용량은 얼마인가?",["1C","1.2C","2C","2.4C"],2,"콘덴서 병렬연결 시 합성 정전용량 C병렬=C+C+C=3C. 2C와 C병렬은 직렬연결이므로 전체 합성 정전용량 Ctotal=(2C×3C)/(2C+3C)=6/5 C=1.2C","A에서 2C 콘덴서가 직렬로 연결되고, 그 뒤에 용량 C인 콘덴서 3개가 병렬로 연결되어 B로 이어지는 회로."],

[T,"03 전류의 열작용과 화학작용","종류가 다른 두 금속을 접합하여 폐회로를 만들고 두 접합점의 온도를 다르게 하면 이 폐회로에 기전력이 발생하여 전류가 흐르게 되는 현상을 지칭하는 것은?",["줄의 법칙(Joule's Law)","톰슨 효과(Thomson Effect)","펠티에 효과(Peltier Effect)","제벡 효과(Seebeck Effect)"],4,"제벡 효과: 서로 다른 금속을 접합하여 폐회로를 만든 후 두 접합점의 온도를 다르게 했을 때 폐회로에 열기전력이 발생하여 열전류가 흐르는 현상. 펠티에 효과: 서로 다른 금속을 접속시켜 폐회로를 만들고 전류를 흘리면 접합부에서 열이 발생 또는 흡수되는 현상. 톰슨 효과: 같은 종류 금속을 접합하여 두 점 간에 온도 차를 주고 고온에서 저온 쪽으로 전류를 흘리면 열이 발생하거나 흡수가 일어나는 현상"],
[T,"09 비정현파","비정현파를 여러 개의 정현파의 합으로 표시하는 방법은?",["키르히호프 법칙","뉴턴의 법칙","푸리에 분석","테일러의 분석"],3,"푸리에 급수를 이용하여 분석하는 비정현파는 직류 성분, 기본파 성분, 고조파 성분의 합으로 표시한다."],

[S,"08 특수 장소 공사","화약류 저장 장소의 배선 공사에서 전용 개폐기에서 화약류 저장소의 인입구까지는 어떤 공사를 하여야 하는가?",["케이블을 사용한 옥측 전선로","금속관을 사용한 지중 전선로","케이블을 사용한 지중 전선로","금속관을 사용한 옥측 전선로"],3,"화약류 저장소의 배선 공사: 금속관, 케이블 공사. 개폐기에서 화약고 인입구까지는 지중 케이블로 시설할 것. 대지 전압 300[V] 이하"],
[S,"03 전선의 접속","전선의 굵기가 6[mm²] 이하의 가는 단선의 전선 접속은 어떤 접속을 하여야 하는가?",["브리타니아 접속","쥐꼬리 접속","트위스트 접속","슬리브 접속"],3,"단선의 직선 접속: 단면적 6[mm²] 이하는 트위스트 접속, 단면적 10[mm²] 이상은 브리타니아 접속"],
[G,"02 동기기","동기 전동기의 전기자 전류가 최소일 때 역률은?",["0.5","0.707","0.866","1.0"],4,"동기 전동기에 단자(공급) 전압 및 출력을 일정한 상태로 두고 계자 전류를 변화시키면, 전기자 전류와 역률이 달라진다. 일정 출력에서 여자를 약하게 해 주면 지상 역률의 전기자 전류를, 여자를 강하게 하면 진상 역률의 전류를 취하게 된다. 어떤 부하에서도 전기자 전류가 최소일 때는 역률이 1.0이 된다."],
[S,"04 옥내 배선 공사","금속관 공사에서 절연 부싱을 사용하는 이유는?",["박스 내에서 전선의 접속을 방지","관이 손상되는 것을 방지","관 단에서 전선의 인입 및 교체 시 발생하는 전선의 손상 방지","관의 입구에서 조영재의 접촉을 방지"],3,"모든 관 공사 시 부싱은 관 끝부분(끝단)에 설치하여 전선의 피복 훼손 방지를 하기 위한 것이다."],
[G,"04 유도기","권선형에서 비례 추이를 이용한 기동법은?",["리액터 기동법","기동 보상기법","2차 저항법","Y-Δ 기동법"],3,"3상 권선형 유도 전동기와 같이 2차 회로의 저항을 가감시켜서 슬립을 조정하는 것을 비례 추이라 한다. 기동 회전력을 크게 하거나 속도제어를 할 수 있다. 2차 동손, 출력, 2차 효율 등은 r2/s의 함수로 표현되지 않아 비례 추이를 할 수 없다.","권선형 유도 전동기의 비례 추이 특성 곡선: 2차 저항 r2, 2r2, 3r2에 따라 토크(실선)와 전류(점선) 곡선이 s=0 쪽에서 s=1 쪽으로 이동."],
[T,"03 전류의 열작용과 화학작용","그림의 휘스톤 브리지의 평형 조건은?",["X=(Q/P)R","X=(P/Q)R","X=(Q/R)P","X=(P²/R)Q"],2,"휘스톤 브리지의 평형 조건은 Q×X=P×R이다. ∴ X=(P/Q)×R","휘스톤 브리지: 윗변 P(왼쪽)와 X(오른쪽), 아랫변 Q(왼쪽)와 R(오른쪽), 중앙 c-d 사이에 검류계 G, 전원은 a-b 사이."],
[S,"04 옥내 배선 공사","다음 중 덕트 공사 방법과 거리가 가장 먼 것은?",["덕트의 종단은 막을 것","덕트는 접지공사를 생략해도 무방하다.","금속덕트의 뚜껑은 쉽게 열리지 않도록 시설할 것","금속덕트 상호는 견고하고 또한 전기적으로 완전하게 접속할 것"],2,"덕트는 접지공사를 한다. 덕트의 종단부는 먼지 등이 침입하지 않도록 막고, 지지점 간 거리는 3[m] 이하로 한다."],
[S,"04 옥내 배선 공사","다음 금속몰드 공사 방법 중 설명이 틀린 것은?",["점검할 수 없는 은폐 장소에 시설하였다.","몰드 안에는 접속점이 없도록 한다.","사용 전압이 400[V] 이하이므로 접지공사를 하였다.","지지점 간 거리는 1.5[m] 이하마다 한다."],1,"금속몰드 공사 시설 장소: 외상을 받을 우려가 없는 전개된 건조한 장소나 점검할 수 있는 은폐 장소. 몰드의 두께: 0.5[mm] 이상의 연강판(베이스와 뚜껑으로 구성). 몰드 홈의 폭 및 깊이: 5[cm] 이하로 할 것"],
[T,"01 직류회로","2[C]의 전기량이 두 점 사이를 이동하여 48[J]의 일을 하였다면 이 두 점 사이의 전위차는 몇 [V]인가?",["12[V]","24[V]","48[V]","96[V]"],2,"V=W/Q=48/2=24[V]"],
[G,"04 유도기","다음 중 급정지하는 데 가장 좋은 제동방법은?",["발전 제동","회생 제동","역상 제동","단상 제동"],3,"역상 제동: 3상 유도 전동기를 운전 중 급히 정지시킬 경우 1차 측 3선 중 두 선을 바꾸어 접속해서 회전자의 방향을 반대로 하면 유도 전동기는 그 순간에 강력한 유도 제동기가 되는 역상 제동이다. 발전 제동: 회전체의 운동에너지를 전기에너지로 변화시킨 다음 저항 일부를 열에너지로 소비시켜서 제동. 회생 제동: 동기속도 이상의 속도에서 유도 발전기로 동작시켜(s<0) 제동하며 발생 전력을 전원에 반환. 단상 제동: 두 상의 선을 합하고 나머지 한 상과 단상 교류를 공급하여 제동."],
[T,"07 교류회로","R=4[Ω], XL=3[Ω]의 직렬회로에 v=100√2 sin ωt[V]의 전압을 가할 때 전력은 약 몇 [W]인가?",["1,200[W]","1,600[W]","2,000[W]","2,400[W]"],2,"소비전력 P=I²R[W]. V=Vm/√2=100√2/√2=100[V]. I=V/Z=100/√(4²+3²)=100/5=20[A]. ∴ P=20²×4=1,600[W]"],
[G,"01 직류기","직류 전동기에서 전부하 속도가 1,500[rpm], 속도 변동률이 3[%]일 때 무부하 회전속도는 몇 [rpm]인가?",["1,455","1,410","1,545","1,590"],3,"속도 변동률 ε=(N0−Nn)/Nn×100[%]=(N0−1,500)/1,500×100=3[%]에서 무부하 회전속도 N0=1,545[rpm]"],
[G,"03 변압기","3상 전원에서 한 상에 고장이 발생하였다. 이때 3상 부하에 3상 전력을 공급할 수 있는 결선 방법은?",["Y 결선","Δ 결선","단상 결선","V 결선"],4,"단상 변압기 3대로 Δ-Δ 전선 연결(결선) 운전 중 1대의 변압기 고장 시 V 전선 연결(결선)하여 지속 운전 가능. V 결선과 Δ 결선의 출력비 Pv/PΔ=√3V2nI2n/(3V2nI2n)=1/√3≒0.577. V 결선한 변압기 1대당 이용률 √3V2nI2n/(2V2nI2n)=√3/2≒0.866"],
[G,"03 변압기","변압기유가 구비해야 할 조건 중 맞는 것은?",["절연내력이 작고 산화하지 않을 것","비열이 작아서 냉각 효과가 클 것","인화점이 높고 응고점이 낮을 것","절연재료나 금속에 접촉할 때 화학작용을 일으킬 것"],3,"변압기유는 절연 및 냉각 목적으로 공기에 비해 절연내력 및 비열이 큰 광유를 사용한다. 구비 조건: 절연내력이 클 것, 절연재료 및 금속과 접촉해도 화학작용을 일으키지 않을 것, 인화점이 높고 응고점이 낮을 것, 유동성이 크고 비열이 커서 냉각 효과가 클 것, 점도가 낮을 것, 고온에서도 석출물이 생기거나 산화하지 않을 것"],
[T,"07 교류회로","RLC 직렬공진 회로에서 최소가 되는 것은?",["저항","임피던스","전류","전압"],2,"RLC 회로 직렬공진 시 가장 최소가 되는 것은 임피던스 Z=R이다. Z값이 최소이므로 전류는 최대가 된다."],
[S,"02 배선재료와 공구","전등 한 개를 2개소에서 점멸하고자 할 때 옳은 배선은?",["그림 ①","그림 ②","그림 ③","그림 ④"],4,"3로 스위치 2개가 필요하며, 3가닥이 사용된다. 전원에는 2가닥이 사용된다.","3로 스위치 S3 2개 사이를 3가닥으로 연결하고, 중간에 전등과 전원(2가닥)을 연결한 배선도 4가지 중 올바른 것을 고르는 문제."],
[S,"05 전선 및 기계기구의 보안공사","접지공사에서 접지극에 동봉을 사용할 때 최소 길이는?",["1[m]","1.2[m]","0.9[m]","0.6[m]"],3,"접지극의 종류와 규격: 구리(동)봉은 지름 8[mm] 이상, 길이 0.9[m] 이상. 구리(동)판은 두께 0.7[mm] 이상, 단면적 900[cm²] 이상"],
[S,"03 전선의 접속","박스 안에서 가는 전선을 접속할 때 어떤 접속으로 하는가?",["슬리브 접속","브리타니아 접속","쥐꼬리 접속","트위스트 접속"],3,"쥐꼬리 접속은 박스 안에서 굵기가 같은 가는 단선을 2, 3가닥 모아 서로 접속할 때 이용하는 접속법이다. 접속 방법은 접속한 부분에 테이프를 감는 방법과 박스용 접속기(커넥터)를 끼워주는 방법이 있다."],
[T,"03 전류의 열작용과 화학작용","전지에 관한 사항이다. 감극제는 어떤 작용을 막기 위해 사용하는가?",["분극작용","방전","순환전류","전기분해"],1,"전지의 양극에서는 음극에서 흘러들어온 전자를 받아 수소 기체가 발생한다. 이 수소 기체로 인해 기전력이 감소(분극작용)하는 현상이 발생하는데 이를 막기 위해 감극제를 사용한다."],
[T,"08 3상 교류회로","출력 P[kVA]의 단상 변압기 전원 2대를 V 결선할 때의 3상 출력[kVA]은?",["P","√3P","2P","3P"],2,"단상 변압기 2대를 V 전선 연결(결선)하면 출력 PV=√3P (P: 1상의 출력)"],
[S,"05 전선 및 기계기구의 보안공사","분기 회로 설계에서 표준 부하를 40[VA/m²]으로 하여야 하는 건물은?",["교회","학교","은행","아파트"],4,"건축물의 종류에 대한 표준 부하 밀도[VA/m²]: 공장, 공회당, 사원, 교회, 극장, 영화관, 연회장 등 10 / 기숙사, 여관, 호텔, 병원, 음식점, 다방, 학교 등 20 / 사무실, 은행, 상점, 이발소, 미용실 등 30 / 주택, 아파트 40"],
[T,"04 정전기와 콘덴서","0.2[μF] 콘덴서와 0.1[μF] 콘덴서를 병렬연결하여 40[V]의 전압을 가할 때 0.2[μF]에 축적되는 전하량[μC]은?",["2","4","8","12"],3,"0.2[μF]에 축적되는 전하량 Q=CV=0.2×10⁻⁶×40=8[μC]"],
[T,"06 전자유도 법칙과 인덕턴스","자체 인덕턴스가 각각 L1, L2[H]인 두 원통 코일이 서로 직교하고 있다. 두 코일 사이의 상호 인덕턴스[H]는?",["L1+L2","L1L2","0","√(L1L2)"],3,"M=k√(L1L2). 직교 시 결합계수 k=0이므로 M=0"],
[G,"03 변압기","다음 중 ( ) 안에 들어갈 내용은? 「유입 변압기에 많이 사용되는 목면, 명주, 종이 등의 절연재료는 내열 등급( )으로 분류되고, 장시간 지속하여 최고 허용온도( )[℃]를 넘어서는 안 된다.」",["Y종-90","A종-105","E종-120","B종-130"],2,"유입 변압기는 절연물의 내열 등급이 A종으로 최고 허용온도가 105[℃]이다. 절연물 최고 허용 온도[℃]: Y종 90, A종 105, E종 120, B종 130, F종 155, H종 180, C종 180 초과"],
[S,"01 전기설비 개요","다음 중 직류를 기준으로 고압의 범위에 속하는 것은?",["1,500~7,000[V]","1,000~7,000[V]","1,500~6,000[V]","1,000~6,000[V]"],1,"전압의 종류. 저압: AC(교류) 1,000[V] 이하, DC 1,500[V] 이하. 고압: AC 1,000[V] 초과 7,000[V] 이하, DC(직류) 1,500[V] 초과 7,000[V] 이하. 특고압: AC, DC 모두 7,000[V] 초과"],
[G,"03 변압기","부흐홀츠 계전기의 설치 위치로 가장 적당한 곳은?",["콘서베이터 내부","변압기 고압 측 부싱","변압기 주 탱크 내","변압기 주 탱크와 콘서베이터 사이"],4,"부흐홀츠 계전기는 변압기 내부 고장으로 인한 보호용으로 사용되며 변압기의 주 탱크와 콘서베이터 사이에 설치한다. 절연유의 온도 상승 시 발생하는 유증기를 검출하여 권선 단락, 철심 고정 볼트의 절연 열화, 탭 전환기의 고장 등을 경보 및 차단하기 위한 용도로 사용된다."],
[S,"02 배선재료와 공구","전선의 굵기를 측정하는 공구는?",["권척","메거","와이어 게이지","와이어 스트리퍼"],3,"권척(줄자): 관이나 전선의 길이 측정. 메거: 절연 저항 측정. 와이어 게이지: 전선의 굵기(직경) 측정. 와이어 스트리퍼: 절연 전선의 피복을 벗기는 공구"],
[S,"05 전선 및 기계기구의 보안공사","과전류 차단기로서 저압전로에 사용되는 산업용 배선차단기에 있어서 정격전류가 32[A]인 회로에 50[A]의 전류가 흘렀을 때 몇 분 이내에 자동적으로 동작하여야 하는가?",["30분","60분","120분","180분"],2,"과전류 차단기로 저압전로에 사용되는 산업용 배선차단기의 동작시간 및 특성: 정격전류 63[A] 이하 규정시간 60분(부동작전류 1.05배, 동작전류 1.3배), 63[A] 초과 120분(1.05배, 1.3배)"],
[G,"03 변압기","변압기의 무부하 시험, 단락시험에서 구할 수 없는 것은?",["동손","철손","절연내력","전압 변동률"],3,"단락시험으로 권선의 저항, 누설 리액턴스 2차를 단락하고 1차 측 정격 주파수 전압을 서서히 상승하면서 1차 전류와 입력을 측정한다. 1차 전류가 정격전류와 같을 때의 입력이 부하손이며, 전압계로 임피던스전압이 측정된다. 권선의 저항, 누설 리액턴스와 전압 변동률을 측정할 수 있다. 절연내력은 별도의 절연내력 시험으로 구한다."],
[G,"02 동기기","동기기 손실 중 무부하손이 아닌 것은?",["풍손","와류손","전기자 동손","베어링 마찰손"],3,"동손(부하손): 줄 열로 발생하는 손실로 저항손. 무부하손: 기계손(마찰손, 풍손), 철손(히스테리시스손, 와류손)"],
[G,"01 직류기","6극 직류 파권 발전기의 전기자 도체 수 300, 매극 자속 0.02[Wb], 회전수 900[rpm]일 때 유도 기전력[V]은?",["90","110","220","270"],4,"직류 발전기의 유도 기전력 E=(p/a)Zφ(N/60)[V]=(6/2)×300×0.02×(900/60)=270[V] (파권의 병렬 회로수 a=2)"],
[G,"05 정류기 및 제어기기","대전류, 고전압의 전기량을 제어할 수 있는 자기 소호형 소자는?",["MOSFET","Diode","TRIAC","IGBT"],4,"IGBT: 컬렉터(C), 에미터(E), 게이트(G)를 가진 3단자 대전류, 고전압의 전기량을 제어할 수 있는 자기 소호형 소자이다. 파워 MOSFET의 고속성과 파워 트랜지스터의 저 저항성을 겸비한 노이즈에 강한 파워 소자로서, 고속 인버터, 고속 초퍼 소자로 활용된다."],
[T,"08 3상 교류회로","Δ 결선인 3상 유도 전동기의 상전압과 상전류를 측정하였더니 각각 200[V], 30[A]이었다. 이 3상 유도 전동기의 선간전압(Vl)과 선전류(Il)의 크기는 각각 얼마인가?",["Vl=200[V], Il=30[A]","Vl=200√3[V], Il=30[A]","Vl=200√3[V], Il=30√3[A]","Vl=200[V], Il=30√3[A]"],4,"Δ 전선 연결(결선)에서 Vl=Vp, Il=√3Ip. ∴ Vl=200[V], Il=√3×30[A]"],
[G,"01 직류기","4극, 60[MVA], 역률 0.8, 60[Hz], 22.9[kV] 수차 발전기의 전 부하 손실이 1,600[kW]이면 전 부하 효율[%]은?",["90","95","97","99"],3,"효율 η=출력/입력×100. 입력=출력+손실이므로 η=출력/(출력+손실)×100[%](발전기, 변압기)=(60×0.8)/((60×0.8)+1.6)×100≒97[%]"],
[S,"02 배선재료와 공구","절연 전선으로 가선된 배전 선로에서 활선 상태인 경우 전선의 피복을 벗기는 것은 매우 곤란한 작업이다. 이런 경우 활선 상태에서 전선의 피복을 벗기는 공구는?",["데드 엔드 커버","애자 커버","와이어 통","전선 피박기"],4,"와이어 통: 핀 애자나 현수 애자를 사용한 전선 설치(가선) 공사에서 활선을 움직이거나 작업권 밖으로 밀어내거나 안전한 장소로 전선을 옮길 때 사용하는 절연봉. 데드 엔드 덮개(커버): 활선 작업 시 작업자가 현수 애자 등에 접촉하여 발생하는 안전사고 예방을 위해 애자 등의 충전부를 방호하기 위한 절연 덮개. 전선 피박기: 활선 상태에서 전선 피복을 벗기는 공구로 활선 피박기라고도 한다."],
[T,"04 정전기와 콘덴서","두 콘덴서 C1, C2를 직렬연결하고 그 양 끝에 전압을 가한 경우 C1에 걸리는 전압[V]은?",["C1/(C1+C2)×V","C2/(C1+C2)×V","(C1+C2)/C1×V","(C1+C2)/C2×V"],2,"합성 정전용량 C=C1C2/(C1+C2), Q=CV=(C1C2/(C1+C2))V. C1 양단에 걸리는 전압 VC1=Q/C1=(1/C1)×(C1C2/(C1+C2))V=C2/(C1+C2)V[V]"],
[G,"04 유도기","역률과 효율이 좋아서 가정용 선풍기, 전기세탁기, 냉장고 등에 주로 사용되는 것은?",["분상 기동형 전동기","반발 기동형 전동기","콘덴서 기동형 전동기","셰이딩 코일형 전동기"],3,"단상 유도 전동기의 기동 방법에 의한 분류에는 분상 기동형, 콘덴서 기동형(2차 콘덴서형, 영구 콘덴서형), 반발 기동형, 셰이딩 코일형 등으로 분류한다. 이 중 콘덴서 기동형은 원심력 스위치가 없고 보수할 필요가 적고, 큰 기동 토크를 요구하지 않는 선풍기, 냉장고, 세탁기 등에 널리 사용된다."],
[T,"07 교류회로","어떤 정현파 교류의 평균값이 242[V]인 전압의 최대값은 약 몇 [V]인가?",["220[V]","276[V]","342[V]","380[V]"],4,"정현파의 평균값과 최대값의 관계에서 Va=(2/π)Vm[V]. Vm=πVa/2=(3.14×242)/2≒380[V]"],
[G,"04 유도기","60[Hz], 4극 유도 전동기가 1,700[rpm]으로 회전하고 있다. 이 전동기의 슬립은 약 몇 [%]인가?",["3.42%","4.56%","5.56%","6.64%"],3,"동기속도 Ns=120f/p=120×60/4=1,800[rpm]. 슬립 s=(Ns−N)/Ns×100=(1,800−1,700)/1,800×100=5.56[%]"],
[G,"02 동기기","10극, 동기속도 600[rpm]인 동기 발전기에서 나오는 전압의 주파수는 몇 [Hz]인가?",["50","60","80","120"],1,"동기속도 Ns=120f/p[rpm]. f=Ns×p/120=600×10/120=50[Hz]"],
[T,"04 정전기와 콘덴서","200[μF]의 콘덴서를 충전하는 데 9[J]의 일이 필요하였다. 충전 전압은 몇 [V]인가?",["200[V]","300[V]","450[V]","900[V]"],2,"에너지 W=1/2·CV²에서 9=1/2×200×10⁻⁶×V². ∴ V=√(2×9/(200×10⁻⁶))=300[V]"],
[T,"07 교류회로","그림과 같은 회로에 흐르는 유효분 전류[A]는?",["4[A]","6[A]","8[A]","10[A]"],3,"RL 회로의 임피던스 Z=8+j6, |Z|=√(8²+6²)=10[Ω]. 전류 I=V/|Z|=100/10=10[A]. 역률 cosθ=R/|Z|=8/10=0.8. 유효분 전류 I유효=I cosθ=10×0.8=8[A]","8[Ω] 저항과 6[Ω] 유도 리액턴스가 직렬로 연결되고 100[V] 교류 전원이 연결된 회로."],
[T,"03 전류의 열작용과 화학작용","200[V], 500[W]의 전열기를 100[V] 전원에 사용하였다면 이때의 전력은?",["125[W]","250[W]","375[W]","500[W]"],1,"전력 P=I²R=V²/R이므로 R=V²/P=200²/500=80[Ω]. 전압이 100[V]일 때 전력 P100=V²/R=100²/80=125[W]"],
[S,"03 전선의 접속","매킹타이어로 슬리브 접속 시 슬리브를 최소 몇 회 이상 꼬아야 하는가?",["3.5회","2회","2.5회","3회"],2,"슬리브 접속은 매킹타이어 슬리브를 써서 도선을 접속하는 방법으로 나선 접속 시 사용하며 슬리브는 최소 2회 정도 비틀어 꼬아서 접속한다."],
[T,"05 자기 성질과 자기장","공기 중 자장의 세기 40[AT/m]인 곳에 8×10⁻³[Wb]의 자극을 놓으면 작용하는 힘[N]은?",["0.16","0.20","0.32","0.40"],3,"F=mH=8×10⁻³×40=0.32[N]"],
[S,"06 전선로 및 배전선 공사","일반적으로 가공 전선로의 지지물에 취급자가 오르고 내리는 데 사용하는 발판 볼트 등은 지표상 몇 [m] 미만에 시설하여서는 아니 되는가?",["0.75[m]","1.2[m]","1.8[m]","2.0[m]"],3,"발판 볼트는 지표상 1.8[m] 미만에 시설하여서는 안 된다."],
[T,"04 정전기와 콘덴서","전하의 성질을 잘못 설명한 것은?",["같은 종류의 전하는 흡인하고 다른 종류의 전하끼리는 반발한다.","대전체에 들어있는 전하를 없애려면 접지시킨다.","대전체의 영향으로 비대전체에 전기가 유도된다.","전하는 가장 안정한 상태를 유지하려는 성질이 있다."],1,"같은 종류의 전하는 반발하고 다른 종류의 전하끼리는 흡인한다."],
[G,"04 유도기","동기 와트 P2, 출력 Po, 슬립 s, 동기속도 Ns, 회전속도 N, 2차 동손 Pc2일 때 2차 효율 표기로 틀린 것은?",["1−s","Pc2/P2","Po/P2","N/Ns"],2,"2차 효율 η2=Po/P2=1−s=1−(Ns−N)/Ns=N/Ns. Pc2/P2는 슬립 s이다."],
[S,"02 배선재료와 공구","다음 중 금속 전선관을 박스에 고정시킬 때 사용되는 것은 어느 것인가?",["새들","부싱","로크 너트","클램프"],3,"금속관을 박스에 고정시킬 때 로크 너트를 사용한다."],
[T,"07 교류회로","R-L 병렬회로에서의 합성 임피던스 값은?",["R·XL/(R+XL)","√(R²+XL²)","R·XL/√(R²+XL²)","√(R²+XL²)/(R·XL)"],3,"RL 병렬회로의 어드미턴스 Y=1/R−j(1/XL)[℧]. 어드미턴스 크기 |Y|=√((1/R)²+(1/XL)²)=√(1/R²+1/XL²). ∴ |Z|=1/|Y|=RXL/√(R²+XL²)[Ω]"],
[S,"08 특수 장소 공사","폭발성 분진이 있는 위험 장소에 금속관 배선에 의할 경우 관 상호 및 관과 박스 기타의 부속품이나 풀 박스 또는 전기 기계 기구는 몇 턱 이상의 나사 조임으로 접속하여야 하는가?",["2턱","3턱","4턱","5턱"],4,"폭연성 먼지(분진)가 존재하는 곳의 금속관 공사에 있어서 관 상호 및 관과 박스의 접속은 5턱 이상의 조임나사로 시공하여야 한다."],
[T,"03 전류의 열작용과 화학작용","3상 기전력을 2개의 전력계 W1, W2로 측정해서 W1의 지시값이 P1, W2의 지시값이 P2라고 하면 3상 전력은 어떻게 표현되는가?",["P1−P2","3(P1−P2)","P1+P2","3(P1+P2)"],3,"2전력계법으로 측정하는 전력 유효전력 P=P1+P2[W]"],
[T,"06 전자유도 법칙과 인덕턴스","유도기전력은 자신의 발생 원인이 되는 자속의 변화를 방해하려는 방향으로 발생한다. 이것을 유도기전력에 관한 무슨 법칙이라 하는가?",["옴(Ohm)의 법칙","렌츠(Lenz)의 법칙","쿨롱(Coulomb)의 법칙","앙페르(Ampere)의 법칙"],2,"자속의 변화로 유기되는 유기기전력 e=−N dφ/dt인데 (−)는 관성(렌츠)의 법칙으로 유기기전력의 방향을 결정하는 것이다. 이는 자속 φ의 변화를 반대하는 방향으로 유기기전력이 발생한다."],
[S,"06 전선로 및 배전선 공사","다음 중 지중 전선로의 매설 방법이 아닌 것은?",["관로식","암거식","직접 매설식","행거식"],4,"지중 전선로의 매설 방법: 관로식, 암거식, 직접 매설식"],
[G,"01 직류기","직류 전동기의 속도 제어법이 아닌 것은?",["전압 제어법","계자 제어법","저항 제어법","주파수 제어법"],4,"직류 전동기의 속도 N=K(V−IaRa)/φ로서 속도 제어법은 3가지로 분류된다. 전압 제어법: 전기자에 가하는 전압 V를 변화시키는 방법으로 정토크 제어. 계자 제어법: 계자 전류를 조정하여 자속 φ를 변화시키는 방법으로 정출력 제어. 저항 제어법: 전기자에 직렬로 저항을 넣어서 Ra의 값을 변화시키는 방법으로 전력손실이 크며 속도 제어의 범위가 좁다."],
[S,"09 전기응용 시설 공사","전주 외등을 전주에 부착하는 경우 전주 외등은 하단으로부터 지표상 몇 [m] 이상 높이에 시설하여야 하는가?",["3.0","3.5","4.0","4.5"],4,"전주 외등: 기구 부착 높이 하단에서 지표상 4.5[m] 이상(단, 교통 지장이 없을 경우 3.0[m] 이상), 기구 인출선 도체 단면적 0.75[mm²] 이상, 중량 100[kg] 이하, 돌출 수평 거리 1.0[m] 이내"],
[G,"01 직류기","다음 그림은 직류 발전기의 분류 중 어느 것에 해당되는가?",["분권 발전기","직권 발전기","자석 발전기","복권 발전기"],4,"직렬 계자 권선과 병렬 계자 권선이 있으므로 복권 발전기(외분권)이다.","전기자 A에 병렬 계자 권선 F와 직렬 계자 권선 Fs가 모두 연결된 결선도."],
[T,"06 전자유도 법칙과 인덕턴스","그림에서 1차 코일의 자기인덕턴스 L1, 2차 코일의 자기인덕턴스 L2, 상호인덕턴스를 M이라 할 때 LA의 값으로 옳은 것은?(단, L1, L2 코일은 같은 방향으로 감겨있다.)",["L1+L2+2M","L1−L2+2M","L1+L2−2M","L1−L2−2M"],3,"차동접속이므로 LA=L1+L2−2M. 여기서 M=k√(L1L2)이다.(k: 결합계수)","두 코일 L1, L2가 같은 방향으로 감겨 있고, 연결선이 서로 교차되어 차동 접속된 그림."],
[S,"08 특수 장소 공사","화약류 저장소에서 백열전등이나 형광등 또는 이들에 전기를 공급하기 위한 전기 설비를 시설하는 경우 전로의 대지 전압은 몇 [V] 이하이어야 하는가?",["150","200","300","400"],3,"화약류 등을 저장하는 화약고에는 전기 설비를 시설하지 않는 것이 원칙이다. 하지만 백열등이나 형광등과 같은 조명 설비나 이들에 전기를 공급하기 위한 전기 설비를 시설하는 경우는 금속관 공사나 케이블 공사 등에 의하여 시설해야 한다. 전로의 대지 전압은 300[V] 이하이어야 한다."],
[G,"03 변압기","1차 권수 6,000, 2차 권수 200인 변압기의 전압비는?",["10","30","60","90"],2,"권수비 a=V1/V2=N1/N2=I2/I1에서 a=6,000/200=30. 전압비는 권수비와 같으므로 30이다."],
];

EX[27]=[
[T,"05 자기 성질과 자기장","자석에 대한 성질을 설명한 것으로 옳지 않은 것은?",["자석은 임계 온도 이상으로 가열하면 자석의 성질이 없어진다.","발생되는 자기력선은 아무리 사용해도 기본적으로 감소하지 않는다.","자석은 고온이 되면 자력이 감소되고 저온이 되면 자력이 증가된다.","같은 극성의 자석은 서로 흡인하고, 다른 극성은 서로 반발한다."],4,"자석은 같은 극끼리는 반발력, 서로 다른 극끼리는 흡인력이 작용한다."],
[T,"01 직류회로","동선의 길이를 2배로 늘리면 저항은 처음의 몇 배가 되는가?(단, 동선의 체적은 일정하다.)",["2배","4배","8배","16배"],2,"저항 R=ρl/S[Ω]. R'=ρ·2l/(S/2)=4ρl/S=4R[Ω] (∵ 체적은 일정). ∴ 길이를 2배로 늘리면 저항은 4배로 커진다."],
[S,"06 전선로 및 배전선 공사","가공 전선로의 지지물에서 다른 지지물을 거치지 아니하고 수용 장소의 인입선 접속점에 이르는 가공 전선을 무엇이라 하는가?",["옥외 전선","연접 인입선","가공 인입선","관등 회로"],3,"가공 인입선이란 가공 전선로의 지지물에서 수용 장소의 인입선에 이르는 전선을 말한다."],
[S,"05 전선 및 기계기구의 보안공사","최대 사용 전압이 70[kV]인 중성점 직접 접지식 전로의 절연 내력 시험 전압은 몇 [V]인가?",["35,000[V]","42,000[V]","44,800[V]","50,400[V]"],4,"절연 내력 시험: 최대 사용 전압이 60[kV] 초과인 중성점 직접 접지식 전로의 절연 내력 시험은 최대 사용 전압의 0.72배의 전압을 연속으로 10분간 가할 때 견디는 것으로 하여야 한다. 시험 전압=70,000×0.72=50,400[V]"],
[S,"08 특수 장소 공사","소세력 회로의 전선을 조영재에 붙여 시설하는 경우에 틀린 것은?",["전선은 금속제의 수관, 가스관 또는 이와 유사한 것과 접촉하지 아니하도록 시설할 것","전선은 코드, 캡타이어 케이블 또는 케이블일 것","전선이 손상을 받을 우려가 있는 곳에 시설하는 경우에는 적당한 방호장치를 할 것","케이블 이외의 전선의 굵기는 2.5[mm²] 이상일 것"],4,"소세력 회로의 배선(전선을 조영재에 붙여 시설하는 경우): 전선은 코드나 캡타이어 케이블 또는 케이블을 사용할 것. 전선이 손상을 받을 우려가 있는 곳에 시설하는 경우에는 적당한 방호장치를 할 것. 케이블 이외의 전선은 공칭 단면적 1[mm²] 이상의 연동선 또는 이와 동등 이상의 세기 및 굵기의 것일 것"],
[T,"06 전자유도 법칙과 인덕턴스","환상 솔레노이드 내부의 자기장의 세기에 관한 설명으로 틀린 것은?",["자장의 세기는 권수에 비례한다.","자장의 세기는 전류에 비례한다.","자장의 세기는 자로의 길이에 비례한다.","자장의 세기는 권수, 전류, 평균 반지름과는 관계가 있다."],3,"솔레노이드 내부 자계 H=NI/(2πr) (N: 코일수, I: 전류, r: 솔레노이드 반지름, 2πr: 자로 길이). 따라서 자기장의 세기는 자로에 반비례한다."],
[S,"02 배선재료와 공구","코드나 케이블 등을 기계기구의 단자 등에 접속할 때 연선의 단면적이 몇 [mm²]가 넘으면 그림과 같은 터미널 러그(압착 단자)를 사용하여야 하는가?",["10","6","4","8"],2,"코드 또는 캡타이어 케이블과 전기 사용 기계기구와의 접속: 기구 단자가 누름나사형, 클램프형이거나 이와 유사한 구조가 아닌 경우는 단면적 10[mm²]를 초과하는 단선 또는 단면적 6[mm²]를 초과하는 연선에 터미널 러그를 부착할 것. 전선을 1본만 접속할 수 있는 구조는 2본 이상 접속하지 말 것. 터미널 러그는 납땜으로 전선을 부착하고 접속점에 장력이 걸리지 않도록 할 것","원통형 압착부와 볼트 구멍이 있는 평판부로 된 터미널 러그(압착 단자) 그림."],
[S,"07 고압 및 저압 배전반 공사","변류기 개방 시 2차 측을 단락하는 이유는?",["2차 측 절연 보호","2차 측 과전류 보호","측정오차 감소","변류비 유지"],1,"변류기는 2차 전류를 낮게 하기 위하여 권수비가 매우 작아서 2차 측을 개방하게 되면 2차 측에 높은 기전력이 유기되어 절연파괴의 위험이 있다. 즉, 2차 측 절연 보호를 위해 2차 측을 단락한다."],
[S,"02 배선재료와 공구","하나의 콘센트에 두 개 이상의 플러그를 꽂아 사용할 수 있는 기구는?",["코드 접속기","멀티 탭","테이블 탭","아이언 플러그"],2,"접속 기구. 멀티 탭: 하나의 콘센트에 여러 개의 플러그를 끼워 사용하는 것. 테이블 탭: 코드 길이가 짧을 때 연장 사용하는 것"],
[G,"01 직류기","전기기계의 효율 중 발전기의 규약효율 ηG는?(단, 입력 P, 출력 Q, 손실 L로 표현한다.)",["ηG=(P−L)/P×100[%]","ηG=(P−L)/(P+L)×100[%]","ηG=Q/P×100[%]","ηG=Q/(Q+L)×100[%]"],4,"전기기계의 효율에는 출력과 입력을 측정해서 구하는 실측효율, 규약에 따라 손실을 결정하여 계산으로 구하는 규약효율이 있다. 전동기의 규약효율 ηM=(입력−손실)/입력×100[%], 발전기의 규약효율 ηG=출력/(출력+손실)×100[%]"],
[S,"03 전선의 접속","단선의 굵기가 6[mm²] 이하인 전선을 직선 접속할 때 주로 사용하는 접속법은?",["트위스트 접속","브리타니아 접속","쥐꼬리 접속","T형 커넥터 접속"],1,"트위스트 접속: 6[mm²] 이하의 가는 전선 접속"],
[G,"02 동기기","단락비가 큰 동기기에 대한 설명으로 옳은 것은?",["기계가 소형이다.","안정도가 높다.","전압변동률이 크다.","전기자 반작용이 크다."],2,"단락비가 큰 동기 발전기: 공극이 넓고, 동기 임피던스는 작다. 전압변동률이 적다. 전기자 반작용이 적다. 안정도가 좋다. 중량이 무겁고 가격 또한 비싸다."],
[T,"04 정전기와 콘덴서","표면 전하밀도 σ[C/m²]로 대전된 도체 내부의 전속밀도는 몇 [C/m²]인가?",["ε0E","0","σ","E/ε"],2,"전하는 도체 표면에만 존재하고 도체 내부에는 존재하지 않는다. 따라서 도체 내부의 전속밀도는 0이다."],
[T,"07 교류회로","R=8[Ω], X=6[Ω]인 RLC 직렬회로에 10[A]의 전류가 흘렀다면 이때의 전압은?",["60[V]","80[V]","100[V]","140[V]"],3,"RLC 직렬회로에서 임피던스 Z=8+j6[Ω]. 임피던스 크기 |Z|=√(8²+6²)=10[Ω]. 전압 V=I×|Z|=10×10=100[V]"],
[G,"05 정류기 및 제어기기","실리콘 제어 정류기(SCR)의 게이트(G)는?",["P형 반도체","N형 반도체","PN형 반도체","NP형 반도체"],1,"SCR은 PNPN의 4층 구조로 된 사이리스터이며, 게이트(G)는 P형 반도체로 이루어진다.","SCR 기호(A, K, G)와 위에서부터 p-n-p-n 4층 구조에서 게이트 G가 아래쪽 p층에 연결된 그림."],
[S,"04 옥내 배선 공사","금속덕트 공사에 사용하는 금속덕트의 철판 두께는 몇 [mm] 이상이어야 하는가?",["0.8","1.2","1.5","1.8"],2,"금속덕트: 폭 4[cm]를 넘고 두께 1.2[mm] 이상인 강판 또는 동등 이상의 세기를 가지는 금속재로 제작한다. 사용하는 전선은 산화 방지를 위해 아연 도금을 하거나 에나멜 등으로 피복하여 사용한다."],
[G,"03 변압기","다음 중 변압기에서 자속과 비례하는 것은?",["권수","주파수","전압","전류"],3,"자속에 의해 발생하는 변압기 권선의 유도 기전력 E2=2πfn2φ/√2=4.44fn2φm으로서 자속에 비례하는 유도 전압이 발생한다."],
[T,"07 교류회로","임피던스 Z1=12+j16[Ω]과 Z2=18+j24[Ω]이 직렬로 접속된 회로에 전압 V=200[V]를 가할 때 이 회로에 흐르는 전류[A]는?",["2[A]","4[A]","5[A]","8[A]"],2,"임피던스 직렬접속 시 합성 임피던스 Z=Z1+Z2=12+j16+18+j24=30+j40. 임피던스 크기 |Z|=√(30²+40²)=50[Ω]. 전류 I=200/50=4[A]"],
[T,"07 교류회로","저항 R=30[Ω], 자체 인덕턴스 L=50[mH], 정전용량 C=102[μF]의 직렬회로에서 공진주파수 f0은 약 몇 [Hz]인가?",["40","50","60","70"],4,"RLC 회로의 공진주파수는 직렬 또는 병렬에 관계없이 항상 f0=1/(2π√(LC))이다. ∴ 1/(2π√(LC))=1/(2×3.14×√(50×10⁻³×102×10⁻⁶))=70.5[Hz]"],
[T,"08 3상 교류회로","대칭 3상 Y 결선에서 선간전압과 상전압의 위상 관계는?",["선간전압이 π/3[rad] 앞선다.","선간전압이 π/3[rad] 뒤진다.","선간전압이 π/6[rad] 앞선다.","선간전압이 π/6[rad] 뒤진다."],3,"Y 전선 연결(결선)에서 선간전압 Vl=√3Vp∠30°, 선전류 Il=Ip. 30°=π/6[rad]이므로 선간전압이 상전압보다 π/6[rad] 앞선다."],
[G,"01 직류기","전기자 저항 0.1[Ω], 전기자 전류 104[A], 유도 기전력 110.4[V]인 직류 분권 발전기의 단자 전압은 몇 [V]인가?",["98","100","102","105"],2,"유기 기전력 E=V+IaRa에서 V=E−IaRa=110.4−(0.1×104)=100[V]"],
[G,"03 변압기","변압기 내부고장 보호에 쓰이는 계전기는?",["접지 계전기","차동 계전기","과전압 계전기","역상 계전기"],2,"차동 계전기는 변압기 내부고장 발생 시 고·저압 측에 설치한 CT 2차 전류의 차에 의하여 계전기를 동작시키는 방식으로 사용되는 계전기이다.","고·저압 측 CT 2차 전류의 차를 이용하는 차동 계전기 결선도."],
[T,"08 3상 교류회로","부하의 결선방식에서 Δ 결선에서 Y 결선으로 변환하였을 때의 임피던스는?",["ZY=√3 ZΔ","ZY=(1/√3) ZΔ","ZY=3 ZΔ","ZY=(1/3) ZΔ"],4,"Y 전선 연결(결선)의 임피던스와 Δ 전선 연결(결선)의 임피던스의 관계는 ZY=1/3 ZΔ이다."],
[G,"03 변압기","20[kVA]의 단상 변압기 2대를 사용하여 V-V 결선으로 하고 3상 전원을 얻고자 한다. 이때 여기에 접속시킬 수 있는 3상 부하의 용량은 약 몇 [kVA]인가?",["34.6","44.6","54.6","66.6"],1,"V 전선 연결(결선) 3상 용량 PV=√3P=√3×20=34.6[kVA]"],
[S,"04 옥내 배선 공사","박강 전선관의 표준 굵기가 아닌 것은?",["16[mm]","19[mm]","25[mm]","39[mm]"],1,"박강 전선관: 두께 1.2[mm] 이상의 얇은 전선관. 관의 호칭: 관 바깥지름의 크기에 가까운 홀수. 관의 종류(7종류): 19, 25, 31, 39, 51, 63, 75[mm]"],
[T,"04 정전기와 콘덴서","어떤 회로의 소자에 일정한 크기의 전압으로 주파수를 2배로 증가시켰더니 흐르는 전류의 크기가 2배로 되었다. 이 소자의 종류는?",["저항","코일","콘덴서","다이오드"],3,"코일의 리액턴스 XL=2πfL이므로 주파수를 2배로 증가하면 유도 리액턴스는 2배로 증가하여 전류는 1/2로 줄어든다. 콘덴서의 리액턴스 XC=1/(2πfC)이므로 주파수를 2배로 증가하면 용량성 리액턴스는 1/2배로 줄어들어 전류는 2배로 증가한다. 저항은 주파수와 무관하다."],
[G,"02 동기기","동기 발전기의 난조를 방지하는 가장 유효한 방법은?",["회전자의 관성을 크게 한다.","제동 권선을 자극 면에 설치한다.","Xs를 작게 하고 동기 화력을 크게 한다.","자극 수를 적게 한다."],2,"동기기에서 부하가 갑자기 변동하여 부하 회전력과 전기자의 발생 회전력의 평형이 깨어졌을 때 진동하게 되는데 이러한 현상을 난조라 한다. 난조를 방지하기 위하여 자극면에 단락 권선(도체)을 설치하는데 이때 발생하는 토크를 이용하여 난조를 방지하는 권선을 제동 권선이라 하며, 동기 전동기의 경우 기동 회전력을 얻기 위하여 필요하다."],
[G,"01 직류기","직류기에서 교류를 직류로 변환하는 장치는?",["정류자","계자","전기자","브러시"],1,"계자: 성층 철심의 권선에 전류를 흘려 주자속을 만드는 부분(전자석 또는 영구자석). 전기자: 계자에서 발생한 주자속을 회전하며 끊어 기전력을 유기하는 부분. 정류자: 전기자에서 발생한 교류를 직류로 바꾸어 주는 부분(AC→DC). 슬립링: 교류 전압을 외부로 흐르게 해주는 부분"],
[T,"05 자기 성질과 자기장","다음 중 자기장 내에서 같은 크기 m[Wb]의 자극이 존재할 때 자계의 세기가 가장 큰 물질은?",["텅스텐","알루미늄","철","구리"],4,"H=B/(μ0μs)[AT/m]이므로 μs가 작은 구리가 자계의 세기(H)가 강하다. 강자성체(μs≫1): 철, 코발트, 니켈. 상자성체(μs>1): 알루미늄, 산소, 공기. 역자성체(μs<1): 구리, 아연, 납"],
[T,"06 전자유도 법칙과 인덕턴스","아래 ㉠과 ㉡에 들어갈 내용으로 알맞은 것을 고르면? 「패러데이의 전자유도 법칙에서 유도 기전력의 크기는 코일을 지나는 ( ㉠ )의 매 초 변화량과 코일의 ( ㉡ )에 비례한다.」",["㉠ 자속, ㉡ 굵기","㉠ 자속, ㉡ 권수","㉠ 전류, ㉡ 권수","㉠ 전류, ㉡ 굵기"],2,"패러데이의 법칙 e=−N dφ/dt[V]. 전자유도 법칙에서 유기되는 기전력은 단위 시간당 변화하는 자속에 비례하고 코일의 권수에 비례한다."],
[S,"02 배선재료와 공구","심벌 EQ(원 안에 EQ)는 무엇을 의미하는가?",["지진 감지기","과전류 차단기","변압기","누전 경보기"],1,"지진 감지기(Earthquake Detector)는 EQ로 표시한다.","원 안에 EQ가 쓰인 배선용 기호."],
[S,"02 배선재료와 공구","절연전선으로 가선된 배전 선로에서 활선 상태인 경우 전선의 피복을 벗기는 것은 매우 곤란한 작업이다. 이런 경우 활선 상태에서 전선의 피복을 벗기는 공구는?",["전선 피박기","애자 커버","와이어 통","데드 엔드 커버"],1,"전선 피박기: 활선 상태에서 전선 피복을 벗기는 공구. 애자 덮개(커버): 애자 보호용 절연 덮개. 와이어 통: 충전되어 있는 활선을 움직이거나 작업권 밖으로 밀어낼 때 또는 활선을 다른 장소로 옮길 때 사용하는 활선 공구. 데드 엔드 덮개(커버): 잡아당김(인류) 또는 내장주의 선로에서 활선 공법을 할 때 작업자가 현수 애자 등에 접촉되어 생기는 안전사고를 예방하기 위해 사용하는 것"],
[S,"09 전기응용 시설 공사","전주 외등을 전주에 부착하는 경우 전주 외등은 하단으로부터 몇 [m] 이상 높이에 시설하여야 하는가?(단, 교통에 지장이 없는 경우이다.)",["3.0","3.5","4.0","4.5"],1,"전주 외등: 기구 부착 높이는 하단에서 지표상 4.5[m] 이상(단, 교통 지장이 없을 경우 3.0[m] 이상). 기구 인출선 도체 단면적 0.75[mm²] 이상, 중량 100[kg] 이하, 돌출 수평 거리 1.0[m] 이내"],
[T,"01 직류회로","고유저항 ρ의 단위로 맞는 것은?",["[Ω]","[Ω·m]","[AT/Wb]","[Ω⁻¹]"],2,"저항 R=ρl/A[Ω]에서 고유저항 ρ=RA/l[Ω·m²]/[m]=[Ω·m]"],
[S,"02 배선재료와 공구","배관 공사 시 금속관이나 합성수지관으로부터 전선을 뽑아 전동기 단자 부근에 접속할 때 전선 보호를 위해 관 끝에 설치하는 것은?",["부싱","엔트런스 캡","터미널 캡","로크너트"],3,"터미널 캡은 배관 공사 시 금속관이나 합성수지관으로부터 전선을 뽑아 전동기 단자 부근에 접속할 때 사용한다. 또는 노출 배관에서 금속 배관으로 변경 시 전선 보호를 위해 관 끝에 설치하며 서비스 캡이라고도 한다."],
[T,"04 정전기와 콘덴서","C1, C2를 병렬로 접속한 회로에 C3를 직렬로 접속하였다. 이 회로의 합성 정전용량[F]은?",["1/(1/C1+1/C2)+C3","(C1×C2)/(C1+C2)+C3","C1+C2+1/C3","(C1+C2)×C3/(C1+C2+C3)"],4,"C1, C2 콘덴서 병렬접속 합성 정전용량 C12=C1+C2. C12와 C3 직렬연결 합성 정전용량 C=(C12×C3)/(C12+C3)=((C1+C2)×C3)/(C1+C2+C3)[F]","A와 B 사이에 C1, C2가 병렬로 연결되고 그 뒤에 C3가 직렬로 연결된 회로."],
[S,"02 배선재료와 공구","접지 저항을 측정하는 방법은?",["휘스톤 브리지법","켈빈 더블 브리지법","콜라우시 브리지법","테스터법"],3,"접지 저항 측정: 접지 저항계, 콜라우시 브리지법, 어스테스터"],
[G,"01 직류기","직류 직권 전동기의 회전수(N)와 토크(τ)의 관계는?",["τ∝1/N","τ∝1/N²","τ∝N","τ∝N²"],2,"직류 직권 전동기는 계자권선과 전기자 권선이 직렬로 연결되어 있어 If=Ia=I가 된다. N∝1/Ia, τ∝φIa에서 자속 φ는 계자전류에 비례하고 계자전류와 전기자전류의 크기가 같으므로 τ∝I². ∴ τ∝1/N²"],
[S,"06 전선로 및 배전선 공사","전주에서 COS용 완철의 설치 위치는?",["최하단 전력선용 완철에서 0.75[m] 하부에 설치한다.","최하단 전력선용 완철에서 0.3[m] 하부에 설치한다.","최하단 전력선용 완철에서 1.2[m] 하부에 설치한다.","최하단 전력선용 완철에서 1.0[m] 하부에 설치한다."],1,"COS용 완철 설치 규정: 설치 위치는 최하단 전력선용 완철에서 0.75[m] 이하에 설치한다. 설치 방향은 선로 방향 전력선 완철과 직각 방향으로 설치하고 COS 건조를 측에 설치하는 것이 바람직하다."],
[T,"06 전자유도 법칙과 인덕턴스","공기 중에서 10[cm] 간격을 유지하고 있는 2개의 평행도선에 각각 5[A]의 전류가 동일한 방향으로 흐를 때, 도선 1[m]당 발생하는 힘의 크기[N]는?",["2×10⁻⁴","2×10⁻⁵","5×10⁻⁴","5×10⁻⁵"],4,"평행한 두 도선 사이에 작용하는 힘 F=μI1I2/(2πr)=(4π×10⁻⁷×I1×I2)/(2πr)=(2I1I2)/r×10⁻⁷=(2×5×5)/(10×10⁻²)×10⁻⁷=5×10⁻⁵[N] (μ0=4π×10⁻⁷, 공기 중에서 μs=1, μ=μ0μs=4π×10⁻⁷)"],
[T,"04 정전기와 콘덴서","전기장 중에 단위 전하를 놓았을 때, 그것에 작용하는 힘을 나타내는 단위는?",["[H/m]","[F/m]","[AT/m]","[V/m]"],4,"전기장 세기의 단위: V=Ed(V: 전압, E: 전계, d: 거리)에서 E=V/d이므로 [V/m]. 투자율의 단위는 [H/m], 유전율의 단위는 [F/m], 자기장의 단위는 [AT/m]이다."],
[T,"09 비정현파","비사인파 교류회로의 전력 성분과 거리가 먼 것은?",["맥류 성분과 사인파의 곱","직류 성분과 사인파의 곱","직류 성분","주파수가 같은 두 사인파의 곱"],1,"맥류 성분과 사인파의 곱은 교류회로의 전력 성분과 관계가 없다."],
[T,"07 교류회로","200[V], 50[W]의 LED등에 정격전압이 가해졌을 때 LED등 회로에 흐르는 전류는 0.3[A]이다. 이 LED등의 역률[%]은?",["79.8","83.3","89.6","93.6"],2,"역률=유효전력[W]/피상전력[VA]=P/S. LED등의 역률=50[W]/(200[V]×0.3[A])×100=50/60×100=83.3[%]"],
[T,"02 전기회로 해석","전압이 9[V]이고, 내부저항이 0.5[Ω]인 전지 4개를 직렬로 연결하고 이를 단락하였을 때의 단락전류[A]는?",["6","9","15","18"],4,"단락전류 I=V/R=(9+9+9+9)/(0.5+0.5+0.5+0.5)=36/2=18[A]"],
[S,"07 고압 및 저압 배전반 공사","보호를 요하는 회로의 전류가 어떤 일정한 값(정정값) 이상으로 흘렀을 때 동작하는 계전기는?",["과전류 계전기","과전압 계전기","차동 계전기","비율 차동 계전기"],1,"과전류 계전기(OCR): 회로의 전류가 어떤 일정한 값(설정값) 이상으로 흘렀을 때 동작하는 계전기"],
[T,"06 전자유도 법칙과 인덕턴스","누설자속이 발생되기 쉬운 경우는 어느 것인가?",["자로에 공극이 없는 경우","자로의 자속밀도가 낮은 경우","철심이 자기 포화되어 있는 경우","자기회로의 자기저항이 작은 경우"],3,"누설자속은 자기저항이 큰 경우 많아진다. 자기저항 Rm=l/(μS). 자로에 공극이 생기면 자기저항이 커진다. 자로가 포화되면 자기저항은 커지고 누설자속이 커진다. 자기회로의 자기저항이 작은 경우 누설자속이 작아진다."],
[G,"04 유도기","단상 유도 전동기의 기동방법 중 기동 토크가 가장 큰 것은?",["반발 기동형","분상 기동형","반발 유도형","콘덴서 기동형"],1,"단상 유도 전동기의 기동 토크가 큰 순서: 반발 기동형>반발 유도형>콘덴서 기동형>영구 콘덴서형>분상 기동형>셰이딩 코일형"],
[G,"02 동기기","동기 조상기의 계자를 부족 여자로 하여 운전하면?",["콘덴서로 작용","뒤진 역률 보상","리액터로 작용","저항손의 보상"],3,"동기 무효 전력 보상 장치(조상기)는 무부하 운전 중 과여자일 때는 진상 작용을 하는 콘덴서로 동작을 한다. 부족 여자일 때는 지상 작용을 하는 리액터로 작용하며 전력계통의 전압 조정과 역률 개선을 위해 계통에 접속한 무부하의 동기 전동기를 말한다."],
[G,"03 변압기","부흐홀츠 계전기의 설치 위치는?",["콘서베이터 내부","변압기의 고압 측 부싱","변압기 주탱크 내부","변압기 본체와 콘서베이터 사이"],4,"부흐홀츠 계전기는 변압기 내부 고장으로 인한 보호용으로 사용되며 변압기의 주 탱크와 콘서베이터 사이에 설치된다. 절연유의 온도 상승 시 발생하는 유증기를 검출하여 권선 단락, 철심 고정 볼트의 절연 열화, 탭 전환기의 고장 등을 경보 및 차단하기 위한 용도로 사용된다."],
[S,"08 특수 장소 공사","불연성 먼지가 많은 장소에 시설할 수 없는 저압 옥내 공사의 방법은?",["금속관 공사","플로어 덕트 공사","금속제 가요전선관 공사","애자 공사"],2,"불연성 먼지(정미소, 제분소, 먼지(분진))가 많은 장소에 사용하는 공사 방법으로는 금속관 공사, 케이블 공사, 합성수지관 공사, 가요전선관 공사, 애자 공사, 금속 덕트 및 버스 덕트 공사, 캡타이어 케이블 공사 등이 있다."],
[G,"05 정류기 및 제어기기","60[Hz] 3상 반파 정류회로의 맥동 주파수는?",["60[Hz]","120[Hz]","180[Hz]","360[Hz]"],3,"3상 반파 정류의 맥동 주파수는 3×60=180[Hz]이다. (단상 반파 f, 단상 전파 2f, 3상 반파 3f, 3상 전파 6f)"],
[G,"01 직류기","전기기계의 철심을 규소강판으로 성층하는 이유는?",["동손 감소","기계손 감소","철손 감소","제작 용이"],3,"전기기기에서 철심은 자기회로를 만드는 부분으로 회전에 따른 자속 방향이 수시로 변화하면서 와전류(성층 철심으로 감소)나 히스테리시스(규소강판 사용으로 감소) 현상에 의한 철손이 생기게 된다. 따라서 철심은 이 철손을 줄이기 위해서 두께 0.35[mm]~0.5[mm] 정도의 얇은 규소강판을 성층해서 만든다."],
[G,"03 변압기","변압기유가 구비해야 할 조건으로 틀린 것은?",["점도가 낮을 것","인화점이 높을 것","응고점이 높을 것","절연내력이 클 것"],3,"변압기유는 절연 및 냉각 목적으로 공기에 비해 절연내력 및 비열이 큰 광유를 사용하며, 구비 조건: 절연내력이 클 것, 절연재료 및 금속과 접촉해도 화학작용을 일으키지 않을 것, 인화점이 높고 응고점이 낮을 것, 유동성이 크고 비열이 커서 냉각 효과가 클 것, 점도가 낮을 것, 고온에서도 석출물이 생기거나 산화하지 않을 것"],
[S,"08 특수 장소 공사","다음 [보기] 중 금속관, 애자, 합성수지관 및 케이블 공사가 모두 가능한 특수 장소를 옳게 나열한 것은? [보기] ㉠ 화약고 등의 위험 장소 ㉡ 부식성 가스가 있는 장소 ㉢ 위험물 등이 존재하는 장소 ㉣ 불연성 먼지가 많은 장소 ㉤ 습기가 많은 장소",["㉠, ㉡, ㉢","㉠, ㉣, ㉤","㉡, ㉢, ㉣","㉡, ㉣, ㉤"],4,"부식성 가스, 불연성 먼지, 습기가 많은 장소에는 금속관, 애자, 합성수지관 및 케이블 공사가 모두 가능하다."],
[G,"02 동기기","3상 동기 발전기에 무부하 전압보다 90° 뒤진 전기자 전류가 흐를 때 전기자 반작용은?",["감자작용을 한다.","증자작용을 한다.","교차자화 작용을 한다.","자기여자 작용을 한다."],1,"교차자화 작용(횡축 반작용): 계자에 의한 기전력과 전기자 부하전류가 동상(역률 1), 전기자에 의한 기자력과 계자기자력이 90도 방향. 감자작용(직축 반작용): 계자에 의한 기전력과 전기자 부하전류가 90도 위상차(역률 0, 지상전류), 전기자에 의한 기자력과 계자기자력이 180도 방향(직축). 증자작용(직축 반작용): 전기자 전류가 계자기전력보다 90도 앞선 경우(진상 무효전류), 전기자에 의한 기자력과 계자기자력이 0도 동일 방향(계자 자속 증가)"],
[S,"06 전선로 및 배전선 공사","지선의 중간에 넣는 애자의 명칭은?",["구형 애자","곡핀 애자","현수 애자","핀 애자"],1,"지지선(지선)의 중간에 사용하는 애자를 구형 애자. 지지선(지선) 애자, 옥 애자, 구슬 애자라고 한다.","지선의 중간에 끼워진 둥근 흰색 구형 애자 사진."],
[S,"07 고압 및 저압 배전반 공사","낙뢰, 수목 접촉, 일시적인 섬락 등 순간적인 사고로 계통에서 분리된 구간을 신속하게 계통에 투입시킴으로써 계통의 안정도를 향상시키고 정전 시간을 단축시키기 위해 사용되는 계전기는?",["차동 계전기","과전류 계전기","거리 계전기","재폐로 계전기"],4,"재연결(재폐로) 계전기: 계통을 안정시키기 위해서 재연결(재폐로) 차단기와 조합하여 사용한다. 송전선로에 고장이 발생하면 고장을 일으킨 구기와 조합하여 사용한다. 송전선로에 고장이 발생하면 고장을 일으킨 구간을 신속히 고속 차단하여 제거한 후 재투입시켜서 정전 구간을 단축시키는 계전기이다."],
[G,"04 유도기","유도 전동기에서 슬립이 0이라는 것은 다음 중 어느 것과 같은가?",["유도 전동기가 동기속도로 회전한다.","유도 전동기가 정지 상태이다.","유도 전동기가 전 부하 운전 상태이다.","유도 제동기의 역할을 한다."],1,"슬립 s=1이면 N=0으로 전동기는 정지 상태이다. s=0이면 N=Ns가 되어 전동기는 동기속도로 회전하고 있는 것이 되며 이 경우는 이상적인 무부하 상태이다."],
[G,"05 정류기 및 제어기기","SCR 2개를 역병렬로 접속한 그림과 같은 기호의 명칭은?",["SCR","TRIAC","GTO","UJT"],2,"사이리스터 2개를 역병렬로 접속한 것과 등가인 것은 트라이액(TRIAC)이다.","SCR 2개를 서로 반대 방향으로 병렬 접속한 기호이며 게이트 G 단자가 하나 있음."],

[T,"03 전류의 열작용과 화학작용","알칼리 축전지의 대표적인 축전지로 널리 사용되고 있는 2차 전지는?",["납축전지","산화은전지","리튬이온전지","니켈카드뮴전지"],4,"산성계: 납축전지. 알칼리계: 니켈카드뮴전지, 니켈아연전지, 니켈수소전지. 리튬계: 리튬이온/폴리머전지"],
[G,"02 동기기","병렬운전 중인 동기 발전기의 난조를 방지하기 위하여 자극면에 유도 전동기의 농형 권선과 같은 권선을 설치하는데 이 권선의 명칭은?",["계자 권선","제동 권선","전기자 권선","보상 권선"],2,"동기기에서 부하가 갑자기 변동하여 부하 회전력과 전기자의 발생 회전력의 평형이 깨어졌을 때 진동하게 되는데 이러한 현상을 난조라 한다. 난조를 방지하기 위하여 자극면에 단락 권선(도체)을 설치한다. 이때 발생하는 토크를 이용하여 난조를 방지하는 권선을 제동 권선이라 하며, 동기 전동기의 경우 기동 회전력을 얻기 위하여 필요하다."],

[S,"05 전선 및 기계기구의 보안공사","과전류 차단기로서 저압전로에 사용되는 산업용 배선차단기에 있어서 정격전류가 32[A]인 회로에 50[A]의 전류가 흘렀을 때 몇 분 이내에 자동적으로 동작하여야 하는가?",["30분","60분","120분","180분"],2,"과전류 차단기로 저압전로에 사용되는 산업용 배선차단기의 동작시간 및 특성: 정격전류 63[A] 이하 규정시간 60분(부동작전류 1.05배, 동작전류 1.3배), 63[A] 초과 120분(1.05배, 1.3배)"],
[S,"06 전선로 및 배전선 공사","일반적으로 가공 전선로의 지지물에 취급자가 오르고 내리는 데 사용하는 발판 볼트 등은 일반인의 승주를 방지하기 위하여 지표상 몇 [m] 미만에 시설하여서는 아니 되는가?",["0.75[m]","1.2[m]","1.8[m]","20[m]"],3,"발판 볼트는 지표상 1.8[m] 미만에 시설하여서는 안 된다."],
[T,"04 정전기와 콘덴서","전계의 세기 60[V/m], 전속밀도 100[C/m²]인 유전체의 단위체적에 축적되는 에너지는?",["1,000[J/m³]","3,000[J/m³]","6,000[J/m³]","12,000[J/m³]"],2,"단위체적당 축적되는 에너지 w=1/2·DE=1/2×100×60=3,000[J/m³]"],
[G,"04 유도기","농형 유도 전동기의 기동법이 아닌 것은?",["Y-Δ 기동법","기동 보상기에 의한 기동법","2차 저항기법","전전압 기동법"],3,"농형 유도 전동기는 권선형 유도 전동기와 같이 회전자에 저항을 넣을 수 없으므로 기동전류를 제한하기 위하여 공급 전압을 낮추어야 한다. 전전압 기동법: 소용량 농형 유도 전동기에 적용하며 보통 5[kW] 이하에 적용한다. 리액터 기동법: 직렬리액터를 삽입하여 전동기 단자에 가해지는 전압을 떨어뜨리는 방법. Y-Δ 기동법: 보통 5~15[kW] 정도까지 적용한다. 기동 보상기법: 단권 변압기를 써서 공급 전압을 낮추어서 기동시키는 방법. 2차 저항기법은 권선형 유도 전동기의 기동법이다."],
[G,"04 유도기","유도 전동기에서 슬립이 1이면 전동기의 속도 N은?",["동기속도보다 빠르다.","정지한다.","불변이다.","동기속도와 같다."],2,"슬립 s=1이면 N=0으로 전동기는 정지 상태이다. s=0이면 N=Ns가 되어 전동기는 동기속도로 회전하고 있는 것이 되며 이 경우는 이상적인 무부하 상태이다."],
[S,"07 고압 및 저압 배전반 공사","발전기나 변압기 내부 고장 보호에 쓰이는 계전기는?",["접지 계전기","차동 계전기","과전압 계전기","역상 계전기"],2,"발전기 또는 변압기 내부 고장 보호용 계전기는 (비율)차동 계전기, 부흐홀츠 계전기 등이 있다."],

[S,"01 전기설비 개요","전압의 구분에서 직류를 기준으로 고압에 대한 설명으로 가장 옳은 것은?",["700[V]를 넘고 1,000[V] 이하","1,000[V]를 넘고 7,000[V] 이하","700[V]를 넘고 1,500[V] 이하","1,500[V]를 넘고 7,000[V] 이하"],4,"고압 기준. 직류: 1,500[V]를 초과하고, 7,000[V] 이하의 전압. 교류: 1,000[V]를 초과하고, 7,000[V] 이하의 전압"],
[S,"08 특수 장소 공사","한국전기설비규정에 의하면 폭발성 분진이 있는 위험 장소에서 금속관 공사에 의할 경우 관 상호 및 관과 박스 기타의 부속품이나 풀 박스 또는 전기 기계기구는 몇 턱 이상의 나사 조임으로 접속하여야 하는가?",["2턱","3턱","4턱","5턱"],4,"폭연성 먼지(분진)가 존재하는 곳의 금속관 공사에 있어서 관 상호 및 관과 박스의 접속은 5턱 이상 조이는 나사로 시공하여야 한다."],
[S,"02 배선재료와 공구","금속 전선관을 박스에 고정시킬 때 사용되는 것은 어느 것인가?",["새들","부싱","로크 너트","클램프"],3,"새들: 관을 조영재에 부착할 경우 사용. 부싱: 관 끝에 전선 손상 방지를 위해 사용하는 기구. 로크 너트: 박스에 전선관을 고정하거나 커플링으로 관 상호간을 접속할 때 커플링이 도는 것을 방지하기 위해 사용하는 기구. 클램프: 관이나 케이블 등을 고정시키는 기구"],
[S,"07 고압 및 저압 배전반 공사","수·변전 설비의 고압회로에 걸리는 전압을 표시하기 위해 전압계를 시설할 때 고압회로와 전압계 사이에 시설하는 것은?",["수전용 변압기","계기용 변류기","계기용 변압기","권선형 변류기"],3,"계기용 변압기(PT)는 교류 전압 측정을 목적으로 하며 정격 2차 표준전압은 110[V]이다.","3대의 계기용 변압기(PT) 사진."],
[T,"02 전기회로 해석","R1=3[Ω], R2=5[Ω], R3=6[Ω]의 저항 3개를 그림과 같이 병렬로 접속한 회로에 30[V]의 전압을 가하였다면 이때 R1 저항에 흐르는 전류[A]는 얼마인가?",["6","10","15","20"],2,"병렬 연결된 저항에 전압은 각 저항에 30[V]가 인가되므로 R1에 흐르는 전류 I1=V/R1=30/3=10[A]","R1, R2, R3가 병렬로 연결되고 30[V] 전원이 연결된 회로."],
[G,"02 동기기","단락비가 큰 동기기에 대한 설명으로 옳은 것은?",["기계가 소형이다.","안정도가 높다.","전압변동률이 크다.","전기자 반작용이 크다."],2,"단락비가 큰 동기 발전기: 공극이 넓고, 동기 임피던스는 작다. 전압 변동률이 적다. 전기자 반작용이 적다. 안정도가 좋다. 중량이 무겁고 가격 또한 비싸다."],
[S,"06 전선로 및 배전선 공사","지중 전선로의 시설 방식이 아닌 것은?",["행거식","관로식","직접 매설식","암거식"],1,"지중 전선로의 매설 방식: 직접 매설식, 관로식, 암거식"],
[S,"04 옥내 배선 공사","버스덕트 공사 방법 중 틀린 것은?",["끝부분은 먼지가 침입하지 않도록 할 것","덕트는 접지공사를 할 것","지지점 간 거리는 2[m] 이하로 할 것","끝부분은 막을 것"],3,"버스덕트 공사: 지지점 간의 거리 3[m] 이하, 덕트는 접지공사를 할 것, 끝부분은 먼지 침투 방지를 위해 막을 것","버스덕트 설치 사진."],
[T,"04 정전기와 콘덴서","진공 중의 두 점전하 Q1[C], Q2[C]가 거리 r[m] 사이에서 작용하는 정전력[N]의 크기를 옳게 나타낸 것은?",["9×10⁹×Q1Q2/r²","6.33×10⁴×Q1Q2/r²","9×10⁹×Q1Q2/r","6.33×10⁴×Q1Q2/r"],1,"정전력 F=1/(4πε0)×Q1Q2/r²=9×10⁹×Q1Q2/r²[N] (∵ ε0=8.85×10⁻¹²)"],
[G,"01 직류기","다음 그림에서 직류 분권 전동기의 속도 특성 곡선은?",["A","B","C","D"],2,"분권 전동기는 전기자와 계자권선이 병렬로 접속되어 전원에 연결되고, 단자전압이 일정하면 계자 전류 If는 전기자 전류 Ia와는 관계가 없으며 If=V/Rf로 일정하다. 정속도 특성을 나타내는 곡선은 B이다.","가로축 부하전류[A], 세로축 속도 N[rpm]. A는 오른쪽 위로 올라가는 직선(차동복권), B는 완만하게 내려가는 직선(분권), C는 곡선 형태로 내려가는 가동복권, D는 급하게 내려가는 곡선(직권)."],
[S,"02 배선재료와 공구","전등 한 개를 2개소에서 점멸하고자 할 때 옳은 배선은?",["그림 ①","그림 ②","그림 ③","그림 ④"],4,"3로 스위치 2개가 필요하며, 전선은 3가닥이 사용된다. 전원에는 2가닥이 사용된다.","3로 스위치 S3 2개 사이를 3가닥으로 연결하고 중간에 전등과 전원(2가닥)을 연결한 배선도 4가지 중 올바른 것을 고르는 문제."],
[T,"05 자기 성질과 자기장","단위 길이당 권수 1,000회인 무한장 솔레노이드에 10[A]의 전류가 흐를 때 솔레노이드 외부의 자장[AT/m]은?",["0","100","1,000","10,000"],1,"무한장 솔레노이드 외부 자계 H=0"],
[S,"04 옥내 배선 공사","제1종 가요전선관의 최소 두께 [mm]는 얼마인가?",["0.8","1","1.2","1.5"],1,"가요전선관 공사: 전선은 절연 전선 이상일 것(단, 옥외용 비닐 절연 전선은 제외), 전선은 연선으로 사용하되 10[mm²] 이하 단선 가능, 제1종 가요전선관은 최소 0.8[mm] 이상 두께일 것"],
[T,"05 자기 성질과 자기장","자극 가까이에 물체를 두었을 때 자화되는 물체와 자석이 그림과 같은 방향으로 자화되는 금속은?",["구리","철","알루미늄","백금"],1,"강자성체(μs≫1): 철, 코발트, 니켈 등. 상자성체(μs>1): 알루미늄, 산소, 공기 등. 역자성체(μs<1): 자화될 때 자극이 외부 자석의 자극과 같은 방향으로 자화되는 물체로 구리, 아연, 납 등. 그림은 자화될 때 자극이 외부 자석의 자극과 같은 방향으로 자화되는 역자성체로 구리, 아연 등이 있다.","N극과 S극 자석 사이에 놓인 물체가 왼쪽 N, 오른쪽 S로 자화된 그림(외부 자석의 N극 쪽에 물체의 N극이 놓임)."],
[S,"05 전선 및 기계기구의 보안공사","접지공사에서 접지극에 동봉을 사용할 때 최소 길이는?",["1[m]","1.2[m]","0.9[m]","0.6[m]"],3,"접지극의 종류와 규격: 구리(동)봉은 지름 8[mm] 이상, 길이 0.9[m] 이상. 구리(동)판은 두께 0.7[mm] 이상, 단면적 900[cm²] 이상"],
[S,"06 전선로 및 배전선 공사","지선의 시설에서 가공 전선로의 직선 부분이란 수평각도 몇 도까지인가?",["2","3","5","6"],3,"지지선(지선)의 시설에서 전선로의 직선 부분은 5도 이하의 수평각도를 이루는 곳을 포함한다."],
[T,"04 정전기와 콘덴서","전계의 세기 60[V/m], 전속밀도 100[C/m²]인 유전체의 단위체적에 축적되는 에너지는?",["1,000[J/m³]","3,000[J/m³]","6,000[J/m³]","12,000[J/m³]"],2,"w=1/2·DE=1/2×100×60=3,000[J/m³]"],
[G,"02 동기기","동기 전동기의 전기자 전류가 최소일 때 역률은?",["0.5","0.707","0.866","1.0"],4,"동기 전동기에 단자(공급) 전압 및 출력을 일정한 상태로 두고 계자 전류를 변화시키면 전기자 전류와 역률이 달라지는데 이를 나타낸 위상 특성 곡선, 즉 V 곡선이다. 일정 출력에서 여자를 약하게 해 주면 지상 역률의 전기자 전류를, 여자를 강하게 하면 진상 역률의 전류를 취하게 된다. 어떤 부하에서도 전기자 전류가 최소일 때는 역률이 1.0이 된다."],
[G,"03 변압기","변압기 2대를 V 결선했을 때의 이용률은 몇 [%]인가?",["57.7[%]","70.7[%]","86.6[%]","100[%]"],3,"단상 변압기 3대로 Δ-Δ 전선 연결(결선) 운전 중 1대의 변압기 고장 시 지속운전이 가능하다. V 결선과 Δ 결선의 출력비 Pv/PΔ=1/√3≒0.577. V 결선한 변압기 1대당 이용률 √3V2nI2n/(2V2nI2n)=√3/2≒0.866"],
[G,"02 동기기","동기 발전기의 돌발 단락 전류를 주로 제한하는 것은?",["누설 리액턴스","동기 임피던스","권선 저항","동기 리액턴스"],1,"동기 발전기를 갑자기 단락시켰을 때 흐르는 큰 전류를 돌발 단락 전류라고 한다. 돌발 단락 전류를 주로 제한하는 것은 누설 리액턴스이다."],
[T,"02 전기회로 해석","같은 저항 4개를 그림과 같이 연결하여 a-b 간에 일정전압을 가했을 때 소비전력이 가장 큰 것은 어느 것인가?",["그림 ①","그림 ②","그림 ③","그림 ④"],4,"소비전력 P=I²R이고 전압이 일정한 조건을 이용하여 각 전류를 구하여 가장 큰 값이 소비전력이 가장 크다. ①: I=V/4R, ②: I=V/(2R+R/2)=V/2.5R, ③: I=V/(R/2+R/2)=V/R, ④: I=V/(R/4)=4V/R. ④의 전류가 가장 큰 값이므로 소비전력도 가장 크다.","저항 R 4개의 연결: ① 4개 직렬, ② 2개 직렬 + 2개 병렬 직렬, ③ 2개 병렬 두 묶음 직렬, ④ 4개 모두 병렬."],
[G,"04 유도기","유도 전동기의 회전자에 슬립 주파수의 전압을 공급하여 속도 제어를 하는 것은?",["2차 저항법","2차 여자법","극수 변환법","인버터 주파수 변환법"],2,"유도 전동기의 속도 N=(1−s)Ns, Ns=120f/p. 속도를 제어하려면 슬립, 주파수, 극수의 3가지 중 어느 하나를 바꾸면 된다. 2차 여자 제어법은 2차 저항 제어법과 같이 권선형 전동기에 한하여 이용된다. 다만, 다른 점은 2차 측에 저항을 넣는 대신에 그 2차 저항에 의해 생기는 전압 강하분의 전압을 2차 측의 외부 회로에서 슬립링을 통하여 공급하는 방법이다."],
[T,"03 전류의 열작용과 화학작용","황산구리(CuSO4)의 전해액에 2개의 동일한 구리판을 넣고 전원을 연결하였을 때 양극에서 나타나는 변화를 옳게 설명한 것은?",["변화가 없다.","구리판이 두꺼워진다.","구리판이 얇아진다.","수소 가스가 발생한다."],3,"양극: 산화반응, 구리판이 얇아지고 산소가 발생한다. 음극: 환원반응, 구리판이 두꺼워지고 pH가 감소한다."],
[S,"04 옥내 배선 공사","다음 금속몰드 공사 방법 중 설명이 틀린 것은?",["지지점 간 거리는 1.5[m] 이하마다 한다.","사용 전압이 400[V] 이하이므로 접지공사를 하였다.","몰드 안에서 접속점이 없도록 한다.","점검할 수 없는 은폐 장소에 시설하였다."],4,"금속몰드 공사 시설 장소: 외상을 받을 우려가 없는 전개된 건조한 장소나 점검할 수 있는 은폐 장소. 몰드의 두께: 0.5[mm] 이상의 연강판(베이스와 뚜껑으로 구성). 몰드 홈의 폭 및 깊이: 5[cm] 이하로 할 것","금속몰드 사진."],
[T,"03 전류의 열작용과 화학작용","금속체에서 권선 저항과 온도의 관계는?",["온도와는 무관하다.","온도가 상승함에 따라 권선 저항은 감소한다.","온도가 상승함에 따라 권선 저항은 증가한다.","온도가 상승함에 따라 권선 저항은 증가와 감소를 반복한다."],3,"금속체는 일반적으로 양(+)의 온도 계수를 가지므로 권선 저항은 온도 증가에 따라 저항도 증가하게 된다. 또한 반도체는 보통 부(−)의 온도 계수이므로 온도 상승에 따른 저항값이 감소한다."],
[S,"03 전선의 접속","동선을 직선으로 접속할 경우 동선의 굵기가 10[mm²] 이하일 때 매킹타이어 슬리브 접속 시 슬리브를 최소 몇 회 이상 비틀림을 해야 하는가?",["3.5회","2회","2.5회","3회"],2,"매킹타이어 슬리브에 의한 직선 접속: 슬리브 접속은 2번 이상 하는 것이 기본이며 10[mm²] 이하는 2회 이상, 16[mm²] 이하는 2.5회 이상, 25[mm²] 이하는 3회 이상 비틀림을 해야 한다.","매킹타이어 슬리브로 접속한 전선 사진."],
[S,"07 고압 및 저압 배전반 공사","점유 면적이 좁고 운전, 보수 시에 안전하며 공장, 빌딩 등의 전기실에 많이 사용되는 배전반은 어떤 것인가?",["데드 프런트형","수직형","큐비클형","라이브 프런트형"],3,"큐비클형 배전반(폐쇄식 배전반): 점유 면적이 좁고 운전, 보수 시에 안전하므로 공장, 빌딩 등의 전기실에 널리 사용되는 배전반","큐비클형 수배전반 사진."],
[G,"01 직류기","전기기기의 철심 재료로 규소강판을 많이 사용하는 이유로 가장 적당한 것은?",["와류손을 줄이기 위해","맴돌이 전류를 없애기 위해","히스테리시스손을 줄이기 위해","구리손을 줄이기 위해"],3,"전기기기에서 철심은 자기회로를 만드는 부분으로 회전에 따른 자속 방향이 수시로 변화하면서 와전류(성층 철심으로 감소) 손실이나 히스테리시스(규소강판 사용으로 감소) 현상에 의한 철손이 생기게 된다. 따라서 계자(전기자) 철심은 이 철손을 줄이기 위해서 두께 0.35[mm]~0.5[mm] 정도의 얇은 규소강판을 성층하여 사용한다."],
[G,"04 유도기","유도 전동기의 슬립을 측정하는 방법으로 옳은 것은?",["전압계법","전류계법","평형 브리지법","스트로보 스코프법"],4,"회전계법: 직접 회전수 측정, s(슬립) 산출 및 스트로보 스코프에 의한 회전수 측정. 직류 밀리볼트계법: 권선형 유도 전동기에 적용, 슬립링의 단락 2차 권선 사이 전압강하를 코일형 계기로 측정(1[Hz]마다 좌우 흔들림을 세어 계산). 수화기법: 슬립링 사이에 수화기를 대면 2차 주파수의 1[Hz]에 2회 소리 감지 1분간 측정"],
[S,"03 전선의 접속","선의 굵기가 6[mm²] 이하인 전선을 직선 접속할 때 주로 사용하는 접속법은?",["트위스트 접속","브리타니아 접속","쥐꼬리 접속","T형 커넥터 접속"],1,"트위스트 접속: 6[mm²] 이하의 가는 전선 접속"],
[T,"04 정전기와 콘덴서","다음 설명 중에서 틀린 것은?",["코일은 직렬로 연결할수록 인덕턴스가 커진다.","콘덴서는 직렬로 연결할수록 용량이 커진다.","저항은 병렬로 연결할수록 저항치가 작아진다.","리액턴스는 주파수의 함수이다."],2,"콘덴서는 직렬로 연결할수록 용량이 작아지고 병렬로 연결할수록 커진다."],
[G,"04 유도기","가정용 선풍기나 세탁기 등에 많이 사용되는 단상 유도 전동기는?",["분상 기동형","콘덴서 기동형","영구 콘덴서 전동기","반발 기동형"],3,"단상 유도 전동기는 기동 방법에 따라 분상 기동형, 콘덴서 기동형(2차 콘덴서형, 영구 콘덴서형), 반발 기동형, 세이딩 코일형 등으로 분류한다. 이 중 영구 콘덴서 기동형은 원심력 스위치가 없고 가격도 싸며, 보수할 필요가 적고, 큰 기동 토크를 요구하지 않는 선풍기, 냉장고, 세탁기 등에 널리 사용된다."],
[G,"03 변압기","변압기의 규약효율은?",["출력/입력×100[%]","출력/(출력+손실)×100[%]","출력/(입력−손실)×100[%]","(입력+손실)/입력×100[%]"],2,"전기기계의 효율에는 출력과 입력을 측정해서 구하는 실측효율, 규약에 따라 손실을 결정하여 계산으로 구하는 규약효율이 있다. 변압기의 효율은 규약효율을 표준으로 한다. 변압기의 규약효율 η=출력[kW]/(출력[kW]+손실[kW])×100[%]"],
[G,"05 정류기 및 제어기기","다음 중 트라이액(TRIAC)의 심벌(기호)은?",["그림 ①","그림 ②","그림 ③","그림 ④"],3,"TRIAC(쌍방향성 3단자 사이리스터)은 사이리스터 2개를 역병렬로 접속한 것과 등가인 것으로 양방향 전류가 흘러 교류 제어용으로 사용되는 소자이다. 전력 제어용, 조광 다이얼(AC) 등 교류 제어용으로만 사용된다.","① 역방향 두 삼각형(게이트 없음, 양방향 다이오드 형태), ② SCR 기호(삼각형+게이트), ③ 두 삼각형이 맞대어진 양방향 기호에 게이트 G 단자 1개(TRIAC), ④ MOSFET/FET 형태의 기호."],
[T,"02 전기회로 해석","\"임의의 폐회로에서의 기전력 총합은 회로소자에서 발생하는 전압강하의 총합과 같다.\"라고 정의되는 법칙은?",["키르히호프의 제1법칙","키르히호프의 제2법칙","플레밍의 오른손 법칙","앙페르의 오른나사 법칙"],2,"앙페르의 오른나사 법칙: 전류에 의해 만들어지는 자기장의 방향을 결정하는 법칙. 플레밍의 오른손 법칙: 힘의 방향과 자기장의 방향이 주어질 때 유도기전력 방향을 결정하는 법칙. 플레밍의 왼손 법칙: 자기장의 방향과 전류의 방향이 주어질 때 힘의 방향을 알 수 있는 법칙. 키르히호프 제1(전류)법칙: 접합점을 중심으로 들어온 전류와 나가는 전류의 합은 같다. 키르히호프 제2(전압)법칙: 폐회로의 모든 기전력의 총합과 회로소자의 전압강하의 총합은 같다."],
[T,"03 전류의 열작용과 화학작용","다음에서 나타내는 법칙은? \"같은 전기량에 의해서 여러 가지 화합물이 전해될 때 석출되는 물질의 양은 그 물질의 화학당량에 비례한다.\"",["렌즈의 법칙","패러데이의 법칙","앙페르의 법칙","줄의 법칙"],2,"렌츠 법칙: 유도기전력은 자속의 변화를 방해하는 방향으로 발생하는 법칙이다. 패러데이 법칙: 전기분해로 석출되는 양은 그 물질의 화학당량 및 전류의 세기에 비례한다. 석출량 W=kQ=kIt[g]. 앙페르의 오른나사 법칙: 전류가 흐를 때 발생하는 자기장의 방향을 결정하는 법칙이다. 줄의 법칙: 전류가 흐를 때 발생하는 열량 H=0.24I²Rt[cal]"],
[S,"09 전기응용 시설 공사","전주 외등을 전주에 부착하는 경우 전주 외등은 하단으로부터 몇 [m] 이상 높이에 시설하여야 하는가? (단, 교통 지장이 있는 경우이다.)",["3.0","3.5","4.0","4.5"],4,"전주 외등: 대지 전압 300[V] 이하 백열전등이나 수은등 등을 배선 선로의 지지물 등에 시설하는 등. 기구 인출선 도체 단면적: 0.75[mm²] 이상. 중량: 부속 금속 부속품(금구류)을 포함하여 100[kg] 이하. 기구 부착 높이: 하단에서 지표상 4.5[m] 이상(단, 교통 지장이 없을 경우 3.0[m] 이상). 돌출 수평 거리: 1.0[m] 이내"],
[G,"03 변압기","부흐홀츠 계전기의 설치 위치는?",["변압기 주 탱크 내부","콘서베이터 내부","변압기의 고압 측 부싱","변압기 본체와 콘서베이터 사이"],4,"부흐홀츠 계전기는 변압기 내부고장으로 인한 보호용으로 사용되며 변압기의 주 탱크와 콘서베이터 사이에 설치한다. 절연유의 온도 상승 시 발생하는 유증기를 검출하여 권선 단락, 철심 고정 볼트의 절연 열화, 탭 전환기의 고장 등을 경보 및 차단하기 위한 용도로 사용된다."],
[T,"06 전자유도 법칙과 인덕턴스","권수 400회의 코일에 5[A]의 전류가 흘러서 0.04[Wb]의 자속이 코일을 지나간다고 하면, 이 코일의 자체 인덕턴스는 몇 [H]인가?",["0.25","0.32","2.5","3.2"],4,"L=Nφ/I=400×0.04/5=3.2[H]"],
[G,"02 동기기","동기 발전기의 전기자 권선을 단절권으로 하면?",["역률이 좋아진다.","절연이 잘 된다.","고조파를 제거한다.","기전력을 높인다."],3,"권선 간격과 극 간격이 같은 것을 전절권, 권선 간격이 극 간격보다 작은 것을 단절권. 동기 발전기의 전기자 권선을 단절권으로 선정하면 특정 고조파를 제거하여 기전력의 파형을 개선할 수 있다. 권선단의 길이가 짧아져 기계 전체의 길이가 축소된다. 구리(동)량이 적게 들기 때문에 동기기는 단절권을 주로 사용한다."],
[T,"09 비정현파","파고율, 파형률이 모두 1인 파형은?",["사인파","고조파","구형파","삼각파"],3,"파형률=실효값/평균값, 파고율=최대값/실효값. 구형파의 파고율과 파형률은 모두 1이다. (정현파: 실효값 Vm/√2, 평균값 2Vm/π; 정현반파: Vm/2, Vm/π; 삼각파: Vm/√3, Vm/2; 구형반파: Vm/√2, Vm/2; 구형파: Vm, Vm)"],
[T,"04 정전기와 콘덴서","유전율 ε의 유전체 내에 있는 전하 Q[C]에서 나오는 전기력선 수는?",["Q","Q/ε0","Q/ε","Q/εs"],3,"전하 Q[C]에서 나오는 전기력선 수 N=Q/ε[개] (∵ ε=ε0εs)"],
[G,"01 직류기","직류 직권 전동기의 회전수(N)와 토크(τ)의 관계는?",["τ∝1/N","τ∝1/N²","τ∝N","τ∝N^(3/2)"],2,"직류 직권 전동기는 계자권선과 전기자 권선이 직렬로 연결되어 있어 If=Ia=I가 된다. N∝1/Ia, τ∝φIa=Ia² ∴ τ∝1/N². 즉, 직권 전동기의 토크는 전류의 제곱에 비례하므로 기동시킬 때 전류를 안전한 값에 제한하면서 충분히 큰 토크를 발생시킬 수 있다. 이것은 자주 기동시켜야 하는 전차나 기중기 등에 적합한 특성이다."],
[T,"05 자기 성질과 자기장","도체가 자기장에서 받는 힘의 관계 중 틀린 것은?",["자기력선속 밀도에 비례","도체의 길이에 반비례","흐르는 전류에 비례","도체가 자기장과 이루는 각도에 비례(0°~90°)"],2,"자기장 내에서 도체가 받는 힘 F=IBl sinθ[N]에서 힘은 도체의 길이에 비례한다."],
[G,"04 유도기","그림과 같은 분상 기동형 단상 유도 전동기를 역회전 시키기 위한 방법이 아닌 것은?",["원심력 스위치를 개로 또는 폐로한다.","기동 권선이나 운전 권선의 어느 한 권선의 단자접속을 반대로 한다.","기동 권선의 단자접속을 반대로 한다.","운전 권선의 단자접속을 반대로 한다."],1,"단상 유도 전동기의 코일 구성은 주 권선과 보조 권선으로 구성되어 있다. 기동 시 운전(주)권선과 기동(보조)권선에 의하여 회전 자기장을 만들어 기동시키며, 회전 방향을 변경할 때에는 2권선 중 하나의 권선 전원만 바꾸어 주면 된다.","운전 권선(U-V), 기동 권선(X-Y)에 원심력 스위치와 콘덴서 Cs가 직렬로 연결된 분상/콘덴서 기동형 결선도와 회전자."],
[T,"05 자기 성질과 자기장","어느 자극에 의하여 생기는 자기장의 세기를 2배로 하려면 자극으로부터의 거리를 몇 배로 하여야 하는가?",["√2배","1/√2배","2배","1/2배"],2,"자계 H=1/(4πμ)×m/r²이므로 H와 r²은 반비례이다. 즉, 자기장의 세기를 2배로 하기 위해서는 거리를 1/√2배로 하면 된다."],
[G,"03 변압기","3상 전원에서 한 상에 고장이 발생하였다. 이때 3상 부하에 3상 전력을 공급할 수 있는 결선 방법은?",["Y 결선","Δ 결선","단상 결선","V 결선"],4,"단상 변압기 3대로 Δ-Δ 전선 연결(결선) 운전 중 1대의 변압기 고장 시 V 전선 연결(결선)으로 계속 3상 전력을 공급하는 방식. V 결선과 Δ 결선의 출력비 Pv/PΔ=1/√3≒0.577. V 결선한 변압기 1대당 이용률 √3/2≒0.866"],
[T,"07 교류회로","단상 전압 220[V]에 소형 전동기를 접속하였더니 3.5[A]의 전류가 흘렀다. 이때의 역률이 80[%]이었다. 이 전동기의 소비전력[W]은?",["336[W]","425[W]","616[W]","715[W]"],3,"소비전력 P=VIcosθ=220×3.5×0.8=616[W]"],
[T,"03 전류의 열작용과 화학작용","다음이 설명하는 것은? \"금속 A와 B로 만든 열전쌍과 접점 사이에 임의의 금속 C를 연결해도 C의 양 끝의 접점의 온도를 똑같이 유지하면 회로의 열기전력은 변화하지 않는다.\"",["제벡 효과","톰슨 효과","제3금속의 법칙","펠티에 효과"],3,"제벡 효과: 서로 다른 금속을 접합하여 폐회로를 만든 후 두 접합점의 온도를 다르게 했을 때 폐회로에 열기전력이 발생하여 열전류가 흐르는 현상. 펠티에 효과: 서로 다른 금속을 접속시켜 폐회로를 만들고 전류를 흘리면 접합부에서 열이 발생하거나 흡수되는 현상. 톰슨 효과: 같은 종류 금속을 접합하여 두 점 간에 온도차를 주고 고온에서 저온 쪽으로 전류를 흘리면 열이 발생 또는 흡수가 일어나는 현상. 제3금속의 법칙: 서로 다른 금속의 열전쌍의 접점 사이에 임의의 금속을 연결해도 양 끝의 접점의 온도를 똑같이 유지하면 회로의 열기전력이 변하지 않는 현상"],

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CN=["①","②","③","④"];
// 수식 표기 변환: esc된 문자열을 받아 분수·제곱근·첨자를 HTML로 바꿉니다.
const fm=(()=>{
const CH='A-Za-z0-9\\u0391-\\u03A9\\u03B1-\\u03C9\\u00B7.\\u2080-\\u209C\\u00B2\\u00B3\\u00B9\\u2070-\\u2079\\u207A-\\u207C\\u221A';
const NUMC='\\d{1,3}(?:,\\d{3})+(?:\\.\\d+)?';
const GRP='\\([^()\\[\\]]*(?:\\([^()\\[\\]]*\\)[^()\\[\\]]*)*\\)';
const TERM='(?:['+CH+']*'+GRP+'['+CH+']*|'+NUMC+'|['+CH+']+)';
const FR=new RegExp('('+TERM+')/('+TERM+')','g');
const strip=t=>{if(t[0]!=='('||t[t.length-1]!==')')return t;let d=0;for(let i=0;i<t.length;i++){if(t[i]==='(')d++;else if(t[i]===')'){d--;if(d===0&&i<t.length-1)return t}}return t.slice(1,-1)};
function frac(seg,nextBr,nb){
  return seg.replace(FR,(m,a,b,off,str)=>{
    if(/^[a-z]{2,}$/.test(a)&&/^[a-z]+$/.test(b))return m;
    if(/[가-힣]/.test(a+b))return m;
    if(nextBr&&off+m.length===str.length&&/^[\d.]+$/.test(a)&&/^[\d.]+$/.test(b)&&/^\[k?V\]/.test(nb))return m;
    return '<span class="fr"><i>'+frac(strip(a))+'</i><i>'+frac(strip(b))+'</i></span>';
  });
}
function root(s){
  s=s.replace(/√\(([^()]*)\)/g,'√<span class="rt">$1</span>');
  s=s.replace(/√(\d+(?:\.\d+)?)/g,'√<span class="rt">$1</span>');
  s=s.replace(/√([A-Za-zΑ-ω][A-Za-zΑ-ω₀-ₜ]*)/g,'√<span class="rt">$1</span>');
  return s;
}
function sup(s){
  s=s.replace(/\^\(([^()]*)\)/g,'<sup>$1</sup>').replace(/\^(-?[\d.]+)/g,'<sup>$1</sup>');
  s=s.replace(/([A-Za-zΑ-ω₀-ₜ)])_([A-Za-zΑ-ωΔ\d₀-₉]+)/g,'$1<sub>$2</sub>');
  return s;
}
return s=>{
  s=String(s);
  const parts=s.split(/(\[[^\]]*\])/);
  for(let i=0;i<parts.length;i+=2)parts[i]=frac(parts[i],i<parts.length-1,parts[i+1]||'');
  return sup(root(parts.join('')));
};})();

const ex=s=>fm(esc(s));

const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let S_=null,timer=null;

  const best=r=>{const h=store.hist.filter(x=>x.key==="r"+r);return h.length?"최근 "+h[0].score+"점 · 최고 "+Math.max(...h.map(x=>x.score))+"점":"아직 풀지 않음"};

function clearWrong(y){dlg(y+'년 오답노트를 모두 비울까요?',()=>{all(y).forEach(x=>delete store.wrong[x.id]);save();year(y)},'비우기')}

    let h='<header><h1>⚡ 전기기능사 필기 CBT</h1></header><div class="wrap">'+resumeCard()+'<h2>기출문제 (연도 선택)</h2>';

  if(YL.length>4){h+='</div><button class="btn w" id="moreYb" style="width:100%;margin-bottom:8px" onclick="toggleY()">'+(window.showAllY?'접기':'더보기 ('+(YL.length-4)+'개 연도)')+'</button>'}
  h+=smartCard();
  h+='<h2>과목별 연습 (전 회차 섞기)</h2><div class="card">';
  SUBJ.forEach(s=>{const c=all().filter(x=>x.row[0]===s).length;h+=`<div class="row" style="margin-bottom:8px"><div class="grow"><b>${s}</b> <span class="sub">${c}문제</span></div><button class="btn g sm" onclick="start('sub','${s}',20)">20문제</button><button class="btn g sm" onclick="start('sub','${s}',0)">전체</button></div>`});
  h+='</div><h2>랜덤</h2><div class="card"><div class="row"><div class="grow"><div class="big">최근 5개년 랜덤 모의고사</div><div class="sub">'+YL.slice(0,5).join('·')+'년에서 60문제 · 60분</div></div><button class="btn" onclick="start(\'rand5\')">시작</button></div></div><div class="card"><div class="row"><div class="grow"><div class="big">전체 랜덤 모의고사</div><div class="sub">모든 연도에서 60문제 · 60분 (연도별 랜덤은 각 연도 안에 있습니다)</div></div><button class="btn" onclick="start(\'rand\')">시작</button></div></div>';
  if(store.hist.length){h+='<h2>최근 기록</h2><div class="card">';store.hist.slice(0,8).forEach(x=>{h+=`<div class="sb"><span>${esc(x.title)} <span class="sub">${x.date}</span></span><b class="${x.score>=60?'pass':'fail'}">${x.score}점 ${x.score>=60?'합격':'불합격'}</b></div>`});h+='<button class="btn w sm" style="margin-top:8px" onclick="clearHist()">기록 지우기</button></div>'}
  h+=backupCard();
  h+='<p class="sub" style="text-align:center;margin-top:20px">그림은 책 그림을 보고 다시 그린 도식입니다.</p></div>';
  $('#app').innerHTML=h;window.scrollTo(0,0);

function dlg(msg,ok,okLabel,noLabel){
  const m=document.createElement('div');m.className='mask';m.style.alignItems='center';m.style.padding='20px';
  m.innerHTML=`<div class="card" style="max-width:340px;width:100%;margin:0"><div style="font-size:16px;margin-bottom:14px;white-space:pre-wrap">${esc(msg)}</div><div class="row">${noLabel===null?'':`<button class="btn w grow" id="dn">${noLabel||'취소'}</button>`}<button class="btn grow" id="dy">${okLabel||'확인'}</button></div></div>`;
  document.body.appendChild(m);
  const c=()=>m.remove();
  m.querySelector('#dy').onclick=()=>{c();if(ok)ok()};
  const n=m.querySelector('#dn');if(n)n.onclick=c;
}
function clearHist(){dlg('기록과 오답노트를 모두 지울까요?',()=>{store={wrong:{},hist:[]};save();home()},'지우기')}

function start(kind,a,b){
  let items,title,mode='prac',limit=0,key=null;
  if(kind==='real'){items=EX[a].map((_,i)=>mk(a,i));title=NM[a]+" 실전";mode='real';limit=3600;key="r"+a}
  else if(kind==='prac'){items=EX[a].map((_,i)=>mk(a,i));title=NM[a]+" 연습";key=null}
  else if(kind==='sub'){let p=shuf(all().filter(x=>x.row[0]===a));if(b)p=p.slice(0,b);items=p;title=a+" 연습"}
  else if(kind==='rand'){items=shuf(all(a)).slice(0,60);title=a?a+"년 랜덤 모의고사":"전체 랜덤 모의고사";mode='real';limit=3600;key=a?"y"+a:null}
  else if(kind==='rand5'){items=shuf(recent5()).slice(0,60);title="최근 5개년 랜덤 모의고사";mode='real';limit=3600;key="y5"}
  else if(kind==='weak'){items=weakItems();title="약점 맞춤 20문제";if(!items.length){dlg('풀이 기록이 아직 부족합니다.\n문제를 몇 개 더 풀면 약한 챕터를 골라 드립니다.',null,'확인',null);return}}
  else if(kind==='freq'){const g=shuf(Object.values(fqGroups()).filter(x=>x.length>1)).sort((x,y)=>y.length-x.length);items=g.map(x=>{const p=x[0].split('-');return mk(+p[0],+p[1])});if(b)items=items.slice(0,b);title="자주 나오는 문제"}
  else{items=shuf(all(a).filter(x=>store.wrong[x.id]));if(b)items=items.slice(0,b);title=a+"년 오답노트";if(!items.length){dlg('오답노트가 비어 있습니다.',null,'확인',null);return}}
  S_={items,title,mode,kind,key,idx:0,ans:items.map(()=>0),limit,t0:Date.now(),done:false,review:false,id:++sid};
  P('quiz');
  if(limit){clearInterval(timer);timer=setInterval(tick,1000)}
  quiz();
}
function left(){return Math.max(0,S_.limit-Math.floor((Date.now()-S_.t0)/1000))}
function tick(){if(!S_||S_.done||S_.review){clearInterval(timer);return}const l=left();const e=$('#tm');if(e)e.textContent=fmt(l);if(l<=0){clearInterval(timer);finish();dlg('시간이 종료되어 자동 제출했습니다.',null,'확인',null)}}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+":"+String(s%60).padStart(2,'0');

function fqNote(it){const g=fqGroups()[fqKey(it)];if(!g||g.length<2)return '';const o=g.filter(id=>id!==it.id).map(id=>{const p=id.split('-');const x=mk(+p[0],+p[1]);return NM[x.r]+' '+x.n+'번'});return `<div class="e" style="margin-top:8px;padding:8px 10px;background:#fff3cd;color:#6b4500;border-radius:8px">★ 자주 나오는 문제 · 총 ${g.length}회 출제<br>같은 문제: ${o.join(', ')}</div>`}
function quiz(){
  sv();
  const s=S_,it=s.items[s.idx],q=it.row,a=s.ans[s.idx];
  const reveal=s.review||(s.mode==='prac'&&a>0);
  const L=s.rvList,pos=L?L.indexOf(s.idx):s.idx,tot=L?L.length:s.items.length;
  let h=`<header><button onclick="${s.review?'history.back()':'quitQ()'}">${s.review?'결과':'나가기'}</button><h1 style="font-size:16px">${esc(s.title)}${L?` · 오답 ${pos+1}/${tot}`:''}</h1>${s.limit&&!s.review?`<span class="t" id="tm">${fmt(left())}</span>`:''}</header><div class="prog"><i style="width:${(pos+1)/tot*100}%"></i></div><div class="wrap">`;
  h+=`<div class="row"><span class="tag">${esc(q[0])}</span>${fqGroups()[fqKey(it)].length>1?`<span class="tag" style="background:#fff3cd;color:#8a5a00">${fqGroups()[fqKey(it)].length}회 출제</span>`:''}<span class="sub grow">${esc(q[1])}</span><span class="sub">${NM[it.r]} ${it.n}번</span></div>`;
  h+=`<div class="q">${s.idx+1}. ${ex(q[2])}</div>`;
  if(q[6]){const f=FIG[it.r+'-'+it.n];h+=f?`<div class="figbox">${f}</div>`:`<div class="fig">[그림 설명] ${esc(q[6])}</div>`}
  q[3].forEach((c,i)=>{
    const n=i+1;let cl='ch',m='';
    if(reveal){if(n===q[4]){cl+=' ok';m='✓ 정답'}else if(n===a){cl+=' ng';m='✗ 오답'}}
    else if(n===a)cl+=' sel';
    h+=`<button class="${cl}" ${reveal?'disabled':''} onclick="pick(${n})"><span class="no">${n}</span><span>${ex(c)}</span><span class="m">${m}${reveal&&n===a&&n===q[4]?' (내 선택)':''}${reveal&&n===a&&n!==q[4]?' (내 선택)':''}</span></button>`;
  });
  if(reveal){
    const okk=a===q[4];
    h+=`<div class="fb ${okk?'ok':'ng'}"><div class="h">${a===0?'미응답 · ':okk?'⭕ 정답입니다 · ':'❌ 오답입니다 · '}정답 ${CN[q[4]-1]} ${ex(q[3][q[4]-1])}</div><div class="e">${ex(q[5])}</div>${fqNote(it)}</div>`;
  }
  h+='</div>';
  const last=pos===tot-1;
  h+=`<div class="bar"><div><button class="btn w" onclick="go(-1)" ${pos?'':'disabled style="opacity:.4"'}>이전</button><button class="btn g" onclick="omr()">답안지</button>${last?(L?'<button class="btn" onclick="retryWrong()">오답만 다시 풀기</button>':`<button class="btn" onclick="${s.review?'history.back()':'askFinish()'}">${s.review?'결과':s.mode==='real'?'제출':'결과'}</button>`):'<button class="btn" onclick="go(1)">다음</button>'}</div></div>`;
  $('#app').innerHTML=h;window.scrollTo(0,0);
}
function pick(n){
  const s=S_;if(s.review)return;
  if(s.mode==='prac'){if(s.ans[s.idx])return;s.ans[s.idx]=n;rec(s.items[s.idx],n,true);save()}
  else s.ans[s.idx]=(s.ans[s.idx]===n?0:n);
  quiz();
}
function go(d){const s=S_;if(s.rvList){const p=s.rvList.indexOf(s.idx)+d;if(p<0||p>=s.rvList.length)return;s.idx=s.rvList[p];quiz();return}const n=s.idx+d;if(n<0||n>=s.items.length)return;s.idx=n;quiz()}
function exitQ(){clearInterval(timer);S_=null;history.back()}
function quitQ(){if(S_.mode==='real'&&!S_.done&&!S_.review)dlg('중단하고 나갈까요?\n진행 상황은 저장되어 홈에서 이어서 풀 수 있습니다.',exitQ,'나가기','계속 풀기');else exitQ()}
function omr(){
  const s=S_;let h='<div class="mask" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="row"><b class="grow">답안지</b><button class="btn w sm" onclick="this.closest(\'.mask\').remove()">닫기</button></div><div class="sub" style="margin:6px 0 10px">번호를 누르면 이동합니다.</div><div class="grid">';
  s.items.forEach((it,i)=>{let c='';const a=s.ans[i];
    if(s.review||(s.mode==='prac'&&a))c=a===0?'':(a===it.row[4]?'o':'x');else if(a)c='a';
    h+=`<button class="${c} ${i===s.idx?'cur':''}" onclick="S_.idx=${i};document.querySelector('.mask').remove();quiz()">${i+1}</button>`});
  h+='</div>';
  if(!s.review)h+=`<button class="btn" style="width:100%;margin-top:14px" onclick="this.closest('.mask').remove();askFinish()">${s.mode==='real'?'답안 제출':'결과 보기'}</button>`;
  h+='</div></div>';document.body.insertAdjacentHTML('beforeend',h);
}
function askFinish(){
  const un=S_.ans.filter(x=>!x).length;
  dlg(un?`풀지 않은 문제가 ${un}개 있습니다.\n제출할까요?`:'제출할까요?',finish,'제출','취소');
}
function finish(){
  const s=S_;if(s.done)return;s.done=true;clearInterval(timer);
  let ok=0;
  s.items.forEach((it,i)=>{if(s.ans[i]===it.row[4])ok++;rec(it,s.ans[i],s.mode==='real')});
  s.ok=ok;s.score=Math.round(ok/s.items.length*100);
  s.used=Math.floor((Date.now()-s.t0)/1000);
  if(s.mode==='real'){const d=new Date();store.hist.unshift({key:s.key||'rand',title:s.title,score:s.score,date:(d.getMonth()+1)+"/"+d.getDate()});store.hist=store.hist.slice(0,40)}
  store.cur=null;save();R('result');result();
}
let rf='all';
function result(){
  const s=S_;s.review=false;
  const sc={};SUBJ.forEach(x=>sc[x]=[0,0]);
  s.items.forEach((it,i)=>{sc[it.row[0]][1]++;if(s.ans[i]===it.row[4])sc[it.row[0]][0]++});
  s.rvList=null;const p=s.score>=60;
  const bad=s.items.map((it,i)=>i).filter(i=>s.ans[i]!==s.items[i].row[4]);
  let h=`<header><button onclick="goHome()">홈</button><h1 style="font-size:16px">${esc(s.title)} 결과</h1></header><div class="wrap"><div class="card score"><div class="n ${p?'pass':'fail'}">${s.score}점</div><div class="big ${p?'pass':'fail'}" style="margin-top:6px">${p?'합격':'불합격'} (합격선 60점)</div><div class="sub">${s.ok} / ${s.items.length} 정답 · 소요 ${fmt(s.used)}</div></div><div class="card"><b>과목별 점수</b>`;
  SUBJ.forEach(x=>{if(sc[x][1]){const v=Math.round(sc[x][0]/sc[x][1]*100);h+=`<div class="sb"><span>${x} <span class="sub">${sc[x][0]}/${sc[x][1]}</span></span><b class="${v>=40?'':'fail'}">${v}점</b></div>`}});
  h+='</div>'+(bad.length?'<div class="card"><b>오답·미응답 '+bad.length+'문제</b><div class="row" style="margin-top:10px"><button class="btn grow" onclick="revBad()">틀린 문제 넘겨보기</button><button class="btn g grow" onclick="retryWrong()">오답만 다시 풀기</button></div></div>':'')+'<div class="tabs"><button class="btn '+(rf==='all'?'':'w')+' sm" onclick="rf=\'all\';result()">전체</button><button class="btn '+(rf==='bad'?'':'w')+' sm" onclick="rf=\'bad\';result()">오답·미응답만</button></div><div class="card">';
  let c=0;
  s.items.forEach((it,i)=>{const a=s.ans[i],okk=a===it.row[4];if(rf==='bad'&&okk)return;c++;
    h+=`<div class="li" onclick="rev(${i})"><span class="mk ${a===0?'n':okk?'o':'x'}">${a===0?'-':okk?'O':'X'}</span><span class="tx">${i+1}. ${esc(it.row[2])}</span><span class="sub">${okk?'':'정답 '+CN[it.row[4]-1]}</span></div>`});
  if(!c)h+='<div class="sub" style="text-align:center;padding:14px">틀린 문제가 없습니다 🎉</div>';
  h+='</div></div><div class="bar"><div><button class="btn w" onclick="goHome()">홈으로</button><button class="btn" onclick="rev(0)">전체 해설 보기</button></div></div>';
  $('#app').innerHTML=h;window.scrollTo(0,0);
}
function rev(i){S_.review=true;S_.rvList=null;S_.idx=i;P('rev');quiz()}
function revBad(){const s=S_;const L=s.items.map((it,i)=>i).filter(i=>s.ans[i]!==s.items[i].row[4]);if(!L.length)return;s.review=true;s.rvList=L;s.idx=L[0];P('rev');quiz()}
function retryWrong(){const s=S_;const items=s.items.filter((it,i)=>s.ans[i]!==it.row[4]);if(!items.length)return;clearInterval(timer);
  S_={items:shuf(items),title:'오답 다시 풀기',mode:'prac',kind:'retry',key:null,idx:0,ans:items.map(()=>0),limit:0,t0:Date.now(),done:false,review:false,id:++sid};
  R('quiz');quiz()}
const nrm=t=>String(t).replace(/[\s.,\[\]()?:·]/g,'');
let FKG=null;
function fqKey(it){return nrm(it.row[2])+'|'+it.row[3].map(nrm).sort().join('|')}
function fqGroups(){if(!FKG){FKG={};all().forEach(x=>{(FKG[fqKey(x)]=FKG[fqKey(x)]||[]).push(x.id)})}return FKG}
function chapStats(){const m={};all().forEach(x=>{const s=store.stat[x.id];if(!s)return;const k=x.row[0]+' · '+x.row[1];const o=m[k]=m[k]||{k,r:0,w:0};o.r+=s[0];o.w+=s[1]});return Object.values(m).map(o=>({k:o.k,n:o.r+o.w,p:Math.round(o.r/(o.r+o.w)*100)})).filter(o=>o.n>=3).sort((a,b)=>a.p-b.p||b.n-a.n)}
function weakItems(){const cs=chapStats().slice(0,3).map(o=>o.k);const sc=x=>{const s=store.stat[x.id]||[0,0];return (store.wrong[x.id]?-2:0)+(s[0]-s[1])};return shuf(all().filter(x=>cs.includes(x.row[0]+' · '+x.row[1]))).sort((a,b)=>sc(a)-sc(b)).slice(0,20)}
function smartCard(){const cs=chapStats();let h='<h2>맞춤 학습</h2><div class="card">';
  if(cs.length){h+='<b>약한 챕터</b>';cs.slice(0,3).forEach(o=>{h+=`<div class="sb"><span>${esc(o.k)} <span class="sub">${o.n}회 풀이</span></span><b class="${o.p>=60?'':'fail'}">${o.p}%</b></div>`});h+='<button class="btn w" style="margin-top:8px;width:100%" onclick="start(\'weak\')">약한 챕터 20문제 풀기</button>'}
  else h+='<div class="sub">문제를 풀면 챕터별 정답률이 쌓이고, 약한 챕터를 골라 드립니다.</div>';
  h+='</div>';return h}
function sv(){const s=S_;if(!s||s.done||s.review)return;if(!s.ans.some(Boolean)&&!s.idx)return;store.cur={ids:s.items.map(x=>{const p=x.id.split('-');return [+p[0],+p[1]]}),ans:s.ans,idx:s.idx,title:s.title,mode:s.mode,kind:s.kind,key:s.key,limit:s.limit,used:Math.floor((Date.now()-s.t0)/1000),y:curY};save()}
function resumeCard(){const c=store.cur;if(!c)return '';const n=c.ans.filter(Boolean).length;return `<div class="card" style="border:2px solid #2563eb"><div class="big">이어풀기</div><div class="sub">${esc(c.title)} · ${n}/${c.ids.length}문제 풀이</div><div class="row" style="margin-top:10px"><button class="btn grow" onclick="resumeQ()">이어서 풀기</button><button class="btn w grow" onclick="dropCur()">삭제</button></div></div>`}
function dropCur(){store.cur=null;save();home()}
function resumeQ(){const c=store.cur;if(!c)return;const items=c.ids.map(p=>mk(p[0],p[1]));curY=c.y||null;S_={items,title:c.title,mode:c.mode,kind:c.kind,key:c.key,idx:c.idx,ans:c.ans,limit:c.limit,t0:Date.now()-c.used*1000,done:false,review:false,id:++sid};if(c.limit){clearInterval(timer);timer=setInterval(tick,1000)}P('quiz');quiz()}
function backupCard(){return '<h2>기록 백업</h2><div class="card"><div class="sub" style="margin-bottom:8px">오답노트와 점수를 파일로 저장해 두면 폰을 바꾸거나 브라우저를 지워도 복원할 수 있습니다.</div><div class="row"><button class="btn g grow" onclick="exportData()">내보내기</button><button class="btn w grow" onclick="importData()">가져오기</button></div></div>'}
function exportData(){const b=new Blob([JSON.stringify({wrong:store.wrong,hist:store.hist,stat:store.stat})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='eqcbt-backup.json';document.body.appendChild(a);a.click();a.remove()}
function importData(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.wrong||!d.hist)throw 0;dlg('가져오면 현재 기록이 백업 내용으로 바뀝니다. 진행할까요?',()=>{store.wrong=d.wrong;store.hist=d.hist;store.stat=d.stat||{};save();home()},'가져오기')}catch(e){dlg('올바른 백업 파일이 아닙니다.',null,'확인',null)}})};i.click()}
function rec(it,a,c){if(!a)return;const ok=a===it.row[4];if(ok)delete store.wrong[it.id];else store.wrong[it.id]=1;if(c){const s=store.stat[it.id]=store.stat[it.id]||[0,0];s[ok?0:1]++}}
let curY=null,sid=0;
function P(v){const d=((history.state&&history.state.d)||0)+1;history.pushState({v,d,y:curY,sid:S_?S_.id:0},'')}
function R(v){const d=(history.state&&history.state.d)||0;history.replaceState({v,d,y:curY,sid:S_?S_.id:0},'')}
function goHome(){const d=(history.state&&history.state.d)||0;if(d>0)history.go(-d);else home()}
function openYear(y){curY=y;P('year');year(y)}
function route(st){
  const ok=st.sid&&S_&&S_.id===st.sid;
  if(st.v==='quiz'){if(ok&&!S_.done){quiz();return}}
  else if(st.v==='result'){if(ok&&S_.done){result();return}}
  else if(st.v==='rev'){if(ok&&S_.done){S_.review=true;quiz();return}}
  else if(st.v==='year'){year(st.y);return}
  else if(st.v==='home'){home();return}
  if(st.y)year(st.y);else home();
}
window.addEventListener('popstate',e=>{
  const st=e.state||{v:'home',d:0};
  if(S_&&!S_.done&&!S_.review){
    if(S_.mode==='real'){history.pushState({v:'quiz',d:(st.d||0)+1,y:curY,sid:S_.id},'');dlg('중단하고 나갈까요?\n진행 상황은 저장되어 홈에서 이어서 풀 수 있습니다.',exitQ,'나가기','계속 풀기');return}
    clearInterval(timer);S_=null;
  }
  route(st);
});
history.replaceState({v:'home',d:0},'');home();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
