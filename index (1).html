function year(y){
  clearInterval(timer);S_=null;
  const best=r=>{const h=store.hist.filter(x=>x.key==="r"+r);return h.length?"최근 "+h[0].score+"점 · 최고 "+Math.max(...h.map(x=>x.score))+"점":"아직 풀지 않음"};
  const yb=(()=>{const h=store.hist.filter(x=>x.key==="y"+y);return h.length?" · 최근 "+h[0].score+"점":""})();
  let h=`<header><button onclick="home()">홈</button><h1 style="font-size:16px">${y}년 기출</h1></header><div class="wrap"><h2>회차별</h2>`;
  YEARS[y].forEach(r=>{h+=`<div class="card"><div class="row"><div class="grow"><div class="big">${NM[r]}</div><div class="sub">${EX[r].length}문제${NOTE[r]?' ('+NOTE[r]+')':''} · ${best(r)}</div></div></div><div class="row" style="margin-top:10px"><button class="btn grow" onclick="start('real',${r})">실전 모의</button><button class="btn g grow" onclick="start('prac',${r})">연습 (즉시 해설)</button></div></div>`});
  h+=`<h2>랜덤</h2><div class="card"><div class="row"><div class="grow"><div class="big">${y}년 랜덤 모의고사</div><div class="sub">${y}년 회차에서 60문제 · 60분${yb}</div></div><button class="btn" onclick="start('rand',${y})">시작</button></div></div></div>`;
  $('#app').innerHTML=h;window.scrollTo(0,0);
}

function home(){
  clearInterval(timer);S_=null;
  const best=r=>{const h=store.hist.filter(x=>x.key==="r"+r);return h.length?"최근 "+h[0].score+"점 · 최고 "+Math.max(...h.map(x=>x.score))+"점":"아직 풀지 않음"};
  const wn=Object.keys(store.wrong).length;
  let h='<header><h1>⚡ 전기기능사 필기 CBT</h1></header><div class="wrap"><h2>기출문제 (연도 선택)</h2>';
  YL.forEach(y=>{const n=YEARS[y].reduce((s,r)=>s+EX[r].length,0);h+=`<div class="card" onclick="year(${y})" style="cursor:pointer"><div class="row"><div class="grow"><div class="big">${y}년 기출</div><div class="sub">${YEARS[y].length}회차 · ${n}문제 · 회차별 연습 / ${y}년 랜덤 모의고사</div></div><button class="btn">열기</button></div></div>`});
  h+='<h2>과목별 연습 (전 회차 섞기)</h2><div class="card">';
  SUBJ.forEach(s=>{const c=all().filter(x=>x.row[0]===s).length;h+=`<div class="row" style="margin-bottom:8px"><div class="grow"><b>${s}</b> <span class="sub">${c}문제</span></div><button class="btn g sm" onclick="start('sub','${s}',20)">20문제</button><button class="btn g sm" onclick="start('sub','${s}',0)">전체</button></div>`});
  h+='</div><h2>랜덤</h2><div class="card"><div class="row"><div class="grow"><div class="big">전체 랜덤 모의고사</div><div class="sub">모든 연도에서 60문제 · 60분 (연도별 랜덤은 각 연도 안에 있습니다)</div></div><button class="btn" onclick="start(\'rand\')">시작</button></div></div>';
  h+=`<h2>복습</h2><div class="card"><div class="row"><div class="grow"><div class="big">오답노트</div><div class="sub">틀리거나 못 푼 문제 ${wn}개</div></div><button class="btn" ${wn?'':'disabled style="opacity:.4"'} onclick="start('wrong')">풀기</button></div></div>`;
  if(store.hist.length){h+='<h2>최근 기록</h2><div class="card">';store.hist.slice(0,8).forEach(x=>{h+=`<div class="sb"><span>${esc(x.title)} <span class="sub">${x.date}</span></span><b class="${x.score>=60?'pass':'fail'}">${x.score}점 ${x.score>=60?'합격':'불합격'}</b></div>`});h+='<button class="btn w sm" style="margin-top:8px" onclick="clearHist()">기록 지우기</button></div>'}
  h+='<p class="sub" style="text-align:center;margin-top:20px">그림은 책 그림을 보고 다시 그린 도식입니다.</p></div>';
  $('#app').innerHTML=h;window.scrollTo(0,0);
}
function dlg(msg,ok,okLabel,noLabel){
  const m=document.createElement('div');m.className='mask';m.style.alignItems='center';m.style.padding='20px';
  m.innerHTML=`<div class="card" style="max-width:340px;width:100%;margin:0"><div style="font-size:16px;margin-bottom:14px;white-space:pre-wrap">${esc(msg)}</div><div class="row">${noLabel===null?'':`<button class="btn w grow" id="dn">${noLabel||'취소'}</button>`}<button class="btn grow" id="dy">${okLabel||'확인'}</button></div></div>`;
  document.body.appendChild(m);
  const c=()=>m.remove();
  m.querySelector('#dy').onclick=()=>{c();if(ok)ok()};
  const n=m.querySelector('#dn');if(n)n.onclick=c;
}
function clearHist(){dlg('기록과 오답노트를 모두 지울까요?',()=>{store={wrong:{},hist:[]};save();home()},'지우기')}

function start(kind,a,b){
  let items,title,mode='prac',limit=0,key=null;
  if(kind==='real'){items=EX[a].map((_,i)=>mk(a,i));title=NM[a]+" 실전";mode='real';limit=3600;key="r"+a}
  else if(kind==='prac'){items=EX[a].map((_,i)=>mk(a,i));title=NM[a]+" 연습";key=null}
  else if(kind==='sub'){let p=shuf(all().filter(x=>x.row[0]===a));if(b)p=p.slice(0,b);items=p;title=a+" 연습"}
  else if(kind==='rand'){items=shuf(all(a)).slice(0,60);title=a?a+"년 랜덤 모의고사":"전체 랜덤 모의고사";mode='real';limit=3600;key=a?"y"+a:null}
  else{items=shuf(all().filter(x=>store.wrong[x.id]));title="오답노트"}
  S_={items,title,mode,kind,key,idx:0,ans:items.map(()=>0),limit,t0:Date.now(),done:false,review:false};
  if(limit){clearInterval(timer);timer=setInterval(tick,1000)}
  quiz();
}
function left(){return Math.max(0,S_.limit-Math.floor((Date.now()-S_.t0)/1000))}
function tick(){if(!S_||S_.done||S_.review){clearInterval(timer);return}const l=left();const e=$('#tm');if(e)e.textContent=fmt(l);if(l<=0){clearInterval(timer);finish();dlg('시간이 종료되어 자동 제출했습니다.',null,'확인',null)}}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+":"+String(s%60).padStart(2,'0');

function quiz(){
  const s=S_,it=s.items[s.idx],q=it.row,a=s.ans[s.idx];
  const reveal=s.review||(s.mode==='prac'&&a>0);
  let h=`<header><button onclick="${s.review?'result()':'quitQ()'}">${s.review?'결과':'나가기'}</button><h1 style="font-size:16px">${esc(s.title)}</h1>${s.limit&&!s.review?`<span class="t" id="tm">${fmt(left())}</span>`:''}</header><div class="prog"><i style="width:${(s.idx+1)/s.items.length*100}%"></i></div><div class="wrap">`;
  h+=`<div class="row"><span class="tag">${esc(q[0])}</span><span class="sub grow">${esc(q[1])}</span><span class="sub">${NM[it.r]} ${it.n}번</span></div>`;
  h+=`<div class="q">${s.idx+1}. ${esc(q[2])}</div>`;
  if(q[6]){const f=FIG[it.r+'-'+it.n];h+=f?`<div class="figbox">${f}</div>`:`<div class="fig">[그림 설명] ${esc(q[6])}</div>`}
  q[3].forEach((c,i)=>{
    const n=i+1;let cl='ch',m='';
    if(reveal){if(n===q[4]){cl+=' ok';m='✓ 정답'}else if(n===a){cl+=' ng';m='✗ 오답'}}
    else if(n===a)cl+=' sel';
    h+=`<button class="${cl}" ${reveal?'disabled':''} onclick="pick(${n})"><span class="no">${n}</span><span>${esc(c)}</span><span class="m">${m}${reveal&&n===a&&n===q[4]?' (내 선택)':''}${reveal&&n===a&&n!==q[4]?' (내 선택)':''}</span></button>`;
  });
  if(reveal){
    const okk=a===q[4];
    h+=`<div class="fb ${okk?'ok':'ng'}"><div class="h">${a===0?'미응답 · ':okk?'⭕ 정답입니다 · ':'❌ 오답입니다 · '}정답 ${CN[q[4]-1]} ${esc(q[3][q[4]-1])}</div><div class="e">${esc(q[5])}</div></div>`;
  }
  h+='</div>';
  const last=s.idx===s.items.length-1;
  h+=`<div class="bar"><div><button class="btn w" onclick="go(-1)" ${s.idx?'':'disabled style="opacity:.4"'}>이전</button><button class="btn g" onclick="omr()">답안지</button>${last?`<button class="btn" onclick="${s.review?'result()':'askFinish()'}">${s.review?'결과':s.mode==='real'?'제출':'결과'}</button>`:'<button class="btn" onclick="go(1)">다음</button>'}</div></div>`;
  $('#app').innerHTML=h;window.scrollTo(0,0);
}
function pick(n){
  const s=S_;if(s.review)return;
  if(s.mode==='prac'){if(s.ans[s.idx])return;s.ans[s.idx]=n}
  else s.ans[s.idx]=(s.ans[s.idx]===n?0:n);
  quiz();
}
function go(d){const s=S_;const n=s.idx+d;if(n<0||n>=s.items.length)return;s.idx=n;quiz()}
function quitQ(){if(S_.review||S_.done)return home();dlg('중단하고 나갈까요?\n진행 내용은 저장되지 않습니다.',home,'나가기','계속 풀기')}
function omr(){
  const s=S_;let h='<div class="mask" onclick="if(event.target===this)this.remove()"><div class="sheet"><div class="row"><b class="grow">답안지</b><button class="btn w sm" onclick="this.closest(\'.mask\').remove()">닫기</button></div><div class="sub" style="margin:6px 0 10px">번호를 누르면 이동합니다.</div><div class="grid">';
  s.items.forEach((it,i)=>{let c='';const a=s.ans[i];
    if(s.review||(s.mode==='prac'&&a))c=a===0?'':(a===it.row[4]?'o':'x');else if(a)c='a';
    h+=`<button class="${c} ${i===s.idx?'cur':''}" onclick="S_.idx=${i};document.querySelector('.mask').remove();quiz()">${i+1}</button>`});
  h+='</div>';
  if(!s.review)h+=`<button class="btn" style="width:100%;margin-top:14px" onclick="this.closest('.mask').remove();askFinish()">${s.mode==='real'?'답안 제출':'결과 보기'}</button>`;
  h+='</div></div>';document.body.insertAdjacentHTML('beforeend',h);
}
function askFinish(){
  const un=S_.ans.filter(x=>!x).length;
  dlg(un?`풀지 않은 문제가 ${un}개 있습니다.\n제출할까요?`:'제출할까요?',finish,'제출','취소');
}
function finish(){
  const s=S_;if(s.done)return;s.done=true;clearInterval(timer);
  let ok=0;
  s.items.forEach((it,i)=>{const c=s.ans[i]===it.row[4];if(c){ok++;if(s.kind==='wrong')delete store.wrong[it.id]}else if(s.mode==='real'||s.ans[i]>0||s.kind!=='wrong')store.wrong[it.id]=1});
  s.ok=ok;s.score=Math.round(ok/s.items.length*100);
  s.used=Math.floor((Date.now()-s.t0)/1000);
  if(s.mode==='real'){const d=new Date();store.hist.unshift({key:s.key||'rand',title:s.title,score:s.score,date:(d.getMonth()+1)+"/"+d.getDate()});store.hist=store.hist.slice(0,40)}
  save();result();
}
let rf='all';
function result(){
  const s=S_;s.review=false;
  const sc={};SUBJ.forEach(x=>sc[x]=[0,0]);
  s.items.forEach((it,i)=>{sc[it.row[0]][1]++;if(s.ans[i]===it.row[4])sc[it.row[0]][0]++});
  const p=s.score>=60;
  let h=`<header><button onclick="home()">홈</button><h1 style="font-size:16px">${esc(s.title)} 결과</h1></header><div class="wrap"><div class="card score"><div class="n ${p?'pass':'fail'}">${s.score}점</div><div class="big ${p?'pass':'fail'}" style="margin-top:6px">${p?'합격':'불합격'} (합격선 60점)</div><div class="sub">${s.ok} / ${s.items.length} 정답 · 소요 ${fmt(s.used)}</div></div><div class="card"><b>과목별 점수</b>`;
  SUBJ.forEach(x=>{if(sc[x][1]){const v=Math.round(sc[x][0]/sc[x][1]*100);h+=`<div class="sb"><span>${x} <span class="sub">${sc[x][0]}/${sc[x][1]}</span></span><b class="${v>=40?'':'fail'}">${v}점</b></div>`}});
  h+='</div><div class="tabs"><button class="btn '+(rf==='all'?'':'w')+' sm" onclick="rf=\'all\';result()">전체</button><button class="btn '+(rf==='bad'?'':'w')+' sm" onclick="rf=\'bad\';result()">오답·미응답만</button></div><div class="card">';
  let c=0;
  s.items.forEach((it,i)=>{const a=s.ans[i],okk=a===it.row[4];if(rf==='bad'&&okk)return;c++;
    h+=`<div class="li" onclick="rev(${i})"><span class="mk ${a===0?'n':okk?'o':'x'}">${a===0?'-':okk?'O':'X'}</span><span class="tx">${i+1}. ${esc(it.row[2])}</span><span class="sub">${okk?'':'정답 '+CN[it.row[4]-1]}</span></div>`});
  if(!c)h+='<div class="sub" style="text-align:center;padding:14px">틀린 문제가 없습니다 🎉</div>';
  h+='</div></div><div class="bar"><div><button class="btn w" onclick="home()">홈으로</button><button class="btn" onclick="rev(0)">전체 해설 보기</button></div></div>';
  $('#app').innerHTML=h;window.scrollTo(0,0);
}
function rev(i){S_.review=true;S_.idx=i;quiz()}
home();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
