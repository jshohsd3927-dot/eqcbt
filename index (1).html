<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>전기기능사 CBT</title>
<style>
:root{--bg:#f2f4f8;--card:#fff;--tx:#1b2330;--sub:#6b7686;--line:#e2e6ee;--pri:#2563eb;--pri2:#e8f0ff;--ok:#16a34a;--okbg:#e9f8ee;--ng:#dc2626;--ngbg:#fdecec;--warn:#f59e0b;--hd:#1e3a8a}
@media(prefers-color-scheme:dark){:root{--bg:#10151f;--card:#1a2130;--tx:#e8edf6;--sub:#93a0b4;--line:#2a3447;--pri:#5b8cff;--pri2:#1f2d4d;--ok:#4ade80;--okbg:#14301f;--ng:#f87171;--ngbg:#3a1a1c;--hd:#0b1226}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:90px}
header{position:sticky;top:0;z-index:5;background:var(--hd);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header .t{font-variant-numeric:tabular-nums;font-weight:700}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:14px}
.wrap{padding:14px 16px}
h2{font-size:14px;color:var(--sub);margin:20px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.btn{border:0;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:600;background:var(--pri);color:#fff;cursor:pointer}
.btn.g{background:var(--pri2);color:var(--pri)}
.btn.w{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:14px}
.sub{color:var(--sub);font-size:13px}
.big{font-size:17px;font-weight:700}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--pri2);color:var(--pri);font-weight:600}
.q{font-size:17px;font-weight:600;margin:10px 0 14px;white-space:pre-wrap}
.figbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px;color:var(--tx)}
.fig{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:14px;color:var(--sub);margin-bottom:12px}
.ch{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;font-size:16px;cursor:pointer}
.ch .no{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:700}
.ch.sel{border-color:var(--pri);background:var(--pri2)}
.ch.sel .no{background:var(--pri);color:#fff;border-color:var(--pri)}
.ch.ok{border-color:var(--ok);background:var(--okbg)}
.ch.ok .no{background:var(--ok);color:#fff;border-color:var(--ok)}
.ch.ng{border-color:var(--ng);background:var(--ngbg)}
.ch.ng .no{background:var(--ng);color:#fff;border-color:var(--ng)}
.ch .m{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
.ch.ok .m{color:var(--ok)}.ch.ng .m{color:var(--ng)}
.ch:disabled{cursor:default}
.fb{border-radius:12px;padding:12px;margin-top:6px}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.ng{background:var(--ngbg);border:1px solid var(--ng)}
.fb .h{font-weight:800;margin-bottom:4px}
.fb.ok .h{color:var(--ok)}.fb.ng .h{color:var(--ng)}
.fb .e{font-size:15px;white-space:pre-wrap}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar>div{max-width:560px;margin:0 auto;display:flex;gap:8px}
.bar .btn{flex:1}
.prog{height:4px;background:rgba(255,255,255,.25)}
.prog i{display:block;height:100%;background:#fff}
.score{text-align:center;padding:20px 10px}
.score .n{font-size:54px;font-weight:800;line-height:1}
.pass{color:var(--ok)}.fail{color:var(--ng)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.grid button{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);font-weight:700;font-size:14px;cursor:pointer;position:relative}
.grid button.a{background:var(--pri2);border-color:var(--pri);color:var(--pri)}
.grid button.o{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.grid button.x{background:var(--ngbg);border-color:var(--ng);color:var(--ng)}
.grid button.cur{outline:2.5px solid var(--warn)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:85vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border:0}
.mk{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px}
.mk.o{background:var(--ok)}.mk.x{background:var(--ng)}.mk.n{background:var(--sub)}
.li .tx{flex:1;font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1}
.sb{display:flex;justify-content:space-between;font-size:14px;padding:6px 0}
</style></head><body><div id="app"></div>
<script>
var EX={};var T="전기이론",G="전기기기",S="전기설비";
EX[1]=[
[S,"06 전선로 및 배전선 공사","가공전선의 지지물에 승탑 또는 승강용으로 사용하는 발판볼트 등은 지표상 몇 [m] 미만에 시설하여서는 안 되는가?",["1.2","1.5","1.6","1.8"],4,"가공전선로 지지물의 철탑오름(승탑) 및 전주오름방지(승주방지) 발판볼트 등은 지표상 1.8[m] 미만에 시설해서는 안 된다."],
[S,"04 옥내 배선 공사","합성수지관 상호 및 관과 박스는 접속 시에 삽입하는 깊이를 관 바깥지름의 몇 배 이상으로 하여야 하는가? (단, 접착제를 사용하지 않는 경우이다.)",["0.2","0.5","1.0","1.2"],4,"관 상호 간 및 박스와는 관을 삽입하는 깊이를 관 바깥지름의 1.2배(접착제를 사용하는 경우 0.8배) 이상으로 하고 꽂음 접속에 의하여 견고하게 접속한다."],
[T,"02 전기회로 해석","기전력이 V₀[V], 내부 저항이 r[Ω]인 n개의 전지를 직렬 연결하였다. 전체 내부 저항을 옳게 나타낸 것은?",["r/n","nr","r/n²","nr²"],2,"n개를 직렬 연결했으므로 합성 내부 저항 R = nr [Ω]."],
[T,"03 전류의 열작용과 화학작용","1,000[V]의 전압을 200[μF]의 콘덴서에 가하여 충전한 뒤 저항을 통하여 방전시키면 저항체의 발열량은 몇 [cal]인가?",["3","5","24","43"],3,"콘덴서 축적 에너지 W = ½CV² = ½×200×10⁻⁶×1,000² = 100[J]. 1[J] = 0.24[cal]이므로 H = 100×0.24 = 24[cal]."],
[T,"05 자기 성질과 자기장","물질에 따라 자석에 반발하는 물체를 무엇이라 하는가?",["비자성체","상자성체","반자성체","가역성체"],3,"강자성체(μs≫1): 철, 코발트, 니켈. 상자성체(μs>1): 알루미늄, 산소, 공기. 반(역)자성체(μs<1): 외부 자석과 같은 방향으로 자화되어 반발력이 생기며 구리, 아연 등이 있다."],
[T,"03 전류의 열작용과 화학작용","전압계 및 전류계의 측정 범위를 넓히기 위하여 사용하는 배율기와 분류기의 접속방법은?",["배율기는 전압계와 병렬접속, 분류기는 전류계와 직렬접속","배율기는 전압계와 직렬접속, 분류기는 전류계와 병렬접속","배율기 및 분류기 모두 전압계와 전류계에 직렬 접속","배율기 및 분류기 모두 전압계와 전류계에 병렬 접속"],2,"배율기는 전압계 내부저항보다 큰 저항을 전압계와 직렬로, 분류기는 전류계 내부저항보다 작은 저항을 전류계와 병렬로 연결한다."],
[S,"03 전선의 접속","접지저항 측정방법으로 가장 적당한 것은?",["절연저항계","전력계","교류의 전압 및 전류계","콜라우시 브리지"],4,"콜라우시 브리지: 접지저항 및 전해액의 저항 측정. 절연저항계: 회로의 절연저항 측정. 전력계: 부하의 소비전력 표시."],
[G,"01 직류기","직류 직권 전동기의 특징에 대한 설명으로 틀린 것은?",["부하전류가 증가하면 속도가 크게 감소된다.","기동 토크가 작다.","무부하 운전이나 벨트를 연결한 운전은 위험하다.","계자 권선과 전기자 권선이 직렬로 접속되어 있다."],2,"직권 전동기는 토크 T∝Iₐ²이므로 기동 토크가 크다. 무부하·벨트 운전은 속도가 무한대로 올라 위험하고, 부하전류가 늘면 속도가 현저히 감소한다."],
[S,"06 전선로 및 배전선 공사","일반적으로 저압 가공 인입선이 도로를 횡단하는 경우 노면상 시설하여야 할 높이는?",["4[m] 이상","5[m] 이상","6[m] 이상","6.5[m] 이상"],2,"저압 인입선이 도로를 횡단할 때 노면상 5[m] 이상(기술상 부득이하고 교통에 지장이 없을 때 3[m] 이상). 철도·궤도 6.5[m], 횡단보도교 3[m], 기타 4[m].","저압 인입선 시설 높이 그림: 도로 5.0(3)[m], 철도·궤도 6.5[m], 횡단보도교 3.0[m], 기타 4.0[m]"],
[G,"01 직류기","직류 발전기 전기자의 주된 역할은?",["기전력을 유도한다.","자속을 만든다.","정류작용을 한다.","회전자와 외부회로를 접속한다."],1,"계자: 주 자속을 만듦. 전기자: 자속을 끊어 기전력을 유기. 브러시: 직류 기전력을 외부로 인출. 정류자: 전류를 한 방향으로(AC→DC). 슬립링: 교류 전압을 외부로 인출."],
[S,"05 전선 및 기계기구의 보안공사","선택지락계전기의 용도는?",["단일회선에서 접지전류의 대소 선택","단일회선에서 접지전류의 방향 선택","단일회선에서 접지사고 지속시간의 선택","다회선에서 접지고장 회선의 선택"],4,"선택지락계전기(SGR)는 다회선에서 접지고장 회선만을 선택적으로 차단하는 계전기이다."],
[G,"05 정류기 및 제어기기","그림과 같은 전동기 제어회로에서 전동기 M의 전류 방향으로 올바른 것은? (단, 전동기의 역률은 100[%]이고, 사이리스터의 점호각은 0°로 본다.)",["항상 A에서 B의 방향","항상 B에서 A의 방향","입력의 반주기 마다 A에서 B의 방향, B에서 A의 방향","S₁과 S₄, S₂와 S₃의 동작 상태에 따라 A에서 B의 방향, B에서 A의 방향"],1,"사이리스터 4개(S₁·S₄, S₂·S₃)가 반주기마다 번갈아 동작하는 전파 정류 형태의 제어 회로로, 전동기에는 항상 A에서 B 방향으로 전류가 흐른다.","교류 입력 → 왼쪽에 S₁(위)·S₂(아래), 오른쪽에 S₃(위)·S₄(아래) 사이리스터 4개. 전동기 M은 가운데에서 왼쪽 접점 A와 오른쪽 접점 B 사이에 연결"],
[S,"03 전선의 접속","S형 슬리브를 사용하여 전선을 접속하는 경우의 유의사항이 아닌 것은?",["전선은 연선만 사용이 가능하다.","전선의 끝은 슬리브의 끝에서 조금 나오는 것이 좋다.","슬리브는 전선의 굵기에 적합한 것을 사용한다.","도체는 샌드페이퍼 등으로 닦아서 사용한다."],1,"S형 슬리브는 단선, 연선 어느 것에도 사용할 수 있다."],
[T,"01 직류회로","전기 전도도가 좋은 순서대로 도체를 나열한 것은?",["은 → 구리 → 금 → 알루미늄","구리 → 금 → 은 → 알루미늄","금 → 구리 → 알루미늄 → 은","알루미늄 → 금 → 은 → 구리"],1,"전기 전도도는 은 → 구리 → 금 → 알루미늄 순으로 좋다."],
[T,"05 자기 성질과 자기장","평균 반지름이 r[m]이고, 감은 횟수가 N인 환상 솔레노이드에 전류 I[A]가 흐를 때 내부의 자기장 세기 H[AT/m]는?",["NI/(2πr)","NI/(2r)","2πr/(NI)","2r/(NI)"],1,"환상 솔레노이드 내부 자계의 세기 H = NI/(2πr) [AT/m]."],
[G,"05 정류기 및 제어기기","3상 전파 정류회로에서 전원 250[V]일 때 부하에 나타나는 전압[V]의 최대값은?",["약 177","약 292","약 354","약 433"],3,"V = Vmax/√2 에서 Vmax = √2×250 ≒ 354[V]."],
[S,"04 옥내 배선 공사","콘크리트 직매용 케이블 배선에서 일반적으로 케이블을 구부릴 때 케이블 피복이 손상되지 않도록 그 굴곡부 안쪽의 반경은 케이블의 외장의 몇 배 이상으로 하여야 하는가?",["2배","3배","6배","12배"],3,"케이블을 구부릴 때는 피복 손상 및 저항 발생이 없도록 굴곡부 안쪽 반경을 케이블 외경의 6배(단심은 8배) 이상으로 한다."],
[S,"02 배선재료와 공구","다음 중 300/500[V] 기기 배선용 유연성 단심 비닐 절연전선을 나타내는 약호는?",["NFR","NFI","NR","NRC"],2,"NFI: 300/500[V] 기기 배선용 유연성 단심 비닐 절연전선. NR: 450/750[V] 일반용 단심 비닐 절연전선."],
[G,"03 변압기","발전기 권선의 층간단락보호에 가장 적합한 계전기는?",["차동 계전기","방향 계전기","온도 계전기","접지 계전기"],1,"차동 계전기는 변압기·동기 발전기가 단락 사고 등으로 불평형 전류 차가 기준치 이상이 되었을 때 동작하여 내부고장 검출용으로 사용된다."],
[T,"09 비정현파","비정현파의 실효값을 나타낸 것은?",["최대파의 실효값","각 고조파의 실효값의 합","각 고조파의 실효값의 합의 제곱근","각 고조파의 실효값의 제곱의 합의 제곱근"],4,"V = √(V₀² + V₁² + V₂² + … + Vₙ²) [V]. 각 고조파 실효값의 제곱의 합의 제곱근."],
[T,"07 교류회로","그림의 병렬 공진 회로에서 공진 주파수 f₀[Hz]는?",["f₀ = (1/2π)√(R/L − 1/LC)","f₀ = (1/2π)√(L²/R² − 1/LC)","f₀ = (1/2π)√(1/LC − L/R)","f₀ = (1/2π)√(1/LC − R²/L²)"],4,"합성 어드미턴스 Y = R/(R²+(ωL)²) + j(ωC − ωL/(R²+(ωL)²))에서 허수부가 0이 되어야 공진. ω² = 1/LC − R²/L² 이므로 f₀ = (1/2π)√(1/LC − R²/L²) [Hz].","전원 V에 병렬로 두 가지: (R와 L이 직렬로 연결된 가지)와 (C만 있는 가지)"],
[S,"07 고압 및 저압 배전반 공사","선로의 도중에 설치하여 회로에 고장전류가 흐르게 되면 자동적으로 고장전류를 감지하여 스스로 회로를 차단하는 차단기의 일종으로 단상용과 3상용으로 구분되어있는 것은?",["리클로저","선로용 퓨즈","섹셔널 라이저","고장 자동구분 개폐기"],1,"리클로저는 보호계전기와 차단기의 기능을 갖고 사고검출 및 자동차단과 재연결(재폐로)이 가능하다. 선로 중간에 설치하며 단상용과 3상용이 있다."],
[T,"07 교류회로","유효전력의 식으로 옳은 것은? (단, E는 전압, I는 전류, θ는 위상각이다.)",["EI cosθ","EI sinθ","EI tanθ","EI"],1,"유효전력 P = I²R = EI cosθ [W]."],
[T,"07 교류회로","교류 전력에서 일반적으로 전기 기기의 용량을 표시하는 데 쓰이는 전력은?",["피상전력","유효전력","무효전력","기전력"],1,"전기기기의 용량은 피상전력[VA]으로 나타낸다."],
[T,"04 정전기와 콘덴서","4[F]와 6[F]의 콘덴서를 병렬접속하고 10[V]의 전압을 가했을 때 축적되는 전하량 Q[C]는?",["19","50","80","100"],4,"병렬접속 시 합성 정전용량 C = 4+6 = 10[F]. 전하량 Q = CV = 10×10 = 100[C]."],
[S,"02 배선재료와 공구","옥내 전로의 대지전압이 150[V] 초과 300[V] 이하의 주택의 전로 인입구에 설치하여야 하는 것은 무엇인가?",["감전보호용 누전차단기","배선용 차단기","개폐기","퓨즈"],1,"주택의 옥내에 시설하는 대지전압 150[V] 초과 300[V] 이하의 저압전로 인입구에는 인체 감전보호용 누전차단기를 설치한다."],
[T,"04 정전기와 콘덴서","전기장의 세기 단위로 옳은 것은?",["[H/m]","[F/m]","[AT/m]","[V/m]"],4,"전기장의 세기 단위: [V/m], [N/C]."],
[S,"04 옥내 배선 공사","저압 옥내배선 시설 시 캡타이어 케이블을 조영재의 아랫면 또는 옆면에 따라 붙이는 경우 전선의 지지점 간의 거리는 몇 [m] 이하로 하여야 하는가?",["1","1.5","2","2.5"],1,"전선의 지지점 간 거리는 케이블은 2[m] 이하, 캡타이어 케이블은 1[m] 이하로 하고 피복을 손상하지 않도록 붙인다."],
[G,"01 직류기","기중기, 전기 자동차, 전기 철도와 같은 곳에 가장 많이 사용되는 전동기는?",["가동 복권 전동기","차동 복권 전동기","분권 전동기","직권 전동기"],4,"직권 전동기는 부하 변동이 심하고 큰 기동 토크가 요구되는 전동차, 크레인, 전기철도 등에 적용한다. (토크는 전기자 전류의 제곱에 비례)"],
[S,"06 전선로 및 배전선 공사","가공전선로의 지지물에 시설하는 지선은 지표상 몇 [cm]까지의 부분에 내식성이 있는 것 또는 아연도금을 한 철봉을 사용하여야 하는가?",["15","20","30","50"],3,"지중부분 및 지표상 30[cm]까지의 부분에는 내식성이 있는 것 또는 아연도금을 한 철봉을 사용하고 쉽게 부식되지 않는 전주 버팀대(근가)에 견고하게 붙일 것."],
[T,"06 전자유도 법칙과 인덕턴스","히스테리시스손은 최대 자속밀도 및 주파수의 각각 몇 승에 비례하는가?",["최대 자속밀도: 1.6, 주파수: 1.0","최대 자속밀도: 1.0, 주파수: 1.6","최대 자속밀도: 1.0, 주파수: 1.0","최대 자속밀도: 1.6, 주파수: 1.6"],1,"히스테리시스손 Pₕ = ηfB^1.6 이므로 Pₕ ∝ B^1.6, Pₕ ∝ f."],
[G,"03 변압기","주상 변압기의 고압 측에 여러 개의 탭을 설치하는 이유는?",["선로 고장 대비","선로 전압 조정","선로 역률 개선","선로 과부하 방지"],2,"전원 전압의 변동, 부하 변화 등으로 선로 전압이 변동한다. 이에 대응하기 위해 변압기 탭(보통 5[%] 간격의 5개 탭)을 설치해 선로의 전압을 조정한다."],
[S,"09 전기응용 시설 공사","조명기구를 배광에 따라 분류하는 경우 특정한 장소만을 고조도로 하기 위한 조명기구는?",["직접 조명기구","전반확산 조명기구","광천장 조명기구","반직접 조명기구"],1,"직접 조명: 빛을 직접 대상물에 비추는 고조도 방식. 전반확산: 하향 광속은 직사, 상향 광속은 반사광으로 조도 증가. 광천장: 천장 조명을 발광면으로. 반직접: 빛의 60~90[%]가 아래로, 10~40[%]는 천장면 반사."],
[S,"04 옥내 배선 공사","저압 옥내배선에서 애자 공사를 할 때 올바른 것은?",["전선 상호 간의 간격은 6[cm] 이상","400[V] 초과하는 경우 전선과 조영재 사이의 이격거리는 2.5[cm] 미만","전선의 지지점 간의 거리는 조영재의 윗면 또는 옆면에 따라 붙일 경우에는 3[m] 이상","애자 공사에 사용되는 애자는 절연성·난연성 및 내수성과 무관"],1,"전선 상호 간격은 6[cm] 이상, 전선과 조영재 사이 이격은 400[V] 이하 2.5[cm] 이상(400[V] 초과 시 4.5[cm] 이상), 지지점 간 거리는 조영재 윗면·옆면에 붙일 때 2[m] 이하이다. 애자는 절연성·난연성·내수성이 있어야 한다.","애자 공사 그림: 전선 상호 6[cm] 이상, 조영재와 2.5[cm] 이상(400[V] 이하), 지지점 간 2[m] 이하, 옥외용(OW)·인입용(DV) 비닐 절연전선은 사용 불가"],
[G,"04 유도기","유도 전동기의 무부하 시 슬립은?",["4","3","1","0"],4,"슬립 s=1이면 N=0으로 정지 상태이다. s=0이면 N=Nₛ가 되어 동기속도로 돌고 있는 이상적인 무부하 상태이다."],
[S,"05 전선 및 기계기구의 보안공사","접지저항 저감 대책이 아닌 것은?",["접지봉의 연결 개수를 증가시킨다.","접지판의 면적을 감소시킨다.","접지극을 깊게 매설한다.","토양의 고유저항을 화학적으로 저감시킨다."],2,"접지판의 면적이 클수록 접지저항이 저감된다."],
[T,"06 전자유도 법칙과 인덕턴스","자체 인덕턴스가 각각 160[mH], 250[mH]의 두 코일이 있다. 두 코일 사이의 상호 인덕턴스가 150[mH]이면 결합계수는?",["0.5","0.62","0.75","0.86"],3,"M = k√(L₁L₂) 이므로 k = M/√(L₁L₂) = 150/√(160×250) = 0.75."],
[G,"03 변압기","사용 중인 변류기의 2차를 개방하면?",["1차 전류가 감소한다.","2차 권선에 110[V]가 걸린다.","개방단의 전압은 불변하고 안전하다.","2차 권선에 고압이 유도된다."],4,"변류기는 1차 측에 정격전류가 흐를 때 2차 전류가 5[A]가 되도록 하는 것이 표준이다. 사용 중 2차 회로를 개방해서는 안 되며, 개방하면 부하전류가 여자전류로 되어 변류기 2차 측에 고전압을 유기한다."],
[G,"01 직류기","직류 분권 전동기의 회전 방향을 바꾸기 위해 일반적으로 무엇의 방향을 바꾸어야 하는가?",["전원","주파수","계자 저항","전기자 전류"],4,"회전 방향을 바꾸려면 계자 권선이나 전기자 권선 중 한쪽의 접속을 반대로 하면 되는데, 일반적으로 전기자 권선의 접속을 바꾸어 준다. 즉 전기자에 흐르는 전류의 방향을 바꾼다."],
[G,"05 정류기 및 제어기기","3단자 사이리스터가 아닌 것은?",["SCS","SCR","TRIAC","GTO"],1,"SCR은 PNPN 4층 구조의 대표적인 3단자 소자(양극·음극·게이트). GTO는 게이트에 역방향 전류를 흘려 스스로 소호하는 3단자 소자. TRIAC은 쌍방향성 3단자 사이리스터. SCS는 2개의 게이트를 갖는 4단자 단방향 사이리스터이다."],
[T,"02 전기회로 해석","회로망의 임의의 접속점에 유입되는 전류의 합은 0이라는 법칙은?",["쿨롱의 법칙","패러데이의 법칙","키르히호프의 제1법칙","키르히호프의 제2법칙"],3,"키르히호프의 제1법칙(전류 법칙): 회로망의 임의의 한 점에 대해서 들어오는 전류의 합과 나가는 전류의 합은 같다."],
[S,"04 옥내 배선 공사","다음 ( ) 안에 들어갈 내용으로 알맞은 것은? ‘사람의 접촉 우려가 있는 합성수지제 몰드는 홈의 폭 및 깊이가 (㉠)[cm] 이하, 두께는 (㉡)[mm] 이상의 것이어야 한다.’",["㉠ 3.5, ㉡ 1","㉠ 5, ㉡ 1","㉠ 3.5, ㉡ 2","㉠ 5, ㉡ 2"],3,"합성수지 몰드는 홈의 폭 및 깊이가 3.5[cm] 이하, 두께는 2[mm] 이상의 것이어야 한다."],
[G,"03 변압기","1차 전압 13,200[V], 2차 전압 220[V]인 단상 변압기의 1차에 6,000[V]의 전압을 가한다면 2차 전압은 몇 [V]인가?",["100","200","50","250"],1,"권수비 a = V₁/V₂ = 13,200/220 = 60. 따라서 V₂ = V₁/a = 6,000/60 = 100[V]."],
[T,"07 교류회로","정격전압 3상 24[kV], 정격차단전류 300[A]인 수전설비의 차단용량은 몇 [MVA]인가?",["17.26","28.34","12.47","24.94"],3,"정격차단용량 Pₛ = √3×정격전압[kV]×정격차단전류[kA] = √3×24×300×10⁻³ = 12.47[MVA]."],
[S,"06 전선로 및 배전선 공사","저압 가공전선이 철도 또는 궤도를 횡단하는 경우에는 레일면상 몇 [m] 이상이어야 하는가?",["3.5","4.5","5.5","6.5"],4,"가공전선의 높이: 철도 횡단 6.5[m] 이상, 도로 횡단 6[m] 이상."],
[G,"03 변압기","다음 중 변압기의 원리와 관계있는 것은?",["전기자 반작용","전자유도 작용","플레밍의 오른손 법칙","플레밍의 왼손 법칙"],2,"변압기는 하나의 회로에서 교류전력을 받아 전자유도 작용에 의해서 같은 주파수의 교류전력으로 변성하여 다른 회로에 공급하는 기기이다."],
[S,"02 배선재료와 공구","전기 배선용 도면을 작성할 때 사용하는 콘센트 도면기호는?",["절반이 검게 칠해진 원 안에 점 두 개(◐:)","검게 칠한 원(●)","속이 빈 원(○)","원 양옆에 작은 사각형이 붙은 형태"],1,"콘센트: 반쪽을 칠한 원에 점 두 개. 점멸기: ●(검은 원). 백열등·HID등: ○(빈 원). 형광등: 원 양옆에 사각형이 붙은 기호."],
[T,"05 정류기 및 제어기기","반도체 재료로 GaP(인화갈륨)과 같은 금속 화합물이 쓰이며, 디지털 계측기나 탁상 계산기의 숫자 표시 등에 사용되는 다이오드 명칭은?",["광 다이오드","제너 다이오드","터널 다이오드","발광 다이오드"],4,"발광다이오드: LED(Light Emitting Diode)로 플렉시블 OLED 등 출력장치에 사용. 광다이오드: 빛신호를 전기신호로 변환. 제너: 전류가 변해도 전압이 일정(정전압원). 터널: 부저항 특성을 이용한 고속스위칭용."],
[S,"07 고압 및 저압 배전반 공사","배전반 및 분전반을 넣는 강판제로 만든 함의 두께는 몇 [mm] 이상인가?(단, 가로 세로의 길이가 30[cm] 초과한 경우이다.)",["0.8","1.2","1.5","2.0"],2,"배전반 및 분전반을 넣는 강판제 함의 두께는 1.2[mm] 이상이어야 한다. 다만 가로 또는 세로의 길이가 30[cm] 이하인 것은 두께 1.0[mm] 이상으로 할 수 있다."],
[S,"06 전선로 및 배전선 공사","가공배전선로 시설에는 전선을 지지하고 각종 기기를 설치하기 위한 지지물이 필요하다. 이 지지물 중 가장 많이 사용되는 것은?",["철주","철탑","강판 전주","철근콘크리트주"],4,"철근콘크리트주는 무거워서 운반이나 전주를 세우는 데 힘이 들지만 겉모양이 좋고 수명이 반영구적이므로 많이 사용된다."],
[G,"04 유도기","유도 전동기의 원선도를 구하는데 필요하지 않은 것은?",["슬립 측정","저항 측정","단락 시험","무부하 시험"],1,"원선도 작성에 필요한 시험은 저항측정 시험, 구속(단락) 시험, 무부하 시험이다. 슬립 측정은 필요하지 않다."],
[G,"02 동기기","동기기 운전 시 안정도 증진법이 아닌 것은?",["단락비를 크게 한다.","회전부의 관성을 크게 한다.","속응 여자방식을 채택한다.","역상 및 영상 임피던스를 작게 한다."],4,"단락비를 크게, 회전부 관성을 크게, 속응 여자방식 채택, 영상 및 역상 임피던스를 크게 한다. (역상·영상 임피던스를 작게 하는 것은 틀림)"],
[T,"02 전기회로 해석","그림의 단자 1−2에서 본 노튼 등가회로의 개방단 컨덕턴스는 몇 [℧]인가?",["0.5","1","2","5.8"],1,"1−2 단자에서 전원 측을 봤을 때 합성 저항 R = 0.8 + (2×3)/(2+3) = 2[Ω]. ∴ G = 1/R = 1/2 = 0.5[℧].","5[V] 전원 → 2[Ω] 직렬 → 3[Ω]은 아래로 병렬 분기 → 0.8[Ω] 직렬 → 단자 1(위)·2(아래)"],
[T,"07 교류회로","e = 100 sin(314t − π/6)[V]인 파형의 주파수는 약 몇 [Hz]인가?",["40","50","60","80"],2,"ω = 2πf = 314 이므로 f = 314/2π = 50[Hz]."],
[T,"06 전자유도 법칙과 인덕턴스","자속밀도 0.8[Wb/m²]인 자계에서 길이 50[cm]인 도체가 30[m/s]로 회전할 때 유기되는 기전력[V]은?",["8","12","15","24"],2,"e = Blv = 0.8×0.5×30 = 12[V]."],
[T,"03 전류의 열작용과 화학작용","전지에 관한 사항이다. 감극제는 어떤 작용을 막기 위해 사용하는가?",["분극작용","방전","순환전류","전기분해"],1,"전지의 양극에서는 음극에서 흘러들어온 전자를 받아 수소 기체가 발생한다. 이로 인해 기전력이 감소(분극작용)하는 현상을 막기 위해 감극제를 사용한다."],
[T,"08 3상 교류회로","Δ 결선에서 선전류가 10√3[A]이면 상전류[A]는?",["5","10","10√3","30"],2,"Δ 전선 연결(결선): Iₗ = √3 Iₚ ∠−30°. 따라서 Iₚ = (1/√3)Iₗ = (1/√3)×10√3 = 10[A]."],
[G,"04 유도기","선풍기, 가정용 펌프, 헤어 드라이기 등에 주로 사용되는 전동기는?",["단상 유도 전동기","권선형 유도 전동기","동기 전동기","직류 직권 전동기"],1,"단상 유도 전동기는 취급이 용이하고 견고하여 가정용·소공업용·농사용 등 주로 0.75[kW] 이하의 소출력용으로 많이 사용된다. (단, 3상에 비해 무겁고 가격이 비싼 편)"],
[G,"05 정류기 및 제어기기","직류 스테핑 모터(DC Stepping Motor)의 특징이다. 다음 중 가장 옳은 것은?",["교류 동기 서보모터에 비하여 효율이 나쁘고 토크 발생도 작다.","입력되는 전기신호에 따라 계속하여 회전한다.","일반적인 공작 기계에 많이 사용된다.","출력을 이용하여 특수기계의 속도, 거리, 방향 등을 정확하게 제어할 수 있다."],4,"스테핑 모터는 입력 펄스 신호에 따라 미리 설정된 각도만큼 회전하며, 출력을 이용해 속도·거리·방향을 정확히 제어할 수 있다. 응답 특성이 좋고 고정도 제어에 용이하며, 교류 서보모터에 비해 효율이 좋고 큰 토크를 발생시킨다."],
[G,"02 동기기","동기 전동기에 관한 내용으로 틀린 것은?",["기동 토크가 작다.","역률을 조정할 수 없다.","난조가 발생하기 쉽다.","여자기가 필요하다."],2,"동기 전동기는 여자전류 조정으로 역률을 임의로 조정할 수 있고 전부하 시 효율이 양호하다. 단점: 별도의 직류 여자장치 필요, 기동 취급 복잡, 난조 발생 쉬움, 기동 토크가 작음."]
];

EX[2]=[
[S,"06 전선로 및 배전선 공사","가공전선로의 지지물에 시설하는 지선은 지표상 몇 [cm]까지의 부분에 내식성이 있는 것 또는 아연도금을 한 철봉을 사용하여야 하는가?",["15","20","30","50"],3,"지중부분 및 지표상 30[cm]까지의 부분에는 내식성이 있는 것 또는 아연도금을 한 철봉을 사용하고 쉽게 부식되지 않는 전주 버팀대(근가)에 견고하게 붙일 것."],
[G,"03 변압기","변압기의 효율이 가장 좋을 때의 조건은?",["철손 = 동손","철손 = ½ 동손","동손 = ½ 철손","동손 = 2 철손"],1,"철손(무부하손)과 동손(부하손)이 같을 때 변압기 효율이 최대이다. 전력용 변압기는 전 부하의 75[%], 배전용 변압기는 전 부하의 60[%] 정도에서 최대 효율이 된다.","효율·손실-부하 곡선: 철손은 부하와 무관한 수평선, 동손은 부하의 제곱에 비례하는 곡선. 두 선이 만나는 점에서 효율 최대"],
[G,"01 직류기","직류 발전기에서 자속을 만드는 부분은 어느 것인가?",["계자 철심","정류자","브러시","공극"],1,"계자: 성층 철심의 권선에 전류를 흘려 주 자속을 만드는 부분(전자석 또는 영구자석). 전기자: 자속을 끊어 기전력 유기. 브러시: 직류 기전력을 외부로 인출. 정류자: AC→DC."],
[S,"01 전기설비 개요","전선 약호가 VV인 케이블의 종류로 옳은 것은?",["0.6/1[kV] 비닐절연 비닐시스 케이블","0.6/1[kV] EP 고무절연 클로로프렌시스 케이블","0.6/1[kV] EP 고무절연 비닐시스 케이블","0.6/1[kV] 비닐절연 비닐캡타이어 케이블"],1,"VV: 비닐절연 비닐시스 케이블. PN: EP 고무절연 클로로프렌시스 케이블. PV: EP 고무절연 비닐시스 케이블. VCT: 비닐절연 비닐캡타이어 케이블."],
[G,"03 변압기","변압기에서 2차 측이란?",["부하 측","고압 측","전원 측","저압 측"],1,"변압기는 일반적으로 전력이 들어가는 쪽을 1차(전원 측), 나오는 쪽을 2차(부하 측)라 하며 승압 또는 강압한다."],
[S,"05 전선 및 기계기구의 보안공사","접지 저항값에 가장 큰 영향을 주는 것은?",["접지도체 굵기","접지전극 크기","온도","대지 저항"],4,"접지 저항의 주요소는 전극과 인접한 대지의 저항이다."],
[T,"05 자기 성질과 자기장","진공 중에서 같은 크기의 두 자극을 1[m] 거리에 놓았을 때 그 작용하는 힘이 6.33×10⁴[N]이 되는 자극 세기의 단위는?",["1[Wb]","1[C]","1[A]","1[W]"],1,"진공 중 쿨롱의 법칙 F = (1/4πμ₀)×m₁m₂/r² = 6.33×10⁴×m₁m₂/1² [N]. F = 6.33×10⁴[N]이므로 m₁m₂ = 1, 즉 m₁ = m₂ = 1[Wb]."],
[G,"05 정류기 및 제어기기","단상 전파 정류회로에서 전원이 220[V]이면 부하에 나타나는 전압의 평균값은 약 몇 [V]인가?",["99","198","257.4","297"],2,"Ed = 0.9E = 0.9×220 = 198[V]. (단상 반파 0.45E, 단상 전파 0.9E, 3상 반파 1.17E, 3상 전파 1.35E)"],
[T,"02 전기회로 해석","동일 전압의 전지 3개를 접속하여 각각 다른 전압을 얻고자 한다. 접속 방법에 따라 몇 가지의 전압을 얻을 수 있는가?(단, 극성은 같은 방향으로 설정한다.)",["1가지 전압","2가지 전압","3가지 전압","4가지 전압"],3,"전지 3개 직렬연결, 전지 2개 병렬연결+1개 직렬연결, 전지 3개 병렬연결 → 총 3가지 전압을 얻을 수 있다."],
[G,"04 유도기","복잡한 전기 회로를 등가 임피던스를 사용하여 간단히 변환시킨 회로는?",["유도 회로","전개 회로","등가 회로","단순 회로"],3,"복잡한 회로 소자를 근사적으로 등가한 저항, 인덕턴스, 정전용량(콘덴서), 임피던스 등의 조합으로 바꿔놓아 회로를 단순화한 회로를 등가 회로라 한다."],
[T,"07 교류회로","R=8[Ω], L=19.1[mH]의 직렬 회로에 5[A]가 흐르고 있을 때 인덕턴스(L)에 걸리는 단자 전압의 크기는 약 몇 [V]인가?(단, 주파수는 60[Hz]이다.)",["12","25","29","36"],4,"유도성 리액턴스 Xₗ = ωL = 2πfL. 인덕턴스 양단 전압 Vₗ = 2πfLI = 2×π×60×19.1×10⁻³×5 ≒ 36[V]."],
[T,"03 전류의 열작용과 화학작용","4[Ω]의 저항에 200[V]의 전압을 인가할 때 소비되는 전력은?",["20[W]","400[W]","2.5[kW]","10[kW]"],4,"P = V²/R = 200²/4 = 40,000/4 = 10,000[W] = 10[kW]."],
[G,"03 변압기","3상 전원에서 한 상에 고장이 발생하였다. 이때 3상 부하에 3상 전력을 공급할 수 있는 결선 방법은?",["Y 결선","Δ 결선","단상 결선","V 결선"],4,"단상 변압기 3대로 Δ−Δ 결선 운전 중 1대가 고장 나면 V 결선으로 계속 3상 전력을 공급할 수 있다. V결선 출력비 P_V/P_Δ = 1/√3 ≒ 0.577, 변압기 1대당 이용률 √3/2 ≒ 0.866."],
[G,"01 직류기","다음 중 정속도 전동기에 속하는 것은?",["유도 전동기","직권 전동기","교류 정류자 전동기","분권 전동기"],4,"전기자와 계자권선이 병렬로 접속되어 단자 전압이 일정하면 부하 전류에 관계없이 자속이 일정하므로 정속도 특성을 가진다. 이것이 직류 분권 전동기이다."],
[S,"02 배선재료와 공구","화재 시 소방대가 조명 기구나 파괴용 기구, 배연기 등 소화활동 및 인명 구조 활동에 필요한 전원으로 사용하기 위해 설치하는 것은?",["상용전원장치","유도등","비상용 콘센트","비상등"],3,"화재 시 소방대의 조명등 또는 소화활동상 필요한 장비의 전원설비로 사용하는 것을 비상용 콘센트라고 한다."],
[T,"07 교류회로","무효 전력에 대한 설명으로 틀린 것은?",["Pᵣ = VI cosθ로 계산된다.","부하에서 소모되지 않는다.","단위로는 [Var]를 사용한다.","전원과 부하 사이를 왕복하기만 하고 부하에 유효하게 사용되지 않는 에너지이다."],1,"유효전력 Pₐ = VI cosθ [W], 무효전력 Pᵣ = VI sinθ [Var]. 무효전력은 sinθ로 계산한다."],
[G,"02 동기기","동기 검정기로 알 수 있는 것은?",["전압의 크기","전압의 위상","전류의 크기","주파수"],2,"두 계통 전압의 위상을 측정 또는 표시하는 계측기로, 동기 검정등으로 확인하는 방법과 아날로그 계측 형식으로 중간 0점에 도달했을 때 동기화를 확인하는 방법이 있다."],
[S,"06 전선로 및 배전선 공사","22.9[kV−Y] 가공전선의 굵기는 단면적이 몇 [mm²] 이상이어야 하는가?(단, 동선의 경우이다.)",["22","32","40","50"],1,"특고압 가공전선의 굵기는 구리(동)선의 경우 단면적이 22[mm²] 이상, ACSR의 경우는 32[mm²] 이상이어야 한다."],
[T,"06 전자유도 법칙과 인덕턴스","평등자계 B[Wb/m²] 속을 V[m/s]의 속도를 가진 전자가 움직일 때 받는 힘[N]은?",["B²eV","eV/B","BeV","BV/e"],3,"자기장 내 도체가 받는 힘 F = BlI [N](자계와 전류가 직각). 전류 I = e/t 이므로 F = Bl(e/t) = Be(l/t) = BeV [N]."],
[T,"06 전자유도 법칙과 인덕턴스","다음 ( ) 안에 들어갈 알맞은 내용은? ‘자기 인덕턴스 1[H]는 전류의 변화율이 1[A/s]일 때, ( )가(이) 발생할 때의 값이다.’",["1[N]의 힘","1[J]의 에너지","1[V]의 기전력","1[Hz]의 주파수"],3,"인덕턴스에 유기되는 유기기전력 V = L·di/dt = L×1 (di/dt=1[A/s]). ∴ L = 1[H]이면 V = 1[V]."],
[T,"08 3상 교류회로","선간 전압 210[V], 선전류 10[A]의 Y 결선 회로가 있다. 상전압과 상전류는 각각 약 얼마인가?",["121[V], 5.77[A]","121[V], 10[A]","210[V], 5.57[A]","210[V], 10[A]"],2,"Y 결선: 선간 전압 Vₗ = √3Vₚ → 상전압 Vₚ = 210/√3 = 121[V]. 선전류 Iₗ = Iₚ 이므로 상전류 Iₚ = 10[A]."],
[S,"02 배선재료와 공구","전선과 기구 단자 접속 시 누름나사를 덜 죌 때 발생할 수 있는 현상과 거리가 먼 것은?",["과열","화재","절전","전파잡음"],3,"누름나사를 덜 조일 경우 접촉 불량이 발생하여 스파크에 의한 과열, 화재, 잡음이 일어날 수 있다. (절전과는 무관)"],
[T,"06 전자유도 법칙과 인덕턴스","평행한 왕복 도체에 흐르는 전류에 의한 작용력은?",["흡인력","반발력","회전력","작용력이 없다."],2,"평행한 도체에 전류가 흐를 때 같은 방향이면 흡인력, 다른 방향이면 반발력이 생긴다. 평행한 왕복 도체는 전류의 방향이 반대이므로 반발력이 발생한다."],
[S,"05 전선 및 기계기구의 보안공사","사용전압 415[V]의 3상 3선식 전선로의 1선과 대지간에 필요한 절연 저항값의 최솟값은?(단, 최대공급전류는 500[A]이다.)",["2,560[Ω]","1,660[Ω]","3,210[Ω]","4,512[Ω]"],2,"허용 누설 전류는 최대 공급 전류의 1/2,000배이므로 0.25[A]. ∴ 절연 저항값 = 415/0.25 = 1,660[Ω]."],
[T,"07 교류회로","실효값 5[A], 주파수 f[Hz], 위상 60°인 전류의 순시값 i[A]를 수식으로 옳게 표현한 것은?",["i = 5√2 sin(2πft + π/2)","i = 5√2 sin(2πft + π/3)","i = 5 sin(2πft + π/2)","i = 5 sin(2πft + π/3)"],2,"순시값 i(t) = Iₘ sin(ωt+θ). 최대값 Iₘ = I×√2 = 5√2[A], ω = 2πf, θ = 60° = π/3. ∴ i(t) = 5√2 sin(2πft + π/3)[A]."],
[S,"05 전선 및 기계기구의 보안공사","접지공사에서 접지도체를 철주, 기타 금속체를 따라 시설하는 경우 접지극은 지중에서 그 금속체로부터 몇 [cm] 이상 떼어 매설하나?",["30","60","75","100"],4,"접지도체를 철주, 기타 금속체를 따라 시설하는 경우 접지극을 금속체로부터 1[m] 이상 이격시켜야 한다.","접지극 시설 그림: 접지도체는 합성수지관 또는 동등 이상의 절연효력 및 강도의 몰드로 덮고(지표상 2m, 지하 75cm), 접지극은 금속체에서 1m 이상 이격"],
[T,"08 3상 교류회로","평형 3상 교류 회로에서 Δ 부하의 한 상의 임피던스가 Z_Δ일 때, 등가 변환한 Y 부하의 한 상 임피던스 Z_Y는 얼마인가?",["Z_Y = √3 Z_Δ","Z_Y = 3 Z_Δ","Z_Y = (1/√3) Z_Δ","Z_Y = (1/3) Z_Δ"],4,"3상 평형 회로의 임피던스 변환식: Z_Y = (1/3)Z_Δ."],
[T,"07 교류회로","사인파 교류전압을 표현한 것 중 같지 않은 것은?(단, θ는 회전각이며, ω는 각속도, 주기는 T이다.)",["v = Vₘ sinθ","v = Vₘ sinωt","v = Vₘ sin2πt","v = Vₘ sin(2π/T)t"],3,"v = Vₘ sinωt = Vₘ sinθ = Vₘ sin2πft = Vₘ sin(2π/T)t. (θ=ωt, ω=2πf, f=1/T) 따라서 sin2πt는 f=1일 때만 성립하므로 같지 않다."],
[T,"03 전류의 열작용과 화학작용","다음이 설명하는 것은? ‘금속 A와 B로 만든 열전쌍과 접점 사이에 임의의 금속 C를 연결해도 C의 양 끝의 접점의 온도를 똑같이 유지하면 회로의 열기전력은 변화하지 않는다.’",["제벡 효과","톰슨 효과","제3금속의 법칙","펠티에 효과"],3,"제벡: 서로 다른 금속을 접합해 두 접합점의 온도를 다르게 하면 열기전력이 발생. 펠티에: 접합부에 전류를 흘리면 열이 발생·흡수. 톰슨: 같은 금속의 두 점에 온도차를 주고 전류를 흘릴 때 열 발생·흡수. 제3금속의 법칙: 문제의 설명 내용."],
[G,"02 동기기","동기 전동기 중 안정도 증진법으로 틀린 것은?",["전기자 저항 감소","관성효과 증대","동기 임피던스 증대","속응 여자 채용"],3,"안정도 증진법: 단락비를 크게(동기 임피던스는 작게), 회전부 관성 크게, 속응 여자방식 채택, 영상·역상 임피던스를 크게, 전기자 저항 감소. 동기 임피던스 증대는 틀림."],
[T,"05 자기 성질과 자기장","공기 중 자장의 세기가 20[AT/m]인 곳에 8×10⁻³[Wb]의 자극을 놓으면 작용하는 힘[N]은?",["0.16","0.32","0.43","0.56"],1,"F = mH = 8×10⁻³×20 = 0.16[N]."],
[T,"06 전자유도 법칙과 인덕턴스","단면적 A[m²], 자로의 길이 l[m], 투자율 μ, 권수 N회인 환상 철심의 자체 인덕턴스[H]는?",["μAN²/l","AlN²/(4πμ)","4πAN²/l","μlN²/A"],1,"환상 철심의 자체 인덕턴스 L = μAN²/l [H]."],
[G,"05 정류기 및 제어기기","전력 변환기기가 아닌 것은?",["변압기","정류기","유도 전동기","인버터"],3,"변압기: 전자유도로 승압·강압. 정류기: AC→DC. 인버터: DC→AC. 유도 전동기는 전기에너지를 기계에너지로 변환하는 회전기기이다."],
[S,"03 전선의 접속","전선 접속 시 사용되는 슬리브(Sleeve)의 종류가 아닌 것은?",["D형","S형","E형","P형"],1,"슬리브의 종류: 직선맞대기용(B형), 종단겹침용(E형), 직선겹침용(P형), S형 슬리브, 매킹타이어 슬리브."],
[S,"08 특수 장소 공사","화약고의 배선공사 시 개폐기 및 과전류차단기에서 화약고 인입구까지는 어떤 배선공사에 의하여 시설하여야 하는가?",["합성수지관공사로 지중선로","금속관공사로 지중선로","합성수지몰드 지중선로","케이블 사용 지중선로"],4,"화약류 저장소 안에는 백열전등이나 형광등 또는 이에 전기를 공급하기 위한 인공구조물에 한하여 시설할 수 있다. 전용의 개폐기·과전류차단기에서 저장소 인입구까지의 배선에는 케이블을 사용하여 지중에 매설해야 한다."],
[S,"06 전선로 및 배전선 공사","가공배전선로 시설에는 전선을 지지하고 각종 기기를 설치하기 위한 지지물이 필요하다. 이 지지물 중 가장 많이 사용되는 것은?",["철주","철탑","강관 전주","철근콘크리트주"],4,"철근콘크리트주는 무거워서 운반이나 전주를 세우는 데 힘이 들지만 겉모양이 좋고 수명이 반영구적이므로 많이 사용된다."],
[S,"07 고압 및 저압 배전반 공사","수변전 설비 구성기기의 계기용 변압기(PT)의 설명으로 맞는 것은?",["높은 전압을 낮은 전압으로 변성하는 기기이다.","높은 전류를 낮은 전류로 변성하는 기기이다.","회로에 병렬로 접속하여 사용하는 기기이다.","부족전압 트립코일의 전원으로 사용된다."],1,"계기용 변압기(PT)는 배전반의 전압계·전력계·주파수계·역률계·표시등 및 트립코일의 전원으로 사용하기 위해 고압회로의 전압을 저압으로 변성하는 기기이다. (높은 전류를 낮추는 것은 CT)","계기용 변압기 사진: 3상 PT 3대"],
[S,"02 배선재료와 공구","금속관 배관공사를 할 때 금속관을 구부리는 데 사용하는 공구는?",["히키(Hickey)","파이프 렌치(Pipe Wrench)","오스터(Oster)","파이프 커터(Pipe Cutter)"],1,"히키: 금속관을 구부리는 데 사용(벤더). 파이프 렌치: 금속관 커플링을 물고 조이는 것. 오스터: 금속관 끝에 나사를 내는 공구. 파이프 커터: 금속관을 절단할 때 사용."],
[G,"01 직류기","부하의 변동에 대하여 단자전압의 변화가 가장 적은 직류 발전기는?",["직권","분권","평복권","과복권"],3,"무부하 전압과 전부하 전압이 거의 같은 것을 평복권이라 한다. 직권 계자가 강하여 부하전류의 증가에 따라 단자전압이 상승하는 특성을 과복권이라 한다."],
[G,"01 직류기","8극 파권 직류 발전기의 전기자 권선의 병렬 회로수 a는 얼마로 하고 있는가?",["1","2","6","8"],2,"파권은 극수와 관계없이 병렬 회로 수가 항상 2개(a=2)로 구성된다. (중권은 a = 극수 p)"],
[G,"04 유도기","다음 중 유도 전동기에서 슬립이 가장 큰 경우는?",["무부하 운전 시","경부하 운전 시","정격부하 운전 시","기동 시"],4,"슬립 s = (Nₛ−N)/Nₛ×100[%]. 기동 시에는 N=0이므로 슬립이 1(100[%])로 가장 크게 나타난다."],
[G,"05 정류기 및 제어기기","그림의 전동기 제어 회로에 대한 설명으로 잘못된 것은?",["교류를 직류로 변환한다.","사이리스터 위상 제어 회로이다.","전파 정류회로이다.","주파수를 변환하는 회로이다."],4,"SCR 제어정류 회로로서 교류를 정류하여 전동기를 구동한다. SCR 소자 4개로 S₁과 S₄, S₂와 S₃가 반주기마다 동작하여 교류입력을 전파 정류한다. SCR은 위상제어로 전동기 속도 조절이 가능하다. 주파수 변환(인버터)은 하지 않는다.","교류 입력 → 사이리스터 S₁(위 왼쪽)·S₂(아래 왼쪽)·S₃(위 오른쪽)·S₄(아래 오른쪽) 4개 브리지 형태, 중앙에 전동기 M"],
[G,"02 동기기","전력계통에 접속되어 있는 변압기나 장거리 송전 시 정전용량으로 인한 충전 특성 등을 보상하기 위한 기기는?",["유도 전동기","동기 발전기","유도 발전기","동기 조상기"],4,"발전기에 직류 여자를 주지 않은 경우에도 무여자 동기 발전기로 무부하의 장거리 송전선에 일어나는 현상이다. 발전기의 정격전압보다 훨씬 높은 전압이 되어 위험할 때가 있는데, 이때 수전단에 동기 무효 전력 보상 장치(조상기)를 접속하여 개선한다."],
[S,"06 전선로 및 배전선 공사","가공 인입선 중 수용장소의 인입선에서 분기하여 다른 수용장소의 인입구에 이르는 전선을 무엇이라 하는가?",["소주 인입선","연접 인입선","본주 인입선","인입 간선"],2,"연접 인입선: 한 수용장소의 인입선에서 분기하여 다른 수용장소의 인입구에 이르는 전선. 소주 인입선: 인입간선의 전선로에서 분기한 소주에서 수용가로 이르는 전선로. 본주 인입선: 인입간선의 전선로에서 수용가에 이르는 전선로. 인입 간선: 배전선로에서 분기된 인입 전선로.","이웃 연결(연접) 인입선 그림: 가공 인입선, 인입선 중 옥측 부분, 인입구, 이웃 연결 인입선"],
[S,"02 배선재료와 공구","전선의 재료로서 구비해야 할 조건이 아닌 것은?",["기계적 강도가 클 것","가요성이 풍부할 것","고유저항이 클 것","비중이 작을 것"],3,"전선 및 케이블의 구비 조건: 도전율이 크고 고유 저항은 작을 것, 기계적 강도 및 가요성(유연성)이 풍부할 것, 내구성이 클 것, 비중이 작을 것, 시공 및 보수의 취급이 용이할 것, 경제적일 것."],
[S,"02 배선재료와 공구","다음 중 300/500[V] 기기 배선용 유연성 단심 비닐 절연전선을 나타내는 약호는?",["NFR","NFI","NR","NRC"],2,"NFI: 300/500[V] 기기 배선용 유연성 단심 비닐 절연전선. NR: 450/750[V] 일반용 단심 비닐 절연전선."],
[T,"03 전류의 열작용과 화학작용","전지의 전압 강하 원인으로 틀린 것은?",["국부 작용","산화 작용","성극 작용","자기 방전"],2,"전지의 전압 강하 원인으로 분극(성극) 작용, 자기 방전, 국부 작용이 있다. 산화 작용은 해당하지 않는다."],
[G,"03 변압기","3상 100[kVA], 13,200/200[V] 변압기의 저압 측 선전류의 유효분은 약 몇 [A]인가?(단, 역률은 80[%]이다.)",["100","173","230","260"],3,"3상 피상전력 Pₐ = √3·V·I → I = 100×10³/(√3×200) = 288.6[A]. 선전류 유효분 I cosθ = 288.6×0.8 = 230.9[A]."],
[G,"04 유도기","다음 단상 유도 전동기 중 기동 토크가 큰 것부터 옳게 나열한 것은?\n㉠ 반발 기동형  ㉡ 콘덴서 기동형  ㉢ 분상 기동형  ㉣ 세이딩 코일형",["㉠ > ㉡ > ㉢ > ㉣","㉠ > ㉣ > ㉡ > ㉢","㉠ > ㉢ > ㉣ > ㉡","㉠ > ㉡ > ㉣ > ㉢"],1,"단상 유도 전동기를 기동 토크가 큰 순서로 나열하면 반발 기동형 → 반발 유도형 → 콘덴서 기동형 → 영구 콘덴서형 → 분상 기동형 → 세이딩 코일형 순이다."],
[S,"06 전선로 및 배전선 공사","가공전선 지지물의 기초 강도는 주체에 가하여지는 곡하중에 대하여 안전율은 얼마 이상으로 하여야 하는가?",["1.0","1.5","1.8","2.0"],4,"가공전선로의 지지물에 하중이 가해지는 경우 그 하중을 받는 지지물의 기초의 안전율은 2.0 이상(단, 이상 시 상정하중에 대한 철탑의 기초에 대하여는 1.33)이어야 한다."],
[G,"03 변압기","변압기 명판에 표시된 정격에 대한 설명으로 틀린 것은?",["변압기의 정격출력 단위는 [kW]이다.","변압기 정격은 2차 측을 기준으로 한다.","변압기의 정격은 용량, 전류, 전압, 주파수 등으로 결정된다.","정격이란 정해진 규정에 적합한 범위 내에서 사용할 수 있는 한도이다."],1,"변압기의 정격출력이란 정격 2차 전압, 정격 2차 전류, 정격 주파수 및 정격 역률로 2차 단자 사이에서 얻을 수 있는 피상전력을 말하며 [VA], [kVA], [MVA]로 표시한다. 단위는 [kW]가 아니다."],
[S,"04 옥내 배선 공사","저압 옥내배선에서 애자 공사를 할 때 올바른 것은?",["전선 상호 간의 간격은 6[cm] 이상","400[V] 초과하는 경우 전선과 조영재 사이의 이격거리는 2.5[cm] 미만","전선의 지지점 간의 거리는 조영재의 윗면 또는 옆면에 따라 붙일 경우에는 3[m] 이상","애자 공사에 사용되는 애자는 절연성·난연성 및 내수성과 무관"],1,"전선 상호 간의 간격은 6[cm] 이상, 조영재와는 400[V] 이하 2.5[cm] 이상(400[V] 초과 시 4.5[cm] 이상), 지지점 간 거리는 조영재 윗면·옆면에 붙일 때 2[m] 이하이며, 애자는 절연성·난연성·내수성이 있어야 한다."],
[G,"03 변압기","변압기의 절연내력 시험법이 아닌 것은?",["유도시험","가압시험","단락시험","충격전압시험"],3,"절연내력 시험: 변압기 절연에 사용된 절연물의 내력 시험에는 유도시험, 가압시험, 충격전압시험 등이 있다. 단락시험은 2차 단자를 단락하고 1차 측 정격전류가 흐르도록 전압을 인가해 임피던스 전압, 동손 등을 구하는 부하 시험법이다."],
[T,"03 전류의 열작용과 화학작용","그림의 브리지 회로에서 평형이 되었을 때의 Cₓ는?",["0.1[μF]","0.2[μF]","0.3[μF]","0.4[μF]"],4,"휘스톤 브리지 회로에서 R₁·(1/jωCₓ) = R₂·(1/jωC_S) 이므로 R₁/Cₓ = R₂/C_S. 200/Cₓ = 50/0.1 → ∴ Cₓ = 20/50 = 0.4[μF].","브리지 회로: 왼쪽 위 R₂=50[Ω], 오른쪽 위 Cₓ, 왼쪽 아래 R₁=200[Ω], 오른쪽 아래 C_S=0.1[μF], 중앙에 검류계 D"],
[T,"07 교류회로","6[Ω]의 저항과, 8[Ω]의 용량성 리액턴스의 병렬회로가 있다. 이 병렬회로의 임피던스는 몇 [Ω]인가?",["1.5","2.6","3.8","4.8"],4,"RC 병렬회로의 임피던스 1/Z = √(1/R² + 1/Xc²) = √(1/6² + 1/8²) = 5/24 ∴ Z = 4.8[Ω]."],
[S,"06 전선로 및 배전선 공사","저압 2조의 전선을 설치 시, 크로스 완금의 표준 길이 [mm]는?",["900","1,400","1,800","2,400"],1,"가공 전선로의 장주에 사용되는 완금의 표준 길이[mm]: 전선 2개 — 특고압 1,800 / 고압 1,400 / 저압 900. 전선 3개 — 특고압 2,400 / 고압 1,800 / 저압 1,400."],
[T,"03 전류의 열작용과 화학작용","회로에서 a−b 단자 간 합성저항[Ω] 값은?",["1.5","2","2.5","4"],3,"회로를 다이아몬드 형태의 휘스톤 브리지로 다시 그릴 수 있고 평형이므로 가운데 저항 2[Ω]에는 전류가 흐르지 않는다. a−b 합성저항 R = (5×5)/(5+5) = 2.5[Ω].","a 단자에서 4[Ω]이 위쪽 길로, 1[Ω]이 아래쪽 길로 연결되고, 가운데 2[Ω]이 양쪽 중간점을 잇는 브리지 구조(위 4Ω·4Ω, 아래 1Ω·1Ω, 중앙 2Ω)"],
[T,"01 직류회로","Q[C]의 전하량이 도체를 이동하면서 한 일을 W[J]이라 했을 때 전위차 V[V]를 나타내는 관계식으로 옳은 것은?",["V = QW","V = W/Q","V = Q/W","V = 1/(QW)"],2,"전압은 전하를 이동하는 데 에너지를 잃거나 얻은 에너지 비로 정의한다. V = W/Q [V]."],
[G,"05 정류기 및 제어기기","통전 중인 사이리스터를 턴 오프(Turn Off)하려면?",["순방향 Anode 전류를 유지전류 이하로 한다.","순방향 Anode 전류를 증가시킨다.","게이트 전압을 0으로 또는 음(−)으로 한다.","역방향 Anode 전류를 통전한다."],1,"SCR은 PNPN 4층 구조의 3단자 소자(양극·음극·게이트)이다. 사이리스터를 턴 오프하는 데는 ON 상태에 있는 사이리스터의 순방향 전류를 유지전류 이하로 감소시켜 턴 오프시킬 수 있다."],
[S,"04 옥내 배선 공사","애자 사용 배선공사 시 사용할 수 없는 전선은?",["고무 절연전선","폴리에틸렌 절연전선","플루오르 수지 절연전선","인입용 비닐 절연전선"],4,"애자 사용 공사 시 전선은 절연 전선(옥외용 비닐 절연전선, 인입용 비닐 절연전선은 제외)일 것."]
];

EX[3]=[
[T,"04 정전기와 콘덴서","콘덴서의 정전용량에 대한 설명으로 틀린 것은?",["전압에 반비례한다.","이동 전하량에 비례한다.","극판의 넓이에 비례한다.","극판의 간격에 비례한다."],4,"C = εS/d 에서 정전용량은 극판의 면적(S)에 비례하고 거리(d)에 반비례한다. C = Q/V 에서 정전용량은 전하량(Q)에 비례하고 전압(V)에 반비례한다."],
[T,"07 교류회로","그림과 같은 R−L 병렬 회로에서 R=25[Ω], ωL=100/3[Ω]일 때, 200[V]의 전압을 가하면 코일에 흐르는 전류 I_L[A]는?",["3.0","4.8","6.0","8.2"],3,"코일에 흐르는 전류 I_L = V/X_L = V/ωL = 200/(100/3) = 6[A]. (병렬이므로 코일에는 전원 전압 전체가 걸린다.)","R과 L이 병렬로 연결되고 교류전원 V가 공급되는 회로 (전류 I는 I_R과 I_L로 나뉨)"],
[G,"04 유도기","슬립이 0.05이고 전원 주파수가 60[Hz]인 유도 전동기의 회전자 회로 주파수[Hz]는?",["1","2","3","4"],3,"2차(회전자) 주파수 f₂ₛ = s·f₁ = 0.05×60 = 3[Hz]."],
[S,"04 옥내 배선 공사","사용전압 400[V] 초과, 건조한 장소로 점검할 수 있는 은폐된 곳에 저압 옥내배선 시 공사할 수 있는 방법은?",["합성수지 몰드 공사","금속 몰드 공사","버스 덕트 공사","라이팅 덕트 공사"],3,"사용전압 400[V] 초과, 건조한 장소로 점검할 수 있는 은폐된 곳에 저압 옥내배선 시 공사할 수 있는 방법에는 애자 사용 공사, 금속 덕트 공사 또는 버스 덕트 공사가 있다."],
[S,"07 고압 및 저압 배전반 공사","점유 면적이 좁고 운전, 보수 시에 안전하며 공장, 빌딩 등의 전기실에 많이 사용되는 배전반은 어떤 것인가?",["데드 프런트형","수직형","큐비클형","라이브 프런트형"],3,"큐비클형 배전반(폐쇄식 배전반): 점유 면적이 좁고 운전, 보수 시에 안전하므로 공장, 빌딩 등의 전기실에 널리 사용되는 배전반."],
[S,"09 전기응용 시설 공사","실내 전반 조명을 하고자 한다. 작업대로부터 광원까지의 높이가 2.4[m]인 위치에 조명 기구를 배치할 때 벽에서 한 기구 이상 떨어진 기구에서 기구 간의 거리는 일반적인 경우 최대 몇 [m]로 배치하여 설치하는가?",["1.8","2.4","3.2","3.6"],4,"작업대로부터 광원까지의 높이가 H[m]인 경우 등 간격은 S ≤ 1.5H 이므로 S ≤ 1.5×2.4 = 3.6[m]."],
[S,"05 전선 및 기계기구의 보안공사","저압 옥내용 기기에 접지공사를 하는 주된 목적은?",["이상 전류에 의한 기기의 손상 방지","과전류에 의한 감전 방지","누전에 의한 감전 방지","누전에 의한 기기의 손상 방지"],3,"저압 옥내용 기기에 접지공사를 하는 주된 목적은 누전에 의한 인체 감전사고를 방지하기 위함이다."],
[T,"03 전류의 열작용과 화학작용","정격 전압에서 1[kW]의 전력을 소비하는 저항에 정격의 90[%] 전압을 가했을 때 전력은 몇 [W]가 되는가?",["630","780","810","900"],3,"소비전력 P = V²/R = 1,000[W]에서 P' = (0.9V)²/R = 0.81×V²/R = 0.81×1,000 = 810[W]."],
[T,"03 전류의 열작용과 화학작용","20분간에 876,000[J]의 일을 할 때 전력은 몇 [kW]인가?",["0.73","7.3","73","730"],1,"전력 P = W/t = 876,000/(20×60) = 730[W] = 0.73[kW]."],
[T,"07 교류회로","ωL=5[Ω], 1/ωC=25[Ω]의 LC 직렬회로에 100[V]의 교류를 가할 때 전류[A]는?",["3.3[A], 유도성","5[A], 유도성","3.3[A], 용량성","5[A], 용량성"],4,"Z = j(5−25) = −j20[Ω], |Z| = 20[Ω]. ∴ I = V/|Z| = 100/20 = 5[A]. 리액턴스가 음(−)이므로(X_C > X_L) 용량성."],
[S,"02 배선재료와 공구","가정용 전기 세탁기를 욕실에 설치하는 경우 콘센트의 규격은?",["접지극부 3극 15[A]","3극 15[A]","접지극부 2극 15[A]","2극 15[A]"],3,"욕조나 샤워 시설이 있는 욕실 등 인체가 물에 젖어 있는 상태에서 전기를 사용하는 장소에는 인체 감전 보호용 누전 차단기(정격 감도 전류 15[mA] 이하, 동작시간 0.03초 이하의 전류 동작형)를 전로에 접속하거나 그것이 부착된 콘센트를 시설해야 하며, 콘센트는 접지극이 있는 2극 15[A] 방수형 콘센트를 사용하여 접지해야 한다."],
[G,"01 직류기","직권 발전기에 대한 설명 중 틀린 것은?",["계자 권선과 전기자 권선이 직렬로 접속되어 있다.","승압기로 사용되며 수전 전압을 일정하게 유지하고자 할 때 사용된다.","단자 전압을 V, 유기 기전력을 E, 부하전류를 I, 전기자 저항 및 직권 계자 저항을 각각 rₐ, rₛ라고 할 때 V = E + I(rₐ + rₛ)[V]이다.","부하전류에 의해 여자되므로 무부하 시 자기 여자에 의한 전압확립은 일어나지 않는다."],3,"직권 발전기의 단자 전압은 V = E − I(rₐ + rₛ)[V]이다. (+가 아니라 −) 계자와 전기자가 직렬이므로 부하전류가 곧 계자전류이고, 무부하에서는 계자전류가 0이라 잔류 자속만 있어 전압이 극히 적게 유기된다."],
[G,"03 변압기","3권선 변압기에 대한 설명으로 옳은 것은?",["한 개의 전기 회로에 3개의 자기회로로 구성되어 있다.","3차 권선에 조상기를 접속하여 송전선의 전압 조정과 역률 개선에 사용된다.","3차 권선에 단권 변압기를 접속하여 송전선의 전압 조정에 사용된다.","고압배전선의 전압을 10[%] 정도 올리는 승압용이다."],2,"3권선 변압기는 한 개의 변압기에 3개의 권선이 있다. 3차 권선에 무효 전력 보상 장치(조상기)를 접속하여 송전선의 전압조정과 역률 개선에 사용되며, 변압기 뱅크가 Y−Y 결선이면 제3고조파 대응을 위해 별도의 Δ 결선(3차)을 채용한다. 또한 3차 권선으로 발전소 내 전력 등 별개의 계통에 전력을 공급할 수 있다."],
[T,"05 자기 성질과 자기장","단면적 5[cm²], 길이 1[m], 비투자율 10³인 환상 철심에 600회의 권선을 감고 이것에 0.5[A]의 전류를 흐르게 한 경우 기자력[AT]은?",["100","200","300","400"],3,"기자력 F = NI = 600×0.5 = 300[AT]. (단면적·길이·비투자율은 기자력 계산에 필요 없는 값)"],
[G,"04 유도기","3상 380[V], 60[Hz], 4극, 슬립 5[%], 55[kW]인 유도 전동기가 있다. 회전자 속도는 몇 [rpm]인가?",["1,200","1,526","1,710","2,280"],3,"동기속도 Nₛ = 120f/p = 120×60/4 = 1,800[rpm]. N = (1−s)Nₛ = (1−0.05)×1,800 = 1,710[rpm]."],
[T,"08 3상 교류회로","평상 3상 교류회로에서 Y 결선할 때 선간전압(Vₗ)과 상전압(Vₚ)의 관계는?",["Vₗ = Vₚ","Vₗ = √2 Vₚ","Vₗ = √3 Vₚ","Vₗ = (1/√3)Vₚ"],3,"Y 전선 연결(결선)에서 선간전압과 상전압의 관계: Vₗ(선간전압) = √3 Vₚ(상전압)."],
[T,"06 전자유도 법칙과 인덕턴스","자기회로에 기자력을 주면 자로에 자속이 흐른다. 그러나 기자력에 의해 발생되는 자속 전부가 자기회로 내를 통과하는 것이 아니라, 자로 이외의 부분을 통과하는 자속도 있다. 이와 같이 자기회로 이외 부분을 통과하는 자속을 무엇이라 하는가?",["종속자속","누설자속","주자속","반사자속"],2,"누설자속: 자로 이외의 곳을 통과하는 자속."],
[G,"04 유도기","다음 중 유도 전동기에서 비례 추이를 할 수 있는 것은?",["출력","2차 동손","효율","역률"],4,"권선형 유도 전동기에서 2차 회로의 저항을 가감시켜 슬립을 조정하는 비례 추이에 따라 기동회전력을 크게 하거나 속도를 제어할 수 있다. 2차 동손, 출력, 효율 등은 r₂/s의 함수로 표현되지 않아 비례 추이를 할 수 없고, 역률은 가능하다."],
[S,"03 전선의 접속","알루미늄전선과 전기기계기구 단자의 접속 방법으로 틀린 것은?",["전선을 나사로 고정하는 경우 나사가 진동 등으로 헐거워질 우려가 있는 장소는 2중 너트 등을 사용할 것","전선에 터미널러그 등을 부착하는 경우는 도체에 손상을 주지 않도록 피복을 벗길 것","나사 단자에 전선을 접속하는 경우는 전선을 나사의 홈에 가능한 한 밀착하여 3/4바퀴 이상 1바퀴 이하로 감을 것","누름나사단자 등에 전선을 접속하는 경우는 전선을 단자 깊이의 2/3 위치까지만 삽입할 것"],4,"전선과 전기기계 기구단자와의 접속은 접촉이 완전하고, 헐거워질 우려가 없도록 해야 한다. 누름나사단자 등에는 전선을 단자 깊이의 2/3 위치까지만 삽입하는 것이 아니라 완전하게 접촉되도록 확실히 삽입해야 하므로 ④가 틀린 설명이다."],
[S,"05 전선 및 기계기구의 보안공사","전기 난방 기구인 전기담요나 전기장판의 보호용으로 사용되는 퓨즈는?",["플러그 퓨즈","온도 퓨즈","절연 퓨즈","유리관 퓨즈"],2,"온도 퓨즈: 퓨즈에 흐르는 과전류에 의하여 용단되는 것이 아니고, 주위 온도에 의하여 용단되는 것이다. 전기담요와 같은 보온용 기기에 사용된다."],
[G,"03 변압기","전기기계에서 와전류 손실(Eddy Current Loss)을 감소하기 위한 적합한 방법은?",["규소 강판에 성층 철심을 사용한다.","보상 권선을 설치한다.","교류 전원을 사용한다.","냉각 압연 철심을 사용한다."],1,"전기기기에서 철심은 자기회로를 만드는 부분으로, 자속 방향이 수시로 변화하면서 와전류(성층 철심으로 감소) 손실이나 히스테리시스(규소함유 3.5[%] 강판 사용) 현상에 의한 철손이 생긴다. 따라서 철심은 두께 0.35~0.5[mm] 정도의 얇은 규소 강판을 성층하여 사용한다."],
[S,"03 전선의 접속","단선의 직선 접속 시 트위스트 접속을 할 경우 적합하지 않은 전선규격[mm²]은?",["2.5","4.0","6.0","10"],4,"트위스트 직선 접속은 6[mm²] 이하의 단선인 경우에 적용한다. 따라서 10[mm²]은 적합하지 않다."],
[T,"05 자기 성질과 자기장","1[cm]당 권선수가 10인 무한 길이 솔레노이드에 1[A]의 전류가 흐르고 있을 때 솔레노이드 외부 자계의 세기[AT/m]는?",["0","5","10","20"],1,"무한 길이 솔레노이드의 내부 자계 H = NI [AT/m], 외부 자계 H = 0."],
[G,"01 직류기","다음 중 병렬 운전 시 균압선을 설치해야 하는 직류 발전기는?",["분권","차동복권","평복권","부족복권"],3,"직권, 과복권, 평복권 발전기는 수하 특성을 가지지 않아 병렬 운전 시 불안정하다. 일시적 원인으로 한 대의 전류가 증가하면 전압이 더 상승해 부하가 한쪽으로 쏠린다. 안정운전을 위해 직권 계자에 균압선을 연결하여 전압 상승을 같게 하면 병렬 운전을 할 수 있다."],
[S,"05 전선 및 기계기구의 보안공사","배선설계를 위한 전등 및 소형 전기기계기구의 부하용량 산정 시 건축물의 종류에 대응한 표준부하에서 원칙적으로 표준부하를 20[VA/m²]으로 적용하여야 하는 건축물은?",["교회, 극장","호텔, 병원","은행, 상점","아파트, 미용원"],2,"건축물 종류에 따른 표준부하밀도: 공장·공회당·사원·교회·극장·영화관·연회장 10[VA/m²] / 기숙사·여관·호텔·병원·학교·음식점·다방·대중목욕탕 20[VA/m²] / 사무실·은행·상점·이발소·미장원 30[VA/m²] / 주택·아파트 40[VA/m²]."],
[S,"06 전선로 및 배전선 공사","지지물의 지선에 연선을 사용하는 경우 소선 몇 가닥 이상을 꼬아서 사용하는가?",["1","2","3","4"],3,"지지선(지선)은 안전율 2.5 이상, 1가닥 허용 인장 하중 4.31[kN] 이상이고 2.6[mm] 이상의 금속선을 3가닥 이상 꼬아서 만든다."],
[T,"02 전기회로 해석","다음 그림과 같은 회로의 저항값이 R₁ > R₂ > R₃ > R₄일 때, 전류가 최소로 흐르는 저항은?",["R₁","R₂","R₃","R₄"],2,"R₁에 흐르는 전류는 R₂, R₃, R₄에 흐르는 전류의 합이므로 제일 큰 전류가 흐른다. 전류는 저항에 반비례하므로 R₂에 흐르는 전류가 최소가 된다. (병렬회로에서 저항 R₂가 가장 크기 때문)","R₁ 직렬 뒤에 R₂·R₃·R₄가 병렬로 연결된 회로"],
[T,"04 정전기와 콘덴서","정전용량이 같은 콘덴서 2개를 병렬로 연결했을 때의 합성 정전용량은 직렬로 접속했을 때의 합성 정전용량보다 몇 배인가?",["1/4","1/2","2","4"],4,"직렬접속: C_직렬 = C/2. 병렬접속: C_병렬 = 2C. 따라서 병렬접속인 경우는 직렬접속인 경우에 비해 4배 증가한다."],
[G,"03 변압기","어떤 변압기에서 임피던스 강하가 5[%]인 변압기가 운전 중 단락되었을 때 그 단락 전류는 정격전류의 몇 배인가?",["5","20","50","200"],2,"Iₛ/Iₙ = 100/%Z = 100/5 = 20 (배)."],
[T,"03 전류의 열작용과 화학작용","그림에서 a−b 간의 합성저항은 c−d 간의 합성저항의 몇 배인가?",["1배","2배","3배","4배"],2,"a−b 단자 간은 휘스톤 브리지 평형조건을 만족하므로 합성저항 R_ab = (2r×2r)/(2r+2r) = r[Ω]. c−d 단자 간 합성저항 R_cd는 2r과 r과 2r 저항이 병렬로 연결된 것이므로 R_cd = 1/(1/2r + 1/r + 1/2r) = r/2[Ω]. 따라서 R_ab = 2R_cd 이다.","저항 r 5개로 이루어진 브리지(변마다 r, 중앙에도 r). 단자 c·d·a·b가 그림처럼 붙어 있음"],
[G,"04 유도기","50[Hz], 6극인 3상 유도 전동기의 전 부하에서 회전수가 955[rpm]일 때 슬립[%]은?",["4","4.5","5","5.5"],2,"Nₛ = 120f/p = 120×50/6 = 1,000[rpm]. 슬립 s = (Nₛ−N)/Nₛ = (1,000−955)/1,000 = 0.045 ∴ 4.5[%]."],
[G,"02 동기기","동기 전동기의 여자 전류를 변화시켜도 변하지 않는 것은?(단, 공급 전압과 부하는 일정하다.)",["동기속도","역기전력","역률","전기자 전류"],1,"동기속도는 Nₛ = 120f/p 로서 극수와 주파수의 관계이며, 여자 전류의 변화에 변화하지 않는다."],
[G,"03 변압기","다음 변압기 극성에 관한 설명에서 틀린 것은?",["우리나라는 감극성이 표준이다.","1차와 2차 권선에 유기되는 전압의 극성이 서로 반대이면 감극성이다.","3상 결선 시 극성을 고려해야 한다.","병렬 운전 시 극성을 고려해야 한다."],2,"변압기 극성은 어떤 순간에 1차 단자와 2차 단자에 나타나는 유도 기전력의 상대적 방향이다. 우리나라는 감극성이 표준이며, 감극성은 1차와 2차 권선에 유기되는 전압의 극성이 서로 같으면(같은 방향) 감극성이다. 3상 결선이나 병렬 운전에서는 극성을 명확히 해야 한다."],
[G,"02 동기기","정격이 10,000[V], 500[A], 역률 90[%]의 3상 동기 발전기의 단락전류 Iₛ[A]는?(단, 단락비는 1.3으로 하고 전기자 저항은 무시한다.)",["450","550","650","750"],3,"단락비 Kₛ = Iₛ/Iₙ 에서 단락전류 Iₛ = Kₛ×Iₙ = 1.3×500 = 650[A]."],
[S,"02 배선재료와 공구","큰 건물의 공사에서 콘크리트에 구멍을 뚫어 드라이브 핀을 경제적으로 고정하는 공구는?",["스패너","드라이브이트 툴","오스터","녹아웃 펀치"],2,"스패너: 너트를 죄고 푸는 데 사용. 오스터: 금속관 끝에 나사를 내는 공구. 녹아웃 펀치: 배전반, 분전반 등의 배관을 변경하거나 이미 설치되어 있는 캐비닛에 구멍을 뚫을 때 사용. 드라이브이트 툴은 화약의 힘으로 콘크리트에 드라이브 핀을 박는 공구."],
[T,"04 정전기와 콘덴서","어떤 물질이 정상 상태보다 전자 수가 많아져 전기를 띠는 현상을 무엇이라 하는가?",["충전","방전","대전","분극"],3,"외부에서 에너지를 가하면 물질은 전기적인 중성 상태가 깨져 양 또는 음으로 대전되어 전기적인 성질을 가진다."],
[G,"01 직류기","직류 발전기에서 전기자 반작용을 없애는 방법으로 옳은 것은?",["브러시 위치를 전기적 중성점이 아닌 곳으로 이동시킨다.","보극과 보상 권선을 설치한다.","브러시의 압력을 조정한다.","보극은 설치하되 보상 권선은 설치하지 않는다."],2,"전기자 반작용을 없애는 방법: 브러시 위치를 전기적 중성점인 회전 방향으로 이동, 보극을 중성축 위치에 설치, 주자극 표면에 보상 권선을 설치."],
[G,"03 변압기","다음 그림은 단상 변압기 결선도이다. 1차, 2차는 각각 어떤 결선인가?",["Y−Y 결선","Δ−Y 결선","Δ−Δ 결선","Y−Δ 결선"],2,"단상 변압기 3대를 이용하여 3상 전선 연결(결선)한 것으로 1차 측은 Δ 전선 연결(결선), 2차 측은 Y 전선 연결(결선)이다.","단상 변압기 T₁·T₂·T₃ 3대를 이용한 3상 결선도 (1차 U·V·W, 2차 u·v·w)"],
[S,"02 배선재료와 공구","450/750[V] 일반용 단심 비닐 절연전선의 약호는?",["NRI","NF","NFI","NR"],4,"NRI: 300/500[V] 기기 배선용 단심 비닐 절연전선. NF: 450/750[V] 일반용 유연성 단심 비닐 절연전선. NFI: 300/500[V] 기기 배선용 유연성 단심 비닐 절연전선. NR: 450/750[V] 일반용 단심 비닐 절연전선."],
[S,"09 전기응용 시설 공사","전자접촉기 2개를 이용하여 유도전동기 1대를 정·역운전하고 있는 시설에서 전자접촉기 2개가 동시에 여자되어 상간 단락되는 것을 방지하기 위하여 구성하는 회로는?",["자기유지 회로","수차제어 회로","Y−Δ 기동 회로","인터록 회로"],4,"자기유지 회로: 릴레이 자신의 접점으로 동작 상태를 유지하는 회로. Y−Δ 회로: 3상 유도전동기 기동법으로 Y 결선으로 기동하고 Δ 결선으로 변환하여 운전하는 회로. 인터록 회로: 둘 이상 출력이 동시에 생기는 일이 없도록 하는 회로(동시동작 방지)."],
[T,"02 전기회로 해석","기전력 1.5[V], 내부 저항이 0.1[Ω]인 전지 4개를 직렬로 연결하고 이를 단락했을 때의 단락 전류[A]는?",["10","12.5","15","17.5"],3,"직렬연결이므로 전압 V = 1.5×4 = 6[V], 저항 R = 0.1×4 = 0.4[Ω]. ∴ 단락 전류 I = 6/0.4 = 15[A]."],
[G,"02 동기기","동기 발전기에서 역률각이 90도 늦을 때의 전기자 반작용은?",["증자 작용","편자 작용","교차 작용","감자 작용"],4,"교차 자화 작용(횡축 반작용): 역률 1. 감자 작용(직축 반작용): 계자에 의한 기전력과 전기자 부하전류가 90도 위상 차(역률 0, 지상). 증자 작용(직축 반작용): 전기자 전류가 계자 기전력보다 90도 앞선 경우(진상 무효전류)."],
[T,"01 직류회로","다음 중 1[V]와 같은 값을 갖는 것은?",["1[J/C]","1[Wb/m]","1[Ω/m]","1[A·sec]"],1,"V[V] = W[J]/Q[C] 이므로 1[V] = 1[J/C]."],
[S,"04 옥내 배선 공사","라이팅 덕트를 조영재에 따라 부착할 경우 지지점 간의 거리는 몇 [m] 이하로 하여야 하는가?",["1.0","1.2","1.5","2.0"],4,"라이팅 덕트 지지점 간의 거리는 2[m] 이하일 것."],
[G,"03 변압기","전력용 변압기의 내부 고장 보호용 계전 방식은?",["역상 계전기","차동 계전기","접지 계전기","과전류 계전기"],2,"차동 계전기: 고장 또는 이상 현상에 대하여 생긴 불평형의 전류 차가 기준치 이상으로 되었을 때 동작하는 계전기이다. 변압기, 동기기 등의 내부 고장 검출용으로 많이 사용한다."],
[G,"03 변압기","변압기 내부고장 시 급격한 유류 또는 가스의 이동이 생기면 동작하는 부흐홀츠 계전기의 설치 위치는?",["변압기 본체","변압기의 고압 측 부싱","콘서베이터 내부","변압기 본체와 콘서베이터를 연결하는 파이프"],4,"부흐홀츠 계전기는 변압기 내부 고장으로 인한 보호용으로, 변압기의 주 탱크와 콘서베이터 사이에 설치되어 절연유의 온도 상승 시 발생하는 유증기를 검출하여 권선 단락, 철심 고정 볼트의 절연 열화, 탭 전환기의 고장 등을 경보 및 차단하기 위한 용도로 사용된다."],
[S,"05 전선 및 기계기구의 보안공사","특고압(22.9[kV−Y]) 가공전선로의 완금 접지 시 접지선은 어느 곳에 연결하여야 하는가?",["변압기","전주","지선","중성선"],4,"22.9[kV−Y] 가공전선로의 완금 접지 시 접지선은 중성선에 연결하여야 한다.","완금 접지 사진: 전주 위 변압기와 완금(완철)"],
[S,"04 옥내 배선 공사","연피 없는 케이블을 배선할 때 직각 구부리기(L형)는 대략 굴곡 반지름을 케이블의 바깥지름의 몇 배 이상으로 하는가?",["3","4","6","10"],3,"연피가 없는 케이블을 구부리는 경우 피복이 손상되지 않도록 하여 그 굽은 부분(굴곡) 반지름이 케이블의 완성품 지름의 6배(단심의 경우 8배) 이상으로 구부려야 한다."],
[T,"08 3상 교류회로","2전력계법으로 3상 전력을 측정할 때 지시값이 P₁=200[W], P₂=200[W]일 때 부하전력[W]은?",["200","400","600","800"],2,"2전력계법에서 유효전력은 두 전력계의 지시값을 합한 것이다. P = P₁ + P₂ = 200 + 200 = 400[W]."],
[S,"02 배선재료와 공구","인입용 비닐 절연전선의 공칭단면적이 8[mm²]가 되는 연선의 구성은 소선의 지름이 1.2[mm]일 때, 소선수는 몇 가닥으로 되어 있는가?",["3","4","6","7"],4,"소선의 단면적 a = πd²/4 = π×1.2²/4 ≒ 1.13[mm²]. 연선의 단면적 A = Na[mm²]이므로 소선의 총수 N = A/a = 8/1.13 ≒ 7가닥."],
[S,"04 옥내 배선 공사","다음 중 버스덕트가 아닌 것은?",["플로어 버스덕트","피더 버스덕트","트롤리 버스덕트","플러그인 버스덕트"],1,"버스덕트의 종류: 피더(도중에 부하를 접속하지 않은 것), 익스팬션(열 신축에 따른 변화량을 흡수하는 구조), 탭붙이(종단 및 중간에서 기기·전선 등과 접속시키기 위한 탭을 가진 것), 트랜스포지션(각 상의 임피던스를 평균시키기 위해 도체 상호의 위치를 관 내에서 교체), 플러그인(도중에 부하 접속용 꽂음 플러그), 트롤리(도중에 이동 부하를 접속). 플로어 버스덕트는 없다."],
[S,"04 옥내 배선 공사","저압 옥내배선 시설 시 캡타이어 케이블을 조영재의 아랫면 또는 옆면에 따라 붙이는 경우 전선의 지지점 간의 거리는 몇 [m] 이하로 하여야 하는가?",["1","1.5","2","2.5"],1,"케이블 지지점 간의 거리: 조영재의 아랫면 또는 옆면에 따라 시설할 경우 2[m] 이하(단, 캡타이어 케이블은 1[m])."],
[G,"01 직류기","다음의 정류 곡선 중 브러시의 후단에서 불꽃이 발생하기 쉬운 것은?",["직선 정류","정현파 정류","과 정류","부족 정류"],4,"직선 정류(a): 가장 이상적인 정류. 정현 정류(b): 양호한 정류. 부족 정류(c): 브러시 끝 부분(말단 부분)에서 불꽃 발생. 과 정류(d): 브러시 앞단 부분에서 불꽃 발생.","정류 곡선 그림: 전기자 전류 i_a가 시간(정류주기 T_c) 동안 +I_c → −I_c로 변하는 곡선 a(직선), b(정현), c(부족), d(과)"],
[T,"06 전자유도 법칙과 인덕턴스","자체 인덕턴스가 100[H]가 되는 코일에 전류를 1초 동안 0.1[A]만큼 변화시켰다면 유도기전력[V]는?",["1[V]","10[V]","100[V]","1,000[V]"],2,"인덕턴스 L의 유기기전력 V = L·di/dt = 100×0.1/1 = 10[V]."],
[T,"07 교류회로","복소수에 대한 설명으로 틀린 것은?",["실수부와 허수부로 구성된다.","허수를 제곱하면 음수가 된다.","복소수는 A = a + jb의 형태로 표시된다.","거리와 방향을 나타내는 스칼라 양으로 표시한다."],4,"복소수는 거리와 방향을 나타내는 벡터 양으로 표시한다. (스칼라가 아님)"],
[T,"04 정전기와 콘덴서","그림에서 C₁=1[μF], C₂=2[μF], C₃=2[μF]일 때 합성 정전용량은 몇 [μF]인가?",["1/2","1/5","2","5"],1,"콘덴서의 직렬연결 합성 정전용량 C = 1/(1/C₁ + 1/C₂ + 1/C₃) = 1/(1/1 + 1/2 + 1/2) = 1/2[μF].","콘덴서 C₁, C₂, C₃ 세 개가 직렬로 연결된 회로"],
[G,"05 정류기 및 제어기기","다음 그림에 대한 설명으로 틀린 것은?",["브리지(Bridge)회로라고도 한다.","실제의 정류기로 널리 사용된다.","반파 정류회로라고도 한다.","전파 정류회로라고도 한다."],3,"다이오드 4개를 활용한 단상 브리지 전파 정류회로로서 정류기로 응용되어 사용되고 있다. 반파 정류회로가 아니다.","다이오드 D₁~D₄ 4개로 구성한 브리지 회로: 교류전원 V가 a·b에 연결되고, P−N 사이에 부하가 연결"],
[G,"04 유도기","유도 전동기가 회전하고 있을 때 생기는 손실 중에서 구리손이란?",["브러시의 마찰손","베어링의 마찰손","표유 부하손","1차, 2차 권선의 저항손"],4,"회전기에 생기는 손실에는 고정손(철손)과 부하손(구리손(동손))으로 분류된다. 구리손(동손): 전류가 흐르는 회로 중 저항에 의해 생기는 손실. 종류로는 계자구리손, 전기자 구리손, 브러시 접촉 저항에 의한 구리손 등이 있다."],
[T,"07 교류회로","R=5[Ω], L=30[mH]인 R−L 직렬 회로에 V=200[V], f=60[Hz]인 교류 전압을 가할 때 전류의 크기는 약 몇 [A]인가?",["8.67","11.42","16.18","21.25"],3,"전류 I = V/Z = V/√(R² + (2πfL)²) = 200/√(5² + (2×3.14×60×30×10⁻³)²) = 16.18[A]. (π≒3.14)"],
[S,"06 전선로 및 배전선 공사","고압 가공전선로의 지지물 중 지선을 사용해서는 안 되는 것은?",["목주","철탑","A종 철주","A종 철근 콘크리트주"],2,"가공전선로의 지지물로 사용하는 철탑은 지지선(지선)을 사용하여 그 강도를 분담시켜서는 안 된다."]
];

EX[4]=[
[T,"02 전기회로 해석","임의의 폐회로에서 키르히호프의 제2법칙을 가장 잘 나타낸 것은?",["기전력의 합 = 합성 저항의 합","기전력의 합 = 전압 강하의 합","전압 강하의 합 = 합성 저항의 합","합성 저항의 합 = 회로 전류의 합"],2,"키르히호프 제2법칙(전압 법칙): 폐회로에서 기전력의 합은 전압 강하의 합과 같다."],
[G,"02 동기기","동기기 운전 시 안정도 증진법이 아닌 것은?",["단락비를 크게 한다.","회전부의 관성을 크게 한다.","속응 여자방식을 채택한다.","역상 및 영상 임피던스를 작게 한다."],4,"안정도 증진법: 단락비를 크게(철기계가 되어 고가), 회전부의 관성을 크게(부하각 동요가 적어져 동기 이탈 가능성 감소), 속응 여자방식 채택, 영상 및 역상 임피던스를 크게 한다. 따라서 임피던스를 작게 하는 것은 틀림."],
[T,"07 교류회로","교류 전력에서 일반적으로 전기 기기의 용량을 표시하는 데 쓰이는 전력은?",["피상전력","유효전력","무효전력","기전력"],1,"전기 기기의 용량은 피상전력[VA]으로 나타낸다."],
[S,"05 전선 및 기계기구의 보안공사","사용전압 415[V]의 3상 3선식 전선로의 1선과 대지간에 필요한 절연 저항값의 최솟값은 몇 옴[Ω]인가?(단, 최대공급전류는 500[A]이다.)",["2,560","1,660","3,210","4,512"],2,"전선로 1선과 대지 간에 필요한 절연 저항값의 최소를 구하려면 허용 누설 전류를 구해야 한다. 허용 누설 전류는 최대 공급전류의 1/2,000배이므로 0.25[A]. 따라서 절연 저항값 = 415/0.25 = 1,660[Ω]."],
[S,"04 옥내 배선 공사","연피 없는 케이블을 배선할 때 직각 구부리기(L형)는 대략 굴곡 반지름을 케이블의 바깥지름의 몇 배 이상으로 하는가?",["3","4","6","10"],3,"연피가 없는 케이블을 구부리는 경우 피복이 손상되지 않도록 하여 그 굽은 부분(굴곡) 반지름이 케이블의 완성품 지름의 6배(단심의 경우 8배) 이상으로 구부려야 한다."],
[S,"04 옥내 배선 공사","옥내 배선 공사 시 전선의 지름을 결정하는 요소가 아닌 것은?",["허용전류","전압강하","기계적 강도","공사방법"],4,"옥내 배선의 지름(굵기)을 결정하는 요소는 허용전류, 기계적 강도, 전압강하이다. 공사방법은 해당하지 않는다."],
[T,"02 전기회로 해석","그림에서 단자 A−B 사이의 전압은 몇 [V]인가?",["1.5","2.5","6.5","9.5"],2,"A−B 단자전압 V = 1.5 + 3 + 1.5 − 1.5 − 2 = 2.5[V]. (극성이 반대 방향인 전지는 빼 준다.)","A에서 B까지 전지가 직렬로 연결: 위쪽 1.5[V], 3[V], 오른쪽 세로 1.5[V], 아래쪽 1.5[V], 2[V] (전지 극성 방향은 책 그림 참조)"],
[G,"01 직류기","직류기에서 정류를 좋게 하는 방법 중 전압정류의 역할은?",["보극","탄소","보상권선","리액턴스 전압"],1,"전기자 코일에서 발생하는 평균 리액턴스 전압과 반대 극성의 전압을 유도시켜 평균 리액턴스 전압을 없애고 정류작용을 하는 것을 전압정류라 하고, 이를 위해 주 자극 사이에 보극을 설치한다."],
[S,"02 배선재료와 공구","아래의 그림 기호가 나타내는 것은?",["비상 콘센트","형광등","점멸기","접지저항 측정용 단자"],1,"도면 기호: 비상 콘센트는 사각 테두리 안에 점 2개 원과 점 3개 원이 나란히 있는 형태, 점멸기는 ●(검은 원).","사각 테두리 안에 원 두 개: 왼쪽 원에는 점 2개, 오른쪽 원에는 점 3개"],
[G,"03 변압기","변압기의 임피던스 전압이란?",["정격전류가 흐를 때의 변압기 내의 전압 강하","여자 전류가 흐를 때의 2차 측 단자전압","정격전류가 흐를 때의 2차 측 단자전압","2차 단락 전류가 흐를 때의 변압기 내의 전압 강하"],1,"변압기의 임피던스 전압이란 변압기의 임피던스와 정격전류와의 곱을 말한다. 변압기 2차 측을 단락한 상태에서 1차 측에 정격전류가 흐르도록 1차 측에 인가하는 전압이며, 이는 곧 변압기 내의 전압 강하가 된다."],
[T,"06 전자유도 법칙과 인덕턴스","자속밀도 0.8[Wb/m²]인 자계에서 길이 50[cm]인 도체가 30[m/s]로 회전할 때 유기되는 기전력[V]은?",["8","12","15","24"],2,"e = Blv = 0.8×0.5×30 = 12[V]."],
[S,"03 전선의 접속","그림의 전자계전기 구조는 어떤 형의 계전기인가?",["힌지형","플런저형","가동코일형","스프링형"],1,"힌지형 전자계전기는 코일에 대한 압력으로 전자석의 움직임을 만들어 내고, 그로 인한 직접 또는 간접의 접점 개폐를 하는 계전기이다.","계전기 구조도: 가동접점단자·고정접점단자, 접점, 가동철편, 스프링, 코일단자, 절연물이 표시된 힌지(경첩) 방식 구조"],
[G,"01 직류기","직류 분권 전동기의 회전 방향을 바꾸기 위해 일반적으로 무엇의 방향을 바꾸어야 하는가?",["전원","주파수","계자 저항","전기자 전류"],4,"회전 방향을 바꾸려면 계자 권선이나 전기자 권선 중 어느 한쪽의 접속을 반대로 하면 되는데, 일반적으로 전기자 권선의 접속을 바꾸어 준다. 즉, 전기자에 흐르는 전류의 방향을 바꾸어 주면 된다."],
[S,"03 전선의 접속","합성수지제 전선관의 호칭은 관 굵기의 무엇으로 표시하는가?",["홀수인 안지름","짝수인 바깥지름","짝수인 안지름","홀수인 바깥지름"],3,"합성수지제 전선관의 호칭은 관 굵기의 짝수인 안지름으로 표시한다. (14, 16, 22, 28, 36, 42, 54, 70, 82[mm])"],
[T,"03 전류의 열작용과 화학작용","전구를 점등하기 전의 저항과 점등한 후의 저항을 비교하면 어떻게 되는가?",["점등 후의 저항이 크다.","점등 전의 저항이 크다.","변동 없다.","경우에 따라 다르다."],1,"전구가 점등이 된 후 온도가 상승하여 점등 후의 저항이 크다."],
[S,"03 전선의 접속","전등 1개를 2개소에서 점멸하고자 할 때 필요한 3로 스위치는 최소 몇 개인가?",["1개","2개","3개","4개"],2,"3로 스위치가 2개 있어야만 전등 1개를 2개소에서 점멸할 수 있다."],
[S,"06 전선로 및 배전선 공사","다음 ( ) 안에 알맞은 내용은? ‘고압 및 특고압용 기계기구의 시설에 있어 고압은 지표상 (㉠) 이상(시가지에 시설하는 경우), 특고압(사용전압 35[kV] 이하인 경우)은 지표상 (㉡) 이상의 높이에 시설하고 사람이 접촉될 우려가 없도록 시설하여야 한다.’",["㉠ 3.5[m], ㉡ 4[m]","㉠ 4.5[m], ㉡ 5[m]","㉠ 5.5[m], ㉡ 6[m]","㉠ 5.5[m], ㉡ 7[m]"],2,"기계기구 설치 시 지표상의 높이: 고압은 4.5[m](시가지 외에는 4[m]) 이상. 특고압은 사용전압이 35[kV] 이하이면 5[m] 이상, 35[kV] 초과 160[kV] 이하이면 6[m] 이상."],
[G,"02 동기기","정격이 10,000[V], 500[A], 역률 90[%]의 3상 동기 발전기의 단락전류 Iₛ[A]는?(단, 단락비는 1.3으로 하고 전기자 저항은 무시한다.)",["450","550","650","750"],3,"단락비는 정격전류와 단락전류의 관계를 나타낸다. 단락비 Kₛ = Iₛ/Iₙ 이므로 Iₛ = Kₛ×Iₙ = 1.3×500 = 650[A]."],
[S,"04 옥내 배선 공사","케이블 공사의 단심 비닐 외장 케이블의 굴곡반경은 외경의 몇 배 이상이 되어야 하는가?",["6","8","10","12"],2,"내선규정에 의해 케이블을 구부리는 경우에는 피복이 손상되지 않도록 하고 그 굴곡부의 곡률반경은 원칙적으로 케이블 완성품 외경의 6배(단심인 것은 8배) 이상으로 해야 한다. 단심 케이블이므로 8배."],
[T,"02 전기회로 해석","다음 그림과 같은 회로의 저항값이 R₁ > R₂ > R₃ > R₄일 때, 전류가 최소로 흐르는 저항은?",["R₁","R₂","R₃","R₄"],2,"R₁에 흐르는 전류는 R₂, R₃, R₄에 흐르는 전류의 합이므로 제일 큰 전류가 흐른다. 전류는 저항에 반비례하므로 R₂에 흐르는 전류가 최소가 된다.","R₁ 직렬 뒤에 R₂·R₃·R₄가 병렬로 연결된 회로"],
[G,"02 동기기","동기 발전기에서 역률각이 90도 늦을 때의 전기자 반작용은?",["증자 작용","편자 작용","교차 작용","감자 작용"],4,"교차 자화 작용(횡축 반작용): 역률 1. 감자 작용(직축 반작용): 계자에 의한 기전력과 전기자 부하전류가 90도 위상 차(역률 0, 지상). 증자 작용: 전기자 전류가 계자 기전력보다 90도 앞선 경우(진상 무효전류)."],
[S,"03 전선의 접속","해안지방의 송전용 나전선에 가장 적당한 것은?",["철선","강심알루미늄선","동선","알루미늄합금선"],3,"해안지방에서 송전용 나전선의 알루미늄은 부식되고 철심의 저항이 크기 때문에 사용하지 않고, 구리선(동선)을 사용한다."],
[G,"02 동기기","동기 전동기의 공급전압보다 앞선 전류가 흐르면 어떤 작용을 하는가?",["역률 작용","교차 자화 작용","증자 작용","감자 작용"],4,"동기 전동기에서 무부하 유기전압이 단자전압보다 크게 된 경우에는 평형이 다시 이루어지기 위해서 전기자 권선에 무효전류가 흐르고 자속을 감소시켜야 한다. 공급전압보다 앞선(진상) 전류는 감자 작용을 한다."],
[T,"05 자기 성질과 자기장","1[cm]당 권선수가 10인 무한 길이 솔레노이드에 1[A]의 전류가 흐르고 있을 때 솔레노이드 외부 자계의 세기[AT/m]는?",["0","5","10","20"],1,"무한 길이 솔레노이드의 내부 자계 H = NI [AT/m], 외부 자계 H = 0."],
[S,"02 배선재료와 공구","큰 건물의 공사에서 콘크리트에 구멍을 뚫어 드라이브 핀을 경제적으로 고정하는 공구는?",["스패너","드라이브이트 툴","오스터","녹아웃 펀치"],2,"스패너: 너트를 죄고 푸는 데 사용. 오스터: 금속관 끝에 나사를 내는 공구. 녹아웃 펀치: 배전반, 분전반 등의 배관을 변경하거나 이미 설치되어 있는 캐비닛에 구멍을 뚫을 때 사용. 드라이브이트 툴은 화약의 힘으로 콘크리트에 핀을 박는 공구."],
[G,"03 변압기","1차 전압 13,200[V], 2차 전압 220[V]인 단상 변압기의 1차에 6,000[V]의 전압을 가한다면 2차 전압은 몇 [V]인가?",["100","200","50","250"],1,"권수비 a = V₁/V₂ = N₁/N₂ = 13,200/220 = 60. ∴ V₂ = V₁/a = 6,000/60 = 100[V]."],
[S,"03 전선의 접속","전선을 접속하는 경우 전선의 강도는 몇 [%] 이상 감소시키지 않아야 하는가?",["10","20","40","80"],2,"나전선 상호 또는 나전선과 절연전선, 캡타이어 케이블 또는 케이블과 접속하는 경우 전선의 강도를 20[%] 이상 감소시키지 않을 것."],
[G,"03 변압기","전력용 변압기의 내부 고장 보호용 계전 방식은?",["역상 계전기","차동 계전기","접지 계전기","과전류 계전기"],2,"차동 계전기: 고장 또는 이상 현상에 대하여 생긴 불평형의 전류 차가 기준치 이상으로 되었을 때 동작하는 계전기이다. 변압기, 동기기 등의 내부 고장 검출용으로 많이 사용한다."],
[S,"09 전기응용 시설 공사","조명기구를 반간접 조명 방식으로 설치하였을 때 위(상방향)로 향하는 광속의 양[%]은?",["0~10","10~40","40~60","60~90"],4,"반간접 조명 방식: 하반구 광속은 전 광속의 10~40[%], 상반구 광속은 전 광속의 60~90[%]이다."],
[G,"01 직류기","기중기, 전기 자동차, 전기 철도와 같은 곳에 가장 많이 사용되는 전동기는?",["가동 복권 전동기","차동 복권 전동기","분권 전동기","직권 전동기"],4,"직권 전동기는 계자권선과 전기자 권선이 직렬로 연결되어 Iᶠ = Iₐ = I 이다. 자속이 전기자 전류에 비례하고 토크는 전기자 전류의 제곱에 비례한다. 부하 변동이 심하고 큰 기동 토크가 요구되는 전동차, 크레인, 전기철도 등에 적용한다."],
[T,"01 직류회로","다음 중 1[V]와 같은 값을 갖는 것은?",["1[J/C]","1[Wb/m]","1[Ω/m]","1[A·sec]"],1,"V[V] = W[J]/Q[C] 이므로 1[V] = 1[J/C]."],
[T,"07 교류회로","임피던스 Z = 6 + j8[Ω]에서 컨덕턴스는?",["0.06[℧]","0.08[℧]","0.1[℧]","1.0[℧]"],1,"Y = 1/Z = 1/(6+j8) = (6−j8)/((6+j8)(6−j8)) = (6−j8)/(6²+8²) = (6−j8)/100 = 0.06 − j0.08[℧]. 실수부가 컨덕턴스이므로 G = 0.06[℧]."],
[G,"01 직류기","보극이 없는 직류기 운전 중 중성점의 위치가 변하지 않는 경우는?",["과부하","전부하","중부하","무부하"],4,"전기자 반작용의 영향 — 편자 작용으로 인한 전기적 중성점 이동, 주자속 감소로 인한 기전력 감소, 국부적 전압 불균일로 인한 스파크 발생. 무부하 시에는 전기자 전류가 없어 중성점이 이동하지 않는다."],
[G,"01 직류기","다음 중 병렬 운전 시 균압선을 설치해야 하는 직류 발전기는?",["분권","차동복권","평복권","부족복권"],3,"직권, 과복권, 평복권 발전기는 수하 특성을 가지지 않아 병렬 운전 시 불안정하다. 안정운전을 위해 직권 계자에 균압선을 연결하여 전압 상승을 같게 하면 병렬 운전을 할 수 있다."],
[G,"04 유도기","유도 전동기가 회전하고 있을 때 생기는 손실 중에서 구리손이란?",["브러시의 마찰손","베어링의 마찰손","표유 부하손","1차, 2차 권선의 저항손"],4,"회전기에 생기는 손실에는 고정손(철손)과 부하손(구리손(동손))으로 분류된다. 구리손(동손)은 전류가 흐르는 회로 중 저항에 의해 생기는 손실로 계자구리손, 전기자 구리손, 브러시 접촉 저항에 의한 구리손 등이 있다."],
[G,"03 변압기","다음 변압기 극성에 관한 설명에서 틀린 것은?",["우리나라는 감극성이 표준이다.","1차와 2차 권선에 유기되는 전압의 극성이 서로 반대이면 감극성이다.","3상 결선 시 극성을 고려해야 한다.","병렬 운전 시 극성을 고려해야 한다."],2,"감극성: 1차와 2차 권선에 유기되는 전압의 극성이 서로 같으면(같은 방향) 감극성이다. 우리나라는 감극성을 표준으로 채택하고 있으며, 3상 결선이나 병렬 운전의 경우에는 극성을 명확히 해야 한다."],
[T,"04 정전기와 콘덴서","콘덴서의 정전용량에 대한 설명으로 틀린 것은?",["전압에 반비례한다.","이동 전하량에 비례한다.","극판의 넓이에 비례한다.","극판의 간격에 비례한다."],4,"C = εS/d 에서 정전용량은 극판의 면적(S)에 비례하고 거리(d)에 반비례한다. C = Q/V 에서 정전용량은 전하량(Q)에 비례하고 전압(V)에 반비례한다."],
[G,"01 직류기","다음의 정류 곡선 중 브러시의 후단에서 불꽃이 발생하기 쉬운 것은?",["직선 정류","정현파 정류","과 정류","부족 정류"],4,"직선 정류(a): 가장 이상적인 정류. 정현 정류(b): 양호한 정류. 부족 정류(c): 브러시 끝 부분(말단 부분)에서 불꽃 발생. 과 정류(d): 브러시 앞단 부분에서 불꽃 발생.","정류 곡선 그림: 전기자 전류 i_a가 정류주기 T_c 동안 +I_c → −I_c로 변하는 곡선 a(직선), b(정현), c(부족), d(과)"],
[S,"04 옥내 배선 공사","다음 중 버스덕트가 아닌 것은?",["플로어 버스덕트","피더 버스덕트","트롤리 버스덕트","플러그인 버스덕트"],1,"버스덕트의 종류: 피더, 익스팬션, 탭붙이, 트랜스포지션, 플러그인, 트롤리 버스덕트. 플로어 버스덕트는 버스덕트의 종류가 아니다."],
[T,"03 전류의 열작용과 화학작용","20분간에 876,000[J]의 일을 할 때 전력은 몇 [kW]인가?",["0.73","7.3","73","730"],1,"전력 P = W/t = 876,000/(20×60) = 730[W] = 0.73[kW]."],
[G,"01 직류기","다음 그림의 직류 전동기는 어떤 전동기인가?",["직권 전동기","타여자 전동기","분권 전동기","복권 전동기"],3,"계자와 전기자가 직렬로 연결되어 있으면 직권 전동기이고, 병렬로 접속되어 있으면 분권 전동기이다.","전원 +, − 단자 사이에 전기자 A와 계자 F가 병렬로 연결 (전류 I가 Iₐ와 I_f로 갈라짐)"],
[S,"05 전선 및 기계기구의 보안공사","전기 난방 기구인 전기담요나 전기장판의 보호용으로 사용되는 퓨즈는?",["플러그 퓨즈","온도 퓨즈","절연 퓨즈","유리관 퓨즈"],2,"온도 퓨즈: 퓨즈에 흐르는 과전류에 의하여 용단되는 것이 아니고, 주위 온도에 의하여 용단되는 것이다. 전기담요와 같은 보온용 기기에 사용된다."],
[S,"02 배선재료와 공구","배관 공사 시 금속관이나 합성수지관으로부터 전선을 뽑아 전동기 단자 부근에 접속할 때 전선 보호를 위해 관 끝에 설치하는 것은?",["부싱","엔트런스 캡","터미널 캡","로크너트"],3,"터미널 캡은 배관 공사 시 금속관이나 합성수지관으로부터 전선을 뽑아 전동기 단자 부근에 접속할 때 사용한다. 또는 노출 배관에서 금속 배관으로 변경 시 전선 보호를 위해 관 끝에 설치하며 서비스 캡이라고도 한다."],
[G,"03 변압기","다음 중 변압기의 원리와 관계있는 것은?",["전기자 반작용","전자유도 작용","플레밍의 오른손 법칙","플레밍의 왼손 법칙"],2,"변압기는 하나의 회로에서 교류전력을 받아 전자유도 작용에 의해서 같은 주파수의 교류전력으로 변성하여 다른 회로에 공급하는 기기이다."],
[T,"07 교류회로","복소수에 대한 설명으로 틀린 것은?",["실수부와 허수부로 구성된다.","허수를 제곱하면 음수가 된다.","복소수는 A = a + jb의 형태로 표시된다.","거리와 방향을 나타내는 스칼라 양으로 표시한다."],4,"복소수는 거리와 방향을 나타내는 벡터 양으로 표시한다. (스칼라가 아님)"],
[T,"08 3상 교류회로","2전력계법으로 3상 전력을 측정할 때 지시값이 P₁=400[W], P₂=300[W]일 때 부하전력[W]은?",["200","400","700","800"],3,"2전력계법에서 유효전력은 두 전력계의 지시값을 합한 것이다. P = P₁ + P₂ = 400 + 300 = 700[W]."],
[G,"04 유도기","3상 유도 전동기의 토크는?",["2차 유도 기전력의 2승에 비례한다.","2차 유도 기전력에 비례한다.","2차 유도 기전력과 무관하다.","2차 유도 기전력의 0.5승에 비례한다."],1,"유도 전동기의 토크는 2차 유도 기전력의 제곱에 비례한다. (T ∝ V²)"],
[S,"03 전선의 접속","성냥을 제조하는 공장의 공사 방법으로 적당하지 않은 것은?",["금속관 공사","케이블 공사","합성 수지관 공사","금속몰드공사"],4,"셀룰로이드, 성냥, 석유류 기타 타기 쉬운 위험한 물질을 제조하거나 저장하는 곳에 시설하는 저압 옥내배선 등은 합성 수지관공사(두께 2[mm] 미만의 합성 수지 전선관 및 난연성이 없는 콤바인 덕트관을 사용하는 것을 제외), 금속관공사 또는 케이블공사에 의할 것. 금속몰드공사는 적당하지 않다."],
[S,"02 배선재료와 공구","나전선 등의 금속선에 속하지 않는 것은?",["경동선(지름 12[mm] 이하의 것)","연동선","동합금선(단면적 35[mm²] 이하의 것)","경알루미늄선(단면적 35[mm²] 이하의 것)"],3,"나전선 등 금속선은 구리(동)합금선의 경우 단면적 25[mm²] 이하일 것. 따라서 ③ 동합금선(35[mm²] 이하)은 해당하지 않는다."],
[S,"04 옥내 배선 공사","금속관 공사에 의한 저압 옥내배선에서 잘못된 것은?",["전선은 절연 전선일 것","금속관 안에서는 전선의 접속점이 없도록 할 것","알루미늄 전선은 단면적 16[mm²] 초과 시 연선을 사용할 것","옥외용 비닐 절연전선을 사용할 것"],4,"전선은 옥외용 비닐 절연전선을 제외한 절연전선으로 연선이어야 한다. 따라서 옥외용 비닐 절연전선을 사용하는 것은 잘못이다."],
[S,"05 전선 및 기계기구의 보안공사","배전설계를 위한 전등 및 소형 전기기계기구의 부하용량 산정시 건축물의 종류에 대응한 표준 부하에서 원칙적으로 표준부하를 20[VA/m²]으로 적용하여야 하는 건축물은?",["교회, 극장","학교, 음식점","은행, 상점","아파트, 미용원"],2,"표준부하밀도: 공장·공회당·사원·교회·극장·영화관·연회장 10 / 기숙사·여관·호텔·병원·학교·음식점·다방·대중목욕탕 20 / 사무실·은행·상점·이발소·미장원 30 / 주택·아파트 40 [VA/m²]."],
[S,"09 전기응용 시설 공사","전자접촉기 2개를 이용하여 유도전동기 1대를 정·역운전하고 있는 시설에서 전자접촉기 2개가 동시에 여자되어 상간 단락되는 것을 방지하기 위하여 구성하는 회로는?",["자기유지 회로","수차제어 회로","Y−Δ 기동 회로","인터록 회로"],4,"자기유지 회로: 릴레이 자신의 접점으로 동작 상태를 유지하는 회로. Y−Δ 회로: 3상 유도전동기의 기동법. 인터록 회로: 둘 이상 출력이 동시에 생기는 일이 없도록 하는 회로(동시동작 방지)."],
[T,"01 직류회로","일반적으로 온도가 높아지게 되면 전도율이 커져서 온도 계수가 부(−)의 값을 가지는 것이 아닌 것은?",["구리","반도체","탄소","전해액"],1,"정온도 계수: 온도가 증가하면 저항도 증가하며 구리, 은 등이 있다. 부온도 계수: 온도가 증가하면 저항은 감소하며 탄소, 반도체 등이 있다. 구리는 부(−)의 온도 계수를 갖지 않는다."],
[T,"07 교류회로","R=5[Ω], L=30[mH]인 R−L 직렬 회로에 V=200[V], f=60[Hz]인 교류 전압을 가할 때 전류의 크기는 약 몇 [A]인가?",["8.67","11.42","16.18","21.25"],3,"전류 I = V/Z = V/√(R² + (2πfL)²) = 200/√(5² + (2×3.14×60×30×10⁻³)²) = 16.18[A]."],
[T,"05 자기 성질과 자기장","전류에 의한 자기장의 세기를 구하는 비오-사바르의 법칙으로 옳은 것은?",["ΔH = IΔl sinθ/(4πr²) [AT/m]","ΔH = IΔl sinθ/(4πr) [AT/m]","ΔH = IΔl cosθ/(4πr) [AT/m]","ΔH = IΔl cosθ/(4πr²) [AT/m]"],1,"비오-사바르 법칙은 유한장에 전류가 흐를 때 주변의 자계 세기를 구하는 법칙이다. ΔH = IΔl sinθ/(4πr²) [AT/m]."],
[T,"08 3상 교류회로","Δ 결선에서 선전류가 10√3[A]이면 상전류[A]는?",["5","10","10√3","30"],2,"Δ 전선 연결(결선): Iₗ = √3 Iₚ ∠−30°. Iₚ = (1/√3)Iₗ = (1/√3)×10√3 = 10[A]."],
[T,"07 교류회로","다음 전압 파형의 주파수는 약 몇 [Hz]인가?\ne = 100 sin(377t − π/5)[V]",["50","60","80","100"],2,"전압 e = Vₘ sin(ωt±θ)[V]로 표현하므로 ω = 2πf = 377[rad/s]. ∴ f = 377/2π = 60[Hz]."],
[T,"03 전류의 열작용과 화학작용","그림에서 a−b 간의 합성저항은 c−d 간의 합성저항의 몇 배인가?",["1배","2배","3배","4배"],2,"a−b 단자 간은 휘스톤 브리지 평형조건을 만족하므로 합성저항 R_ab = (2r×2r)/(2r+2r) = r[Ω]. c−d 단자 간 합성저항 R_cd는 2r과 r과 2r 저항이 병렬로 연결된 것이므로 R_cd = 1/(1/2r + 1/r + 1/2r) = r/2[Ω]. 따라서 R_ab = 2R_cd 이다.","저항 r 5개로 이루어진 브리지(변마다 r, 중앙에도 r). 단자 c·d·a·b가 그림처럼 붙어 있음"],
[T,"03 전류의 열작용과 화학작용","저항이 있는 도선에 전류가 흐르면 열이 발생한다. 이와 같이 전류의 열작용과 가장 관계가 깊은 법칙은?",["패러데이의 법칙","키르히호프의 법칙","줄의 법칙","옴의 법칙"],3,"도선에 전류가 흐르면 전기적 에너지가 열에너지로 변환되면서 열을 발생하는데 이를 줄의 법칙이라고 한다. 줄의 법칙 H = 0.24I²Rt [cal]."],
[G,"02 동기기","동기 조상기를 과여자로 사용하면?",["리액터로 작용","저항손의 보상","일반부하의 뒤진 전류 보상","콘덴서로 작용"],4,"동기 전동기를 과여자로 운전하면 회로에서 진상 전류를 취하게 할 수 있다. 일정한 교류 전압을 가하여 이것보다 90° 앞선 무효전류를 흘리는 점이 콘덴서와 닮았기 때문에 동기 무효 전력 보상 장치(조상기)라 한다. 과여자 시 콘덴서로 작용한다."]
];

EX[5]=[
[T,"06 전자유도 법칙과 인덕턴스","전류 0.5[A]가 흐르는 코일에 0.2[J]의 에너지가 저장되어 있다. 자체 인덕턴스[H]는 얼마인가?",["2.0","0.4","0.8","1.6"],4,"W=½LI²에서 L=2W/I²=(2×0.2)/0.5²=1.6[H]"],
[S,"09 전기응용 시설 공사","광도가 I[cd]일 때 구광원의 광속은?",["F=4πI[lm]","F=2πI[lm]","F=πI[lm]","F=π²I[lm]"],1,"구광원 F=4πI[lm], 평판광원 F=πI[lm]. 광도는 한 방향으로 나오는 빛의 세기, 광속은 광원에서 나오는 빛의 양이다."],
[S,"02 배선재료와 공구","전선의 굵기를 측정하는 공구는?",["권척","메거","와이어 게이지","와이어 스트리퍼"],3,"와이어 게이지: 전선의 굵기(직경) 측정. 권척(줄자)은 길이 측정, 메거는 절연저항 측정, 와이어 스트리퍼는 피복을 벗기는 공구."],
[T,"09 비정현파","비사인파의 일반적인 구성이 아닌 것은?",["삼각파","고조파","기본파","직류분"],1,"비사인파 = 직류분 + 기본파 + 고조파"],
[S,"05 전선 및 기계기구의 보안공사","전선과 대지 사이의 절연저항은 사용전압에 대한 누설전류가 최대공급전류의 얼마를 초과하지 않도록 해야 하는가?",["1/1,000","1/2,000","1/2,500","1/1,500"],2,"저압 전선로의 절연저항은 누설전류가 최대공급전류의 1/2,000을 넘지 않도록 유지한다. 절연저항 측정이 곤란한 저압 전로는 누설전류 1[mA] 이하."],
[T,"02 전기회로 해석","다음 회로에서 10[Ω]에 걸리는 전압은 몇 [V]인가?",["2","10","20","30"],4,"전류 I=105/(5+10+20)=3[A], 10[Ω]의 전압 V=IR=3×10=30[V]","5[Ω], 10[Ω], 20[Ω] 저항 3개가 직렬로 연결되고 105[V] 전원이 접속된 회로"],
[T,"06 전자유도 법칙과 인덕턴스","도체가 운동하여 자속을 끊었을 때 기전력의 방향을 알아내는 데 편리한 법칙은?",["렌츠의 법칙","패러데이의 법칙","플레밍의 왼손 법칙","플레밍의 오른손 법칙"],4,"플레밍의 오른손 법칙: 도체가 자속을 끊을 때 유기기전력의 방향(발전기). 엄지=운동 방향, 검지=자속 밀도, 중지=기전력."],
[T,"03 전류의 열작용과 화학작용","전압 220[V], 전력 60[W]인 전구 10개를 20시간 동안 사용하였을 때의 사용 전력량[kWh]은 얼마인가?",["12","15","120","150"],1,"60[W]×10개×20[h]=12,000[Wh]=12[kWh]"],
[T,"04 정전기와 콘덴서","전기력선의 성질에 대한 설명 중 옳지 않은 것은?",["전기력선의 방향은 그 점의 전계의 방향과 일치하며, 밀도는 그 점에서의 전계의 크기와 같다.","전기력선은 부전하에서 시작하여 정전하에서 그친다.","단위전하에서는 1/ε₀개의 전기력선이 출입한다.","전기력선은 전위가 높은 점에서 낮은 점으로 향한다."],2,"전기력선은 정전하(+)에서 시작해 부전하(−)에서 끝난다. 전위가 높은 곳에서 낮은 곳으로 향하고, 도체 표면에 수직으로 출입하며 등전위면과 직교한다. 전기력선 수 N=Q/ε₀."],
[S,"02 배선재료와 공구","전등 1개를 2개소에서 점멸하고자 할 때 필요한 3로 스위치는 최소 몇 개인가?",["1개","2개","3개","4개"],2,"2개소 점멸에는 3로 스위치 2개가 필요하다. (3개소 이상이면 3로 2개 + 4로 스위치 추가)"],
[T,"07 교류회로","저항 8[Ω]과 리액턴스 6[Ω]이 직렬 연결된 회로에 전압 100√2 sin ωt[V]를 인가하였을 경우, 전류의 실효값은 얼마인가?",["10√2","10","100√2","100"],2,"전압 실효값 V=100√2/√2=100[V], |Z|=√(8²+6²)=10[Ω], I=100/10=10[A]"],
[T,"05 자기 성질과 자기장","다음 중 [Wb] 단위를 사용하는 것은?",["자하","전하","전속","투자율"],1,"자하 m[Wb], 전하 Q[C], 전속 ψ[C], 투자율 μ[H/m]"],
[S,"06 전선로 및 배전선 공사","고압 가공전선이 도로를 횡단하는 경우 전선의 지표상 최소 높이는 몇 [m]인가?",["3","4","5","6"],4,"저압·고압 가공전선의 높이: 도로 횡단 지표상 6[m] 이상, 철도 횡단 레일면상 6.5[m] 이상"],
[S,"07 고압 및 저압 배전반 공사","가스 차단기에 들어가는 가스인 SF₆가스의 특징으로 틀린 것은?",["무색, 무취, 무독성 가스이다.","난연성, 불활성 가스이다.","소호능력은 공기의 약 1/3배이다.","절연내력은 공기의 약 2~3배이다."],3,"SF₆의 소호능력은 공기의 100~200배이다. 절연내력은 공기의 2~3배, 무색·무취·무독·불연성 가스."],
[S,"07 고압 및 저압 배전반 공사","보호 계전기의 종류가 아닌 것은?",["비율차동 계전기","과저항 계전기","과전류 계전기","과전압 계전기"],2,"비율차동·과전류·과전압 계전기는 보호 계전기이다. 과저항 계전기라는 것은 없다."],
[T,"05 자기 성질과 자기장","반지름 r[m], 권수 N회의 환상 솔레노이드에 I[A]의 전류가 흐를 때, 그 내부의 자장의 세기 H[AT/m]는 얼마인가?",["NI/r²","NI/2π","NI/4πr²","NI/2πr"],4,"환상 솔레노이드 내부 자계 H=NI/2πr[AT/m]"],
[G,"01 직류기","전압변동률이 작고 자여자이므로 다른 전원이 필요 없으며, 계자 저항기를 사용한 전압조정이 가능하여 전기 화학용, 전지의 충전용 발전기로 가장 적합한 것은?",["타여자 발전기","직류 복권 발전기","직류 분권 발전기","직류 직권 발전기"],3,"분권 발전기: 잔류자기로 자여자하며 계자 저항 조정으로 전압조정이 가능하다. 전압변동이 작아 전기화학용·축전지 충전용에 쓰인다."],
[T,"05 자기 성질과 자기장","반지름 5[cm], 권수 10회인 원형 코일에 15[A]의 전류가 흐르면 코일 중심의 자장의 세기는 몇 [AT/m]인가?",["500","1,500","2,500","3,000"],2,"원형 코일 중심 H=NI/2r=(10×15)/(2×5×10⁻²)=1,500[AT/m]"],
[G,"02 동기기","동기 발전기의 병렬운전 중 기전력의 위상차가 생기면 어떤 현상이 나타나는가?",["전기자 반작용이 발생한다.","동기화 전류가 흐른다.","단락 사고가 발생한다.","무효 순환전류가 흐른다."],2,"병렬운전 조건이 다를 때: 크기가 다르면 무효 순환전류, 위상이 다르면 동기화 전류(유효 횡류), 주파수가 다르면 단자전압의 진동, 파형이 다르면 고조파 순환전류가 생긴다."],

[S,"08 특수 장소 공사","소맥분, 전분 기타 가연성의 분진이 존재하는 곳의 저압 옥내 배선 공사방법 중 적당하지 않은 것은?",["애자 사용 공사","합성수지관 공사","케이블 공사","금속관 공사"],1,"가연성 분진이 있는 곳의 저압 옥내 배선은 합성수지관 공사, 금속관 공사, 케이블 공사로 한다."],
[G,"02 동기기","동기 전동기의 특징으로 잘못된 것은?",["일정한 속도로 운전이 가능하다.","난조가 발생하기 쉽다.","역률을 조정하기 힘들다.","공극이 넓어 기계적으로 견고하다."],3,"동기 전동기는 계자의 직류 여자 전류를 조정해 역률을 조정할 수 있다. 장점: 속도 일정, 공극이 넓어 견고, 효율 양호. 단점: 직류 여자 필요, 속도 제어 어려움, 난조 발생."],

[G,"05 정류기 및 제어기기","그림과 같은 전동기 제어 회로에서 전동기 M의 전류 방향으로 올바른 것은? (단, 전동기의 역률은 100[%]이고, 사이리스터의 점호각은 0°라고 본다.)",["입력 반주기마다 A에서 B의 방향, B에서 A의 방향","S₁과 S₄, S₂와 S₃의 동작 상태에 따라 A에서 B의 방향, B에서 A의 방향","항상 A에서 B의 방향","항상 B에서 A의 방향"],3,"사이리스터 브리지로 전파 정류하는 회로이므로 전동기에는 입력의 반주기와 관계없이 항상 A에서 B 방향으로 전류가 흐른다.","교류 입력에 사이리스터 S₁~S₄를 브리지로 접속한 회로. S₁·S₂ 사이의 점(A)과 S₃·S₄ 사이의 점(B) 사이에 전동기 M이 연결되어 있다."],

[G,"05 정류기 및 제어기기","입력으로 펄스신호를 가해주고 속도를 입력펄스의 주파수에 의해 조절하는 전동기는?",["전기 동력계","서보 전동기","스테핑 전동기","권선형 유도 전동기"],3,"스테핑 전동기: 회전속도가 입력 펄스 주파수에 비례하고, 펄스 수만큼 정해진 각도로 회전한다. 정밀한 위치·속도 제어에 쓴다."],
[G,"03 변압기","단상 변압기 2대로 V−V 결선하여 3상에서 사용하는 경우, V−V 결선의 특징으로 옳지 않은 것은?",["변압기의 이용률이 86.6[%]로 저하된다.","부하 측에 대칭 3상 전압을 공급할 수 있다.","설치방법이 비교적 간단하다.","출력은 Δ−Δ 결선일 때와 동일하다."],4,"V 결선의 출력은 Δ 결선의 1/√3≒57.7[%]로 줄어든다. 이용률은 √3/2≒86.6[%]."],

[T,"04 정전기와 콘덴서","어떤 한 점에 전하량 Q가 72πε₀×10¹²[C]만큼 있다. 여기서 1[m] 떨어진 곳에서의 전속밀도를 D_A, 2[m] 떨어진 곳에서의 전속밀도를 D_B라고 할 때 D_A, D_B값으로 알맞은 것은?",["D_A=40[C/m²], D_B=80[C/m²]","D_A=159[C/m²], D_B=40[C/m²]","D_A=80[C/m²], D_B=40[C/m²]","D_A=40[C/m²], D_B=159[C/m²]"],2,"D=Q/4πr². D_A=(72π×8.855×10⁻¹²×10¹²)/(4π×1²)≒159[C/m²], D_B는 거리가 2배이므로 1/4인 약 40[C/m²]"],
[G,"01 직류기","다극 중권 직류발전기의 전기자 권선에 균압고리를 설치하는 이유는?",["브러시에서 불꽃을 방지하기 위하여","전기자 반작용을 방지하기 위하여","정류 기전력을 높이기 위하여","전압 강하를 방지하기 위하여"],1,"중권은 병렬회로 사이에 기전력 차이가 생기면 브러시를 통해 순환전류가 흘러 불꽃이 난다. 이를 막기 위해 균압 접속(균압고리)을 한다."],
[G,"03 변압기","변압기의 자속에 관한 설명으로 옳은 것은?",["전압과 주파수에 반비례한다.","전압과 주파수에 비례한다.","전압에 반비례하고 주파수에 비례한다.","전압에 비례하고 주파수에 반비례한다."],4,"E=4.44fnφm에서 φm=E/(4.44fn). 자속은 전압에 비례하고 주파수에 반비례한다."],
[G,"03 변압기","낮은 전압을 높은 전압으로 승압할 때 일반적으로 사용되는 변압기의 3상 결선 방식은?",["Δ−Δ 결선","Δ−Y 결선","Y−Y 결선","Y−Δ 결선"],2,"Δ−Y 결선: 발전소용 승압 변압기. Y−Δ 결선: 수전단 변전소용 강압 변압기."],
[G,"05 정류기 및 제어기기","다음 중 전력제어용 반도체 소자가 아닌 것은?",["LED","TRIAC","GTO","IGBT"],1,"LED는 발광 다이오드로 빛을 내는 소자이다. TRIAC(쌍방향 3단자 사이리스터), GTO(게이트 턴 오프 사이리스터), IGBT는 전력 제어용 소자."],
[G,"04 유도기","단상 유도 전동기의 기동 방법 중 기동 토크가 가장 큰 것은?",["분상 기동형","반발 유도형","콘덴서 기동형","반발 기동형"],4,"기동 토크 크기: 반발 기동형 > 반발 유도형 > 콘덴서 기동형 > 영구 콘덴서형 > 분상 기동형 > 셰이딩 코일형"],
[S,"02 배선재료와 공구","원 안에 EQ가 적힌 심벌은 무엇을 의미하는가?",["지진 감지기","과전류 차단기","변압기","누전 경보기"],1,"EQ는 지진 감지기(Earthquake detector)의 심벌이다."],
[T,"03 전류의 열작용과 화학작용","전류에 의한 자기장과 직접적으로 관련이 없는 것은?",["줄의 법칙","플레밍의 왼손 법칙","비오−사바르의 법칙","앙페르의 오른나사 법칙"],1,"줄의 법칙은 전류가 저항에서 소비하는 열량에 관한 법칙이다. H=0.24I²Rt[cal]"],
[G,"01 직류기","전기기기의 철심 재료로 규소강판을 많이 사용하는 이유로 가장 적당한 것은?",["와류손을 줄이기 위해","맴돌이 전류를 없애기 위해","히스테리시스손을 줄이기 위해","구리손을 줄이기 위해"],3,"규소강판 사용 → 히스테리시스손 감소, 성층 철심 → 와류손(맴돌이 전류손) 감소. 그래서 0.35~0.5[mm]의 얇은 규소강판을 성층한다."],
[S,"06 전선로 및 배전선 공사","일반적으로 가공 전선로의 지지물에 취급자가 오르고 내리는 데 사용하는 발판 볼트 등은 지표상 몇 [m] 미만에 시설하여서는 아니 되는가?",["0.75[m]","1.2[m]","1.8[m]","2.0[m]"],3,"발판 볼트는 지표상 1.8[m] 미만에 시설해서는 안 된다."],

[S,"02 배선재료와 공구","한국전기설비규정에 의하면 옥외 백열전등의 인하선으로서 지표상의 높이 2.5[m] 미만인 부분은 공칭 단면적 몇 [mm²] 이상의 연동선과 동등 이상의 세기 및 굵기의 절연전선(옥외용 비닐 절연 전선을 제외)을 사용하는가?",["0.75","1.5","2.0","2.5"],4,"옥외 백열전등 인하선의 지표상 2.5[m] 미만 부분은 2.5[mm²] 이상의 연동선과 동등 이상의 절연전선(OW 제외)을 쓴다."],
[S,"06 전선로 및 배전선 공사","다음 중 고압 지중 케이블이 아닌 것은?",["알루미늄피 케이블","비닐 절연 비닐 외장 케이블","미네랄 인슈레이션 케이블","클로로프렌 외장 케이블"],3,"미네랄 인슈레이션(MI) 케이블은 저압용이다. 고압에는 알루미늄피, 클로로프렌 외장, 비닐 외장, 폴리에틸렌 외장, 콤바인덕트(CD) 케이블을 쓴다."],
[S,"05 전선 및 기계기구의 보안공사","한국전기설비규정에 의하여 분기회로의 과부하 보호장치 설치점과 분기점 사이에 다른 분기회로 또는 콘센트의 접속이 없고, 단락의 위험과 화재 및 인체에 대한 위험성이 최소화되도록 시설된 경우 과부하 보호장치는 분기점으로부터 몇 [m]까지 이동하여 설치할 수 있는가?",["2","3","4","5"],2,"분기회로의 과부하 보호장치는 문제의 조건을 만족하면 분기점(O)으로부터 3[m]까지 이동하여 설치할 수 있다.","전원 측 보호장치 P₁에서 나온 간선 S₁의 분기점 O에서 분기회로 S₂가 갈라지고, 분기회로의 보호장치 P₂가 분기점 O에서 ?[m] 떨어진 곳에 설치되어 있다."],
[G,"03 변압기","변압기의 1차 측 저항이 360[Ω], 2차 측 저항이 0.1[Ω]일 때, 권수비는 얼마인가?",["60","360","3,600","6"],1,"a=N₁/N₂=√(R₁/R₂)=√(360/0.1)=√3,600=60"],

[S,"08 특수 장소 공사","무대, 무대마루 밑, 오케스트라 박스, 영사실, 기타 사람이나 무대 도구가 접촉할 우려가 있는 장소에 시설하는 저압 옥내배선, 전구선 또는 이동전선은 사용전압이 몇 [V] 이하이어야 하는가?",["100","200","400","700"],3,"흥행장의 저압 옥내배선, 전구선, 이동전선은 사용전압 400[V] 이하"],
[S,"02 배선재료와 공구","실링·직접부착등을 시설하고자 한다. 배선도에 표기할 그림기호로 옳은 것은?",["① 가로선 끝의 원 안에 N","② 원에 사선 두 개가 걸친 기호","③ 원 안에 CL","④ 원 안에 R"],3,"CL(Ceiling Light): 천장에 직접 붙이는 등(실링·직접부착등)의 심벌","①~④ 네 가지 그림기호"],

[S,"08 특수 장소 공사","폭연성 분진 또는 화약류의 분말이 전기설비가 발화원이 되어 폭발할 우려가 있는 곳에 시설하는 저압 옥내 전기 설비의 저압 옥내배선 공사는?",["금속관 공사","합성수지관 공사","가요전선관 공사","애자 공사"],1,"폭연성 분진·화약류 분말이 있는 곳은 금속관 공사 또는 케이블 공사(캡타이어케이블 제외)로 한다."],
[S,"07 고압 및 저압 배전반 공사","선택지락 계전기(Selective Ground Relay)의 용도는?",["단일 회선에서 지락 전류의 방향의 선택","단일 회선에서 지락 사고 지속 시간 선택","단일 회선에서 지락 전류의 대소의 선택","다회선에서 지락 고장 회선의 선택"],4,"선택지락 계전기(SGR): 다회선 선로에서 지락이 발생한 회선만 선택하여 차단한다."],
[G,"01 직류기","직류 전동기의 전기자에 가해지는 단자전압을 변화하여 속도를 조정하는 제어법이 아닌 것은?",["워드 레오나드 방식","일그너 방식","직·병렬 제어","계자 제어"],4,"전압 제어 방식: 워드 레오나드 방식, 일그너 방식, 직·병렬 제어. 계자 제어는 자속을 바꾸는 방식이다."],
[T,"03 전류의 열작용과 화학작용","두 종류의 금속 접합부에 전류를 흘리면 전류의 방향에 따라 줄열 이외의 열의 흡수 또는 발생 현상이 생긴다. 이러한 현상을 무엇이라 하는가?",["제벡 효과","페란티 효과","펠티에 효과","초전도 효과"],3,"펠티에 효과: 다른 금속의 접합부에 전류를 흘리면 열의 발생·흡수. 제벡 효과: 두 접합점의 온도차로 열기전력 발생. 톰슨 효과: 같은 금속에서 온도차+전류로 열의 발생·흡수."],
[G,"04 유도기","3상 유도 전동기의 원선도를 그리는 데 필요하지 않은 것은?",["저항 측정","무부하 시험","구속 시험","슬립 측정"],4,"원선도 작성에 필요한 시험: 저항 측정 시험, 무부하 시험, 구속 시험"],
[S,"06 전선로 및 배전선 공사","저압 연접 인입선의 시설과 관련된 설명으로 잘못된 것은?",["옥내를 통과하지 아니할 것","전선의 굵기는 1.5[mm²] 이하일 것","폭 5[m]를 넘는 도로를 횡단하지 아니할 것","인입선에서 분기하는 점으로부터 100[m]를 넘는 지역에 미치지 아니할 것"],2,"연접 인입선 조건: 분기점에서 100[m] 이내, 폭 5[m] 초과 도로 횡단 금지, 옥내 통과 금지. 전선 굵기를 1.5[mm²] 이하로 한다는 규정은 없다."],
[S,"02 배선재료와 공구","절연 전선으로 가선된 배전 선로에서 활선 상태인 경우 전선의 피복을 벗기는 것은 매우 곤란한 작업이다. 이런 경우 활선 상태에서 전선의 피복을 벗기는 공구는?",["데드 엔드 커버","애자 커버","와이어 통","전선 피박기"],4,"전선 피박기(활선 피박기): 활선 상태에서 피복을 벗기는 공구. 와이어 통은 활선을 옮기는 절연봉, 데드 엔드 커버는 현수 애자 등의 충전부를 덮는 절연 커버."],
[S,"03 전선의 접속","전선과 기구 단자 접속 시 나사를 덜 죄었을 경우 발생할 수 있는 위험과 거리가 먼 것은?",["누전","화재 위험","과열 발생","저항 감소"],4,"나사를 덜 죄면 접촉 저항이 증가하여 과열, 누전, 화재로 이어진다."],
[G,"03 변압기","1대의 출력이 20[kVA]인 단상 변압기 2대로 V 결선하여 3상 전력을 공급할 수 있는 최대전력은 약 몇 [kVA]인가?",["20","28.3","34.6","40"],3,"Pv=√3P₁=√3×20≒34.6[kVA]"],
[G,"02 동기기","3상 동기전동기 자기동법에 관한 사항 중 틀린 것은?",["기동토크를 적당한 값으로 유지하기 위하여 변압기 탭에 의해 정격전압의 80[%] 정도로 전압을 가해 기동을 한다.","기동토크는 일반적으로 적고 전부하 토크의 40~60[%] 정도이다.","제동권선에 의한 기동토크를 이용하는 것으로 제동권선은 2차 권선으로서 기동토크를 발생한다.","기동할 때에는 회전자속에 의하여 계자권선 안에는 고전압이 유도되어 절연을 파괴할 우려가 있다."],1,"기동 보상기(3상 단권 변압기)로 전전압의 1/3~1/2 정도로 전압을 낮추어 기동한다. 80[%]가 아니다."],
[S,"07 고압 및 저압 배전반 공사","분전반 및 배전반은 어떤 장소에 설치하는 것이 바람직한가?",["전기회로를 쉽게 조작할 수 있는 장소","개폐기를 쉽게 개폐할 수 없는 장소","은폐된 장소","이동이 심한 장소"],1,"분전반·배전반은 전기회로를 쉽게 조작할 수 있고, 은폐되지 않았으며, 움직임이 적은 고정된 곳에 설치한다."],
[T,"03 전류의 열작용과 화학작용","220[V]용 100[W] 전구와 200[W] 전구를 직렬로 연결하여 220[V]의 전원에 연결하면?",["두 전구의 밝기가 같다.","100[W]의 전구가 더 밝다.","200[W]의 전구가 더 밝다.","두 전구 모두 안 켜진다."],2,"R=V²/P이므로 100[W] 전구 484[Ω], 200[W] 전구 242[Ω]. 직렬은 전류가 같아 P=I²R에서 저항이 큰 100[W] 전구가 더 밝다."],
[S,"04 옥내 배선 공사","플로어 덕트 공사의 설명 중 틀린 것은?",["덕트의 끝 부분은 막는다.","플로어 덕트는 접지공사를 생략하여도 된다.","덕트 상호 간 접속은 견고하고 전기적으로 완전하게 접속하여야 한다.","덕트 및 박스 기타 부속품은 물이 고이는 부분이 없도록 시설하여야 한다."],2,"플로어 덕트는 접지공사를 하여야 한다."],
[T,"06 전자유도 법칙과 인덕턴스","자체 인덕턴스가 각각 L₁, L₂[H]인 두 원통 코일이 서로 직교하고 있다. 두 코일 사이의 상호 인덕턴스[H]는?",["L₁+L₂","L₁L₂","0","√(L₁L₂)"],3,"M=k√(L₁L₂)에서 직교하면 결합계수 k=0이므로 M=0"],
[S,"03 전선의 접속","전선의 굵기가 6[mm²] 이하의 가는 단선의 전선 접속은 어떤 접속을 하여야 하는가?",["브리타니아 접속","쥐꼬리 접속","트위스트 접속","슬리브 접속"],3,"단선의 직선 접속: 6[mm²] 이하는 트위스트 접속, 10[mm²] 이상은 브리타니아 접속"],
[G,"03 변압기","변압기 절연내력 시험 중 권선의 층간 절연시험은?",["충격전압 시험","무부하 시험","가압 시험","유도 시험"],4,"유도 시험: 권선 단자 사이에 상호유도전압의 2배 전압을 유도시켜 층간 절연을 시험한다."],

[S,"03 전선의 접속","연선 분기 접속은 접속선을 브리타니아 접속과 소선 자체를 이용하여 접속하는 방법이 있는데 다음 중 소선자체를 이용하는 방법이 아닌 것은?",["단권분기 접속","복권분기 접속","직권분기 접속","분할분기 접속"],3,"연선 분기 접속에는 단권분기, 복권분기, 분할분기 접속 등이 있다. 직권분기 접속이라는 것은 없다."],
[G,"02 동기기","동기 임피던스 5[Ω]인 2대의 3상 동기 발전기의 유도 기전력에 100[V]의 전압 차이가 있다면 무효 순환전류[A]는?",["10","15","20","25"],1,"I=E/(Z₁+Z₂)=100/(5+5)=10[A]"],
[S,"08 특수 장소 공사","흥행장의 저압 공사에서 잘못된 것은?",["무대용의 콘센트 박스, 플라이덕트 및 보더라이트의 금속제 외함에는 접지를 하여야 한다.","무대 마루 밑, 오케스트라 박스 및 영사실의 전로에는 전용 개폐기 및 과전류 차단기를 시설할 필요가 없다.","플라이 덕트는 조영재 등에 견고하게 시설하여야 한다.","플라이 덕트 내의 전선을 외부로 인출할 경우는 제1종 캡타이어 케이블을 사용한다."],2,"무대 마루 밑, 오케스트라 박스, 영사실의 전로에는 전용 개폐기와 과전류 차단기를 반드시 시설한다."],
[G,"05 정류기 및 제어기기","다음 기호 중 DIAC의 기호는?",["①번 기호","②번 기호","③번 기호","④번 기호"],1,"① DIAC ② TRIAC ③ SCR ④ UJT. DIAC는 게이트 없이 다이오드 2개를 역병렬로 접속한 형태의 2단자 소자이다.","①~④ 네 가지 반도체 소자 기호"],
[S,"07 고압 및 저압 배전반 공사","자연 공기 내에서 개방할 때 접촉자가 떨어지면서 자연 소호되는 방식을 가진 차단기로 저압의 교류 또는 직류차단기로 많이 사용되는 것은?",["유입차단기","자기차단기","가스차단기","기중차단기"],4,"기중차단기(ACB): 공기 중 자연 소호 방식의 저압용 차단기. VCB는 진공, GCB는 SF₆ 가스, OCB는 절연유로 소호한다."],
[T,"05 자기 성질과 자기장","다음 보기 중 자기저항에 영향을 미치는 성질이 아닌 것은?",["길이","면적","투자율","전류"],4,"자기저항 Rm=l/μS. 길이, 투자율, 단면적으로 정해진다."],
[S,"07 고압 및 저압 배전반 공사","설치 면적과 설치 비용이 많이 들지만 가장 이상적이고 효과적인 진상용 콘덴서를 설치하는 방법은 무엇인가?",["수전단 모선에 설치","수전단 모선과 부하 측에 분산하여 설치","부하 측에 분산하여 설치","가장 큰 부하 측에만 설치"],3,"진상용 콘덴서는 부하 측에 분산 설치하는 것이 역률 개선에 가장 이상적이지만 설치 비용이 많이 든다."],
[T,"02 전기회로 해석","R₁과 R₂가 병렬연결이고 전체전류 I가 흐르고 있을 때, R₂에 흐르는 전류 I₂는 얼마인가?",["R₂/(R₁+R₂) × I","R₁/(R₁+R₂) × I","(R₁+R₂)/R₂ × I","(R₁+R₂)/R₁ × I"],2,"전류 분배 법칙: I₂=R₁/(R₁+R₂)×I. 병렬에서는 반대쪽 저항이 분자에 온다."],
[T,"04 정전기와 콘덴서","대전에 의해 물체가 띠고 있는 전기를 무엇이라고 하는가?",["원자","전하","정전유도","대전체"],2,"전하: 대전된 물체가 가지고 있는 전기"],
[S,"03 전선의 접속","전선 접속 시 사용되는 슬리브(Sleeve)의 종류가 아닌 것은?",["D형","S형","E형","P형"],1,"슬리브 종류: 직선맞대기용(B형), 종단겹침용(E형), 직선겹침용(P형), S형, 매킹타이어 슬리브"],
[S,"03 전선의 접속","네온 방전등의 관등회로 배선을 애자 공사로 하는 경우 전선 상호 간의 이격거리는?",["3[cm]","6[cm]","9[cm]","12[cm]"],2,"네온 관등회로의 애자 공사에서 전선 상호 간 간격은 6[cm] 이상"],
[S,"02 배선재료와 공구","굵은 전선이나 케이블을 절단할 때 사용되는 공구는?",["클리퍼","펜치","나이프","플라이어"],1,"클리퍼: 굵은 전선 절단용. 펜치는 전선 절단·접속·바인드, 나이프는 피복 제거, 플라이어는 로크너트 조임 등에 쓴다."],
[G,"02 동기기","4극 36슬롯 3상 동기 발전기의 매극 매상당 슬롯 수는?",["2","3","4","5"],2,"매극 매상당 슬롯 수=전체 슬롯 수/(극수×상수)=36/(4×3)=3"],
[S,"04 옥내 배선 공사","박스나 캐비닛의 노크아웃의 지름이 금속관의 지름보다 클 때 사용되는 접속기구는 무엇인가?",["링 리듀서","부싱","커넥터","로크 너트"],1,"링 리듀서: 박스의 구멍(노크아웃)이 금속관보다 클 때 사용해 고정한다."],

[G,"03 변압기","변압기의 규약효율은?",["출력/입력 × 100[%]","출력/(출력+손실) × 100[%]","출력/(입력+손실) × 100[%]","(입력−손실)/입력 × 100[%]"],2,"변압기·발전기의 규약효율=출력/(출력+손실)×100[%], 전동기의 규약효율=(입력−손실)/입력×100[%]"],

[G,"03 변압기","3상 변압기의 병렬운전 시 병렬운전이 불가능한 결선 조합은?",["Δ−Δ와 Y−Y","Δ−Δ와 Δ−Y","Δ−Y와 Δ−Y","Δ−Δ와 Δ−Δ"],2,"Δ와 Y의 개수가 각각 짝수이면 병렬운전 가능, 홀수이면 불가능. Δ−Δ와 Δ−Y, Y−Y와 Δ−Y는 불가능하다."],

[T,"03 전류의 열작용과 화학작용","황산구리 용액에 5[A]의 전류로 30[g]의 구리를 석출시키려면 몇 시간 전기분해를 하여야 하는가? (단, 구리의 전기 화학 당량은 0.0003293[g/C]이다.)",["2","3","4","5"],4,"Q=30/0.0003293≒91,102[C], t=Q/I=91,102/5≒18,220[sec]≒5[시간]"],

[S,"08 특수 장소 공사","한국전기설비규정에 의하여 사람이 상시 통행하는 터널 안 배선의 사용전압이 저압일 때 시설할 수 없는 공사 방법은?",["금속관 공사","금속몰드 공사","케이블 공사","합성수지관 공사"],2,"사람이 상시 통행하는 터널 안의 저압 배선은 합성수지관 공사, 금속관 공사, 케이블 공사 등으로 한다. 금속몰드 공사는 할 수 없다."],
[S,"05 전선 및 기계기구의 보안공사","다음은 절연저항에 대한 설명이다. 괄호 안에 들어갈 내용으로 알맞은 것은?\n\n특별저압: 2차 전압이 AC ( ㉠ )[V], DC ( ㉡ )[V] 이하인 SELV(비접지회로) 및 PELV(접지회로)는 1차와 2차가 전기적으로 절연된 회로, FELV는 1차와 2차가 전기적으로 절연되지 않은 회로이다.",["㉠ 50, ㉡ 100","㉠ 40, ㉡ 100","㉠ 50, ㉡ 120","㉠ 40, ㉡ 120"],3,"특별저압(ELV)은 AC 50[V], DC 120[V] 이하. 절연저항 기준: SELV·PELV는 DC 250[V] 시험전압에서 0.5[MΩ] 이상, FELV·500[V] 이하는 500[V]에서 1.0[MΩ] 이상, 500[V] 초과는 1,000[V]에서 1.0[MΩ] 이상."],

[T,"06 전자유도 법칙과 인덕턴스","자체 인덕턴스가 각각 L₁, L₂[H]인 두 원통 코일이 서로 직교하고 있다. 두 코일 사이의 상호 인덕턴스[H]는?",["L₁+L₂","L₁L₂","0","√(L₁L₂)"],3,"M=k√(L₁L₂)에서 직교 시 결합계수 k=0이므로 M=0"],
[T,"06 전자유도 법칙과 인덕턴스","그림에서 1차 코일의 자기인덕턴스 L₁, 2차 코일의 자기인덕턴스 L₂, 상호인덕턴스를 M이라 할 때 L_A의 값으로 옳은 것은? (단, L₁, L₂ 코일은 같은 방향으로 감겨있다.)",["L₁+L₂+2M","L₁−L₂+2M","L₁+L₂−2M","L₁−L₂−2M"],3,"두 코일의 자속이 서로 반대가 되는 차동접속이므로 L_A=L₁+L₂−2M (M=k√(L₁L₂))","상호인덕턴스 M으로 결합된 코일 L₁과 L₂. L₁의 오른쪽 단자와 L₂의 오른쪽 단자가 서로 이어져 있고, L₁의 왼쪽 단자와 L₂의 왼쪽 단자 사이를 L_A로 표시했다. (전류가 L₁은 왼쪽→오른쪽, L₂는 오른쪽→왼쪽으로 흐르는 접속)"],

[S,"04 옥내 배선 공사","다음 금속몰드 공사 방법 중 설명이 틀린 것은?",["점검할 수 없는 은폐 장소에 시설하였다.","몰드 안에는 접속점이 없도록 한다.","사용 전압이 400[V] 이하이므로 접지공사를 하였다.","지지점 간 거리는 1.5[m] 이하마다 한다."],1,"금속몰드 공사는 건조하고 전개된 장소나 점검할 수 있는 은폐 장소에 시설한다."],
[T,"02 전기회로 해석","같은 저항 R 4개를 다음과 같이 연결하여 a−b 간에 일정 전압을 가했을 때 소비전력이 가장 큰 것은 어느 것인가?",["4개를 모두 직렬로 연결","2개 직렬 + 2개 병렬 묶음을 직렬로 연결","2개 병렬 묶음 2조를 직렬로 연결","4개를 모두 병렬로 연결"],4,"전압이 일정하면 P=V²/R이므로 합성저항이 가장 작은 것이 소비전력이 가장 크다. 합성저항: ① 4R ② 2.5R ③ R ④ R/4"],
[G,"05 정류기 및 제어기기","다음 중 트라이액(TRIAC)의 심벌(기호)은?",["①번 기호","②번 기호","③번 기호","④번 기호"],3,"① DIAC ② SCR ③ TRIAC ④ UJT. TRIAC은 사이리스터 2개를 역병렬로 접속한 것과 등가인 쌍방향 3단자 소자로 교류 제어용이다.","①~④ 네 가지 반도체 소자 기호"],
[G,"04 유도기","그림과 같은 분상 기동형 단상 유도 전동기를 역회전 시키기 위한 방법이 아닌 것은?",["원심력 스위치를 개로 또는 폐로한다.","기동 권선이나 운전 권선의 어느 한 권선의 단자접속을 반대로 한다.","기동 권선의 단자접속을 반대로 한다.","운전 권선의 단자접속을 반대로 한다."],1,"회전 방향을 바꾸려면 운전(주) 권선과 기동(보조) 권선 중 어느 한 권선의 접속만 반대로 하면 된다.","단상 전원에 운전 권선(U–V)과, 원심력 스위치 Cs가 직렬로 들어간 기동 권선(X–Y)이 병렬로 접속된 회로"],
[T,"05 자기 성질과 자기장","환상 솔레노이드 내부의 자기장의 세기에 관한 설명으로 옳은 것은?",["자장의 세기는 권수에 반비례한다.","자장의 세기는 권수, 전류, 평균 반지름과는 관계가 없다.","자장의 세기는 평균 반지름에 비례한다.","자장의 세기는 전류에 비례한다."],4,"H=NI/2πr이므로 권수와 전류에 비례하고 반지름에 반비례한다."],

[S,"02 배선재료와 공구","조명용 전등을 호텔 또는 여관 객실 입구에 설치할 경우 최대 몇 분 이내에 소등되는 타임스위치를 시설하여야 하는가?",["1","2","3","4"],1,"타임스위치 소등 시간: 숙박업소 객실 입구 1분 이내, 일반 주택·아파트 현관 3분 이내"],
[S,"08 특수 장소 공사","한국전기설비규정에 의하여 가연성 분진에 전기설비가 발화원이 되어 폭발할 우려가 있는 곳에 합성수지관 공사로 저압 옥내배선을 하는 경우 전동기에 접속하는 부분에서 가요성을 필요로 할 때 사용되는 방폭형 부속품은?",["유연성 부속","분진 방폭형 유연성 부속","분진 유연성 부속","안전 증가 유연성 부속"],2,"가연성 분진이 있는 곳에서 전동기 접속부에 가요성이 필요하면 분진 방폭형 유연성 부속을 사용한다."],
[T,"07 교류회로","다음 중 LC 직렬회로의 공진 조건으로 옳은 것은?",["1/ωL=ωC+R","직류 전원을 가할 때","ωL=ωC","ωL=1/ωC"],4,"직렬 공진 조건: ωL=1/ωC, 병렬 공진 조건: ωC=1/ωL"],
[G,"04 유도기","다음은 3상 유도 전동기 고정자 권선의 결선도를 나타낸 것이다. 맞는 사항을 고르면?",["3상 2극, Y 결선","3상 4극, Y 결선","3상 2극, Δ 결선","3상 4극, Δ 결선"],2,"전원이 A, B, C 3상이고, 상마다 코일이 4개씩 있어 4극이 형성된다. A₄, B₄, C₄의 끝이 한 점에서 모두 연결되므로 Y 결선이다.","A·B·C 3상 전원선에 코일 A₁ B₁ C₁ A₂ B₂ C₂ A₃ B₃ C₃ A₄ B₄ C₄ 12개가 차례로 놓여 있다. 상마다 코일 4개가 직렬로 이어지고, 마지막 코일 A₄·B₄·C₄의 끝이 한 점에서 서로 접속되어 있다."],
[T,"06 전자유도 법칙과 인덕턴스","평행한 두 도선 간의 전자력은?",["거리 r에 비례한다.","거리 r에 반비례한다.","거리 r²에 비례한다.","거리 r²에 반비례한다."],2,"F=μI₁I₂/2πr[N/m]. 거리 r에 반비례한다. 전류 방향이 같으면 흡인력, 다르면 반발력."],
[T,"03 전류의 열작용과 화학작용","종류가 다른 두 금속을 접합하여 폐회로를 만들고 두 접합점의 온도를 다르게 하면 이 폐회로에 기전력이 발생하여 전류가 흐르게 되는 현상을 지칭하는 것은?",["줄의 법칙(Joule's Law)","톰슨 효과(Thomson Effect)","펠티에 효과(Peltier Effect)","제벡 효과(Seebeck Effect)"],4,"제벡 효과: 다른 금속의 두 접합점 온도차로 열기전력 발생. 펠티에 효과: 다른 금속 접합부에 전류를 흘리면 열의 발생·흡수. 톰슨 효과: 같은 금속에서 온도차+전류로 열의 발생·흡수."],
[S,"07 고압 및 저압 배전반 공사","고압 이상에서 기기의 점검, 수리 시 무전압, 무전류 상태로 전로에서 단독으로 전로의 접속 또는 분리하는 것을 주목적으로 사용되는 수·변전기기는?",["기중부하 개폐기","단로기","전력퓨즈","컷아웃 스위치"],2,"단로기(DS): 무부하 상태에서 회로의 접속 변경, 점검·수리 시 사용. 부하 개폐기(LBS)는 부하전류 개폐, 전력퓨즈(PF)는 단락 보호, 컷아웃 스위치(COS)는 변압기 과전류 보호."],
[S,"03 전선의 접속","알루미늄전선의 접속 방법으로 적합하지 않은 것은?",["직선 접속","분기 접속","종단 접속","트위스트 접속"],4,"트위스트 접속은 단면적 6[mm²] 이하의 가는 구리 단선을 접속하는 방법이다."],
[G,"04 유도기","슬립 4[%]인 유도전동기의 등가 부하저항은 2차 저항의 몇 배인가?",["5","19","20","24"],4,"R=r₂(1−s)/s=r₂×(1−0.04)/0.04=24r₂"],
[G,"03 변압기","일정 전압 및 일정 파형에서 주파수가 상승하면 변압기 철손은 어떻게 변하는가?",["증가한다.","감소한다.","불변이다.","증가하다 감소한다."],2,"전압이 일정하면 B∝1/f. 주파수가 오르면 와류손은 불변이고 히스테리시스손이 감소하므로 철손은 감소한다."],
[T,"04 정전기와 콘덴서","정전용량 C₁, C₂를 병렬로 접속하였을 때의 합성 정전용량은?",["C₁+C₂","1/(C₁+C₂)","1/C₁+1/C₂","C₁C₂/(C₁+C₂)"],1,"콘덴서의 병렬 합성 정전용량은 각 용량의 합 C₁+C₂ (직렬은 C₁C₂/(C₁+C₂))"],
[T,"07 교류회로","R−L 직렬회로에서 전압과 전류의 위상차 tan θ는?",["L/R","ωRL","ωL/R","L/ωL"],3,"Z=R+jωL이므로 tan θ=ωL/R"],
[S,"06 전선로 및 배전선 공사","저압 전로의 접지 측 전선을 식별하는 데 애자의 빛깔에 의하여 표시하는 경우 어떤 빛깔의 애자를 접지 측으로 하여야 하는가?",["백색","청색","갈색","황갈색"],2,"접지 측 전선은 청색(파란색) 애자로 표시한다."],
[T,"06 전자유도 법칙과 인덕턴스","전동기의 회전 방향을 알기 위한 법칙은?",["플레밍의 오른손 법칙","플레밍의 왼손 법칙","렌츠의 법칙","앙페르의 오른나사 법칙"],2,"플레밍의 왼손 법칙: 전동기의 회전(힘) 방향. 오른손 법칙: 발전기의 유기 전압 방향. 렌츠: 유도 기전력의 방향. 앙페르: 전류에 의한 자계의 방향."],
[S,"02 배선재료와 공구","먼지가 많은 장소에 사용되는 전구 소켓으로 적합한 것은?",["키 소켓","분기 소켓","키리스 소켓","모걸 소켓"],3,"키리스 소켓: 먼지나 분진이 있는 곳에서 사용하는 소켓"],
[T,"07 교류회로","v=Vm sin(ωt−20°)[V], i=Im cos(ωt−20°)[A]의 위상차를 구하면?",["π/2[rad]","π/3[rad]","π/4[rad]","π/6[rad]"],1,"i=Im cos(ωt−20°)=Im sin(ωt+70°). 위상차=70°−(−20°)=90°=π/2[rad]"],
[S,"04 옥내 배선 공사","금속관 공사에서 사용되는 후강 전선관의 규격이 아닌 것은?",["16","28","36","50"],4,"후강 전선관 규격: 16, 22, 28, 36, 42, 54, 70, 82, 92, 104[mm]의 10종"],
[S,"09 전기응용 시설 공사","실내 전반 조명을 하고자 한다. 작업대로부터 광원까지의 높이가 2.4[m]인 위치에 조명 기구를 배치할 때 벽에서 한 기구 이상 떨어진 기구에서 기구 간의 거리는 일반적인 경우 최대 몇 [m]로 배치하여 설치하는가?",["1.8","2.4","3.2","3.6"],4,"등 간격 S≤1.5H이므로 S≤1.5×2.4=3.6[m]"],
[G,"02 동기기","동기 발전기에서 비돌극기의 출력이 최대가 되는 부하각(Power Angle)은?",["0°","45°","90°","180°"],3,"비돌극기(원통형)는 부하각 δ=90°에서, 돌극기(철극기)는 δ=60°에서 출력이 최대이다."],
[T,"06 전자유도 법칙과 인덕턴스","그림과 같은 환상철심에 A, B의 코일이 감겨있다. 전류 I가 120[A/s]로 변화할 때, 코일 A에 90[V], 코일 B에 40[V]의 기전력이 유도된 경우, 코일 A의 자기인덕턴스 L₁[H]과 상호인덕턴스 M[H]의 값은 얼마인가?",["L₁=0.75, M=0.33","L₁=1.25, M=0.7","L₁=1.75, M=0.9","L₁=1.95, M=1.1"],1,"V_A=L₁(dI/dt)에서 L₁=90/120=0.75[H], E_B=M(dI/dt)에서 M=40/120≒0.33[H]","환상 철심의 왼쪽에 코일 A(전류 I가 흐름), 오른쪽에 코일 B가 감겨 있다."],
[T,"03 전류의 열작용과 화학작용","두 종류의 금속을 접속하여 두 접합 부분을 다른 온도로 유지하면 열기전력을 일으켜 열전류가 흐른다. 이 현상을 지칭하는 것은?",["제벡 효과","제3금속의 법칙","펠티에 효과","패러데이의 법칙"],1,"제벡 효과: 다른 금속의 두 접합점 온도차로 열기전력이 발생해 열전류가 흐르는 현상. 제3금속의 법칙: 열전쌍 사이에 다른 금속을 넣어도 그 양 끝 온도가 같으면 열기전력은 변하지 않는다."],
[T,"09 비정현파","입력 전원 전압이 vs=Vm sin θ인 경우, 다음 그림의 전파 다이오드 정류기의 출력전압 v₀(t)에 대한 평균치와 실효치를 각각 옳게 나타낸 것은?",["평균치: Vm/π, 실효치: Vm/2","평균치: Vm/2, 실효치: Vm/π","평균치: Vm/2π, 실효치: Vm/√2","평균치: 2Vm/π, 실효치: Vm/√2"],4,"전파 정류 파형: 평균값 2Vm/π, 실효값 Vm/√2. (반파 정류: 평균값 Vm/π, 실효값 Vm/2)","다이오드 D₁~D₄로 구성된 브리지 전파 정류 회로에 교류 전원 vs와 부하 저항 R(출력 전압 v₀)이 연결되어 있다."],
[G,"03 변압기","부하 역률이 1일 때의 전압변동률은 3[%]이고, 부하 역률 0일 때의 전압변동률은 4[%]인 변압기가 있다. 부하 역률이 0.8(지상)일 때, 전압변동률[%]은?",["3.0","4.0","4.8","7.0"],3,"ε=p cosθ+q sinθ. 역률 1일 때 p=3, 역률 0일 때 q=4. 역률 0.8이면 ε=3×0.8+4×0.6=4.8[%]"],
[T,"06 전자유도 법칙과 인덕턴스","자체 인덕턴스 20[mH]의 코일에 30[A]의 전류를 흘릴 때 축적되는 에너지는?",["1.5[J]","3[J]","9[J]","18[J]"],3,"W=½LI²=½×20×10⁻³×30²=9[J]"],
[G,"01 직류기","정류자와 접촉하여 전기자 권선과 외부 회로를 연결하는 역할을 하는 것은?",["계자","전기자","브러시","계자철심"],3,"브러시: 정류자에 접촉하여 기전력을 외부로 인출. 계자: 자속을 만드는 부분. 전기자: 자속을 끊어 기전력을 유기. 정류자: 교류를 직류로 변환."],
[S,"05 전선 및 기계기구의 보안공사","지중에 매설되어 있는 금속제 수도관로는 대지와의 전기저항값이 얼마 이하로 유지되어야 접지극으로 사용할 수 있는가?",["1[Ω]","3[Ω]","4[Ω]","5[Ω]"],2,"지중에 매설된 금속제 수도관로는 대지와의 전기저항이 3[Ω] 이하이면 접지극으로 사용할 수 있다."],
[G,"04 유도기","유도 전동기에 기계적 부하를 걸었을 때 출력에 따라 속도, 토크, 효율, 슬립 등의 변화를 나타낸 출력 특성 곡선에서 슬립을 나타내는 곡선은?",["1","2","3","4"],4,"출력 특성 곡선에서 속도는 위쪽에서 조금씩 내려가는 곡선, 토크는 직선에 가깝게 증가하는 곡선, 효율은 빠르게 올라가 완만해지는 곡선, 슬립은 맨 아래에서 완만하게 증가하는 곡선이다.","가로축은 출력. 곡선 1: 맨 위에서 조금씩 내려감 / 곡선 2: 빠르게 올라가 완만해짐 / 곡선 3: 원점에서 직선으로 증가 / 곡선 4: 맨 아래에서 완만하게 증가"],
[S,"04 옥내 배선 공사","금속관 공사에서 절연 부싱을 사용하는 이유는?",["박스 내에서 전선의 접속을 방지","관이 손상되는 것을 방지","관 단에서 전선의 인입 및 교체 시 발생하는 전선의 손상 방지","관의 입구에서 조영재의 접속을 방지"],3,"부싱은 관 끝에 설치하여 전선 피복이 손상되는 것을 막는다."],
[S,"03 전선의 접속","박스 안에서 가는 전선을 접속할 때 어떤 접속으로 하는가?",["슬리브 접속","브리타니아 접속","쥐꼬리 접속","트위스트 접속"],3,"쥐꼬리 접속: 박스 안에서 가는 단선 2~3가닥을 모아 접속하는 방법. 테이프를 감거나 박스용 커넥터를 끼운다."],
[S,"03 전선의 접속","매킹타이어로 슬리브 접속 시 슬리브를 최소 몇 회 이상 꼬아야 하는가?",["3.5회","2회","2.5회","3회"],2,"매킹타이어 슬리브 접속은 슬리브를 최소 2회 정도 비틀어 꼬아 접속한다."],
[T,"05 자기 성질과 자기장","자석에 대한 성질을 설명한 것으로 옳지 않은 것은?",["자석은 임계 온도 이상으로 가열하면 자석의 성질이 없어진다.","발생되는 자기력선은 아무리 사용해도 기본적으로 감소하지 않는다.","자석은 고온이 되면 자력이 감소되고 저온이 되면 자력이 증가된다.","같은 극성의 자석은 서로 흡인하고, 다른 극성은 서로 반발한다."],4,"같은 극끼리는 반발하고 다른 극끼리는 흡인한다."],

[T,"05 자기 성질과 자기장","다음 중 자기장 내에서 같은 크기 m[Wb]의 자극이 존재할 때 자계의 세기가 가장 큰 물질은?",["텅스텐","알루미늄","철","구리"],4,"H=B/(μ₀μs)이므로 비투자율이 작을수록 자계의 세기가 크다. 구리는 μs<1인 역자성체라서 가장 크다."],
